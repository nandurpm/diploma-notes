"use strict";
(function(){
  const progress=document.getElementById('readingProgress');
  function update(){if(!progress)return;const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?(scrollY/max)*100:0)+'%';}
  addEventListener('scroll',update,{passive:true}); update();
  const printBtn=document.getElementById('printBtn');
  if(printBtn)printBtn.addEventListener('click',function(){document.querySelectorAll('details').forEach(d=>d.open=true);window.scrollTo(0,0);setTimeout(()=>window.print(),80);});
  const start=document.getElementById('startLearningBtn'); if(start)start.addEventListener('click',()=>document.getElementById('coverage')?.scrollIntoView({behavior:'smooth'}));
  const search=document.getElementById('searchInput'), results=document.getElementById('searchResults'), clear=document.getElementById('searchClearBtn');
  function run(){if(!search||!results)return;const q=search.value.trim().toLowerCase();results.innerHTML='';if(!q)return;const nodes=[...document.querySelectorAll('h2,h3,details summary')].filter(n=>n.textContent.toLowerCase().includes(q)).slice(0,25);nodes.forEach(n=>{const a=document.createElement('a');const holder=n.closest('section,details')||n;const id=holder.id||n.parentElement?.id;if(id){a.href='#'+id;a.textContent=n.textContent.trim();a.addEventListener('click',()=>{const d=n.closest('details');if(d)d.open=true;});results.appendChild(a);}});if(!results.children.length)results.textContent='No matching headings found.';}
  if(search)search.addEventListener('input',run); if(clear)clear.addEventListener('click',()=>{search.value='';run();search.focus();});
  const avgBtn=document.getElementById('avgBtn'); if(avgBtn)avgBtn.addEventListener('click',()=>{const vals=document.getElementById('avgValues').value.split(',').map(Number).filter(Number.isFinite);const out=document.getElementById('avgResult');out.textContent=vals.length?`Average = ${(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2)}`:'Enter comma-separated numbers.';});
  const wcBtn=document.getElementById('wcBtn'); if(wcBtn)wcBtn.addEventListener('click',()=>{const c=Number(document.getElementById('cementKg').value),w=Number(document.getElementById('waterL').value),out=document.getElementById('wcResult');out.textContent=Number.isFinite(c)&&c>0&&Number.isFinite(w)&&w>=0?`Approximate water–cement ratio = ${(w/c).toFixed(2)}`:'Enter positive cement and non-negative water values.';});
  const timeline=document.getElementById('timelineBtn'); if(timeline)timeline.addEventListener('click',()=>{const n=Number(document.getElementById('timelineYear').value),out=document.getElementById('timelineResult');out.textContent=Number.isFinite(n)?(n<0?'Prehistoric period':n<500?'Ancient/Classical period':'Enter a BCE year as a negative value for this quick check.'):'Enter a year.';});
})();
</script>
