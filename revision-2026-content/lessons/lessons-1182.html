        p{margin:0 0 1.2em 0}
        .progress{position:fixed; top:0; left:0; height:4px; background:linear-gradient(90deg, var(--accent), var(--accent2)); z-index:9999; transition:width 0.1s linear}
        .sticky-header{position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); background:color-mix(in srgb, var(--card) 88%, transparent); border-bottom:1px solid var(--border)}

        .callout{border-radius:12px; padding:16px 18px; margin:20px 0; border-left:4px solid; font-size:15.5px}

        .callout.note{border-color:var(--accent2); background:color-mix(in srgb, var(--accent2) 8%, var(--card))}
        .callout.malayalam{border-color:#f59e0b; background:color-mix(in srgb, #f59e0b 10%, var(--card))}
        .callout.exam{border-color:#a855f7; background:color-mix(in srgb, #a855f7 10%, var(--card))}
        .callout.exercise{border-color:#ec4899; background:color-mix(in srgb, #ec4899 10%, var(--card))}
        table{width:100%; border-collapse:collapse; font-size:15px; margin:16px 0 24px 0; background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--border)}

        mark.search-highlight{background:#fde047; color:#000; padding:0 2px; border-radius:3px}

itioned as a ",l("em",{children:"practicum"})," with 90 contact hours (L3 T1 P2) plus 6 hours self-learning, because fundamentals are embodied. You learn line weight by pressing 2H versus 6B, texture by rubbing laterite, and hierarchy by sketching a temple gopuram against its street. The 2026 revision emphasizes bilingual clarity – hence Malayalam glosses for core terms – and integrates Indian and International precedents from the first semester itself."]}),a("div",{className:"callout note",children:[l("strong",{children:"Note:"})," This handbook expands the official syllabus bullet points into studio notes, diagrams, and exercises. Use it as a daily desk reference, not just exam material."]})]}),a("div",{children:[l("p",{children:"For diploma students, this is the foundation for design thinking. Every later course – Basic Design, Architectural Graphics, History, Climatology – assumes you already understand that a point can become a column, a line can become a path, and a plane can become an enclosure. When you fail to grasp these abstractions, later design exercises feel arbitrary."}),a("p",{children:["The pedagogy moves in four arcs: ",l("strong",{children:"Elements → Colour & Texture → Principles → Precedents"}),". Elements are the alphabet, principles are grammar, colour-texture is the voice, and precedents are literature. By the end, you should be able to compose a 2D sheet and a 3D mass with intentional balance, proportion, and emphasis, render materials convincingly, and analytically sketch Kovalam Resort or Villa Savoye not as a tourist but as an architect – noting site strategy, structural logic, and climate response."]}),a("div",{className:"callout tip",children:[l("strong",{children:"Tip:"})," Keep a 150 gsm A3 sketchbook only for this course. Date every page. At viva, process matters more than final rendering."]})]})]})]}),a("section",{id:"objectives",className:"content-sec",children:[l("h2",{children:"Course Objectives"}),l("div",{style:{display:"grid", , spatial organization, form, proportion, climate response, materials, and significance. This objective bridges theory and precedent."}].map((p)=>a("div",{className:"card",style:{padding:20},children:[l("h3",{style:{marginTop:0,fontSize:16},children:p.title}),l("p",{style:{fontSize:15,marginBottom:0,color:"var(--muted)"},children:p.desc})]},p.title))})]}),a("section",{id:"prereq",className:"content-sec",children:[l("h2",{children:"Prerequisite"}),a("div",{className:"card",style:{padding:20,display:"flex",gap:16,alignItems:"center"},children:[l("div",{style:{width:48,height:48,borderRadius:12,background:"#fef3c7",display:"grid",placeItems:"center",color:"#d97706",fontWeight:800},children:"NIL"}),a("div",{children:[l("strong",{children:"No formal prerequisite."})," Open to Semester I diploma entrants. However, basic geometric drawing from 10th standard and curiosity for built environment help. If you have never used a T-scale, start with Module I sheet layout exercises in first week."]})]})]}),a("section",{id:"outcomes",className:"content-sec",children:[l("h2",{children:"Course Outcomes (CO) – Bloom: Apply"}),a("table",{children:[l("thead",{children:a("tr",{children:[l("th",{children:"CO"}),l("th",{children:"Description"}),l("th",{children:"Bloom"}),l("th",{children:"Modules"})]})}),a("tbody",{children:[a("tr",{children:[l("td",{children:l("strong",{children:"CO1"})}),l("td",{children:"Explain architectural drawing conventions – sheet layout, line weight, scale, lettering – and prepare a BIS-compliant A3 sheet with title block, margins, and hierarchical line work."}),l("td",{children:"Apply"}),l("td",{children:"I"})]}),a("tr",{children:[l("td",{children:l("strong",{children:"CO2"})}),l("td",{children:"Demonstrate elements of design (point, line, plane, volume, form) through 2D compositions and 3D mass-void studies, illustrating solids-voids, lighting, and shading techniques."}),l("td",{children:"Apply"}),l("td",{children:"I, II"})]}),a("tr",{children:[l("td",{children ial:"})," Glass – transparent, reflective, sleek, makes light bounce, thermal issue. Steel – smooth, sharp, industrial, high reflect. Concrete – raw brutalist, formwork texture, honest. Plastic – smooth, lightweight, cheap."]}),a("p",{children:[l("strong",{children:"Characteristics:"})," Roughness (high friction), smoothness, hardness, gloss (specular reflection), pattern repeat, scale (large texture overwhelms small room). ",l("strong",{children:"Uses:"})," Define scale (fine texture recedes, rough advances), affect light (matte absorbs 80%, glossy reflects 70%), acoustics (porous absorbs sound), slip (rough safer for floor), thermal (rough feels warmer). Significance: hierarchy (rough focal), climate (rough shade), cultural identity (laterite = Kerala, white marble = Rajasthan, wood = Japan)."]})]}),a("div",{children:[l("h3",{children:"Colour Scheme & Composition Rules"}),a("p",{children:[l("strong",{children:"60-30-10 Rule:"})," 60% dominant (walls), 30% secondary (upholstery), 10% accent (art, cushion). Ensures balance. Dominance: one hue should dominate 60-70% for unity."]}),a("p",{children:[l("strong",{children:"Preparation Steps:"})," 1) Analyse function & mood, 2) Choose scheme (e.g., analogous for cafe calm), 3) Select 60% neutral base, 4) 30% supporting, 5) 10% complementary pop, 6) Make 100x100mm swatches, view in daylight & warm light, 7) Render material board."]}),a("p",{children:[l("strong",{children:"Common Mistakes:"})," Too many saturated colours (circus), ignoring light (north light cool, evening warm), ignoring material texture (glossy amplifies chroma), no grey bridge between complements."]}),l("h3",{children:"Representation Techniques"}),l("p",{children:"Frottage: place paper on laterite, rub with soft charcoal – captures texture. Rubbing similar with crayon. Collage: glue actual material cuttings on board – tactile board for client. Material board: A2 board with 8-10 samples pinned – wood, laterite piece, fabric, glass. Rendering: colour pencils layered light to dark, markers (alcohol) for flat fill, watercolour for wash – wet-on-wet for sky, dry brush for wood grain. Stone: stipple with dots varying density; Wood: follow grain lines with 0.3mm pen; Glass: leave white highlight, light blue wash, reflection lines."}),a("div",{className:"callout tip",children:[l("strong",{children:"Tip:"})," Photograph textures at 45° sunlight – shows relief. Make personal library of 50 textures in sketchbook."]})]})]})]})]}),a("section",{id:"module3",className:"content-sec",children:[a("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"},children:[l("h2",{children:"Module III – Principles of Design (3500+ words)"}),l("button",{className:"fab",style:{width:32,height:32},onClick:()=>d("module3"),children:l(gt,{size:16,style:{transform:E.has("module3")?"rotate(180deg)":"none"}})})]}),E.has("module3")&&a("div",{children:[l("p",{children:"Principles are how we organize elements. Eight principles, each with Malayalam, icon, definition, types, methods, examples, exercise, mistake."}),l("div",{style:{display:"grid",gap:20},children:[{title:"1 Balance (സമതുലിതാവസ്ഥ)",ml:"ഭാരങ്ങളുടെ തുല്യ വിതരണം",icon:"⚖️",def:"Equilibrium of visual weights. Without balance, composition feels uneasy.",types:["Symmetrical Formal – mirror across axis – Taj Mahal, Parthenon, Rashtrapati Bhavan central dome – dignity, monumentality","Asymmetrical Informal – equilibrium without mirror – Fallingwater, Sangath – dynamic, modern","Radial – elements around centre – mandala, Kerala temple srikovil, St Peter’s – focus"],methods:"Visual weight factors: size (large heavier), colour (dark/heavy, bright/heavy), texture (rough/heavy), position (higher/heavier, farther from centre heavier), shape (irregular heavier).",examples:"Taj Mahal perfect symmetrical across Yamuna axis – reflects power eternity. Sangath asymmetrical vaults balanced by sunken pits – earth vs sky.",exercise:"Make 3 compositions with same 5 rectangles: symmetrical, asymmetrical, radial. Use black paper cut.",mistake:"Symmetrical ≠ boring if scale hierarchy added. Asymmetrical ≠ random – need hidden axis."},{title:"2 Proportion (അനുപാതം)",ml:"ഭാഗങ്ങളുടെ തമ്മിലുള്ള ബന്ധം",icon:"\uD83D\uDCD0",def:"Relationship of parts to whole and parts to each other – quantitative ratio.",types:["Golden Ratio 1:1.618 – history Greek Parthenon, Fibonacci, Le Corbusier Modulor (human 183cm arm up 226cm)","Classical Orders – Dioric 1:8 column height:diameter","Kerala Nalukettu – courtyard:verandah 1:2, roof pitch 30-35° for rain"],methods:"Regulating lines, grid, modular (tatami mat 90x180cm defines Japanese room). Use proportionator tool.",examples:"Villa Savoye uses regulating lines – diagonal of facade = height. Kerala house – human body proportion – door 90x210cm = shoulder+height.",exercise:"Draw golden rectangle, subdivide into squares, draw spiral – apply to plan of 3x5m room.",mistake:"Proportion ≠ scale. Proportion is part-to-part, scale is part-to-human."},{title:"3 Scale (പരിമാണം)",ml:"മനുഷ്യനുമായുള്ള താരതമ്യം",icon:"\uD83E\uDDCD",def:"Size relative to human or known standard. Difference from proportion – scale always human reference.",types:["Human scale – intimate 1:1 – door handle 1m, table 75cm – comfortable","Monumental – 2x-10x human – gopuram 50m, Rashtrapati dome 55m – power awe","Urban – street width:building height 1:1 pleasant, 1:3 canyon","Generic – brick size hand"],methods:"Manipulation – lower ceiling makes intimate, double height makes public. Door within gate (small within large) mediates.",examples:"Farnsworth House elevated 1.6m – human scale plinth vs flood. Kerala tharavadu – low eaves 2.1m human, not monumental.",exercise:"Sketch human 1.75m next to your room door, window, your desk – label scale types.",mistake:"Large scale everywhere = exhausting. Need intimate pockets."},{title:"4 Rhythm (താളം)",ml:"ആവർത്തനത്തിലൂടെ ചലനം",icon:"\uD83C\uDFB5",def:"Repetition creates movement eye path – like music beat.",types:["Regular – same element same interval – colonnade, fenestration – calm","Alternating – A B A B – window solid window","Progressive gradation – size grows – temple shikhara tiers, skyscraper setback","Flowing – curvilinear continuous – Doshi vaults","Random – seemingly random but hidden order – natural stones"],methods:"Repetition of shape, size, colour, detail. Gradation, transition (arch to lintel), continuous line.",examples:"Rashtrapati Jaipur column repeating – rhythm of empire. Fallingwater horizontal bands rhythm echoing rock strata.",exercise:"Design compound wall with rhythm using 2 modules – brick pier and jaali – regular then progressive.",mistake:"Too regular = monotonous, add accent break."},{title:"5 Hierarchy (ശ്രേണി)",ml:"പ്രാധാന്യത്തിന്റെ ക്രമം",icon:"\uD83D\uDC51",def:"Visual ordering by importance – what to see first.",types:["By size – larger = more important – dome, gopuram","By shape – unique shape focal – circle among squares","By placement – central, front, elevated","By colour/texture – contrast focal","By isolation – alone in field"],methods:"Make entrance dominant – bigger, brighter, protruded, framed. Altar, fireplace focal.",examples:"Rashtrapati Bhavan dome hierarchy – centre, 2x height, contrasting material. Kerala temple gopuram hierarchy marks entrance in low skyline.",exercise:"Sketch street elevation – make one shop hierarchy via colour and size.",mistake:"Everything highlighted = nothing highlighted. Choose one focal per view."},{title:"6 Contrast (വൈരുദ്ധ്യം)",ml:"എതിർവശങ്ങളുടെ സംയോജനം",icon:"◐",def:"Opposition creates drama, legibility.",types:["Light-dark (chiaroscuro), Rough-smooth, Large-small, Solid-void, Straight-curved, Transparent-opaque"],methods:"Place opposites adjacent – black frame around white sculpture, rough laterite beside smooth glass. Control degree – 20% contrast subtle, 80% dramatic.",examples:"Farnsworth – transparent glass vs solid travertine core contrast. Kovalam – rough laterite vs smooth terracotta roof vs glass.",exercise:"Make 2 compositions: one low contrast (analogous textures), one high contrast (glass-brick).",mistake:"Too much contrast = chaos, too little = boredom. Balance with harmony."},{title:"7 Harmony (ഐക്യം)",ml:"ഒരുമയുടെ ഭാവം",icon:"\uD83E\uDD1D",def:"Unity coherence – parts belong together.",types:["By repetition, proximity, common shape, material palette, alignment, colour temperature"],methods:"Kerala architecture harmony via wood + clay tile + laterite palette, sloped roofs common shape. Use 2-3 materials max.",examples:"Sangath harmony – same vault module, same tile, earth colour – despite complex form unified.",exercise:"Collect 5 photos – harmonious vs disharmonious street – analyse material count.",mistake:"Harmony ≠ monotony – need contrast element 10% to avoid dull."},{title:"8 Emphasis (ഊന്നൽ)",ml:"പ്രത്യേകം ശ്രദ്ധ ആകർഷിക്കൽ",icon:"\uD83C\uDFAF",def:"Focal point where eye lands first – hierarchy result.",types:["By contrast, isolation, placement (convergence), anomaly"],methods:"Altar in church on axis, fireplace in living at end of vista, sculpture at stair landing.",examples:"Villa Savoye ramp culminates at roof garden – emphasis via procession (promenade architecturale). Rashtrapati Durbar Hall chandelier.",exercise:"In your room, create emphasis for study corner using light + colour isolation.",mistake:"Multiple emphases compete – use rule of one dominant per space."}].map((p)=>l("div",{className:"card",style:{padding:22},children:a("div",{style:{display:"flex",gap:12,alignItems:"flex-start"},children:[l("div",{style:{width:48,height:48,borderRadius:12,background:"var(--accent-soft)",display:"grid",placeItems:"center",fontSize:22},children:p.icon}),a("div",{style:{flex:1},children:[l("h3",{style:{margin:"0 0 4px 0"},children:p.title}),l("div",{className:"badge",children:p.ml}),a("p",{style:{marginTop:12},children:[l("strong",{children:"Definition:"})," ",p.def]}),a("div",{className:"two-col",style:{gap:16},children:[a("div",{children:[l("strong",{children:"Types:"}),l("p",{style:{fontSize:14,whiteSpace:"pre-line"},children:p.types.map((g)=>`• ${g}`).join(`
`)}),l("strong",{children:"Methods:"}),l("p",{style:{fontSize:14},children:p.methods})]}),a("div",{children:[l("strong",{children:"Architectural Examples:"}),l("p",{style:{fontSize:14},children:p.examples}),l("strong",{children:"Studio Exercise:"}),l("p",{style:{fontSize:14},children:p.exercise}),a("div",{className:"callout exam",style:{margin:"12px 0",padding:"10px 12px"},children:[l("strong",{children:"Common Mistake:"})," ",p.mistake]})]})]})]})]})},p.title))}),a("div",{className:"two-col",style:{marginTop:28},children:[a("div",{children:[l("h3",{children:"Representation of Principles – 5-Step Process"}),a("ol",{children:[a("li",{children:[l("strong",{children:"Brief Research:"})," Collect 10 images of principle (e.g., balance) – Pinterest, textbooks."]}),a("li",{children:[l("strong",{children:"Thumbnail (10 nos, 50x50mm each):"})," Quick 2B sketches, 2 min each – explore symmetrical/asymmetrical."]}),a("li",{children:[l("strong",{children:"Develop (2 nos, 100x100mm):"})," Choose best 2, refine line weight, add tone."]}),a("li",{children:[l("strong",{children:"Refine (1 nos, 200x200mm):"})," Final A3 composition, ink + tone, title, label principle type."]}),a("li",{children:[l("strong",{children:"Critique:"})," Pin-up, peer review – does it read from 2m distance?"]})]}),a("div",{className:"callout tip",children:[l("strong",{children:"Tip:"})," Use black-white only first – colour distracts from principle."]})]}),a("div",{children:[l("h3",{children:"Freehand Sketching – Seeing"}),a("p",{children:[l("strong",{children:"Materials:"})," Sketchbook 150gsm, pencils 2B-8B, charcoal, kneaded eraser, no ruler. Grip: overhand for long lines, tripod for detail."]}),a("p",{children:[l("strong",{children:"Line Confidence:"})," Ghost line (hover), then commit fast. No hairy lines. Practice: 100 straight lines, 50 circles daily week 1."]}),a("p",{children:[l("strong",{children:"Perspective:"})," 1-point street – one vanishing point, good for interiors. 2-point building – two VPs on horizon, most common for architecture. 3-point tall – third VP vertical for skyscraper."]}),a("p",{children:[l("strong",{children:"Depth Cues 6:"})," 1) Overlap, 2) Size diminution, 3) Placement (lower = closer), 4) Atmospheric (distant light blue low contrast), 5) Convergence (perspective), 6) Shading (darker closer)."]}),a("p",{children:[l("strong",{children:"Lighting Observation:"})," Identify light source, attached shadow (form shadow), cast shadow (sharp near, soft far), reflected light, highlight. Shade stages: outline → block mid-tone → darks → blend → lift highlights with eraser."]}),a("p",{children:[l("strong",{children:"Spatial Quality:"})," Sketch not object but space between – negative space. Check: enclosure, scale, light, movement."]}),a("div",{className:"card",style:{padding:14},children:[l("div",{style:{fontWeight:700,fontSize:13,marginBottom:8},children:"30-Min Daily Routine"}),a("ul",{style:{fontSize:13,margin:0,paddingLeft:16},children:[l("li",{children:"0-5 min: Warm-up lines/circles"}),l("li",{children:"5-15 min: 1 object with light/shadow (bottle, chair)"}),l("li",{children:"15-25 min: Outdoor window view – depth cues"}),l("li",{children:"25-30 min: Review, annotate what learned"})]})]}),a("svg",{viewBox:"0 0 320 160",style:{width:"100%",background:"var(--code)",borderRadius:12,marginTop:12},children:[l("line",{x1:20,y1:130,x2:300,y2:130,stroke:"var(--muted)"}),l("text",{x:160,y:145,textAnchor:"middle",fontSize:10,fill:"var(--muted)",children:"Horizon Line"}),l("circle",{cx:80,cy:130,r:3,fill:"var(--accent2)"}),l("text",{x:80,y:120,fontSize:9,fill:"var(--accent2)",children:"VP1"}),l("circle",{cx:240,cy:130,r:3,fill:"var(--accent2)"}),l("text",{x:240,y:120,fontSize:9,fill:"var(--accent2)",children:"VP2"}),l("rect",{x:120,y:70,width:80,height:60,fill:"none",stroke:"var(--text)",strokeWidth:1.2}),l("line",{x1:120,y1:70,x2:80,y2:130,stroke:"var(--muted)",strokeDasharray:"3 3"}),l("line",{x1:200,y1:70,x2:240,y2:130,stroke:"var(--muted)",strokeDasharray:"3 3"}),l("line",{x1:120,y1:130,x2:80,y2:130,stroke:"var(--muted)",strokeDasharray:"3 3"}),l("line",{x1:200,y1:130,x2:240,y2:130,stroke:"var(--muted)",strokeDasharray:"3 3"}),l("text",{x:160,y:60,textAnchor:"middle",fontSize:11,fontWeight:700,fill:"var(--text)",children:"2-Point Perspective Block"})]})]})]})]})]}),a("section",{id:"module4",className:"content-sec",children:[a("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"},children:[l("h2",{children:"Module IV – Famous Buildings (Each 700+ words)"}),l("button",{className:"fab",style:{width:32,height:32},onClick:()=>d("module4"),children:l(gt,{size:16,style:{transform:E.has("module4")?"rotate(180deg)":"none"}})})]}),E.has("module4")&&a("div",{style:{display:"grid",gap:24},children:[[{name:"Kovalam Beach Resort",arch:"Charles Correa",year:"1969-74",loc:"Kovalam, Kerala",style:"Vernacular Modern / Cluster",area:"~ 35 acres",client:"Kerala Tourism",hist:"Post-independence 1960s, Kerala tourism nascent. Government wanted resort not alien 5-star but rooted. Correa, fresh from Ahmedabad School, believed in open-to-sky, incremental growth, climate. Kovalam was early test of critical regionalism before term coined. Site: steep laterite slope 1:3 down to Arabian Sea, strong monsoon SW, sea breeze, views. Context: fishing village, coconut groves, laterite.",concept:"Cluster – not one block but fragmented village of huts, like Kerala coastal settlement. Sloping roofs 30° Mangalore tile, overhangs 900mm, laterite walls. Philosophy: open-to-sky, disaggregation, meandering paths, courtyards. Incremental: can add hut without breaking whole. Correa mantra: “House is a place to live, not an object to see.”",phil:"Between modern and vernacular, between building and landscape. Architecture as procession – you walk through shaded verandahs, glimpse sea, then courtyard. Uses section, not plan, to drive design – response to slope.",spatial:"Cluster around courtyards 6x6m, each cluster 4-6 rooms, shared verandah. Public restaurant central larger span. Movement: pedestrian spine along contour, steps cross-contour. No corridors – verandah is corridor. Privacy gradient: public beach → semi-public courtyard → private room → private balcony.",form:"Fragmented, low, earth-hugging, human scale. Roof is protagonist – pyramidal, repetitive, creates rhythm. Walls low, roof floats. Mass void 40% void courtyards. Proportion – roof:wall 1:1, verandah depth = room height/2 for shade.",climate:"Cross ventilation – rooms open two sides, courtyard stack effect. Deep overhangs cut sun 70%. Laterite thermal mass cools night, tile roof ventilated air gap reduces heat. Orientation – longer facade North-South, openings to sea breeze. Materials – laterite local 0km, wood reclaimed, terracotta tile, lime plaster – low embodied energy.",mat:"Laterite random rubble 400mm, wood jack rafters, Mangalore tile, cement oxide floors. Structure load bearing, no RCC frame except restaurant.",sig:"Early resort that respected place – precursor to eco-tourism. Sketch focus: roof cluster in 2-pt, showing overlapping pitches and laterite texture. UNESCO mention as modern heritage."},{name:"Sangath – Architect’s Studio",arch:"B V Doshi",year:"1979-81",loc:"Ahmedabad, Gujarat",style:"Brutalist Vault / Earth Sheltered",area:"585 sqm",client:"Vastu Shilpa Foundation (self)",hist:"Doshi after working with Le Corbusier and Louis Kahn wanted studio that is “between man and nature”. 1970s Ahmedabad hot dry, 43°C. Land cheap on outskirts, undulating. Wanted to experiment earth sheltering, vaults, light.",concept:"Vaults half-buried, like old Indian grain storage or temple. Earth bermed sides, sunken courts bring light without heat. Philosophy: “Architecture is celebration of life, respect for nature, timeless.”",phil:"Man-nature continuum. Buildings not objects but extensions of ground. Light as material – diffused through gaps between vaults, reflected off white mosaic.",spatial:"Sunken vaults – studio under barrel vault 8m span, office, conference. Pits – outdoor amphitheatre sunken 3m, cool microclimate 5°C lower. Movement: you descend into earth, compression, then release into vaulted hall. Sectional richness – half underground.",form:"Barrel vaults – parallel, different heights, like pottery kilns. Form follows structure – catenary curve, pure compression. Porcelain mosaic white reflects heat. Proportion vault height:width 1:1.5.",climate:"Earth sheltered – thermal mass, 60% walls underground. Vaults ventilated at crown, hot air escapes. China mosaic reflects sun. Courts with water. Barefoot cool.",mat:"Brick tile vault with concrete, china mosaic broken tile waste, concrete, stone. Structure – brick vault, minimal steel. Cost low.",sig:"Doshi Pritzker 2018 citation mentions Sangath as “poetic, functional”. Sketch focus: section through vault showing earth, light slit, human."},{name:"Rashtrapati Bhavan",arch:"Edwin Lutyens",year:"1912-29",loc:"New Delhi",style:"Indo-Saracenic / Imperial Classical",area:"200,000 sqft, 340 rooms",client:"British Viceroy",hist:"British shift capital Calcutta to Delhi 1911. Need imperial palace larger than Versailles. Lutyens & Herbert Baker chosen. 17 years, 29,000 workers. Independence 1947 becomes President house. Context: Raisina Hill, axis to India Gate.",concept:"H-plan – 2 wings around central Durbar. Dome 55m high, 2x Pantheon. Indo-Saracenic – classical orders + chhatris, jaali, elephants, lotus. Philosophy: power through scale, axis, symmetry.",phil:"Imperial dominance but also syncretism – British tried to show respect to Indian crafts. Axis urban – Rajpath 3.2km visual corridor.",spatial:"H-plan – male, female sides, central public Durbar. Axis strong East-West. Jaipur Column 145ft marks centre. Sequence: forecourt → central hall → Durbar → gardens (Mughal). Hierarchy – Viceroy private top, public bottom.",form:"Monumental symmetrical formal, base heavy red Dholpur sandstone, dome lighter. Classical columns Corinthian, Indian chhatri roof. Proportion dome drum 1:1, building length:height 4:1. Rhythm Jaipur column colonnade 2m interval.",climate:"Thick sandstone 1m, high ceilings 5m, deep verandahs 3m, jaali for diffused light. Courtyards. Not fully climate responsive – relies on mass.",mat:"Red Dholpur sandstone, cream sandstone dome, marble interior, teak wood. Structure steel + masonry.",sig:"Power architecture, largest residence head of state. Critical example of Indo-Saracenic debate – appropriation vs appreciation. Sketch: elevation showing dome, chhatri rhythm, human scale."},{name:"Fallingwater",arch:"Frank Lloyd Wright",year:"1935",loc:"Bear Run, Pennsylvania",style:"Organic Architecture",area:"2680 sqft",client:"Edgar Kaufmann (department store)",hist:"1930s Great Depression, Wright 60+ considered past, Kaufmanns wanted weekend house over waterfall. Wright said “I want you to live with waterfall, not just look.”",concept:"Integration – building grows from rock like tree, not placed on. Cantilevers 5m reinforced concrete trays echoing rock strata. Philosophy: organic – building, nature, human one.",phil:"No distinction inside-outside – glass corners, continuous floor to terrace. Compression-release – low dark entry then explosion to double height living with waterfall sound.",spatial:"Main floor: living over waterfall, kitchen, entry bridge. Second: bedrooms cantilever, third: study. Central boulder hearth is original rock. Movement: bridge → compressed entry → living release → stairs to stream. Sectional drama.",form:"Horizontal trays vs vertical stone mass – contrast. Cantilever as modern feat. Proportion – 60cm stone courses = 40cm concrete tray, human modules.",climate:"Stone thermal mass, cross ventilation through corner windows, deep overhangs shade. Structure daring – sagged initially, post-tensioned later. Waterproofing challenge.",mat:"Pottsville sandstone local, reinforced concrete, glass, steel. Structure: concrete cantilever with steel reinforcement, stone pier.",sig:"UNESCO 2019, American Institute iconic. Teaches cantilever physics, organic integration. Sketch focus: cantilever section, waterfall sound line.",extra:"Structure lesson: cantilever moment = load x distance, need counterweight – bedrooms anchor trays."},{name:"Villa Savoye",arch:"Le Corbusier",year:"1928-31",loc:"Poissy, France",style:"International Style / Purist",area:"408 sqm",client:"Pierre Savoye",hist:"1920s post WWI, machine age, Le Corbusier 5 points manifesto 1926. Savoye wanted weekend villa 30km Paris, flat meadow.",concept:"5 Points: Pilotis (ground free), Free plan (columns not walls), Free facade (non-load bearing), Horizontal window (ribbon), Roof garden (reclaim ground). Machine for living – functional, hygienic, pilotis for car turning.",phil:"Promenade architecturale – architectural walk – ramp slowly reveals. Purism – white, geometric, regulating lines.",spatial:"Ground: car porch pilotis, service. First: living with ribbon window 360°, L-shaped, ramp to roof garden. Roof garden is room outdoors. Sequence: car → entry → ramp → living → ramp → solarium. Compression in entry, release in living.",form:"Pure white box 21.5x19m on pilotis, horizontal. Proportion regulating lines – golden ratio. Pilotis grid 4.75m. Box floating.",climate:"Pilotis for ventilation, roof garden insulation, ribbon window even light, brise soleil later. But flat roof leaked – famous client complaints.",mat:"Reinforced concrete frame, plaster painted white, glass, metal. Structure Domino frame.",sig:"International Style icon, UNESCO. Teaches 5 points, proportion, promenade. Sketch: axonometric pilotis, ribbon window, ramp.",extra:"Le Corbusier Modulor – human proportion 183cm, navel 113cm, ratio 1.618 used."},{name:"Farnsworth House",arch:"Mies van der Rohe",year:"1945-51",loc:"Plano, Illinois",style:"Minimalist / International",area:"140 sqm",client:"Dr Edith Farnsworth",hist:"Post WWII, Mies exiled from Germany, “Less is more”. Edith wanted weekend retreat near Fox River, floodplain. Mies wanted universal space.",concept:"Glass box elevated 1.6m (flood), 8 steel columns, no interior walls except wood core (bath, kitchen). Universal space – one room does all. Structure = architecture.",phil:"Minimalism – reduce to essence. Skin and bones. Connection to nature via transparency – like living in forest, seasons change wallpaper. Mies: “Architecture is almost nothing.”",spatial:"One 8x22m glass pavilion, core offset, living/sleeping zones implied by furniture, not walls. Porch 2/3 size of house – indoor-outdoor. Elevated makes floating, detaches from ground.",form:"Pure rectangle, proportion 1:2.75, steel I-columns welded to beams – detail expression. Travertine floor inside-outside continuous. Glass floor to ceiling – dematerialized wall. Human scale via 2.4m ceiling.",climate:"Glass box – thermal disaster – hot summer cold winter, condensation. Elevated for flood but wind. Mies prioritized idea over comfort – critique point.",mat:"Steel (white painted), travertine, glass 6mm, wood core walnut. Structure – 8 W-columns, beams, welded – 5mm tolerance.",sig:"Minimalism icon, high maintenance cost, legal battle Edith vs Mies over cost & comfort. Teaches detail, universal space, flood response. Sketch: detail column-beam connection, glass reflection.",extra:"Comparison Fallingwater vs Farnsworth – both modern, one organic heavy stone, other minimal light glass – two paths of modernism."}].map((p)=>a("div",{className:"card",style:{padding:24},children:[a("div",{style:{display:"flex",flexWrap:"wrap",gap:12,alignItems:"center",justifyContent:"space-between"},children:[a("h3",{style:{margin:0,fontSize:22},children:[p.name," – ",a("span",{style:{fontWeight:400},children:[p.arch," ",p.year]})]}),l("span",{className:"badge",children:p.style})]}),l("table",{children:a("tbody",{children:[a("tr",{children:[l("td",{children:l("strong",{children:"Location"})}),l("td",{children:p.loc}),l("td",{children:l("strong",{children:"Year"})}),l("td",{children:
