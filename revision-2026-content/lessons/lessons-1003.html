<script>
(()=>{
  "use strict";
  const status=document.getElementById("status");
  const fallbackActions=document.getElementById("fallbackActions");
  const base="/assets/data/lesson-handbooks/1003/handbook-";
  const expectedHash="8d174d32a9195a746e5f3b7568e12a1e1e8659756905ec0ee04fe1619c2db00e";
  const urls=Array.from({length:10},(_,index)=>`${base}${String(index).padStart(2,"0")}.b64`);

  const fail=(error)=>{
    console.error(error);
    if(status){
      status.className="error";
      status.textContent=`The complete handbook could not be opened: ${error instanceof Error?error.message:String(error)}`;
    }
    if(fallbackActions) fallbackActions.hidden=false;
  };

  const loadPart=async(url,index)=>{
    if(status) status.textContent=`Loading handbook data ${index+1} of ${urls.length}…`;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),20000);
    try{
      const response=await fetch(url,{cache:"no-store",signal:controller.signal});
      if(!response.ok) throw new Error(`Missing handbook data file ${index+1} (HTTP ${response.status}).`);
      return (await response.text()).trim();
    }finally{
      clearTimeout(timer);
    }
  };

  const sha256=async(text)=>{
    if(!(globalThis.crypto&&crypto.subtle)) return null;
    const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
    return Array.from(new Uint8Array(digest),value=>value.toString(16).padStart(2,"0")).join("");
  };

  const boot=async()=>{
    if(typeof DecompressionStream!=="function") throw new Error("This browser or Android WebView does not support local gzip decompression. Use the downloadable notes PDF below.");
    const parts=[];
    for(let index=0;index<urls.length;index+=1) parts.push(await loadPart(urls[index],index));
    if(status) status.textContent="Verifying and opening the handbook…";
    const binary=atob(parts.join(""));
    const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    const hash=await sha256(html);
    if(hash&&hash!==expectedHash) throw new Error("The reconstructed handbook failed its SHA-256 integrity check.");
    if(!html.startsWith("<!doctype html>")||!html.includes("Official Source Declaration and Verified Inconsistencies")||!html.includes("downloadable-notes-")){
      throw new Error("The reconstructed handbook failed its structural integrity check.");
    }
    document.open();
    document.write(html);
    document.close();
    document.documentElement.classList.add("poly-lesson-page", "lesson-all-content", "revision-2026-lesson");
    document.body?.classList.add("poly-lesson-page", "lesson-all-content", "revision-2026-lesson");
  };

  void boot().catch(fail);
})();
</script>
