<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5fb;color:#17324d;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.load{width:min(620px,calc(100% - 28px));padding:28px;border:1px solid #cbd9e6;border-radius:18px;background:#fff;box-shadow:0 16px 45px rgba(20,55,85,.12)}h1{margin:.2rem 0;font-size:clamp(1.45rem,5vw,2.25rem)}p{margin:.5rem 0}.bar{height:10px;margin-top:18px;border-radius:999px;background:#dbe7f2;overflow:hidden}.bar span{display:block;height:100%;width:35%;background:#2563eb;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(185%)}}.error{color:#9b1c1c;font-weight:700}@media(prefers-reduced-motion:reduce){.bar span{animation:none;width:100%}}
</style>
</head>
<body>
<main class="load" role="status" aria-live="polite">
<p><strong>POLY PMNA · Revision 2026</strong></p>
<h1>Loading Course 1003 Engineering Graphics</h1>
<p id="status">Preparing the complete offline handbook…</p>
<div class="bar" aria-hidden="true"><span></span></div>
<noscript><p class="error">JavaScript is required to assemble this handbook from its local compressed data files.</p></noscript>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const base='/assets/data/lesson-handbooks/1003/handbook-';
  const expectedHash='8d174d32a9195a746e5f3b7568e12a1e1e8659756905ec0ee04fe1619c2db00e';
  const urls=Array.from({length:10},(_,i)=>`${base}${String(i).padStart(2,'0')}.b64`);
  try{
    if(typeof DecompressionStream!=='function') throw new Error('This browser does not support the required local gzip decompression API.');
    const parts=[];
    for(let i=0;i<urls.length;i++){
      status.textContent=`Loading handbook data ${i+1} of ${urls.length}…`;
      const response=await fetch(urls[i],{cache:'no-store'});
      if(!response.ok) throw new Error(`Missing handbook data file ${i+1} (HTTP ${response.status}).`);
      parts.push((await response.text()).trim());
    }
    status.textContent='Verifying and opening the handbook…';
    const encoded=parts.join('');
    const binary=atob(encoded);
    const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(globalThis.crypto&&crypto.subtle){
      const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html));
      const hash=Array.from(new Uint8Array(digest),value=>value.toString(16).padStart(2,'0')).join('');
      if(hash!==expectedHash) throw new Error('The reconstructed handbook failed its SHA-256 integrity check.');
    }
    if(!html.startsWith('<!doctype html>')||!html.includes('Official Source Declaration and Verified Inconsistencies')) throw new Error('The reconstructed handbook failed its structural integrity check.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    status.className='error';
    status.textContent=`The complete handbook could not be opened: ${error.message}`;
  }
})();
</script>
</body>
