<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Tools - POLY PMNA</title>
  <meta name="description" content="Frontend-only engineering calculators and study tools for POLY PMNA diploma students.">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5ff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
    .tools-frame{display:block;width:100%;height:100dvh;min-height:100vh;border:0;background:#eef5ff}
    .fallback{position:fixed;inset:0;display:grid;place-items:center;color:#102033;background:linear-gradient(180deg,#eaf3ff,#fff);padding:24px;text-align:center}
    .fallback a{color:#2457f5;font-weight:900}
  </style>
</head>
<body>
  <iframe id="toolsFrame" class="tools-frame" src="/tools-v2-original.html?v=20260620-unfreeze-toolbar" title="POLY PMNA Student Tools"></iframe>
  <noscript><main class="fallback"><p>Open <a href="/tools-v2-original.html">Student Tools</a>.</p></main></noscript>
  <script>
    (()=>{
      'use strict';
      const frame=document.getElementById('toolsFrame');
      const css='.toolbar{position:static!important;top:auto!important;z-index:auto!important}.toolbar{transform:none!important}@media(max-width:850px){.toolbar{top:auto!important;position:static!important}}';
      const applyFix=()=>{
        try{
          const doc=frame.contentDocument;
          if(!doc||!doc.head)return;
          let style=doc.getElementById('poly-tools-unfreeze-toolbar');
          if(!style){style=doc.createElement('style');style.id='poly-tools-unfreeze-toolbar';doc.head.append(style)}
          style.textContent=css;
        }catch(error){console.warn('Tools toolbar fix could not be applied yet.',error)}
      };
      frame.addEventListener('load',()=>{
        applyFix();
        const doc=frame.contentDocument;
        if(doc){
          doc.addEventListener('click',()=>setTimeout(applyFix,60),true);
          doc.addEventListener('input',()=>setTimeout(applyFix,60),true);
        }
      });
      setInterval(applyFix,800);
    })();
  </script>
</body>
</html>
