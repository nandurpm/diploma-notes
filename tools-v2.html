;transition:.18s}.top{display:flex;justify-content:space-between;gap:10px}.icon{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--c));font-size:24px}.fav{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}.fav.on{color:var(--warn);background:rgba(255,209,102,.16)}.card h3{font-size:20px;margin:0}.card p{color:var(--muted);line-height:1.5;margin:0;flex:1}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);background:rgba(255,255,255,.08);padding:7px 10px;border-radius:999px;font-weight:900;font-size:12px;color:var(--txt)}.modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.68);padding:16px;overflow:auto}.modal.show{display:block}.work{max-width:1120px;margin:0 auto 30px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(9,22,43,.98),rgba(5,11,22,.98));border-radius:30px;box-shadow:0 30px 120px rgba(0,0,0,.65);overflow:hidden}body.light .work{background:linear-gradient(180deg,#fff,#f7fbff)}.work-head{display:flex;justify-content:space-between;gap:16px;padding:22px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(0,213,255,.14),rgba(124,60,255,.14))}.work-head h2{margin:0;font-size:30px}.work-head p{margin:6px 0 0;color:var(--muted)}.close{border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--txt);border-radius:16px;min-width:48px;min-height:48px;font-weight:950}.work-body{padding:22px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);border-radius:999px;min-height:42px;padding:0 13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:white}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.field{display:grid;gap:7px}.field label{font-weight:900;color:var(--txt);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.result,.box{border:1px solid var(--line);background:rgba(255,255,255,.075);border-radius:20px;padding:16px;line-height:1.55;color:var(--txt);overflow:auto;margin-top:12px}.small{font-size:13px;color:var(--muted)}.calc{max-width:520px;margin:auto;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:26px;padding:14px}.display{min-height:86px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:20px;padding:13px;text-align:right;word-break:break-all}.expr{font-size:17px;color:var(--muted)}.ans{font-size:28px;font-weight:950}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.keys button{min-height:46px;border:1px solid var(--line);background:rgba(255,255,255,.09);color:var(--txt);border-radius:13px;font-weight:900;cursor:pointer}.keys .op{background:rgba(0,213,255,.18)}.keys .eq{grid-column:span 2;background:linear-gradient(135deg,var(--a),var(--c));color:#fff}.tbl{overflow:auto;border-radius:16px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--a);font-size:12px;text-transform:uppercase}.plot{width:100%;max-width:900px;height:420px;border:1px solid var(--line);border-radius:20px;background:#071225}.formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.formula-card{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:18px;padding:14px}.formula-card h4{margin:0 0 8px;color:var(--a)}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);padding:36px 12px}.toast{position:fixed;right:16px;bottom:16px;background:#071225;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;display:none;z-index:200}.toast.show{display:block}@media(max-width:980px){.menu-toggle{display:block}.nav-shell{border-radius:26px;align-items:flex-start;flex-wrap:wrap}.nav-links{display:none;width:100%;margin-left:0;overflow:auto;padding-top:8px}.nav-links.open{display:flex}.toolbar{top:86px}.search-row{grid-template-columns:1fr}.keys{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.site-header{padding:8px}.logo{width:36px;height:36px}.brand{font-size:20px}.page{padding-left:10px;padding-right:10px}.work-head{display:block}.close{margin-top:10px}.work-body{padding:14px}.form-grid{grid-template-columns:1fr}.plot{height:300px}.nav-links{flex-wrap:nowrap}.nav-links a{font-size:13px;padding:10px 12px}}

<script>
(()=>{'use strict';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));const cats=['All','Scientific','Electrical','Electronics','Digital','Mathematics','Mechanical','Civil','Programming','Student Utilities','Writing','Chemistry','Physics','Computer','Formula Handbook'];const tools=[['scientific','🧮','Scientific Calculator','Scientific','Trigonometry, inverse trig, powers, roots, factorial, percentage, memory, DEG/RAD and history.'],['electrical','⚡','Electrical Engineering Calculator','Electrical','Ohm law, 1-phase/3-phase power, energy cost, voltage drop, motor current, transformer, PF, battery and solar.'],['electronics','🔌','Electronics Calculator','Electronics','Resistor code, SMD, LED resistor, voltage divider, 555 timer, RC/RL/RLC, op-amp, filter and ADC/DAC.'],['digital','🔢','Digital Electronics Toolkit','Digital','Number systems, complements, binary arithmetic, BCD, Gray, ASCII, gates, truth table, Boolean and K-map.'],['unit','📏','Engineering Unit Converter','Scientific','Length, area, volume, mass, temperature, pressure, power, energy, speed, torque, frequency and data.'],['mechanical','⚙️','Mechanical Engineering Calculator','Mechanical','Gear, pulley, belt, torque, power, hydraulic, material weight, thermal expansion and pipe flow.'],['civil','🏗️','Civil Engineering Calculator','Civil','Concrete, mix, brick/block, plaster, paint, tile, steel, slope and staircase calculators.'],['math','∑','Mathematics Toolkit','Mathematics','Quadratic solver, simultaneous equation helper, percentage, logarithms and statistics.'],['plotter','📈','Graph Plotter','Mathematics','Canvas graph plotter for linear, quadratic, cubic, sin, cos, tan, log and exponential functions.'],['programming','💻','Programming Toolbox','Programming','HTML preview, JSON/XML formatter, regex tester, Base64, URL and case conversion.'],['student','🎯','Student Utility Toolkit','Student Utilities','Attendance, CGPA/SGPA, internal marks, exam countdown, study planner and timetable storage.'],['writing','✍️','Grammar and Writing Tools','Writing','Offline rule-based writing helper, report formatter and resume text cleaner.'],['formula','📚','Formula Handbook','Formula Handbook','Searchable formula cards for mathematics, physics, chemistry, electrical, electronics, digital, mechanical, civil and computer.'],['chemistry','🧪','Periodic Table / Chemistry Toolkit','Chemistry','Element search, common ions, pH calculator and molar mass helper for common compounds.'],['physics','🧲','Physics Toolkit','Physics','Force, work, power, kinetic energy, potential energy, density, pressure, velocity, acceleration and waves.'],['computer','🌐','Computer Number and Data Toolkit','Computer','Binary/decimal/hex, IP subnet, data size, download time, bitrate and password strength.']].map(x=>({id:x[0],icon:x[1],name:x[2],cat:x[3],desc:x[4]}));const map=Object.fromEntries(tools.map(t=>[t.id,t]));const LS={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};let state={cat:'All',q:'',tool:'',tab:'',cur:'0',acc:null,op:null,angle:'DEG',mem:0};const hist=id=>'pmna_hist_'+id;function f(n,d=6){return Number.isFinite(n)?(Math.abs(n)>1e6||Math.abs(n)<1e-4&&n!==0?n.toExponential(6):Number(n.toFixed(d)).toString()):'Invalid / not enough data'}function val(id){let v=parseFloat($('#'+id)?.value);return Number.isFinite(v)?v:NaN}function txt(id){return ($('#'+id)?.value||'').trim()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}function save(id,text){let h=LS.get(hist(id),[]);h.unshift({t:new Date().toLocaleString(),x:text});LS.set(hist(id),h.slice(0,8))}function result(x,id=state.tool){$('#result').innerHTML='<strong>Result:</strong><br>'+x;save(id,$('#result').innerText)}function history(id){let h=LS.get(hist(id),[]);return `<div class="box"><h3>History</h3>${h.length?h.map(x=>`<p class="small"><b>${x.t}</b><br>${esc(x.x).slice(0,300)}</p>`).join(''):'<p class="small">No saved calculations yet.</p>'}<button class="btn secondary" onclick="APP.clearHist('${id}')">Clear History</button></div>`}function fields(a){return `<div class="form-grid">${a.map(o=>`<div class="field"><label>${o.l}</label>${o.t==='select'?`<select id="${o.id}">${o.o.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select>`:o.t==='textarea'?`<textarea id="${o.id}" placeholder="${o.p||''}">${o.val||''}</textarea>`:`<input id="${o.id}" type="${o.t||'number'}" value="${o.val||''}" placeholder="${o.p||''}">`}</div>`).join('')}</div>`}function actions(name){return `<div class="actions"><button class="btn" onclick="APP.calc.${name}()">Calculate</button><button class="btn secondary" onclick="APP.reset()">Reset</button><button class="btn secondary" onclick="APP.copy(document.querySelector('#result').innerText)">Copy</button><button class="btn secondary" onclick="window.print()">Print</button></div>`}function panel(inner,formula,guide,id=state.tool){return `${inner}<div class="result" id="result"><strong>Result:</strong> Enter values and calculate.</div><div class="box"><b>Formula</b><br>${formula||'Formula appears with result.'}</div><div class="box small"><b>Guide</b><br>${guide||'Enter values carefully.'}</div>${history(id)}`}function tabs(tool,arr){state.tab=state.tab||arr[0][0];return `<div class="tabs">${arr.map(x=>`<button class="tab ${state.tab===x[0]?'active':''}" onclick="APP.tab('${tool}','${x[0]}')">${x[1]}</button>`).join('')}</div>`}window.APP={calc:{},sci:{},copy:t=>navigator.clipboard?.writeText(String(t)).then(()=>toast('Copied')),clearHist:id=>{LS.del(hist(id));open(id)},reset:()=>open(state.tool),tab:(tool,tab)=>{state.tab=tab;renderTool(tool)}};function card(t){let fav=LS.get('pmna_fav',[]).includes( r:<pre>${esc(a.toLowerCase())}</pre>Title:<pre>${esc(a.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()))}</pre>`;result(o,'programming')}catch(e){result('<span style="color:var(--warn)">'+esc(e.message)+'</span>','programming')}};function student(){let ts=[['att','Attendance'],['cgpa','CGPA'],['internal','Internal'],['exam','Countdown'],['planner','Planner'],['time','Timetable']];return tabs('student',ts)+panel(fields([{id:'a',l:'Value A / Text',t:'textarea'},{id:'b',l:'Value B'},{id:'c',l:'Value C',val:'75'},{id:'d',l:'Value D'}])+actions('student'),'Attendance, CGPA, internal mark, exam countdown, planner and timetable.','A/B/C/D are explained in output.')}APP.calc.student=()=>{let t=state.tab,a=parseFloat(txt('a')),b=val('b'),c=val('c'),d=val('d'),o='';if(t==='att'){let pct=b/a*100,need=Math.max(0,Math.ceil((c*a-100*b)/(100-c)));o=`Current=${f(pct)}%<br>Classes needed=${need}`}else if(t==='cgpa')o=`SGPA=${f((a*b+c*d)/(a+c))}`;else if(t==='internal')o=`Total internal=${f(a+b+c+d)}`;else if(t==='exam'){let days=Math.ceil((new Date(txt('a'))-new Date())/86400000);o=days>=0?`Exam in ${days} days`:'Date already passed'}else if(t==='planner')o=txt('a').split('\n').filter(Boolean).map((s,i)=>`Day ${i+1}: ${esc(s)} - ${f(b)} hours`).join('<br>');else{LS.set('pmna_timetable',txt('a'));o='Timetable saved in this browser.'}result(o,'student')};function writing(){let ts=[['grammar','Grammar Helper'],['report','Report Formatter'],['resume','Resume Cleaner']];return tabs('writing',ts)+panel(fields([{id:'a',l:'Text',t:'textarea'}])+actions('writing'),'Frontend rule-based writing helper.','Checks double spaces, repeated words, common spelling and missing full stop.')}APP.calc.writing=()=>{let text=txt('a'),issues=[],fixed=text;if(/  +/.test(fixed)){issues.push('Double spaces found');fixed=fixed.replace(/ {2,}/g,' ')}if(/\b(\w+)\s+\1\b/gi.test(fixed)){issues.push('Repeated words found');fixed=fixed.replace(/\b(\w+)\s+\1\b/gi,'$1')}let dict={recieve:'receive',definately:'definite
