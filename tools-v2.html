<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Tools v2 - POLY PMNA</title><style>:root{--b:#2457f5;--c:#09a9c9;--d:#102a80;--l:#d9e5f7;--m:#5b6b84}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eaf3ff,#f8fbff);color:#071225}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--l);box-shadow:0 8px 24px rgba(18,43,90,.08)}.brand{font-weight:950}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:11px 14px;border:1px solid var(--l);border-radius:999px;background:#fff;font-weight:850;text-decoration:none;color:#344054}.nav a.active,.nav a:hover{background:linear-gradient(135deg,var(--b),var(--c));color:white}.wrap{padding:22px clamp(12px,3vw,46px) 60px}.hero{border-radius:28px;background:linear-gradient(135deg,#10235d,var(--b),var(--c));color:white;padding:clamp(24px,4vw,46px);box-shadow:0 18px 45px rgba(18,43,90,.14)}.hero h1{font-size:clamp(34px,5vw,58px);margin:.2rem 0}.hero p{max-width:850px;line-height:1.55;color:#eaf1ff}.bar{margin:18px 0;padding:14px;background:#fff;border:1px solid var(--l);border-radius:22px;box-shadow:0 10px 28px rgba(18,43,90,.07)}#search{width:100%;min-height:52px;padding:0 16px;border:1px solid var(--l);border-radius:16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--l);background:#fff;border-radius:999px;min-height:40px;padding:0 13px;font-weight:900}.chip.on{background:var(--b);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:22px;min-height:220px;box-shadow:0 12px 32px rgba(18,43,90,.09);display:grid;gap:12px}.card h3{margin:0;font-size:20px}.card p{color:var(--m);line-height:1.5;margin:0}.tag{width:max-content;background:#eef2ff;color:#263ea8;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:950}.open,.btn{border:0;background:var(--b);color:#fff;border-radius:14px;min-height:46px;padding:0 14px;font-weight:950}.modal{position:fixed;inset:0;background:rgba(2,8,23,.72);display:none;z-index:30;padding:18px;overflow:auto}.modal.show{display:block}.work{max-width:1050px;margin:auto;background:#fff;border-radius:28px;overflow:hidden}.head{display:flex;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#10235d,var(--b),var(--c));color:#fff;padding:20px}.head h2{margin:0}.body{padding:24px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:grid;gap:7px}.field label{font-weight:900}.field input,.field select,.field textarea{min-height:52px;border:1px solid #cdd9ec;border-radius:15px;padding:12px;background:#f8fbff}.field textarea{min-height:130px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.result{margin-top:14px;border:1px solid #cfe8ff;background:#eef7ff;color:#153c6b;border-radius:18px;padding:15px;white-space:pre-wrap;line-height:1.55}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid var(--l);padding:10px;text-align:left}th{background:#eef5ff}@media(max-width:760px){.topbar{display:block}.nav{margin-top:10px}.grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="brand">POLY PMNA Student Tools</div><nav class="nav"><a href="index.html">Home</a><a href="revision-2021.html">Revision 2021</a><a href="daily-quiz.html">Mock Exams</a><a class="active" href="tools-v2.html">Tools</a><a href="contact.html">Help</a></nav></header><main class="wrap"><section class="hero"><p><b>FRONTEND ONLY</b></p><h1>Professional engineering tools lab.</h1><p>Clean calculators and utilities for diploma engineering students. Works directly in the browser without backend login.</p></section><section class="bar"><input id="search" placeholder="Search tools: voltage, CGPA, attendance, civil, resume"><div class="chips" id="chips"></div></section><section class="grid" id="grid"></section></main><div class="modal" id="modal"><article class="work"><div class="head"><div><h2 id="title">Tool</h2><p id="desc"></p></div><button class="btn" id="close">Close</button></div><div class="body" id="body"></div></article></div><script>(()=>{const $=s=>document.querySelector(s),tools=[['common','Scientific Calculator','Quick arithmetic, powers, square root and percentage.'],['common','CGPA / SGPA Calculator','Weighted grade point calculator using credits.'],['common','Attendance Calculator','Current percentage and required classes.'],['electrical','Ohm Law Calculator','Voltage, current, resistance and power.'],['electrical','Voltage Divider','Output voltage from Vin, R1 and R2.'],['electrical','LED Resistor','Series resistor and wattage for LED circuits.'],['electrical','Series Parallel Resistance','Total resistance from comma-separated values.'],['electrical','Capacitor Code','Codes like 104 to pF, nF and uF.'],['civil','Concrete Quantity','Wet and dry volume for concrete work.'],['civil','Brick Quantity','Approximate brick count for wall size.'],['civil','Steel Weight','Rebar weight from diameter, length and quantity.'],['mechanical','Torque Calculator','Torque from force and radius.'],['mechanical','Gear Ratio','Gear ratio from driver and driven teeth.'],['computer','Number Base Converter','Binary, decimal, octal and hexadecimal.'],['computer','Logic Gate Table','AND, OR, NAND, NOR, XOR truth table.'],['career','Resume Builder','Simple student resume preview.'],['career','Application Letter','Formal application letter generator.'],['career','Basic Grammar Helper','Offline correction for common mistakes.']];let cat='all';const cats=['all','common','electrical','civil','mechanical','computer','career'];function render(){let q=$('#search').value.toLowerCase();let list=tools.map((t,i)=>[...t,i]).filter(t=>(cat==='all'||t[0]===cat)&&(`${t[1]} ${t[2]}`.toLowerCase().includes(q)));$('#grid').innerHTML=list.map(t=>`<article class="card"><span class="tag">${t[0]}</span><h3>${t[1]}</h3><p>${t[2]}</p><button class="open" data-i="${t[3]}">Open Tool</button></article>`).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openTool(+b.dataset.i))}$('#chips').innerHTML=cats.map((c,i)=>`<button class="chip ${i?'':'on'}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.c;render()});$('#search').oninput=render;$('#close').onclick=()=>$('#modal').classList.remove('show');function field(n,id,type='number'){return `<div class="field"><label>${n}</label><input id="${id}" type="${type}"></div>`}function area(){return '<div class="result" id="out">Result will appear here.</div>'}function openTool(i){let t=tools[i];$('#title').textContent=t[1];$('#desc').textContent=t[2];$('#body').innerHTML=form(t[1]);$('#modal').classList.add('show');$('#calc')&&($('#calc').onclick=()=>calc(t[1]));$('#print')&&($('#print').onclick=()=>print())}function form(name){if(name.includes('Resume'))return `${field('Name','name','text')}${field('Email','email','text')}<div class="field"><label>Education</label><textarea id="edu"></textarea></div><div class="field"><label>Skills</label><textarea id="skills"></textarea></div><div class="actions"><button class="btn" id="calc">Build</button><button class="btn" id="print">Print</button></div>${area()}`;if(name.includes('Grammar'))return `<div class="field"><label>Text</label><textarea id="txt"></textarea></div><div class="actions"><button class="btn" id="calc">Check</button></div>${area()}`;if(name.includes('Letter'))return `${field('Name','name','text')}${field('College','college','text')}${field('Purpose','purpose','text')}<div class="actions"><button class="btn" id="calc">Generate</button><button class="btn" id="print">Print</button></div>${area()}`;if(name.includes('Logic'))return `<div class="field"><label>Gate</label><select id="gate"><option>AND</option><option>OR</option><option>NAND</option><option>NOR</option><option>XOR</option></select></div><div class="actions"><button class="btn" id="calc">Generate</button></div>${area()}`;if(name.includes('Base'))return `${field('Number','n','text')}<div class="field"><label>Base</label><select id="base"><option value="2">Binary</option><option value="10">Decimal</option><option value="16">Hex</option><option value="8">Octal</option></select></div><div class="actions"><button class="btn" id="calc">Convert</button></div>${area()}`;return `<div class="fields">${field('Value 1','a')}${field('Value 2','b')}${field('Value 3','c')}${field('Value 4','d')}</div><div class="actions"><button class="btn" id="calc">Calculate</button></div>${area()}`}function v(id){return parseFloat($('#'+id)?.value)}function f(n){return Number.isFinite(n)?(+n.toFixed(6)).toString():'not enough values'}function calc(name){let a=v('a'),b=v('b'),c=v('c'),d=v('d'),r='';if(name.includes('Scientific'))r=`a+b=${f(a+b)}\na-b=${f(a-b)}\na*b=${f(a*b)}\na/b=${f(a/b)}\na^b=${f(a**b)}\nsqrt(a)=${f(Math.sqrt(a))}`;else if(name.includes('CGPA'))r=`SGPA/CGPA = ${f((a*b+c*d)/(a+c))}`;else if(name.includes('Attendance'))r=`Current = ${f(b/a*100)}%\nMore classes for 75% = ${Math.max(0,Math.ceil((75*a-100*b)/25))}`;else if(name.includes('Ohm'))r=`V=${f(a)} V\nI=${f(b)} A\nR=${f(a/b)} ohm\nP=${f(a*b)} W`;else if(name.includes('Divider'))r=`Vout=${f(a*c/(b+c))} V`;else if(name.includes('LED')){let ohm=(a-b)/(c/1000);r=`Resistor=${f(ohm)} ohm\nPower=${f((c/1000)**2*ohm)} W`}else if(name.includes('Series'))r=`Series=${f([a,b,c,d].filter(Number.isFinite).reduce((s,x)=>s+x,0))} ohm\nParallel=${f(1/[a,b,c,d].filter(Number.isFinite).reduce((s,x)=>s+1/x,0))} ohm`;else if(name.includes('Capacitor')){let code=String($('#a').value||''),pf=Number(code.slice(0,2))*10**Number(code.slice(2));r=`${pf} pF = ${f(pf/1000)} nF = ${f(pf/1000000)} uF`}else if(name.includes('Concrete')){let wet=a*b*c,dry=wet*1.54;r=`Wet volume=${f(wet)} m3\nDry volume=${f(dry)} m3`}else if(name.includes('Brick'))r=`Bricks approx = ${Math.ceil(a*b*c/0.0019)}`;else if(name.includes('Steel'))r=`Weight=${f(a*a/162*b*c)} kg`;else if(name.includes('Torque'))r=`Torque=${f(a*b)} N.m`;else if(name.includes('Gear'))r=`Ratio=${f(b/a)}`;else if(name.includes('Base')){let n=parseInt($('#n').value,$('#base').value);r=`Decimal ${n}\nBinary ${n.toString(2)}\nOctal ${n.toString(8)}\nHex ${n.toString(16).toUpperCase()}`}else if(name.includes('Logic')){let g=$('#gate').value,rows=[[0,0],[0,1],[1,0],[1,1]],y=(x,z)=>g==='AND'?x&z:g==='OR'?x|z:g==='NAND'?+( !(x&z)):g==='NOR'?+(!(x|z)):x^z;r='<table><tr><th>A</th><th>B</th><th>Y</th></tr>'+rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${y(x[0],x[1])}</td></tr>`).join('')+'</table>'}else if(name.includes('Resume'))r=`<h2>${$('#name').value}</h2><p>${$('#email').value}</p><h3>Education</h3><p>${$('#edu').value}</p><h3>Skills</h3><p>${$('#skills').value}</p>`;else if(name.includes('Letter'))r=`From,<br>${$('#name').value}<br><br>To,<br>The Principal<br>${$('#college').value}<br><br>Subject: ${$('#purpose').value}<br><br>Respected Sir/Madam,<br>I kindly request approval for ${$('#purpose').value}.<br><br>Yours faithfully,<br>${$('#name').value}`;else if(name.includes('Grammar'))r=$('#txt').value.replace(/\bI has\b/gi,'I have').replace(/\bYour welcome\b/gi,"You're welcome").replace(/\bRecieve\b/gi,'Receive').replace(/\bDefinately\b/gi,'Definitely');$('#out').innerHTML=r}render()})();</script></body></html>
