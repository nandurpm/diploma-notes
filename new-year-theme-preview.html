<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#06152f">
  <title>New Year Theme Preview | POLY PMNA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #030817; color: #f8fbff; }
    .preview-shell { display: grid; grid-template-rows: auto minmax(0, 1fr); width: 100%; height: 100%; }
    .preview-toolbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(66, 221, 255, .28);
      background: linear-gradient(110deg, rgba(3,8,23,.98), rgba(7,28,58,.98));
      box-shadow: 0 12px 32px rgba(0,0,0,.34);
    }
    .preview-brand { display: flex; align-items: center; gap: 9px; min-width: max-content; font-weight: 900; letter-spacing: .02em; }
    .preview-brand__mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(247,201,72,.55); border-radius: 11px; color: #f7c948; background: rgba(247,201,72,.08); }
    .preview-modes { display: flex; flex: 1; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
    .preview-link, .preview-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      color: #eaf6ff;
      background: rgba(255,255,255,.055);
      text-decoration: none;
      white-space: nowrap;
      font-weight: 800;
      font-size: .86rem;
    }
    .preview-link:hover, .preview-link.active { color: #04101f; border-color: transparent; background: linear-gradient(135deg, #42ddff, #f7c948); }
    .preview-close { margin-left: auto; }
    .preview-frame-wrap { position: relative; min-height: 0; background: #081326; }
    #previewFrame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .preview-loading { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #b9d6eb; background: radial-gradient(circle at center, #0a2344, #030817 68%); text-align: center; font-weight: 800; }
    .preview-loading[hidden] { display: none; }
    @media (max-width: 720px) {
      .preview-toolbar { min-height: 54px; padding: 7px 8px; gap: 8px; }
      .preview-brand strong { display: none; }
      .preview-brand__mark { width: 38px; height: 38px; }
      .preview-link, .preview-close { min-height: 38px; padding: 8px 11px; font-size: .78rem; }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <nav class="preview-toolbar" aria-label="New Year theme preview modes">
      <div class="preview-brand"><span class="preview-brand__mark" aria-hidden="true">✦</span><strong>POLY PMNA Theme Preview</strong></div>
      <div class="preview-modes">
        <a class="preview-link" data-mode="approaching" href="?mode=approaching">Approaching</a>
        <a class="preview-link" data-mode="countdown" href="?mode=countdown">Countdown</a>
        <a class="preview-link" data-mode="celebration" href="?mode=celebration">Happy New Year</a>
        <a class="preview-link" data-mode="welcome" href="?mode=welcome">Calm Welcome</a>
        <a class="preview-link" data-mode="lesson" href="?mode=countdown&page=%2Frevision-2026-content%2Flessons%2Flessons-1002.html">Lesson Preview</a>
      </div>
      <a class="preview-close" href="/">Exit</a>
    </nav>

    <section class="preview-frame-wrap">
      <div class="preview-loading" id="previewLoading">Loading the selected New Year theme…</div>
      <iframe id="previewFrame" title="POLY PMNA New Year theme preview"></iframe>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const mode = ["approaching", "countdown", "celebration", "welcome"].includes(params.get("mode")) ? params.get("mode") : "countdown";
      const requestedPage = params.get("page") || "/";
      const safePage = requestedPage.startsWith("/") && !requestedPage.startsWith("//") ? requestedPage : "/";
      const previewYear = new Date().getUTCFullYear() + 1;
      const simulatedDates = {
        approaching: `${previewYear - 1}-12-29T14:30:00.000Z`,
        countdown: `${previewYear - 1}-12-31T18:27:27.000Z`,
        celebration: `${previewYear}-01-01T00:30:00.000Z`,
        welcome: `${previewYear}-01-02T06:30:00.000Z`
      };

      document.querySelectorAll("[data-mode]").forEach(link => {
        const active = link.dataset.mode === mode || (link.dataset.mode === "lesson" && safePage.includes("/lessons/"));
        link.classList.toggle("active", active);
        if (link.dataset.mode !== "lesson") link.href = `?mode=${encodeURIComponent(link.dataset.mode)}&page=${encodeURIComponent(safePage)}`;
      });

      const frame = document.getElementById("previewFrame");
      const loading = document.getElementById("previewLoading");
      const separator = safePage.includes("?") ? "&" : "?";
      frame.src = `${safePage}${separator}polyNewYearPreviewBase=1`;

      frame.addEventListener("load", () => {
        try {
          const frameWindow = frame.contentWindow;
          const frameDocument = frame.contentDocument;
          const fixedNow = Date.parse(simulatedDates[mode]);

          frameWindow.Date.now = () => fixedNow;
          frameWindow.__POLY_NEW_YEAR_THEME__ = false;
          try {
            frameWindow.sessionStorage.removeItem(`poly-new-year-celebrated-${previewYear}`);
            frameWindow.sessionStorage.setItem("poly-new-year-effects", "playing");
          } catch (error) {
            // Preview remains usable when browser storage is restricted.
          }

          const existingStyle = frameDocument.querySelector('link[href*="new-year-theme.css"]');
          if (!existingStyle) {
            const style = frameDocument.createElement("link");
            style.rel = "stylesheet";
            style.href = "/assets/css/new-year-theme.css?v=preview-1";
            frameDocument.head.append(style);
          }

          frameDocument.documentElement.dataset.polyNewYearPreview = mode;
          const script = frameDocument.createElement("script");
          script.src = "/assets/js/new-year-theme.js?v=preview-1";
          script.onload = () => { loading.hidden = true; };
          script.onerror = () => { loading.textContent = "The preview assets have not deployed yet. Refresh this page after the latest main-branch deployment completes."; };
          frameDocument.body.append(script);
        } catch (error) {
          loading.textContent = "This page could not open inside the preview frame. Open the normal website and try the preview link again.";
          console.error(error);
        }
      });
    })();
  </script>
</body>
</html>
