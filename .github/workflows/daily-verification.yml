name: Daily Deployment and Link Verification

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Site Audit & Link Checker
        run: |
          python3 scripts/audit_site_perf_accessibility.py
          python3 scripts/weekly_link_checker.py || true

      - name: Commit audit report if changed
        run: |
          git config --global user.name "POLY PMNA Bot"
          git config --global user.email "bot@polypmna.dpdns.org"
          git add reports/site-audit-report.json
          git commit -m "chore: daily automated site audit & verification report [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or failed"
