name: Daily Deployment and Link Verification

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'

      - name: Run Site Audit, Advanced Accessibility, Performance & Link Checker
        run: |
          python3 scripts/audit_site_perf_accessibility.py
          python3 scripts/advanced_audit.py
          python3 scripts/perf_cwv_monitor.py
          python3 scripts/weekly_link_checker.py || true

      - name: Commit audit report if changed
        run: |
          git config --global user.name "POLY PMNA Bot"
          git config --global user.email "bot@polypmna.dpdns.org"
          git add reports/site-audit-report.json reports/advanced-audit-report.json reports/perf-cwv-report.json
          git commit -m "chore: daily automated performance, CWV and accessibility audit report [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or failed"
