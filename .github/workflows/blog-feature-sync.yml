name: Blog feature branch sync

on:
  push:
    branches:
      - feat/blog-gk-section

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Blog & GK to canonical site navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/site-shell.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'label: "2015 Materials" label: "Tools" label: "Help"',
              'label: "2015 Materials" label: "Tools" label: "Blog & GK" label: "Help"'
          )
          text = text.replace(
              'const VERSION = "20260819-developer-link3";',
              'const VERSION = "20260916-blog-nav1";'
          )

          needle = '    ["Tools", "/tools.html", path => /\\/tools(?:-v2|-v2-original)?\\.html$/i.test(path)],\n    ["Help", "/contact.html", path => path.endsWith("/contact.html")]'
          replacement = '    ["Tools", "/tools.html", path => /\\/tools(?:-v2|-v2-original)?\\.html$/i.test(path)],\n    ["Blog & GK", "/blog.html", path => path.endsWith("/blog.html") || path.includes("/blog/")],\n    ["Help", "/contact.html", path => path.endsWith("/contact.html")]'
          if needle in text:
              text = text.replace(needle, replacement, 1)
          elif '["Blog & GK", "/blog.html"' not in text:
              raise SystemExit('Could not find canonical Tools -> Help navigation block')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh sitemap
        run: python tools/generate_sitemap.py

      - name: Validate generated files
        run: |
          python tools/generate_sitemap.py --check
          git diff --check

      - name: Commit deterministic sync
        run: |
          if git diff --quiet -- assets/js/site-shell.js sitemap.xml; then
            echo "Navigation and sitemap already synced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-shell.js sitemap.xml
          git commit -m "feat(blog): add Blog & GK to global nav and sitemap"
          git push origin HEAD:feat/blog-gk-section
