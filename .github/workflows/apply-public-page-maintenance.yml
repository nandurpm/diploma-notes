name: Apply public page maintenance batch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-public-page-maintenance.yml"

permissions:
  contents: write

jobs:
  maintain-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep lesson Twitter fallback audit-compatible
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/audit_site.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for key in REQUIRED_META:
        if not parser.meta.get(key):
            issues.append(f"Missing metadata: {key}")
'''
          new = '''    required_meta = REQUIRED_META
    if local.startswith("lessons/"):
        required_meta = tuple(
            key for key in REQUIRED_META if key not in {"twitter:title", "twitter:description"}
        )
    for key in required_meta:
        if not parser.meta.get(key):
            issues.append(f"Missing metadata: {key}")
'''
          if old not in text:
              raise SystemExit('Expected audit metadata loop was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Apply metadata, breadcrumbs and accessibility updates
        run: python tools/maintain_public_pages.py

      - name: Run static site audit
        id: static_audit
        continue-on-error: true
        run: python tools/audit_site.py

      - name: Check JavaScript syntax
        id: syntax_audit
        continue-on-error: true
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file" || status=1
          done < <(find assets/js -type f -name '*.js' -print0)
          exit "$status"

      - name: Install Chromium audit dependency
        run: |
          mkdir -p /tmp/poly-site-audit
          cd /tmp/poly-site-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/tools/runtime_console_audit.cjs" .

      - name: Run browser console audit
        id: runtime_audit
        continue-on-error: true
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/poly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          cd /tmp/poly-site-audit
          BASE_DIR="$GITHUB_WORKSPACE" BASE_URL="http://127.0.0.1:8000" node runtime_console_audit.cjs

      - name: Record audit step status
        shell: python
        env:
          STATIC_RESULT: ${{ steps.static_audit.outcome }}
          SYNTAX_RESULT: ${{ steps.syntax_audit.outcome }}
          RUNTIME_RESULT: ${{ steps.runtime_audit.outcome }}
        run: |
          import json
          import os
          from pathlib import Path

          json_path = Path('reports/site-integrity-audit.json')
          payload = json.loads(json_path.read_text(encoding='utf-8'))
          payload['workflow_results'] = {
              'static_audit': os.environ['STATIC_RESULT'],
              'javascript_syntax': os.environ['SYNTAX_RESULT'],
              'runtime_console': os.environ['RUNTIME_RESULT'],
          }
          json_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          md_path = Path('reports/site-integrity-audit.md')
          md = md_path.read_text(encoding='utf-8')
          md += '\n## Workflow checks\n\n'
          md += f"- Static audit step: **{os.environ['STATIC_RESULT']}**\n"
          md += f"- JavaScript syntax step: **{os.environ['SYNTAX_RESULT']}**\n"
          md += f"- Browser console step: **{os.environ['RUNTIME_RESULT']}**\n"
          md_path.write_text(md, encoding='utf-8')

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-public-page-maintenance.yml

      - name: Commit maintained pages and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete public page SEO and accessibility batch"
          git push
