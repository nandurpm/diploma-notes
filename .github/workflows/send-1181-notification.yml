name: Send Course 1181 update notification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/notify-1181-now.txt"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Install FCM sender dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Send FCM notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account
          from google.auth.exceptions import GoogleAuthError

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              raise SystemExit("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is empty or unavailable to this workflow.")

          print(f"Secret received: yes (length={len(raw)})")

          try:
              account = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON: {exc}")

          required = ["project_id", "client_email", "private_key"]
          missing = [key for key in required if not account.get(key)]
          if missing:
              raise SystemExit(f"ERROR: Firebase service account JSON is missing required field(s): {', '.join(missing)}")

          project_id = account["project_id"]
          print(f"Firebase project detected: {project_id}")
          print(f"Service account detected: {account['client_email']}")

          try:
              credentials = service_account.Credentials.from_service_account_info(
                  account,
                  scopes=["https://www.googleapis.com/auth/firebase.messaging"],
              )
              credentials.refresh(Request())
          except Exception as exc:
              raise SystemExit(f"ERROR: Firebase service-account authentication failed: {type(exc).__name__}: {exc}")

          if not credentials.token:
              raise SystemExit("ERROR: Google OAuth token was not obtained.")

          print("Google OAuth token obtained successfully.")

          payload = {
              "message": {
                  "topic": "all-users",
                  "notification": {
                      "title": "📢 POLY PMNA – Course 1181 Updated",
                      "body": "The Course 1181 📋— Architectural Graphics lesson has been updated  👉 Open Course 1181 now."
                  },
                  "data": {
                      "url": "https://polypmna.dpdns.org/revision-2026-content/lessons/lessons-1181.html",
                      "subjectCode": "1181",
                      "revision": "REV2026",
                      "contentType": "lesson-update"
                  },
                  "android": {
                      "priority": "HIGH",
                      "ttl": "86400s"
                  }
              }
          }

          endpoint = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          response = requests.post(
              endpoint,
              headers={
                  "Authorization": f"Bearer {credentials.token}",
                  "Content-Type": "application/json; charset=UTF-8",
              },
              json=payload,
              timeout=30,
          )

          print(f"FCM HTTP status: {response.status_code}")
          if not response.ok:
              print("FCM response:")
              print(response.text)
              sys.exit(1)

          print("SUCCESS: FCM accepted the Course 1181 notification.")
          print(response.text)
          PY
