name: Export Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-android-apk.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polytechnic-Study-Hub-v1.0.0
          path: downloads/Polytechnic-Study-Hub-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record workflow run ID
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > downloads/android-apk-workflow-run-id.txt
          rm -f .github/workflows/export-android-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Android APK artifact run"
          git push origin main
