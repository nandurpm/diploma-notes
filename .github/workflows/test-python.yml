name: Tiny python
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-python.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          print(Path('.').resolve())
      - run: rm .github/workflows/test-python.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove tiny python workflow"
          git push
