name: Fix semester inline layout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-semester-inline-layout.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add inline layout safeguards for semester groups
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('assets/js/subject-browser.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
            '<section class="semester-subject-section" aria-labelledby="${headingId}">',
            '<section class="semester-subject-section" aria-labelledby="${headingId}" style="grid-column:1/-1;display:block;width:100%;min-width:0;margin:0 0 24px">'
          )
          text = text.replace(
            '<div class="semester-group-heading">',
            '<div class="semester-group-heading" style="display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:52px;margin:0 0 14px;padding:13px 16px;border:1px solid rgba(29,78,216,.14);border-radius:18px;background:linear-gradient(135deg,rgba(219,234,254,.96),rgba(236,253,245,.96));box-shadow:0 10px 24px rgba(20,45,90,.07)">'
          )
          text = text.replace(
            '<div class="semester-card-grid">',
            '<div class="semester-card-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch;width:100%">'
          )
          if 'grid-column:1/-1;display:block;width:100%' not in text:
              raise SystemExit('Inline semester section layout was not added')
          path.write_text(text, encoding='utf-8')

          # cache-bust the subject browser script everywhere so the browser loads the fixed renderer
          html_count = 0
          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts:
                  continue
              html = page.read_text(encoding='utf-8')
              updated = re.sub(
                  r'/assets/js/subject-browser\.js(?:\?v=[^"\']*)?',
                  '/assets/js/subject-browser.js?v=20260614-gridfix2',
                  html,
              )
              if updated != html:
                  page.write_text(updated, encoding='utf-8')
                  html_count += 1
          print(f'cache-busted pages: {html_count}')
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-semester-inline-layout.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix subject browser semester layout holes"
          git push
