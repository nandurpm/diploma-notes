name: Blog feature normalize once

on:
  push:
    branches:
      - feat/blog-gk-section
    paths:
      - .github/workflows/blog-normalize-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align shared asset cache token
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'blog.html',
              'blog/welcome-to-poly-pmna-blog-gk.html',
              'blog/post-template.html.example',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '/assets/js/site-shell.js?v=20260916-blog-nav1',
                  '/assets/js/site-shell.js?v=20260827-footer-consistency1',
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Normalize structured data
        run: python tools/inject_structured_data.py

      - name: Validate blog source
        run: |
          python tools/generate_sitemap.py --check
          python tools/inject_structured_data.py --check
          python tools/full_site_static_audit.py
          node --check assets/js/blog.js
          git diff --check

      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "Blog source is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html blog/welcome-to-poly-pmna-blog-gk.html blog/post-template.html.example
          git commit -m "fix(blog): normalize metadata and cache tokens"
          git push origin HEAD:feat/blog-gk-section
