name: Deploy Ask POLY AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/ask-poly-ai/**"
      - "assets/js/ask-poly-config.js"
      - ".github/workflows/deploy-ask-poly-ai.yml"

permissions:
  contents: write

concurrency:
  group: ask-poly-ai-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_AI_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
      NVIDIA_API_KEY_VALUE: ${{ secrets.NVIDIA_API_KEY }}
      GOOGLE_AI_STUDIO_VALUE: ${{ secrets.GOOGLE_AI_STUDIO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Worker source
        run: |
          node --check workers/ask-poly-ai/src/index.js
          node --check workers/ask-poly-ai/src/ask-handler.js
          node --check workers/ask-poly-ai/src/mock-evaluator.js
          python - <<'PY'
          from pathlib import Path
          public_config = Path('assets/js/ask-poly-config.js').read_text(encoding='utf-8')
          for secret_name in (
              'OPENAI_API_KEY', 'NVIDIA_API_KEY', 'GOOGLE_AI_STUDIO',
              'CLOUDFLARE_AI_API_TOKEN', 'CLOUDFLARE_AI_ACCOUNT_ID'
          ):
              assert secret_name not in public_config
          worker_config = Path('workers/ask-poly-ai/wrangler.toml').read_text(encoding='utf-8')
          assert '[ai]' in worker_config and 'binding = "AI"' in worker_config
          worker_source = Path('workers/ask-poly-ai/src/index.js').read_text(encoding='utf-8')
          assert 'cloudflare-workers-ai-rest' in worker_source
          print('Worker source, AI fallbacks and public configuration validated.')
          PY

      - name: Check deployment secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_VALUE" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID_VALUE" ]; then
            echo "Ask POLY deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_AI_API_TOKEN_VALUE" ]; then
            echo "No Cloudflare AI token is available. Add CLOUDFLARE_AI_API_TOKEN or permit CLOUDFLARE_API_TOKEN to use Workers AI."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY_VALUE" ] && [ -z "$NVIDIA_API_KEY_VALUE" ] && [ -z "$GOOGLE_AI_STUDIO_VALUE" ]; then
            echo "No external AI key is configured. Ask POLY will use Cloudflare AI."
          else
            echo "External AI provider keys are available as additional fallbacks."
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/ask-poly-ai/wrangler.toml

      - name: Upload runtime AI credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_AI_STUDIO: ${{ secrets.GOOGLE_AI_STUDIO }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          secrets = {
              "CLOUDFLARE_AI_API_TOKEN": os.environ.get("CLOUDFLARE_AI_API_TOKEN", ""),
              "CLOUDFLARE_AI_ACCOUNT_ID": os.environ.get("CLOUDFLARE_AI_ACCOUNT_ID", ""),
          }
          for key in ("OPENAI_API_KEY", "NVIDIA_API_KEY", "GOOGLE_AI_STUDIO"):
              value = os.environ.get(key, "")
              if value:
                  secrets[key] = value
          if os.environ.get("GOOGLE_AI_STUDIO", ""):
              secrets["GEMINI_API_KEY"] = os.environ["GOOGLE_AI_STUDIO"]
          missing = [key for key in ("CLOUDFLARE_AI_API_TOKEN", "CLOUDFLARE_AI_ACCOUNT_ID") if not secrets.get(key)]
          if missing:
              raise SystemExit("Missing runtime Cloudflare AI credentials: " + ", ".join(missing))
          with open("ask-poly-secrets.json", "w", encoding="utf-8") as file:
              json.dump(secrets, file)
          print("Prepared runtime secret names:", ", ".join(secrets.keys()))
          PY
          wrangler secret bulk ask-poly-secrets.json --config workers/ask-poly-ai/wrangler.toml
          rm -f ask-poly-secrets.json

      - name: Smoke-test live AI answer
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          health_url = "https://ask-poly-ai.nandakumarkdpm.workers.dev/health"
          ask_url = "https://ask-poly-ai.nandakumarkdpm.workers.dev/api/ask-poly"
          last_error = ""
          for attempt in range(1, 19):
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          health_url + f"?deploy_attempt={attempt}",
                          headers={"User-Agent": "POLY-PMNA-Deploy-QA/3.0", "Cache-Control": "no-cache"},
                      ),
                      timeout=20,
                  ) as response:
                      health = json.loads(response.read().decode("utf-8"))
                  providers = list(health.get("providers") or [])
                  if not health.get("ok") or not health.get("configured"):
                      raise RuntimeError(f"Worker health is not configured: {health}")
                  if not any(provider.startswith("cloudflare-workers-ai") for provider in providers):
                      raise RuntimeError(f"Cloudflare AI fallback is not active: {health}")

                  payload = json.dumps({
                      "message": "Reply with exactly: Ask POLY is ready",
                      "history": [],
                      "pageTitle": "Deployment smoke test",
                      "pageContext": ""
                  }).encode("utf-8")
                  request = urllib.request.Request(
                      ask_url,
                      data=payload,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Origin": "https://polypmna.dpdns.org",
                          "User-Agent": "POLY-PMNA-Deploy-QA/3.0"
                      },
                  )
                  with urllib.request.urlopen(request, timeout=45) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  answer = str(result.get("answer") or "").strip()
                  if not answer:
                      raise RuntimeError(f"Worker returned no answer: {result}")
                  print(json.dumps({
                      "healthProviders": providers,
                      "provider": result.get("provider"),
                      "model": result.get("model"),
                      "answer": answer[:200]
                  }, indent=2))
                  break
              except Exception as error:
                  last_error = f"Attempt {attempt}: {type(error).__name__}: {error}"
                  print(last_error)
                  if attempt == 18:
                      raise SystemExit(last_error)
                  time.sleep(10)
          PY

      - name: Configure website with deployed Worker URL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          endpoint = "https://ask-poly-ai.nandakumarkdpm.workers.dev/api/ask-poly"
          source = (
              "globalThis.ASK_POLY_CONFIG = Object.freeze({\n"
              f"  endpoint: {json.dumps(endpoint)},\n"
              "  timeoutMs: 45000,\n"
              "  maxHistory: 12\n"
              "});\n"
          )
          Path('assets/js/ask-poly-config.js').write_text(source, encoding='utf-8')
          print(f'Configured Ask POLY endpoint: {endpoint}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ask-poly-config.js
          if git diff --cached --quiet; then
            echo "Website endpoint configuration is already current."
          else
            git commit -m "Configure verified Ask POLY AI endpoint [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
