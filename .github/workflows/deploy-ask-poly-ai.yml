name: Deploy Ask POLY AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/ask-poly-ai/**"
      - "assets/js/ask-poly-config.js"
      - ".github/workflows/deploy-ask-poly-ai.yml"

permissions:
  contents: read

concurrency:
  group: ask-poly-ai-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_AI_STUDIO: ${{ secrets.GOOGLE_AI_STUDIO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secure Worker source and public routes
        run: |
          node --check workers/ask-poly-ai/src/index.js
          node --check workers/ask-poly-ai/src/secure-index.js
          node --check workers/ask-poly-ai/src/ask-handler.js
          node --check workers/ask-poly-ai/src/mock-evaluator.js
          node --check workers/ask-poly-ai/src/result-store.js
          node --check assets/js/ask-poly-config.js
          node --check assets/js/mock-exam-service.js
          python - <<'PY'
          from pathlib import Path

          public_config = Path('assets/js/ask-poly-config.js').read_text(encoding='utf-8')
          for secret_name in (
              'OPENAI_API_KEY', 'NVIDIA_API_KEY', 'GOOGLE_AI_STUDIO',
              'CLOUDFLARE_AI_API_TOKEN', 'CLOUDFLARE_AI_ACCOUNT_ID',
              'SUPABASE_SERVICE_ROLE_KEY'
          ):
              assert secret_name not in public_config
          assert 'workers.dev/api/ask-poly' in public_config
          assert 'workers.dev/api/evaluate-mock-exam' in public_config
          assert 'backupEndpoint' not in public_config

          worker_config = Path('workers/ask-poly-ai/wrangler.toml').read_text(encoding='utf-8')
          assert 'main = "src/secure-index.js"' in worker_config
          assert '[ai]' in worker_config and 'binding = "AI"' in worker_config
          assert 'name = "ASK_RATE_LIMITER"' in worker_config
          assert 'name = "EXAM_RATE_LIMITER"' in worker_config
          print('Secure Worker source, storage route and rate-limit bindings validated.')
          PY

      - name: Require deployment and verified-storage secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN_VALUE" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID_VALUE" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_AI_API_TOKEN_VALUE" ] || missing+=(CLOUDFLARE_AI_API_TOKEN)
          [ -n "$SUPABASE_URL_VALUE" ] || missing+=(SUPABASE_URL)
          [ -n "$SUPABASE_ANON_KEY_VALUE" ] || missing+=(SUPABASE_ANON_KEY)
          [ -n "$SUPABASE_SERVICE_ROLE_KEY_VALUE" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY_VALUE" ] && [ -z "$NVIDIA_API_KEY_VALUE" ] && [ -z "$GOOGLE_AI_STUDIO_VALUE" ] && [ -z "$CLOUDFLARE_AI_API_TOKEN_VALUE" ]; then
            echo "At least one AI provider credential is required."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Upload runtime credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_AI_STUDIO: ${{ secrets.GOOGLE_AI_STUDIO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          secrets = {
              "CLOUDFLARE_AI_API_TOKEN": os.environ["CLOUDFLARE_AI_API_TOKEN"],
              "CLOUDFLARE_AI_ACCOUNT_ID": os.environ["CLOUDFLARE_AI_ACCOUNT_ID"],
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_ANON_KEY": os.environ["SUPABASE_ANON_KEY"],
              "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          }
          for key in ("OPENAI_API_KEY", "NVIDIA_API_KEY", "GOOGLE_AI_STUDIO"):
              value = os.environ.get(key, "")
              if value:
                  secrets[key] = value
          if os.environ.get("GOOGLE_AI_STUDIO", ""):
              secrets["GEMINI_API_KEY"] = os.environ["GOOGLE_AI_STUDIO"]
          with open("ask-poly-secrets.json", "w", encoding="utf-8") as file:
              json.dump(secrets, file)
          PY
          wrangler secret bulk ask-poly-secrets.json --config workers/ask-poly-ai/wrangler.toml
          rm -f ask-poly-secrets.json

      - name: Deploy secure Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/ask-poly-ai/wrangler.toml

      - name: Smoke-test live Worker and protected mock route
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://ask-poly-ai.nandakumarkdpm.workers.dev"
          last_error = ""
          for attempt in range(1, 19):
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          base + f"/health?deploy_attempt={attempt}",
                          headers={"User-Agent": "POLY-PMNA-Deploy-QA/6.0", "Cache-Control": "no-cache"},
                      ),
                      timeout=20,
                  ) as response:
                      health = json.loads(response.read().decode("utf-8"))
                  if not health.get("ok") or not health.get("configured"):
                      raise RuntimeError(f"Worker health is not configured: {health}")
                  if not health.get("verifiedResultStorage"):
                      raise RuntimeError(f"Verified result storage is disabled: {health}")

                  ask_payload = json.dumps({
                      "message": "Reply with exactly: Ask POLY is ready",
                      "history": [],
                      "pageTitle": "Deployment smoke test",
                      "pageContext": ""
                  }).encode("utf-8")
                  ask_request = urllib.request.Request(
                      base + "/api/ask-poly",
                      data=ask_payload,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Origin": "https://polypmna.dpdns.org",
                          "User-Agent": "POLY-PMNA-Deploy-QA/6.0"
                      },
                  )
                  with urllib.request.urlopen(ask_request, timeout=45) as response:
                      answer = json.loads(response.read().decode("utf-8"))
                  if not str(answer.get("answer") or "").strip():
                      raise RuntimeError(f"Worker returned no answer: {answer}")

                  mock_request = urllib.request.Request(
                      base + "/api/evaluate-mock-exam",
                      data=b"{}",
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Origin": "https://polypmna.dpdns.org",
                          "User-Agent": "POLY-PMNA-Deploy-QA/6.0"
                      },
                  )
                  try:
                      urllib.request.urlopen(mock_request, timeout=20)
                      raise RuntimeError("Unauthenticated mock route unexpectedly succeeded")
                  except urllib.error.HTTPError as error:
                      if error.code != 401:
                          raise RuntimeError(f"Protected mock route returned HTTP {error.code}, expected 401")

                  print(json.dumps({
                      "providers": health.get("providers"),
                      "verifiedResultStorage": health.get("verifiedResultStorage"),
                      "provider": answer.get("provider"),
                      "model": answer.get("model"),
                      "mockRoute": "401 without login"
                  }, indent=2))
                  break
              except Exception as error:
                  last_error = f"Attempt {attempt}: {type(error).__name__}: {error}"
                  print(last_error)
                  if attempt == 18:
                      raise SystemExit(last_error)
                  time.sleep(10)
          PY
