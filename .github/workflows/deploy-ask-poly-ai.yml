name: Deploy Ask POLY AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ask-poly-ai-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
      NVIDIA_API_KEY_VALUE: ${{ secrets.NVIDIA_API_KEY }}
      GOOGLE_AI_STUDIO_VALUE: ${{ secrets.GOOGLE_AI_STUDIO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Worker source
        run: |
          node --check workers/ask-poly-ai/src/index.js
          node --check workers/ask-poly-ai/src/ask-handler.js
          node --check workers/ask-poly-ai/src/mock-evaluator.js
          python - <<'PY'
          from pathlib import Path
          public_config = Path('assets/js/ask-poly-config.js').read_text(encoding='utf-8')
          assert 'OPENAI_API_KEY' not in public_config
          assert 'NVIDIA_API_KEY' not in public_config
          assert 'GOOGLE_AI_STUDIO' not in public_config
          print('Worker source and public configuration validated.')
          PY

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_VALUE" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID_VALUE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Ask POLY AI deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow manually."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY_VALUE" ] && [ -z "$NVIDIA_API_KEY_VALUE" ] && [ -z "$GOOGLE_AI_STUDIO_VALUE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Ask POLY AI deployment skipped. Add at least one AI key: OPENAI_API_KEY, NVIDIA_API_KEY, or GOOGLE_AI_STUDIO."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker and store AI keys securely
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config workers/ask-poly-ai/wrangler.toml
          secrets: |
            OPENAI_API_KEY
            NVIDIA_API_KEY
            GOOGLE_AI_STUDIO
            GEMINI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_AI_STUDIO: ${{ secrets.GOOGLE_AI_STUDIO }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO }}

      - name: Configure website with deployed Worker URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment_url = os.environ.get('DEPLOYMENT_URL', '').strip().rstrip('/')
          if not deployment_url:
              deployment_url = 'https://ask-poly-ai.nandakumarkdpm.workers.dev'
          endpoint = f"{deployment_url}/api/ask-poly"
          source = (
              "globalThis.ASK_POLY_CONFIG = Object.freeze({\n"
              f"  endpoint: {json.dumps(endpoint)},\n"
              "  timeoutMs: 30000,\n"
              "  maxHistory: 12\n"
              "});\n"
          )
          Path('assets/js/ask-poly-config.js').write_text(source, encoding='utf-8')
          print(f'Configured Ask POLY endpoint: {endpoint}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ask-poly-config.js
          if git diff --cached --quiet; then
            echo "Website endpoint configuration is already current."
          else
            git commit -m "Configure deployed Ask POLY AI endpoint [skip ci]"
            git push origin HEAD:main
          fi
