name: Validate REV2026 1009 legacy payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-legacy-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject recursive loader payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          parts = [
              Path("reports/.materialize-1009-part1.b64"),
              Path("reports/.materialize-1009-part2.b64"),
              Path("reports/.materialize-1009-part3.b64"),
          ]
          if not all(path.exists() for path in parts):
              raise SystemExit("Legacy payload files are missing.")

          payload = "".join(path.read_text(encoding="utf-8").strip() for path in parts)
          raw = gzip.decompress(base64.b64decode(payload, validate=True)).decode("utf-8")

          if "materialize-1009-part1.b64" in raw or "DecompressionStream" in raw:
              raise SystemExit(
                  "Rejected: the legacy payload expands to another loader page and causes a recursive load/abort loop."
              )

          print("Legacy payload is not recursive. No repository file was changed.")
          PY
