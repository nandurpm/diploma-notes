name: Vendor pinned Supabase browser client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-supabase-browser.yml"

permissions:
  contents: write

concurrency:
  group: vendor-supabase-browser-main
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    env:
      SUPABASE_JS_VERSION: "2.110.7"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download and validate exact UMD bundle
        run: |
          set -euo pipefail
          mkdir -p assets/vendor
          url="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@${SUPABASE_JS_VERSION}/dist/umd/supabase.js"
          target="assets/vendor/supabase-js-${SUPABASE_JS_VERSION}.js"
          curl --fail --location --retry 3 --connect-timeout 20 "$url" -o "$target.tmp"
          test "$(wc -c < "$target.tmp")" -gt 100000
          grep -q "createClient" "$target.tmp"
          mv "$target.tmp" "$target"
          sha256sum "$target" > "${target}.sha256"
          cat > assets/vendor/SUPABASE-JS-NOTICE.txt <<EOF
          @supabase/supabase-js ${SUPABASE_JS_VERSION}
          Source: ${url}
          License: MIT
          Vendored for POLY PMNA browser authentication to avoid an unversioned runtime CDN dependency.
          Digest: see supabase-js-${SUPABASE_JS_VERSION}.js.sha256
          EOF
      - name: Replace moving CDN references atomically
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = os.environ['SUPABASE_JS_VERSION']
          local = f'/assets/vendor/supabase-js-{version}.js?v={version}'
          pattern = re.compile(r'https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2(?:\.[0-9]+(?:\.[0-9]+)?)?(?:/dist/umd/supabase(?:\.min)?\.js)?')
          files = [Path(name) for name in ('daily-quiz.html','mock-exam-1004.html','mock-exam.html','reset-password.html')]
          changed = []
          for path in files:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(local, text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(f'{path}:{count}')
              elif local not in text:
                  raise SystemExit(f'No Supabase browser client reference found in {path}')
          print('\n'.join(changed) or 'All references already local.')
          PY
          grep -R "cdn.jsdelivr.net/npm/@supabase/supabase-js@2" daily-quiz.html mock-exam-1004.html mock-exam.html reset-password.html && exit 1 || true
      - name: Validate and commit vendor update
        run: |
          node --check "assets/vendor/supabase-js-${SUPABASE_JS_VERSION}.js"
          python tools/generate_sitemap.py
          python tools/site_quality_gate.py
          if git diff --quiet; then
            echo "Pinned Supabase browser client is already current."
            exit 0
          fi
          git config user.name "POLY PMNA Dependency Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor daily-quiz.html mock-exam-1004.html mock-exam.html reset-password.html sitemap.xml
          git commit -m "Self-host Supabase JS ${SUPABASE_JS_VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
