name: Production URL audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
  workflow_run:
    workflows:
      - "Deploy static site to Cloudflare Pages"
      - "Deploy static site to GitHub Pages"
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate current scope
        run: python tools/generate_sitemap.py
      - name: Audit live GET responses and release signatures
        run: python tools/production_url_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-url-audit-${{ github.run_id }}
          path: |
            reports/production-url-audit.json
            reports/production-url-audit.md
          retention-days: 30
