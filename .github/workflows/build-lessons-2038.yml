name: Build lessons-2038 CAD handbook

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-lessons-2038.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and verify handbook
        run: python scripts/build-lessons-2038.py

      - name: Remove one-time build files
        run: |
          rm -rf tmp/lessons-2038 tmp/lessons-2038-hex2 tmp/lessons-2038-hex3 tmp/lessons-2038-enc
          rm -f scripts/build-lessons-2038.py
          rm -f .github/workflows/build-lessons-2038.yml

      - name: Commit completed handbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add complete lessons-2038 CAD handbook'
          git push origin HEAD:main
