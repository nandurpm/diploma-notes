name: Audit branch brand normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-brand:
    if: github.event.pull_request.head.ref == 'audit/full-site-2026-09-15' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/full-site-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize and verify public brand metadata
        run: |
          python tools/normalize_public_brand_assets.py
          python tools/normalize_public_brand_assets.py --check
          git diff --check
      - name: Commit normalized source
        env:
          BRANCH: audit/full-site-2026-09-15
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'POLY PMNA Audit Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize favicon metadata site-wide'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
