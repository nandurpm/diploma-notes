name: Verify consolidated lesson cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-lesson-cleanup-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Enforce final lesson state
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import html
          import re

          root = Path('.')
          lessons = root / 'lessons'
          social_rel = 'assets/media/poly-pmna-study-hub-social-card.png'
          social_url = 'https://polypmna.dpdns.org/' + social_rel
          back_link = '<link rel="stylesheet" href="/assets/css/revision-back-button.css?v=20260614-1">'

          # Deterministic branded 1200 x 630 preview card.
          out = root / social_rel
          out.parent.mkdir(parents=True, exist_ok=True)
          im = Image.new('RGB', (1200, 630), '#07182f')
          d = ImageDraw.Draw(im)
          for y in range(630):
              t = y / 629
              d.line((0, y, 1200, y), fill=(int(7+3*t), int(24+46*t), int(47+73*t)))
          d.ellipse((820, -180, 1320, 320), fill='#0e7490')
          d.ellipse((-170, 350, 340, 860), fill='#5b21b6')
          d.rounded_rectangle((70, 66, 1130, 564), radius=42, fill='#081f3a', outline='#67e8f9', width=3)
          d.rounded_rectangle((104, 100, 270, 160), radius=25, fill='#0e7490')
          def font(size, bold=True):
              candidates = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',
              ]
              for name in candidates:
                  if Path(name).exists():
                      return ImageFont.truetype(name, size)
              return ImageFont.load_default()
          d.text((130, 112), 'POLY PMNA', font=font(28), fill='white')
          d.text((105, 205), 'KERALA POLYTECHNIC', font=font(82), fill='white')
          d.text((108, 312), 'STUDY HUB', font=font(82), fill='#67e8f9')
          d.text((110, 428), 'Lessons  •  Notes  •  Question Papers', font=font(46), fill='#e2e8f0')
          d.text((110, 497), 'Revision 2021 student learning resource', font=font(28, False), fill='#cbd5e1')
          d.text((842, 515), 'polypmna.dpdns.org', font=font(25), fill='white')
          im.save(out, 'PNG', optimize=True)

          css = '''.revision-back-button{position:fixed;left:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;gap:.42rem;padding:.72rem 1rem;border:1px solid rgba(255,255,255,.42);border-radius:999px;background:linear-gradient(135deg,#075985,#6d28d9);color:#fff!important;text-decoration:none!important;font-family:Segoe UI,Arial,sans-serif;font-size:.84rem;font-weight:900;line-height:1;letter-spacing:.01em;box-shadow:0 12px 30px rgba(15,23,42,.24);transition:transform .2s ease,box-shadow .2s ease;white-space:nowrap}.revision-back-button:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(15,23,42,.3)}.revision-back-button:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}@media(max-width:560px){.revision-back-button{left:10px;bottom:10px;padding:.66rem .82rem;font-size:.76rem}}@media print{.revision-back-button{display:none!important}}
'''
          css_path = root / 'assets/css/revision-back-button.css'
          css_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.write_text(css, encoding='utf-8')

          layout_path = root / 'assets/css/lesson-2031-layout.css'
          if not layout_path.exists():
              layout_path.write_text('html,body{width:100%;max-width:none;margin:0;overflow-x:clip}.wrap{width:100%!important;max-width:none!important;margin:0!important;padding-inline:clamp(5px,.55vw,11px)!important}.top{position:sticky!important;top:0!important;z-index:9999!important;background:rgba(255,255,255,.98)!important}.nav{width:100%!important;max-width:none!important;display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important}section[id]{scroll-margin-top:82px!important}@media print{.top{display:none!important}}\n', encoding='utf-8')

          inline_style = re.compile(r'<style\s+id=["\']revision-back-button-style["\']>.*?</style>', re.I | re.S)
          buttons = re.compile(r'(<button\b[^>]*>)(.*?)(</button>)', re.I | re.S)

          def meta(text, attr, key, value):
              pat = re.compile(rf'<meta\s+{attr}=["\']{re.escape(key)}["\'][^>]*>', re.I)
              tag = f'<meta {attr}="{key}" content="{html.escape(value, quote=True)}">'
              return pat.sub(tag, text, count=1) if pat.search(text) else text.replace('</head>', '  '+tag+'\n</head>', 1)

          def canonical(text, url):
              pat = re.compile(r'<link\s+rel=["\']canonical["\'][^>]*>', re.I)
              tag = f'<link rel="canonical" href="{url}">'
              return pat.sub(tag, text, count=1) if pat.search(text) else text.replace('</head>', '  '+tag+'\n</head>', 1)

          def print_buttons(text):
              def cb(m):
                  opening, body, closing = m.groups()
                  joined = opening + body
                  if 'window.print()' not in joined:
                      return m.group(0)
                  if not re.search(r'\btype\s*=', opening, re.I):
                      opening = opening.replace('<button', '<button type="button"', 1)
                  for old in ('Download as PDF', 'Download PDF', 'Print / Save PDF'):
                      body = body.replace(old, 'Print / Save as PDF')
                  return opening + body + closing
              return buttons.sub(cb, text)

          def subject(text, code):
              m = re.search(r'<meta\s+property=["\']og:title["\'][^>]*content=["\']([^"\']+)', text, re.I)
              value = html.unescape(m.group(1)) if m else ''
              if not value:
                  h = re.search(r'<h1\b[^>]*>(.*?)</h1>', text, re.I | re.S)
                  value = re.sub(r'<[^>]+>', ' ', h.group(1)).strip() if h else ''
              value = value.split('|')[0].strip()
              return re.sub(rf'\s*{code}\s*$', '', value).strip() or f'Course {code}'

          def visible_filename(text, code, name):
              footer = re.compile(r'(<footer\b[^>]*>)(.*?)(</footer>)', re.I | re.S)
              text = footer.sub(lambda m: m.group(1)+m.group(2).replace(f'lessons-{code}.html', f'{name} {code}')+m.group(3), text)
              return re.sub(rf'<span>\s*File\s*</span>\s*<b>\s*lessons-{code}\.html\s*</b>', f'<span>Course Title</span><b>{html.escape(name)}</b>', text, flags=re.I)

          # Static 2031 conversion when the old duplicate source still exists.
          source = lessons / 'handbook-2031-source.html'
          official = lessons / 'lessons-2031.html'
          if source.exists():
              text = source.read_text(encoding='utf-8')
              text = re.sub(r'<meta\s+name=["\']robots["\'][^>]*>', '', text, flags=re.I)
              text = text.replace('handbook-2031-source.html', 'lessons-2031.html')
              title = 'Fundamentals of Electrical and Electronics Engineering 2031 | Kerala Polytechnic Study Hub'
              desc = 'Fundamentals of Electrical and Electronics Engineering 2031 diploma handbook with electrical circuits, electronics, formulas, revision and exam preparation.'
              text = re.sub(r'<title>.*?</title>', f'<title>{title}</title>', text, count=1, flags=re.I|re.S)
              text = canonical(text, 'https://polypmna.dpdns.org/lessons/lessons-2031.html')
              for attr, key, val in [('name','description',desc),('property','og:type','website'),('property','og:title',title),('property','og:description',desc),('property','og:url','https://polypmna.dpdns.org/lessons/lessons-2031.html')]:
                  text = meta(text, attr, key, val)
              if '/assets/css/lesson-2031-layout.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="/assets/css/lesson-2031-layout.css?v=20260614-1">\n</head>', 1)
              text = re.sub(r'<script\b[^>]*site-hardening\.js[^>]*></script>', '', text, flags=re.I)
              text = text.replace('</body>', '  <script src="/assets/js/site-hardening.js?v=20260612-1" defer></script>\n</body>', 1)
              official.write_text(text, encoding='utf-8')
              source.unlink()

          # Remove all stale source references.
          for glob in ('*.html','*.js','*.xml','*.txt'):
              for p in root.rglob(glob):
                  if '.git' in p.parts:
                      continue
                  text = p.read_text(encoding='utf-8')
                  new = text.replace('handbook-2031-source.html', 'lessons-2031.html')
                  if new != text:
                      p.write_text(new, encoding='utf-8')

          for p in sorted(lessons.glob('lessons-*.html')):
              text = p.read_text(encoding='utf-8')
              code_match = re.search(r'lessons-(\d+)\.html$', p.name)
              if not code_match:
                  continue
              code = code_match.group(1)
              name = subject(text, code)
              text = inline_style.sub(back_link, text)
              text = print_buttons(text)
              text = visible_filename(text, code, name)
              if re.search(r'<meta\s+property=["\']og:url["\']', text, re.I):
                  for attr, key, val in [
                      ('property','og:image',social_url),('property','og:image:type','image/png'),
                      ('property','og:image:width','1200'),('property','og:image:height','630'),
                      ('property','og:image:alt','POLY PMNA Kerala Polytechnic Study Hub'),
                      ('name','twitter:card','summary_large_image'),('name','twitter:image',social_url)
                  ]:
                      text = meta(text, attr, key, val)
              p.write_text(text, encoding='utf-8')

          # Final integrity checks.
          assert not source.exists()
          official_text = official.read_text(encoding='utf-8')
          assert 'document.write' not in official_text
          assert 'handbook-2031-source.html' not in official_text
          assert social_url in official_text
          assert (root / social_rel).exists()
          for p in lessons.glob('lessons-*.html'):
              text = p.read_text(encoding='utf-8')
              assert 'revision-back-button-style' not in text, p
              if 'og:image' in text:
                  assert 'sfi-poly-pmna-poster.jpg' not in text, p

      - name: Remove temporary workflows
        run: rm -f .github/workflows/final-lesson-cleanup.yml .github/workflows/final-lesson-cleanup-verify.yml
      - name: Commit verified state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matched the requested final state."
          else
            git commit -m "Verify final consolidated lesson cleanup"
            git push
          fi
