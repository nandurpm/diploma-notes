name: Retry Chrome audit timeouts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-chrome-timeouts.yml"

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retry timed out pages
        run: python tools/chrome_retry_timeouts.py || true
      - name: Save retry result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-integrity-audit.json reports/site-integrity-audit.md
          git commit -m "Complete Chrome runtime audit retry"
          git push
