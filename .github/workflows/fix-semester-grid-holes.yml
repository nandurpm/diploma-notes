name: Fix semester grid holes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-semester-grid-holes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch subject browser grouping and CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          js_path = root / 'assets/js/subject-browser.js'
          js = js_path.read_text(encoding='utf-8')
          old = '''  function groupCards(subjects, renderer) {
    const counts = subjects.reduce((map, subject) => map.set(subject.semester, (map.get(subject.semester) || 0) + 1), new Map());
    let previous = "";
    return subjects.map((subject) => {
      const heading = subject.semester !== previous
        ? `<div class="semester-group-heading"><span>${escapeHtml(subject.semester)}</span><small>${counts.get(subject.semester)} subjects</small></div>`
        : "";
      previous = subject.semester;
      return heading + renderer(subject);
    }).join("");
  }
'''
          new = '''  function groupCards(subjects, renderer) {
    const groups = new Map();
    subjects.forEach((subject) => {
      if (!groups.has(subject.semester)) groups.set(subject.semester, []);
      groups.get(subject.semester).push(subject);
    });

    return Array.from(groups.entries()).map(([semester, semesterSubjects]) => `
      <section class="semester-group-section" data-semester="${escapeHtml(semester)}">
        <div class="semester-group-heading"><span>${escapeHtml(semester)}</span><small>${semesterSubjects.length} ${semesterSubjects.length === 1 ? "subject" : "subjects"}</small></div>
        <div class="semester-group-grid">
          ${semesterSubjects.map((subject) => renderer(subject)).join("")}
        </div>
      </section>
    `).join("");
  }
'''
          if old not in js:
              raise SystemExit('Expected groupCards function was not found in subject-browser.js')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          css_path = root / 'assets/css/style.css'
          css = css_path.read_text(encoding='utf-8').rstrip() + '\n'
          marker = '/* Semester grouping: prevent blank grid holes. */'
          if marker not in css:
              css += '''
/* Semester grouping: prevent blank grid holes. */
.subject-grid > .semester-group-section{
  grid-column:1 / -1;
  display:block;
  width:100%;
  min-width:0;
  margin:0 0 24px;
}
.subject-grid > .semester-group-section:last-child{margin-bottom:0}
.semester-group-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
  gap:18px;
  align-items:stretch;
  width:100%;
}
.semester-group-grid > .subject-card{min-width:0;height:100%}
.semester-group-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  width:100%;
  min-height:52px;
  margin:0 0 14px;
  padding:13px 16px;
  border:1px solid rgba(29,78,216,.14);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(219,234,254,.96),rgba(236,253,245,.96));
  box-shadow:0 10px 24px rgba(20,45,90,.07);
}
.semester-group-heading span{
  color:#0f3f8a;
  font-family:"Space Grotesk",Inter,sans-serif;
  font-size:clamp(1.05rem,1.45vw,1.35rem);
  font-weight:950;
  letter-spacing:-.025em;
}
.semester-group-heading small{
  flex:0 0 auto;
  padding:7px 11px;
  border-radius:999px;
  color:#047857;
  background:rgba(255,255,255,.94);
  font-size:.78rem;
  font-weight:900;
}
@media(max-width:620px){
  .semester-group-grid{grid-template-columns:1fr;gap:14px}
  .semester-group-heading{min-height:48px;margin-bottom:11px;padding:10px 12px;border-radius:15px}
  .semester-group-heading span{font-size:1rem}
  .semester-group-heading small{padding:6px 9px;font-size:.72rem}
}
'''
          css_path.write_text(css, encoding='utf-8')

          # The old homepage-only selector must not be the only rule. Keep it harmless, but add a cache-busted stylesheet URL everywhere.
          updated_pages = 0
          for page in root.rglob('*.html'):
              if '.git' in page.parts:
                  continue
              text = page.read_text(encoding='utf-8')
              updated = re.sub(
                  r'/assets/css/style\.css(?:\?v=[^"\']*)?',
                  '/assets/css/style.css?v=20260614-semester-grid1',
                  text,
              )
              updated = re.sub(
                  r'/assets/css/home-subject-browser\.css(?:\?v=[^"\']*)?',
                  '/assets/css/home-subject-browser.css?v=20260614-semester-grid1',
                  updated,
              )
              if updated != text:
                  page.write_text(updated, encoding='utf-8')
                  updated_pages += 1

          # Assertions
          patched = js_path.read_text(encoding='utf-8')
          if 'semester-group-section' not in patched or 'semester-group-grid' not in patched:
              raise SystemExit('The subject browser still does not wrap semester groups')
          sample = (root / 'index.html').read_text(encoding='utf-8')
          if 'style.css?v=20260614-semester-grid1' not in sample:
              raise SystemExit('index.html did not receive the new style cache buster')

          print(f'HTML pages cache-busted: {updated_pages}')

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-semester-grid-holes.yml

      - name: Commit grid repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix semester grouped subject grids"
          git push
