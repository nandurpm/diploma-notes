name: Generate Course 1041 handbook

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/.course-1041-payload/**"
      - "tools/generate_course_1041.py"
      - ".github/workflows/generate-course-1041.yml"

permissions:
  contents: write

concurrency:
  group: generate-course-1041
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and validate handbook
        run: |
          python -m py_compile tools/generate_course_1041.py
          python tools/generate_course_1041.py

      - name: Publish handbook source immediately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision-2026-content/lessons/lessons-1041.html
          git commit -m "Add REV2026 Course 1041 handbook source [skip notes]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install browser and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Start local website
        run: |
          python -m http.server 8000 > /tmp/course-1041-site.log 2>&1 &
          echo $! > /tmp/course-1041-site.pid
          sleep 3

      - name: Run desktop, tablet, mobile and auto-print tests
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = "http://127.0.0.1:8000/revision-2026-content/lessons/lessons-1041.html"
          sizes = [(1920, 1080), (1366, 768), (768, 1024), (360, 800), (390, 844)]
          results = []
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              for width, height in sizes:
                  page = browser.new_page(viewport={"width": width, "height": height})
                  console_errors = []
                  page.on("console", lambda message, bucket=console_errors: bucket.append(message.text) if message.type == "error" else None)
                  page.goto(url, wait_until="networkidle", timeout=120000)
                  page.wait_for_function("window.__HANDBOOK_READY__ === true", timeout=30000)
                  assert page.locator("main").count() == 1
                  assert page.locator(".module-panel").count() == 4
                  assert page.locator(".animation-card").count() == 12
                  assert page.locator(".experiment").count() == 16
                  assert page.evaluate("document.documentElement.scrollWidth <= window.innerWidth + 1")
                  assert not console_errors, console_errors
                  results.append({"width": width, "height": height, "horizontalOverflow": False, "consoleErrors": []})
                  page.close()

              page = browser.new_page(viewport={"width": 1366, "height": 768})
              page.add_init_script("window.print = () => { window.__course1041PrintCalled = true; };")
              page.goto(url + "?autoPrintNotes=1", wait_until="networkidle", timeout=120000)
              page.wait_for_function("window.__course1041PrintCalled === true", timeout=30000)
              assert page.title() == "downloadable-notes-1041"
              assert page.locator("details:not([open])").count() == 0
              page.close()
              browser.close()

          report = {
              "course": "1041",
              "viewports": results,
              "autoPrintNotes": True,
              "status": "passed",
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/course-1041-browser-verification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Build Course 1041 PDF
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          import build_lesson_pdfs as builder

          lesson = root / "revision-2026-content" / "lessons" / "lessons-1041.html"
          builder.LESSONS = lesson.parent
          builder.NOTES = root / "revision-2026-content" / "notes"
          builder.REPORTS = root / "reports"
          builder.PRESERVE_EXISTING_PDF_CODES = set()
          builder.lesson_files = lambda: [("1041", lesson)]

          generated, errors = builder.render_all()
          payload = {
              "revision": "2026",
              "lessonFolder": "revision-2026-content/lessons",
              "notesFolder": "revision-2026-content/notes",
              "generated": generated,
              "errors": errors,
              "requiredLessonCodes": ["1041"],
              "generatedThisRunCodes": [str(item["code"]) for item in generated],
              "missingCodes": [] if generated and not errors else ["1041"],
              "renderer": "Playwright Chromium through local HTTP server",
              "minimumPdfBytes": builder.MIN_VALID_PDF_BYTES,
          }
          (root / "reports").mkdir(exist_ok=True)
          (root / "reports" / "revision-2026-lesson-notes-pdf-build.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2))
          if errors or not generated:
              raise SystemExit(1)
          PY

      - name: Update availability and Revision 2026 pages
        run: |
          python tools/update_asset_manifest.py
          node --check assets/js/subject-browser.js
          node --check assets/js/asset-manifest.js
          python -m py_compile tools/build_revision_2026_pages.py
          python tools/build_revision_2026_pages.py

      - name: Validate final HTML, PDF and manifests
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader

          html = Path("revision-2026-content/lessons/lessons-1041.html")
          pdf = Path("revision-2026-content/notes/downloadable-notes-1041.pdf")
          browser_report = json.loads(Path("reports/course-1041-browser-verification.json").read_text(encoding="utf-8"))
          source = html.read_text(encoding="utf-8")
          assert html.stat().st_size == 577326
          assert hashlib.sha256(html.read_bytes()).hexdigest() == "098ecfddf6ff398a1463c1a6752711202a1124a23800f32d20076fe8c25cf699"
          assert pdf.exists() and pdf.stat().st_size >= 20000

          reader = PdfReader(str(pdf))
          page_texts = [" ".join((page.extract_text() or "").split()) for page in reader.pages]
          assert len(reader.pages) > 20
          assert not [index + 1 for index, text in enumerate(page_texts) if len(text) < 10]
          assert sum(len(text) for text in page_texts) > 100000

          subject_browser = Path("assets/js/subject-browser.js").read_text(encoding="utf-8")
          asset_manifest = Path("assets/js/asset-manifest.js").read_text(encoding="utf-8")
          assert '"1041"' in next(line for line in subject_browser.splitlines() if "REV2026_LESSON_CODES" in line)
          assert '"1041"' in next(line for line in subject_browser.splitlines() if "REV2026_NOTES_CODES" in line)
          assert "revision2026LessonCodes" in asset_manifest and "revision2026NotesCodes" in asset_manifest

          report = {
              "course": "1041",
              "htmlPath": str(html),
              "htmlBytes": html.stat().st_size,
              "htmlSha256": hashlib.sha256(html.read_bytes()).hexdigest(),
              "pdfPath": str(pdf),
              "pdfBytes": pdf.stat().st_size,
              "pdfPages": len(reader.pages),
              "pdfCharacters": sum(len(text) for text in page_texts),
              "blankPages": [],
              "diagrams": source.count("<svg"),
              "animations": source.count('class="animation-card'),
              "solvedExamples": source.count('class="worked'),
              "experiments": source.count('class="experiment'),
              "componentAtlasEntries": source.count('class="component-card'),
              "questionAnswerItems": source.count('class="qa'),
              "browser": browser_report,
              "lessonAvailability": True,
              "notesAvailability": True,
              "status": "passed",
          }
          Path("reports/course-1041-verification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Remove temporary generation files
        run: |
          rm -rf tools/.course-1041-payload
          rm -f tools/generate_course_1041.py
          rm -f .github/workflows/generate-course-1041.yml

      - name: Commit and push completed handbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete REV2026 Course 1041 electronics handbook"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Stop local website
        if: always()
        run: |
          if [ -f /tmp/course-1041-site.pid ]; then
            kill "$(cat /tmp/course-1041-site.pid)" || true
          fi
