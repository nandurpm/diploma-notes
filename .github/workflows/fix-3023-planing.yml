name: Correct Machine Tools terminology

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-3023-planing.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct planing terminology
        shell: python
        run: |
          from pathlib import Path
          path = Path("lessons/lessons-3023.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "shaping, planning, slotting": "shaping, planing, slotting",
              "lathe, shaping, planning, milling, slotting": "lathe, shaping, planing, milling, slotting",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit correction
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Correct Machine Tools planing terminology
          file_pattern: lessons/lessons-3023.html
