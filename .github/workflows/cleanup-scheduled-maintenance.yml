name: Cleanup scheduled maintenance

on:
  schedule:
    - cron: "45 15 31 12 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check cleanup date
        id: guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%F)" == "2026-12-31" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove completed maintenance gate
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git rm -f functions/_middleware.js
          git rm -f .github/workflows/cleanup-scheduled-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove completed 2026 maintenance gate"
          git push origin main
