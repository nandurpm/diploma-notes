name: Refresh scrolling notice

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-scrolling-notice.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache-bust the shared notice script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(
                  r'/assets/js/main\.js(?:\?v=[^"\']+)?',
                  '/assets/js/main.js?v=20260615-notice2',
                  text,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML pages.')
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/refresh-scrolling-notice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show the expanded bilingual scrolling notice"
          git push origin main
