name: Apply Ask POLY whole-site upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ask-poly-whole-site-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: apply-ask-poly-whole-site-upgrade
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connect Worker to whole-site instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          handler = Path("workers/ask-poly-ai/src/ask-handler.js")
          text = handler.read_text(encoding="utf-8")
          import_line = 'import { SYSTEM_INSTRUCTIONS } from "./site-instructions.js";\n'
          if import_line not in text:
              anchor = 'import { cleanText } from "./http.js";\n'
              if anchor not in text:
                  raise SystemExit("ask-handler import anchor not found")
              text = text.replace(anchor, anchor + import_line, 1)

          text = re.sub(
              r'\nconst SYSTEM_INSTRUCTIONS = `.*?`;\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace("MAX_OUTPUT_TOKENS || 450", "MAX_OUTPUT_TOKENS || 700")
          handler.write_text(text, encoding="utf-8")

          deploy = Path(".github/workflows/deploy-ask-poly-ai.yml")
          source = deploy.read_text(encoding="utf-8")
          check = "          node --check workers/ask-poly-ai/src/site-instructions.js\n"
          if check not in source:
              anchor = "          node --check workers/ask-poly-ai/src/ask-handler.js\n"
              if anchor not in source:
                  raise SystemExit("Worker validation anchor not found")
              source = source.replace(anchor, anchor + check, 1)
          deploy.write_text(source, encoding="utf-8")
          PY

      - name: Validate Worker and current knowledge
        run: |
          node --check workers/ask-poly-ai/src/site-instructions.js
          node --check workers/ask-poly-ai/src/ask-handler.js
          node --check assets/js/ask-poly-knowledge-loader.js
          node --check assets/js/ask-poly-v2.js
          python - <<'PY'
          import json
          from pathlib import Path

          handler = Path("workers/ask-poly-ai/src/ask-handler.js").read_text(encoding="utf-8")
          deploy = Path(".github/workflows/deploy-ask-poly-ai.yml").read_text(encoding="utf-8")
          data = json.loads(Path("assets/data/ask-poly-knowledge.json").read_text(encoding="utf-8"))
          counts = data.get("counts", {})
          assert 'from "./site-instructions.js"' in handler
          assert "const SYSTEM_INSTRUCTIONS = `" not in handler
          assert "MAX_OUTPUT_TOKENS || 700" in handler
          assert "site-instructions.js" in deploy
          assert counts.get("programmes2026") == 38, counts
          assert counts.get("subjectRecords", 0) >= 300, counts
          assert any(row.get("revision") == "2026" for row in data.get("subjects", []))
          assert any(row.get("revision") == "2021" for row in data.get("subjects", []))
          print(json.dumps(counts, indent=2))
          PY

      - name: Commit final Worker connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/ask-poly-ai/src/ask-handler.js workers/ask-poly-ai/src/site-instructions.js .github/workflows/deploy-ask-poly-ai.yml
          if git diff --cached --quiet; then
            echo "Ask POLY Worker is already connected to whole-site instructions."
            exit 0
          fi
          git commit -m "Connect Ask POLY Worker to whole-site knowledge"
          git pull --rebase origin main
          git push origin HEAD:main
