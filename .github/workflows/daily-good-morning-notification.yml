name: Daily Good Morning Notification

on:
  schedule:
    # 07:00 AM IST = 01:30 UTC (only one notification per day)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Install FCM sender dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Send Good Morning notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import json
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              raise SystemExit("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is empty or unavailable to this workflow.")

          try:
              account = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON: {exc}")

          required = ["project_id", "client_email", "private_key"]
          missing = [key for key in required if not account.get(key)]
          if missing:
              raise SystemExit(
                  "ERROR: Firebase service account JSON is missing required field(s): "
                  + ", ".join(missing)
              )

          project_id = account["project_id"]

          credentials = service_account.Credentials.from_service_account_info(
              account,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"],
          )
          credentials.refresh(Request())

          if not credentials.token:
              raise SystemExit("ERROR: Google OAuth token was not obtained.")

          # Use the Indian calendar date so the message changes according
          # to the IST date.
          today_ist = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          date_key = today_ist.isoformat()

          # Special Onam notifications override the normal daily messages
          # on these two dates.
          onam_messages = {
              "2026-08-25": {
                  "title": "🌼 ഒന്നാം ഓണം ആശംസകൾ – POLY PMNA",
                  "body": (
                      "ഉത്രാടത്തിന്റെ ഈ പുണ്യദിനത്തിൽ സന്തോഷവും സമാധാനവും പ്രതീക്ഷയും "
                      "നിങ്ങളുടെ ജീവിതത്തിൽ നിറയട്ടെ. 🌾 നല്ല നാളെയ്ക്കായി ഇന്ന് ചെയ്യുന്ന "
                      "ഓരോ ചെറിയ ശ്രമവും വിജയത്തിലേക്കുള്ള ഒരു ചുവടാണ്. 💛 ഒന്നാം ഓണം ആശംസകൾ!"
                  ),
              },
              "2026-08-26": {
                  "title": "🌸 ഹൃദയം നിറഞ്ഞ തിരുവോണം ആശംസകൾ – POLY PMNA",
                  "body": (
                      "പൂക്കളത്തിന്റെ നിറങ്ങളും ഓണസദ്യയുടെ രുചിയും സ്നേഹത്തിന്റെ നന്മയും "
                      "നമ്മുടെ ജീവിതത്തിൽ എന്നും നിറഞ്ഞുനിൽക്കട്ടെ. 🌿 അറിവും സ്നേഹവും "
                      "പങ്കുവെക്കുമ്പോഴാണ് ജീവിതം കൂടുതൽ മനോഹരമാകുന്നത്. ✨ എല്ലാവർക്കും "
                      "ഹൃദയം നിറഞ്ഞ തിരുവോണം ആശംസകൾ!"
                  ),
              },
          }

          # 50 unique daily messages that rotate based on the IST date.
          # Each day gets a different title and body, cycling back to #1 after day 50.
          daily_messages = [
              {"title": "🌅 Good Morning – POLY PMNA", "body": "പുതിയൊരു ദിവസം... പുതിയൊരു അവസരം. ഇന്ന് എന്തെങ്കിലും പുതിയത് പഠിക്കൂ! 📚"},
              {"title": "☀️ സുപ്രഭാതം!", "body": "Every expert was once a beginner. ഇന്ന് പഠനം ആരംഭിക്കൂ."},
              {"title": "📚 Good Morning!", "body": "ഒരു Lesson പൂർത്തിയാക്കി ഇന്നത്തെ ദിവസം വിജയകരമാക്കൂ."},
              {"title": "🌼 സുപ്രഭാതം!", "body": "Dream Big. Learn Daily. Achieve More. 🚀"},
              {"title": "💡 Good Morning!", "body": "അറിവാണ് നിങ്ങളുടെ ഏറ്റവും വലിയ ശക്തി. ഇന്ന് അത് വർധിപ്പിക്കൂ."},
              {"title": "🌞 സുപ്രഭാതം!", "body": "Today's effort becomes tomorrow's success."},
              {"title": "📖 Good Morning!", "body": "Learn something new today. Your future will thank you."},
              {"title": "🌿 സുപ്രഭാതം!", "body": "ഓരോ ദിവസവും ഒരു പുതിയ തുടക്കമാണ്. മുന്നോട്ട് പോവൂ."},
              {"title": "🚀 Good Morning!", "body": "Small progress every day leads to big achievements."},
              {"title": "🎯 സുപ്രഭാതം!", "body": "ഇന്നത്തെ ലക്ഷ്യം: ഒരു Chapter പൂർത്തിയാക്കുക."},
              {"title": "🌅 Good Morning!", "body": "പഠനം നിർത്തരുത്... വിജയം നിങ്ങളെ കാത്തിരിക്കുന്നു."},
              {"title": "📘 സുപ്രഭാതം!", "body": "Consistency is the key to success. പഠനം തുടരൂ."},
              {"title": "✨ Good Morning!", "body": "One lesson today, one step closer to your dream."},
              {"title": "🌸 സുപ്രഭാതം!", "body": "ഇന്ന് ഒരു പുതിയ Concept മനസ്സിലാക്കൂ."},
              {"title": "📚 Good Morning!", "body": "Stay curious. Stay focused. Keep learning."},
              {"title": "🌞 സുപ്രഭാതം!", "body": "സമയം വിലപ്പെട്ടതാണ്. അത് അറിവാക്കി മാറ്റൂ."},
              {"title": "💙 Good Morning!", "body": "Believe in yourself. Great things take time."},
              {"title": "📖 സുപ്രഭാതം!", "body": "ഇന്നത്തെ പഠനം നാളത്തെ ആത്മവിശ്വാസമാണ്."},
              {"title": "🌼 Good Morning!", "body": "Make today productive. Start with one lesson."},
              {"title": "🚀 സുപ്രഭാതം!", "body": "Learn Today. Lead Tomorrow."},
              {"title": "🌅 Good Morning!", "body": "നിങ്ങളുടെ സ്വപ്നങ്ങളിലേക്ക് ഇന്ന് ഒരു ചുവടുകൂടി."},
              {"title": "📚 സുപ്രഭാതം!", "body": "Every page you read builds your future."},
              {"title": "💡 Good Morning!", "body": "Questions lead to knowledge. Never stop asking."},
              {"title": "🌿 സുപ്രഭാതം!", "body": "ഇന്ന് ഒരു Quiz ശ്രമിക്കൂ."},
              {"title": "📘 Good Morning!", "body": "Learning is the best investment you can make."},
              {"title": "🌞 സുപ്രഭാതം!", "body": "ഓരോ ദിവസവും പുതിയ അവസരങ്ങളാണ്."},
              {"title": "🚀 Good Morning!", "body": "Focus on progress, not perfection."},
              {"title": "📖 സുപ്രഭാതം!", "body": "POLY PMNA-യോടൊപ്പം ഇന്നും പഠനം തുടരൂ."},
              {"title": "🌸 Good Morning!", "body": "Success begins with today's effort."},
              {"title": "🎯 സുപ്രഭാതം!", "body": "ഇന്നത്തെ Challenge: ഒരു പുതിയ Topic പഠിക്കുക."},
              {"title": "🌅 Good Morning!", "body": "Make every morning count."},
              {"title": "📚 സുപ്രഭാതം!", "body": "പഠനം നിങ്ങളുടെ ഭാവിയെ രൂപപ്പെടുത്തുന്നു."},
              {"title": "💙 Good Morning!", "body": "Never stop learning."},
              {"title": "🌞 സുപ്രഭാതം!", "body": "ഇന്ന് ചെയ്യുന്ന പരിശ്രമം നാളത്തെ വിജയം."},
              {"title": "📖 Good Morning!", "body": "Read. Learn. Improve."},
              {"title": "🌼 സുപ്രഭാതം!", "body": "നിങ്ങളുടെ കഴിവിൽ വിശ്വസിക്കൂ."},
              {"title": "🚀 Good Morning!", "body": "One small step today makes a big difference tomorrow."},
              {"title": "📚 സുപ്രഭാതം!", "body": "അറിവ് പങ്കുവെച്ചാൽ മാത്രമേ വളരൂ."},
              {"title": "💡 Good Morning!", "body": "Stay positive. Stay productive."},
              {"title": "🌿 സുപ്രഭാതം!", "body": "ഇന്നത്തെ ദിവസം പഠനത്തിനായി മാറ്റിവെക്കൂ."},
              {"title": "📘 Good Morning!", "body": "Keep moving. Keep improving."},
              {"title": "🌸 സുപ്രഭാതം!", "body": "ഒരു Lesson ഇന്ന്... ഒരു വിജയം നാളെ."},
              {"title": "🌅 Good Morning!", "body": "Learn with confidence. Grow with knowledge."},
              {"title": "📖 സുപ്രഭാതം!", "body": "നല്ല ശീലങ്ങൾ നല്ല ഭാവി സൃഷ്ടിക്കുന്നു."},
              {"title": "🚀 Good Morning!", "body": "Push yourself. Nobody else will do it for you."},
              {"title": "☀️ സുപ്രഭാതം!", "body": "POLY PMNA-യിൽ പുതിയ Notes പരിശോധിക്കൂ."},
              {"title": "📚 Good Morning!", "body": "Knowledge opens new opportunities."},
              {"title": "🌞 സുപ്രഭാതം!", "body": "പുതിയൊരു ദിവസം... പുതിയൊരു പഠനം."},
              {"title": "💙 Good Morning!", "body": "Learn today, inspire tomorrow."},
              {"title": "🌅 സുപ്രഭാതം – POLY PMNA", "body": "പുഞ്ചിരിയോടെ ദിവസം ആരംഭിക്കൂ... അറിവോടെ ദിവസം അവസാനിപ്പിക്കൂ. 🌟"},
          ]

          # Determine title and body
          if date_key in onam_messages:
              title = onam_messages[date_key]["title"]
              body = onam_messages[date_key]["body"]
              notification_type = "onam-greeting"
          else:
              index = today_ist.toordinal() % len(daily_messages)
              selected = daily_messages[index]
              title = selected["title"]
              body = selected["body"]
              notification_type = "daily-good-morning"

          message = {
              "topic": "all-users",
              "data": {
                  "title": title,
                  "body": body,
                  "url": "https://polypmna.dpdns.org/",
                  "contentType": "daily-good-morning",
                  "notificationType": notification_type,
                  "date": date_key,
              },
              "android": {
                  "priority": "high",
                  "ttl": "86400s",
                  "collapse_key": "daily-good-morning",
              },
          }

          endpoint = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          response = requests.post(
              endpoint,
              headers={
                  "Authorization": f"Bearer {credentials.token}",
                  "Content-Type": "application/json; charset=UTF-8",
              },
              json={"message": message},
              timeout=30,
          )

          print(f"IST date: {date_key}")
          print(f"Notification title: {title}")
          print(f"Notification type: {notification_type}")
          print(f"FCM HTTP status: {response.status_code}")

          if not response.ok:
              print(response.text)
              sys.exit(1)

          print("SUCCESS: Good Morning notification sent.")
          print(response.text)
