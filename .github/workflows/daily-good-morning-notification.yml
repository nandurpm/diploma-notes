name: Daily Good Morning Notification

on:
  schedule:
    # 07:00 AM IST = 01:30 UTC (Good Morning)
    - cron: "30 1 * * *"
    # 09:00 AM IST = 03:30 UTC (Special Day)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      notification_mode:
        description: "Which notification to send?"
        required: true
        default: "Auto"
        type: choice
        options:
          - "Auto"
          - "Good Morning"
          - "Special Day"
      dry_run:
        description: "Validate and preview the selected notification without sending it"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test notification delivery windows
        run: python -m unittest discover -s tests -p test_notification_window.py

      - name: Install FCM sender dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Send notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NOTIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.notification_mode || 'Auto' }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        shell: python
        run: |
          import json
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              raise SystemExit("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is empty or unavailable.")

          try:
              account = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON: {exc}")

          required = ["project_id", "client_email", "private_key"]
          missing = [key for key in required if not account.get(key)]
          if missing:
              raise SystemExit(
                  "ERROR: Firebase service account JSON is missing required field(s): "
                  + ", ".join(missing)
              )

          project_id = account["project_id"]

          # Determine the date/time in IST (Asia/Kolkata)
          today_ist_dt = datetime.now(ZoneInfo("Asia/Kolkata"))
          today_ist = today_ist_dt.date()
          date_key = today_ist.isoformat()
          mm_dd_key = f"{today_ist.month:02d}-{today_ist.day:02d}"

          # Load the notifications database
          db_path = "notifications/notifications_db.json"
          try:
              with open(db_path, "r", encoding="utf-8") as f:
                  db = json.load(f)
          except Exception as exc:
              raise SystemExit(f"ERROR: Failed to load notification database: {exc}")

          good_morning_list = db.get("good_morning", [])
          special_day_list = db.get("special_day", [])

          mode = os.environ.get("NOTIFICATION_MODE", "Auto")
          schedule_cron = os.environ.get("EVENT_SCHEDULE", "")
          # Queued runs have recently started around 11:50 and 13:33 IST.
          # Accept a morning greeting until noon and an observance until 18:00.
          # Keep these cutoffs on manual runs too, and bound FCM expiry to them.
          sys.path.insert(0, os.getcwd())
          from scripts.notification_window import resolve_mode
          resolved_mode, ttl_seconds = resolve_mode(mode, schedule_cron, today_ist_dt)

          def report_delivery(message, warning=False):
              print(("::warning::" if warning else "") + message)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as output:
                      output.write(message + "\n")

          print(f"Current IST Date & Time: {today_ist_dt}")
          if ttl_seconds <= 0:
              report_delivery(f"Not sent: {resolved_mode} job started outside its delivery window at {today_ist_dt:%H:%M} IST.", warning=True)
              sys.exit(0)

          print(f"Resolved Mode: {resolved_mode}")

          # Retrieve message details
          if resolved_mode == "Good Morning":
              if not good_morning_list:
                  raise SystemExit("ERROR: Good Morning list is empty in the database.")
              index = today_ist.toordinal() % len(good_morning_list)
              selected = good_morning_list[index]
              title = selected.get("title")
              body = selected.get("body")
              notification_type = selected.get("notification_type", "daily-motivation-7am")
              category = selected.get("category", "Good Morning")
              target_url = selected.get("url", "https://polypmna.dpdns.org/")
              collapse_key = "daily-good-morning-7am"

          elif resolved_mode == "Special Day":
              matched_events = [item for item in special_day_list if item.get("date") == mm_dd_key]
              if not matched_events:
                  report_delivery(f"Not sent: no special event in the calendar for {mm_dd_key}.")
                  sys.exit(0)
              selected = matched_events[0]
              title = selected.get("title")
              body = selected.get("body")
              notification_type = selected.get("notification_type", "special-day-9am")
              category = selected.get("category", "Special Day")
              target_url = selected.get("url", "https://polypmna.dpdns.org/")
              collapse_key = "special-day-9am"

          else:
              raise SystemExit(f"ERROR: Unknown resolved mode: {resolved_mode}")

          if not title or not body:
              raise SystemExit("ERROR: Selected notification has empty title or body.")

          dry_run = os.environ.get("DRY_RUN", "false").strip().lower() == "true"
          if dry_run:
              print("DRY RUN: Notification payload validated; no FCM message will be sent.")
              print(json.dumps({
                  "topic": "all-users",
                  "title": title,
                  "body": body,
                  "url": target_url,
                  "notification_type": notification_type,
                  "category": category,
                  "date": date_key,
                  "collapse_key": collapse_key,
              }, ensure_ascii=False, indent=2))
              sys.exit(0)

          # Authenticate with Google API
          credentials = service_account.Credentials.from_service_account_info(
              account,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"],
          )
          credentials.refresh(Request())

          if not credentials.token:
              raise SystemExit("ERROR: Google OAuth token was not obtained.")

          message = {
              "topic": "all-users",
              "data": {
                  "title": title,
                  "body": body,
                  "url": target_url,
                  "contentType": "daily-good-morning" if resolved_mode == "Good Morning" else "special-day",
                  "notificationType": notification_type,
                  "date": date_key,
                  "category": category,
              },
              "android": {
                  "priority": "high",
                  "ttl": f"{ttl_seconds}s",
                  "collapse_key": collapse_key,
              },
          }

          endpoint = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          print(f"Sending FCM message payload: {json.dumps(message, ensure_ascii=False, indent=2)}")

          response = requests.post(
              endpoint,
              headers={
                  "Authorization": f"Bearer {credentials.token}",
                  "Content-Type": "application/json; charset=UTF-8",
              },
              json={"message": message},
              timeout=30,
          )

          print(f"FCM HTTP status: {response.status_code}")
          if not response.ok:
              print(response.text)
              sys.exit(1)

          report_delivery(f"Sent: {resolved_mode} for {date_key}; accepted by FCM (device delivery is not confirmed).")
          print(response.text)
