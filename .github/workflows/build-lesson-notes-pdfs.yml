name: Build lesson notes PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lessons/lessons-*.html"
      - "assets/lesson-content/**/*.html"
      - "assets/css/**/*.css"
      - "assets/js/site-hardening.js"
      - "tools/build_lesson_pdfs.py"
      - ".github/workflows/build-lesson-notes-pdfs.yml"

permissions:
  contents: write

concurrency:
  group: lesson-notes-pdf-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Validate renderer source
        run: |
          python -m py_compile tools/build_lesson_pdfs.py
          python -m py_compile tools/update_asset_manifest.py

      - name: Start local website server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/lesson-http.log 2>&1 &
          echo $! > /tmp/lesson-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/lessons.html > /dev/null; then
              echo "Local website server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lesson-http.log
          exit 1

      - name: Generate and validate all lesson PDFs
        run: |
          python tools/build_lesson_pdfs.py
          printf '%s\n' "${{ github.run_id }}" > reports/lesson-notes-pdf-run-id.txt

      - name: Synchronize lesson and notes availability
        run: |
          python tools/update_asset_manifest.py
          node --check assets/js/subject-browser.js
          node --check assets/js/asset-manifest.js

      - name: Verify separate uploaded notes are preserved
        run: |
          test -f notes/downloadable-notes-1003.pdf
          test -f notes/downloadable-notes-1004.pdf
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/lesson-notes-pdf-build.json").read_text(encoding="utf-8"))
          assert report["preservedSeparateNotes"] == ["1003", "1004"]
          generated_codes = {item["code"] for item in report["generated"]}
          assert "1003" not in generated_codes
          assert "1004" not in generated_codes
          assert all(not item["blankPages"] for item in report["generated"])
          assert all(item["panelCount"] == item["visiblePanelCount"] for item in report["generated"])
          PY

      - name: Commit corrected PDFs and availability files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/downloadable-notes-*.pdf \
            reports/lesson-notes-pdf-build.json \
            reports/lesson-notes-pdf-run-id.txt \
            assets/js/subject-browser.js \
            assets/js/asset-manifest.js
          if git diff --cached --quiet; then
            echo "No lesson PDF changes"
          else
            git commit -m "Regenerate complete lesson PDFs without blank pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stop local website server
        if: always()
        run: |
          if [ -f /tmp/lesson-http.pid ]; then
            kill "$(cat /tmp/lesson-http.pid)" || true
          fi
