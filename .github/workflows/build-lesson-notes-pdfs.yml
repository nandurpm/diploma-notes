name: Build lesson notes PDFs

on:
  workflow_dispatch:
  schedule:
    # Catch lesson files added by tools or uploads that do not trigger a normal push workflow.
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "lessons/**/*.html"
      - "tools/build_lesson_pdfs.py"
      - "tools/update_asset_manifest.py"
      - ".github/workflows/build-lesson-notes-pdfs.yml"

permissions:
  contents: write

concurrency:
  group: lesson-notes-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-notes:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip notes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python -m http.server 8000 > /tmp/lesson-site.log 2>&1 &
          echo $! > /tmp/lesson-site.pid
          sleep 3

      - name: Build downloadable notes PDFs from every lesson HTML
        run: |
          python tools/build_lesson_pdfs.py

      - name: Verify every lesson has a downloadable notes PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path.cwd()
          lesson_codes = set()
          notes_codes = set()
          for path in (root / "lessons").glob("lessons-*.html"):
              match = re.fullmatch(r"lessons-(\d+[A-Za-z]?)\.html", path.name)
              if match:
                  lesson_codes.add(match.group(1).upper())
          for path in (root / "notes").glob("downloadable-notes-*.pdf"):
              match = re.fullmatch(r"downloadable-notes-(\d+[A-Za-z]?)\.pdf", path.name)
              if match and path.stat().st_size >= 20000:
                  notes_codes.add(match.group(1).upper())
          missing = sorted(lesson_codes - notes_codes)
          if missing:
              raise SystemExit(f"Missing downloadable notes PDFs for: {', '.join(missing)}")
          print(f"Verified {len(lesson_codes)} lesson files and {len(notes_codes)} downloadable notes PDFs.")
          PY

      - name: Synchronize lesson and notes availability
        run: |
          python tools/update_asset_manifest.py
          node --check assets/js/subject-browser.js
          node --check assets/js/asset-manifest.js

      - name: Commit generated PDFs and availability data
        run: |
          if git diff --quiet -- notes reports/lesson-notes-pdf-build.json assets/js/subject-browser.js assets/js/asset-manifest.js; then
            echo "Downloadable notes are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes reports/lesson-notes-pdf-build.json assets/js/subject-browser.js assets/js/asset-manifest.js
          git commit -m "Build downloadable lesson notes [skip notes]"
          git push origin HEAD:main

      - name: Stop local static server
        if: always()
        run: |
          if [ -f /tmp/lesson-site.pid ]; then
            kill "$(cat /tmp/lesson-site.pid)" || true
          fi
