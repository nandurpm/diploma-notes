name: Live About page verification

on:
  push:
    branches: [main]
    paths:
      - ".github/live-about-verification-trigger.txt"
      - "tools/verify_live_about.py"
      - ".github/workflows/live-about-verification.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-about-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify uncached production content
        id: verify
        continue-on-error: true
        run: python tools/verify_live_about.py --expected-commit "$GITHUB_SHA" --attempts 10 --delay 6 --report /tmp/live-about-verification.md
      - name: Publish verification result
        if: ${{ !cancelled() && steps.verify.outcome != 'cancelled' }}
        shell: bash
        run: |
          status="failed"
          [ "${{ steps.verify.outcome }}" = "success" ] && status="passed"
          {
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> /tmp/live-about-verification.md
          cat /tmp/live-about-verification.md >> "$GITHUB_STEP_SUMMARY"
          python tools/report_diagnostic_issue.py --status "$status" --title "[live About verification] failed" --report /tmp/live-about-verification.md
          test "$status" = "passed"
