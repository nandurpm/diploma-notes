name: Site Structure Validation

on:
  pull_request:
    paths:
      - "*.html"
      - "lessons/**"
      - "revision-2026-content/lessons/**"
      - "assets/js/**"
      - "assets/css/**"
      - "android-app/**"
      - "tools/validate_site_structure.py"
      - "tools/validate_lesson_fullscreen.py"
      - "tools/validate_watermark.py"
      - "tools/update_lesson_assistant.py"
      - ".github/workflows/site-structure-validation.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "lessons/**"
      - "revision-2026-content/lessons/**"
      - "assets/js/**"
      - "assets/css/**"
      - "android-app/**"
      - "tools/validate_site_structure.py"
      - "tools/validate_lesson_fullscreen.py"
      - "tools/validate_watermark.py"
      - "tools/update_lesson_assistant.py"
      - ".github/workflows/site-structure-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify shared runtime on every lesson
        run: python tools/update_lesson_assistant.py --check
      - name: Validate site structure
        run: python tools/validate_site_structure.py
      - name: Validate full-screen lesson standard
        run: python tools/validate_lesson_fullscreen.py
      - name: Validate lesson watermark coverage
        run: python tools/validate_watermark.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-structure-validation
          path: |
            reports/site-structure-validation.json
            reports/lesson-fullscreen-validation.json
            reports/watermark-validation.json
          if-no-files-found: warn
