name: Build and publish signed Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - ".github/workflows/build-windows-app.yml"

permissions:
  contents: read

concurrency:
  group: poly-pmna-windows-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        working-directory: windows-app
        run: npm ci

      - name: Generate temporary Windows signing certificate
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=POLY PMNA Windows App" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(2)
          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE 'windows-app\signing.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          "CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CSC_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_SUBJECT=$($certificate.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed portable executable
        working-directory: windows-app
        run: npm run dist

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows-app/dist -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'No portable EXE was produced.' }
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -eq 'NotSigned' -or $null -eq $signature.SignerCertificate) { throw "The portable EXE is not Authenticode-signed, refusing to publish." }
          "SIGNATURE_STATUS=$($signature.Status)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNER=$($signature.SignerCertificate.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNED_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EXE_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Read release version
        shell: pwsh
        run: |
          $pkg = Get-Content windows-app/package.json | ConvertFrom-Json
          "VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=windows-v$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            throw "Release $env:RELEASE_TAG already exists. Bump windows-app/package.json version before rebuilding."
          }
          gh release create "$env:RELEASE_TAG" "$env:SIGNED_EXE" `
            --title "POLY PMNA Windows $env:VERSION" `
          --notes "Cryptographically signed portable POLY PMNA Windows app. Signature status: $env:SIGNATURE_STATUS. Signer: $env:SIGNER. SHA-256: $env:EXE_SHA256. This release uses a CI-generated self-signed certificate and may show an untrusted-publisher warning on Windows."

      - name: Upload signed executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: POLY_PMNA_Windows_${{ env.VERSION }}_signed_portable
          path: windows-app/dist/*.exe
          if-no-files-found: error
