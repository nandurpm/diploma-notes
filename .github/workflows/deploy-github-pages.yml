name: Deploy static site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test PDF catalogue loading and packaging
        run: |
          node --test tests/pdf-catalogue.test.mjs
          python -m unittest discover -s tests -p test_public_pdf_catalogues.py
      - name: Generate, validate and optimize public artifact
        run: |
          GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="main" python tools/write_build_info.py
          python tools/generate_sitemap.py
          python tools/site_quality_gate.py
          python tools/build_public_site.py --target _site
          python tools/verify_public_build_consistency.py _site --expected-commit "$GITHUB_SHA"
          test -f _site/build-optimization.json
          grep -q 'assets/build/home.' _site/index.html
          test ! -s <(grep -o 'id="queueBtn"' _site/ask-poly.html)
          test ! -s <(grep -o 'class="ask-queue"' _site/ask-poly.html)
          test ! -s <(grep -o 'id="contextDepartment"' _site/ask-poly.html)
          test ! -s <(grep -o 'class="ask-context-bar"' _site/ask-poly.html)
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
