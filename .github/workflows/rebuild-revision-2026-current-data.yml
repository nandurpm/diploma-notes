name: Rebuild Revision 2026 from current data

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/normalize_revision_2026_legacy_data.py'
      - 'tools/build_revision_2026_pages.py'
      - '.github/workflows/rebuild-revision-2026-current-data.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-revision-2026-current-data
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts
        run: python -m py_compile tools/normalize_revision_2026_legacy_data.py tools/build_revision_2026_pages.py
      - name: Correct legacy semester placement
        run: python tools/normalize_revision_2026_legacy_data.py
      - name: Build static pages and code comparison report
        run: python tools/build_revision_2026_pages.py
      - name: Commit corrected data, pages and reports
        run: |
          git add assets/data/revision-2026-subjects.json
          git add revision-2026.html revision-2026/*.html
          git add reports/revision-2026-build-summary.json
          git add reports/revision-2026-new-codes-vs-2021.json reports/revision-2026-new-codes-vs-2021.md
          if git diff --cached --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Correct REV2026 semester ordering and publish code comparison'
          git push
