name: Rebuild Revision 2026 from current data

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/normalize_revision_2026_legacy_data.py'
      - 'tools/build_revision_2026_pages.py'
      - 'tools/bump_subject_card_assets.py'
      - '.github/workflows/rebuild-revision-2026-current-data.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-revision-2026-current-data
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts
        run: python -m py_compile tools/normalize_revision_2026_legacy_data.py tools/build_revision_2026_pages.py tools/bump_subject_card_assets.py
      - name: Correct legacy semester placement
        run: python tools/normalize_revision_2026_legacy_data.py
      - name: Build Revision 2021-style static subject cards
        run: python tools/build_revision_2026_pages.py
      - name: Refresh subject-card browser cache versions
        run: python tools/bump_subject_card_assets.py
      - name: Commit corrected cards, data and reports
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Rebuild REV2026 with REV2021 subject-card structure'
          git push
