name: Test Android native print in emulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poly-pmna-android-print-emulator
  cancel-in-progress: false

jobs:
  native-print-emulator:
    name: Install APK, open lesson, and verify Print / Save as PDF
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read expected APK metadata
        id: app
        run: |
          set -euo pipefail
          APK_URL=$(python3 -c "import json; print(json.load(open('downloads/app-update.json'))['apkUrl'])")
          APK_SHA=$(python3 -c "import json; print(json.load(open('downloads/app-update.json'))['sha256'])")
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the published signed APK
        run: |
          set -euo pipefail
          mkdir -p emulator-artifacts
          curl --fail --location --retry 3 --retry-delay 2 \
            "${{ steps.app.outputs.apk_url }}" \
            --output emulator-artifacts/POLY_PMNA.apk
          echo "${{ steps.app.outputs.apk_sha }}  emulator-artifacts/POLY_PMNA.apk" | sha256sum --check --strict

      - name: Install APK and verify native print dialog in emulator
        uses: reactivecircus/android-emulator-runner@d2f3dfb75ea5ebf50d31b594ff5f42ed1cce9c1b # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # Keep the complete test in one POSIX shell script. The runner invokes
            # this block with /usr/bin/sh, and the script captures all adb evidence.
            sh tools/test_android_print_emulator.sh

      - name: Upload emulator UI and logcat evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-print-emulator-evidence
          path: emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14
