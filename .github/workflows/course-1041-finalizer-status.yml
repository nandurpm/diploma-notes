name: Monitor Course 1041 final verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-finalizer-status.yml"

permissions:
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Report final verification status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh run list --repo nandurpm/diploma-notes --workflow course-1041-finalize-verification.yml --limit 3 --json databaseId,status,conclusion,headSha,displayTitle,event,createdAt,url)"
          gh issue comment 38 --repo nandurpm/diploma-notes --body "Course 1041 final live verification status:

\`\`\`json
${status}
\`\`\`"
