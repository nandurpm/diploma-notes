name: Monitor Course 1041 final verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-finalizer-status.yml"

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write final verification status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          gh run list --repo nandurpm/diploma-notes --workflow course-1041-finalize-verification.yml --limit 3 --json databaseId,status,conclusion,headSha,displayTitle,event,createdAt,url > reports/course-1041-finalizer-status.json
          cat reports/course-1041-finalizer-status.json

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/course-1041-finalizer-status.json
          git commit -m "Record Course 1041 final verification status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
