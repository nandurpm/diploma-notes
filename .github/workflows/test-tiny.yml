name: Tiny test
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-tiny.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo ok
      - run: rm .github/workflows/test-tiny.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove tiny test workflow"
          git push
