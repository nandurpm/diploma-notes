name: Apply Android sidebar update and release 1.0.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-android-sidebar-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Add Quiz Dashboard to the native sidebar and bump app version
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path("android-app/app/src/main/res/layout/activity_main.xml")
          source = layout.read_text(encoding="utf-8")
          if 'android:id="@+id/navDailyQuiz"' not in source:
              marker = '''                <TextView
                      android:id="@+id/navStudyMaterials"
                      style="@style/DrawerMenuItem"
                      android:drawableStart="@drawable/ic_document"
                      android:text="@string/nav_study_materials" />
          '''
              addition = marker + '''
                  <TextView
                      android:id="@+id/navDailyQuiz"
                      style="@style/DrawerMenuItem"
                      android:drawableStart="@drawable/ic_question"
                      android:text="@string/nav_daily_quiz" />
          '''
              if marker not in source:
                  raise SystemExit("Could not locate Study Materials sidebar item.")
              source = source.replace(marker, addition, 1)
              layout.write_text(source, encoding="utf-8")

          activity = Path("android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/MainActivity.java")
          source = activity.read_text(encoding="utf-8")
          binding = '        bindNavigation(R.id.navDailyQuiz, "/daily-quiz.html");\n'
          if binding not in source:
              marker = '        bindNavigation(R.id.navStudyMaterials, "/study-materials.html");\n'
              if marker not in source:
                  raise SystemExit("Could not locate Study Materials navigation binding.")
              source = source.replace(marker, marker + binding, 1)
              activity.write_text(source, encoding="utf-8")

          gradle = Path("android-app/app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          source = source.replace("versionCode 4", "versionCode 5", 1)
          source = source.replace("versionName '1.0.3'", "versionName '1.0.4'", 1)

          if "ANDROID_KEYSTORE_FILE" not in source:
              source = source.replace(
                  "plugins {\n    id 'com.android.application'\n}\n",
                  "plugins {\n    id 'com.android.application'\n}\n\n"
                  "def releaseStoreFilePath = System.getenv('ANDROID_KEYSTORE_FILE')\n"
                  "def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
                  "def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')\n"
                  "def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')\n"
                  "def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword\n",
                  1,
              )
              source = source.replace(
                  "    buildFeatures {\n",
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            if (hasReleaseSigning) {\n"
                  "                storeFile file(releaseStoreFilePath)\n"
                  "                storePassword releaseStorePassword\n"
                  "                keyAlias releaseKeyAlias\n"
                  "                keyPassword releaseKeyPassword\n"
                  "            }\n"
                  "        }\n"
                  "    }\n\n"
                  "    buildFeatures {\n",
                  1,
              )
              source = source.replace(
                  "        release {\n            debuggable false\n",
                  "        release {\n            debuggable false\n            if (hasReleaseSigning) {\n                signingConfig signingConfigs.release\n            }\n",
                  1,
              )
          gradle.write_text(source, encoding="utf-8")

          readme = Path("android-app/README.md")
          source = readme.read_text(encoding="utf-8")
          source = source.replace("Version: `1.0.3`", "Version: `1.0.4`", 1)
          source = source.replace(
              "Version 1.0.3 hardens navigation, downloads, deep links and WebView lifecycle handling:",
              "Version 1.0.4 updates the native navigation drawer and preserves the v1.0.3 security improvements:",
              1,
          )
          sidebar_note = "- Adds the Quiz Dashboard directly to the native navigation drawer.\n"
          if sidebar_note not in source:
              anchor = "Version 1.0.4 updates the native navigation drawer and preserves the v1.0.3 security improvements:\n\n"
              source = source.replace(anchor, anchor + sidebar_note, 1)
          readme.write_text(source, encoding="utf-8")
          PY

      - name: Validate sidebar source changes
        run: |
          set -euo pipefail
          grep -q 'android:id="@+id/navDailyQuiz"' android-app/app/src/main/res/layout/activity_main.xml
          grep -q 'bindNavigation(R.id.navDailyQuiz, "/daily-quiz.html")' android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/MainActivity.java
          grep -q "versionCode 5" android-app/app/build.gradle
          grep -q "versionName '1.0.4'" android-app/app/build.gradle

      - name: Commit Android source update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/res/layout/activity_main.xml \
                  android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/MainActivity.java \
                  android-app/app/build.gradle \
                  android-app/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add Quiz Dashboard to Android sidebar and bump to 1.0.4 [skip ci]"
            git push
          fi

      - name: Build and publish signed 1.0.4 APK when signing secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Signing secrets are not configured. Source update was committed, but no installable APK was published."
            exit 0
          fi

          KEYSTORE="$GITHUB_WORKSPACE/android-app/release-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          export ANDROID_KEYSTORE_FILE="$KEYSTORE"

          cd android-app
          gradle --no-daemon :app:clean :app:assembleRelease --stacktrace
          cd "$GITHUB_WORKSPACE"

          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          cp "$APK" downloads/Polytechnic-Study-Hub-v1.0.4.apk
          sha256sum downloads/Polytechnic-Study-Hub-v1.0.4.apk > downloads/Polytechnic-Study-Hub-v1.0.4.sha256.txt
          python tools/update_app_manifest.py

          git add downloads/Polytechnic-Study-Hub-v1.0.4.apk \
                  downloads/Polytechnic-Study-Hub-v1.0.4.sha256.txt \
                  downloads/app-update.json \
                  index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish Polytechnic Study Hub Android 1.0.4 [skip ci]"
            git push
          fi

          rm -f "$KEYSTORE"
