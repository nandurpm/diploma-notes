name: Publish Android sidebar update 1.0.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-android-sidebar-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate 1.0.4 sidebar source
        run: |
          set -euo pipefail
          grep -q "versionCode 5" android-app/app/build.gradle
          grep -q "versionName '1.0.4'" android-app/app/build.gradle
          grep -q 'android:name=".QuizNavigationApplication"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'QUIZ_URL = "https://polypmna.dpdns.org/daily-quiz.html"' \
            android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/QuizNavigationApplication.java
          grep -q 'setText(R.string.nav_daily_quiz)' \
            android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/QuizNavigationApplication.java

      - name: Require the original Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD:-}" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Build unsigned release APK
        working-directory: android-app
        run: gradle --no-daemon :app:clean :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android-app/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="android-app/app/build/outputs/apk/release/Polytechnic-Study-Hub-v1.0.4.apk"
          KEYSTORE="$RUNNER_TEMP/polytechnic-study-hub-release.jks"

          test -f "$UNSIGNED"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          rm -f "$KEYSTORE"

      - name: Publish 1.0.4 APK and update metadata
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/Polytechnic-Study-Hub-v1.0.4.apk"
          cp "$APK" downloads/Polytechnic-Study-Hub-v1.0.4.apk
          sha256sum downloads/Polytechnic-Study-Hub-v1.0.4.apk > downloads/Polytechnic-Study-Hub-v1.0.4.sha256.txt
          python tools/update_app_manifest.py
          python -m json.tool downloads/app-update.json > /dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Polytechnic-Study-Hub-v1.0.4.apk \
                  downloads/Polytechnic-Study-Hub-v1.0.4.sha256.txt \
                  downloads/app-update.json \
                  index.html
          git commit -m "Publish Polytechnic Study Hub Android 1.0.4 [skip ci]"
          git push
