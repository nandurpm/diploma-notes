name: Publish Android v1.0.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-v1.0.3.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified signed v1.0.3 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 7675085057
          path: signed-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 27636756279

      - name: Publish APK and synchronize website metadata
        run: |
          set -euo pipefail
          EXPECTED_SHA="8229523c702766901925da73cb9bc7224c94f99efcd4d542373cae1be98b40a5"
          APK="$(find signed-release -type f -name 'Polytechnic-Study-Hub-v1.0.3.apk' | head -n 1)"
          test -f "$APK"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          cp "$APK" downloads/Polytechnic-Study-Hub-v1.0.3.apk
          printf '%s  %s\n' "$EXPECTED_SHA" "Polytechnic-Study-Hub-v1.0.3.apk" > downloads/Polytechnic-Study-Hub-v1.0.3.sha256.txt
          python tools/update_app_manifest.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("downloads/app-update.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.update({
              "versionCode": 4,
              "versionName": "1.0.3",
              "forceUpdate": False,
              "publishedAt": "2026-06-16",
              "title": "Polytechnic Study Hub 1.0.3 security update",
              "message": "Update for safer links and downloads, Android 6 compatibility, verified website links and improved offline recovery.",
              "releaseNotes": [
                  "Fixed external and special-link handling on Android 6.",
                  "Blocked unsafe intent links and restricted downloads to the trusted website.",
                  "Forwarded session cookies and file type information for reliable downloads.",
                  "Disabled third-party cookies and application-data backup.",
                  "Added verified website deep links and improved offline retry.",
                  "Improved WebView lifecycle cleanup and dependency metadata."
              ]
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python -m json.tool downloads/app-update.json > /dev/null

      - name: Commit public v1.0.3 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            downloads/Polytechnic-Study-Hub-v1.0.3.apk \
            downloads/Polytechnic-Study-Hub-v1.0.3.sha256.txt \
            downloads/app-update.json \
            index.html

          if git diff --cached --quiet; then
            echo "Android v1.0.3 is already published."
            exit 0
          fi

          git commit -m "Publish Polytechnic Study Hub v1.0.3 [skip ci]"
          git push origin HEAD:main
