name: Build Android App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish signed release APK to downloads and update app-update.json"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLY_PMNA_v2.1_debug_apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  signed-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode release keystore
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android-app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: |
          gradle -p android-app :app:assembleRelease --no-daemon \
            -PANDROID_KEYSTORE_FILE="$PWD/android-app/release.keystore" \
            -PANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" \
            -PANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
            -PANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish APK and update metadata
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/release/app-release.apk downloads/POLY_PMNA_v2.1.apk
          SHA256=$(sha256sum downloads/POLY_PMNA_v2.1.apk | awk '{print $1}')
          cat > downloads/app-update.json <<JSON
          {
            "schemaVersion": 1,
            "versionCode": 8,
            "versionName": "2.1",
            "apkUrl": "/downloads/POLY_PMNA_v2.1.apk",
            "sha256": "${SHA256}",
            "publishedAt": "2026-06-29",
            "forceUpdate": false,
            "title": "POLY PMNA Android app 2.1",
            "message": "Updated Android app includes Ask POLY AI in the left sidebar and refreshed website sections.",
            "releaseNotes": [
              "Added Ask POLY AI as a separate drawer item.",
              "Updated drawer order to match the website navigation.",
              "Updated launch text and version label for Ask POLY AI.",
              "Kept Revision 2021, Mock Exams, Tools, Question Papers, 2015 Materials, About and Contact available."
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/POLY_PMNA_v2.1.apk downloads/app-update.json
          git commit -m "Publish Android app v2.1" || exit 0
          git push

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLY_PMNA_v2.1_signed_apk
          path: downloads/POLY_PMNA_v2.1.apk
