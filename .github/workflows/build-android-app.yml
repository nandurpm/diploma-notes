name: Build and publish Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

concurrency:
  group: poly-pmna-android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Configure Firebase Android app
        id: firebase
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_MESSAGING=false" >> "$GITHUB_ENV"
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON is required for the public signed release APK. Without it, Firebase Cloud Messaging cannot register the app and users will not receive new-lesson notifications."
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          python -m json.tool android-app/app/google-services.json >/dev/null
          grep -q 'org.diplomanotes.polytechnicstudyhub' android-app/app/google-services.json
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "FIREBASE_MESSAGING=true" >> "$GITHUB_ENV"

      - name: Read app version
        run: |
          VERSION_CODE=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*$/\1/p" android-app/app/build.gradle | head -n 1)
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*'\([^']*\)'.*$/\1/p" android-app/app/build.gradle | head -n 1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=POLY_PMNA_v$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Avoid immutable release collisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "::error::VERSION_NAME '$VERSION_NAME' is not numeric; bump it manually before releasing."
            exit 1
          fi

          # GitHub Release assets are immutable. Keep advancing the patch
          # version until the candidate tag is unused, then build that version.
          while gh release view "$RELEASE_TAG" >/dev/null 2>&1; do
            if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[4]:-0}"
            else
              echo "::error::Version '$VERSION_NAME' became invalid while resolving release collisions."
              exit 1
            fi
            NEXT_VERSION="$major.$minor.$((patch + 1))"
            NEXT_CODE=$((VERSION_CODE + 1))
            python - "$NEXT_CODE" "$NEXT_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path("android-app/app/build.gradle")
          text = path.read_text()
          next_code, next_version = sys.argv[1:]
          text, code_count = re.subn(r"(^\s*versionCode\s*=\s*)\d+", rf"\g<1>{next_code}", text, count=1, flags=re.MULTILINE)
          text, name_count = re.subn(r"(^\s*versionName\s*=\s*)'[^']+'", rf"\g<1>'{next_version}'", text, count=1, flags=re.MULTILINE)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update Android version fields safely")
          path.write_text(text)
          PY
            VERSION_CODE="$NEXT_CODE"
            VERSION_NAME="$NEXT_VERSION"
            RELEASE_TAG="android-v$VERSION_NAME"
            APK_NAME="POLY_PMNA_v$VERSION_NAME.apk"
            export VERSION_CODE VERSION_NAME RELEASE_TAG APK_NAME
            echo "Existing release detected; trying $RELEASE_TAG (versionCode $VERSION_CODE)."
          done
          {
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "APK_NAME=$APK_NAME"
          } >> "$GITHUB_ENV"
          echo "Publishing unused release $RELEASE_TAG (versionCode $VERSION_CODE)."

      - name: Validate release signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Release signing secrets are required. Refusing to publish a debug or unsigned APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android-app/release.keystore
          test -s android-app/release.keystore
          keytool -list -keystore android-app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android-app :app:assembleRelease --no-daemon \
            -PANDROID_KEYSTORE_FILE="$PWD/android-app/release.keystore" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Prepare signed release
        run: |
          set -euo pipefail
          mkdir -p release-output reports downloads
          RELEASE_APK=$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" "release-output/$APK_NAME"
          RELEASE_SHA=$(sha256sum "release-output/$APK_NAME" | awk '{print $1}')
          RELEASE_BYTES=$(stat -c '%s' "release-output/$APK_NAME")
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_BYTES=$RELEASE_BYTES" >> "$GITHUB_ENV"

      - name: Publish signed APK as immutable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq ".assets[] | select(.name == \"${APK_NAME}\") | .digest" | head -n 1)
            if [ -n "$EXISTING_DIGEST" ]; then
              if [ "$EXISTING_DIGEST" != "sha256:${RELEASE_SHA}" ]; then
                echo "::error::Release ${RELEASE_TAG}/${APK_NAME} already exists with digest ${EXISTING_DIGEST}, but this build produced sha256:${RELEASE_SHA}. Published APKs are immutable; bump versionName/versionCode before releasing a different binary."
                exit 1
              fi
              echo "Release asset already exists with the same digest; reusing immutable ${APK_NAME}."
            else
              gh release upload "$RELEASE_TAG" "release-output/$APK_NAME"
            fi
          else
            gh release create "$RELEASE_TAG" "release-output/$APK_NAME" \
              --title "POLY PMNA Android $VERSION_NAME" \
              --notes "Signed POLY PMNA Android release with automatic new-lesson push notifications, Revision 2026, Revision 2021, Ask POLY AI, mock exams and tools."
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: POLY_PMNA_v${{ env.VERSION_NAME }}_signed_apk
          path: release-output/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Update website manifest and build reports
        run: |
          set -euo pipefail
          export APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          export PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "PUBLISHED_AT=$PUBLISHED_AT" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          firebase_messaging = os.environ.get("FIREBASE_MESSAGING") == "true"
          release_notes = [
              "Signed public release APK for Android installs and upgrades.",
              "Homepage Download Our App button points to this GitHub Release APK.",
              "Existing app users see an in-app update button when their installed version is older.",
              "Revision 2026 and Revision 2021 remain separate content destinations.",
          ]
          if firebase_messaging:
              release_notes.insert(1, "New lesson push notifications through Firebase Cloud Messaging.")

          app_update = {
              "schemaVersion": 1,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["RELEASE_SHA"],
              "publishedAt": os.environ["PUBLISHED_AT"],
              "forceUpdate": True,
              "title": f"POLY PMNA Android app {os.environ['VERSION_NAME']}",
              "message": "Install this signed release update to replace older debug builds and keep receiving future app updates from the homepage.",
              "releaseNotes": release_notes,
          }
          build_status = {
              "applicationId": "org.diplomanotes.polytechnicstudyhub",
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "firebaseMessaging": firebase_messaging,
              "status": "success",
              "releaseApkBytes": int(os.environ["RELEASE_BYTES"]),
              "releaseSha256": os.environ["RELEASE_SHA"],
              "builtAt": os.environ["PUBLISHED_AT"],
          }

          publication = {
              "status": "success",
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "firebaseMessaging": firebase_messaging,
              "apkUrl": os.environ["APK_URL"],
              "apkBytes": int(os.environ["RELEASE_BYTES"]),
              "sha256": os.environ["RELEASE_SHA"],
              "publishedAt": os.environ["PUBLISHED_AT"],
          }
          Path("downloads/app-update.json").write_text(json.dumps(app_update, indent=2) + "\n")
          Path("reports/android-v3-build-status.json").write_text(json.dumps(build_status, indent=2) + "\n")
          Path("reports/android-v3-publication.json").write_text(json.dumps(publication, indent=2) + "\n")
          PY
          python tools/update_app_manifest.py

      - name: Commit website update metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html downloads/app-update.json reports/android-v3-build-status.json reports/android-v3-publication.json
          if git diff --cached --quiet; then
            echo "Android release metadata and homepage download button are already current."
            exit 0
          fi
          git commit -m "Publish Android app v${VERSION_NAME} metadata"
          # The collision preflight may have changed the Gradle version only in
          # this runner. Do not carry that temporary build-only edit into the
          # metadata rebase or the push will fail on unstaged changes.
          git restore android-app/app/build.gradle
          git pull --rebase origin main
          git push origin HEAD:main
