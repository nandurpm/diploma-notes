name: Validate Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".well-known/assetlinks.json"
      - ".github/workflows/build-android-app.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".well-known/assetlinks.json"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify secure Android APIs and manifest
        run: |
          set -euo pipefail
          SOURCE="android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/MainActivity.java"
          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          ! grep -q "void onBackPressed" "$SOURCE"
          ! grep -q "startActivityForResult" "$SOURCE"
          ! grep -q "setDatabaseEnabled" "$SOURCE"
          ! grep -q "setAllowFileAccess(true)" "$SOURCE"
          ! grep -q "setAllowContentAccess(true)" "$SOURCE"
          ! grep -q "Intent.parseUri" "$SOURCE"
          grep -q "shouldOverrideUrlLoading(WebView view, String url)" "$SOURCE"
          grep -q "shouldOverrideUrlLoading(WebView view, WebResourceRequest request)" "$SOURCE"
          grep -q "MIXED_CONTENT_NEVER_ALLOW" "$SOURCE"
          grep -q "setAcceptThirdPartyCookies(webView, false)" "$SOURCE"
          grep -q 'request.addRequestHeader("Cookie"' "$SOURCE"
          grep -q "request.setMimeType" "$SOURCE"
          grep -q "onNewIntent" "$SOURCE"
          grep -q "onDestroy" "$SOURCE"
          grep -q 'android:autoVerify="true"' "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:launchMode="singleTop"' "$MANIFEST"
          ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"
          python -m json.tool .well-known/assetlinks.json > /dev/null

      - name: Build clean release validation APK
        working-directory: android-app
        run: |
          set -o pipefail
          mkdir -p release-output
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > release-output/dependencies.txt
          gradle --no-daemon --refresh-dependencies :app:clean :app:assembleRelease --stacktrace 2>&1 | tee release-output/gradle-build.log

      - name: Verify release manifest and metadata
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="android-app/release-output"
          REPORT="$OUTPUT/androidx-version-metadata.txt"
          test -f "$APK"

          cp "$APK" "$OUTPUT/Polytechnic-Study-Hub-release-unsigned.apk"
          sha256sum "$OUTPUT/Polytechnic-Study-Hub-release-unsigned.apk" > "$OUTPUT/Polytechnic-Study-Hub-release-unsigned.sha256.txt"

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          fi
          test -n "$APKANALYZER"
          test "$("$APKANALYZER" manifest debuggable "$APK" | tr -d '\r\n')" = "false"

          python - "$APK" "$REPORT" <<'PY'
          import re
          import sys
          import zipfile

          apk, report = sys.argv[1:3]
          entries = []
          malformed = []
          with zipfile.ZipFile(apk) as archive:
              for name in archive.namelist():
                  if re.fullmatch(r"META-INF/androidx\..+\.version", name):
                      value = archive.read(name).decode("utf-8", "replace").strip()
                      entries.append(f"{name}: {value}")
                      if value and not re.fullmatch(r"\d+(?:\.\d+){1,3}(?:[-+][A-Za-z0-9._-]+)?", value):
                          malformed.append(f"{name}: {value}")
          with open(report, "w", encoding="utf-8") as handle:
              handle.write("\n".join(entries) + ("\n" if entries else ""))
          if malformed:
              raise SystemExit("Malformed AndroidX version metadata:\n" + "\n".join(malformed))
          PY

      - name: Upload validation bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polytechnic-study-hub-android-validation
          path: android-app/release-output/
          if-no-files-found: error
          retention-days: 7
