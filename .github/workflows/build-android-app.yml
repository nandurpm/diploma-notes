name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".well-known/assetlinks.json"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_NAME: "1.0.5"
      APP_VERSION_CODE: "6"
      APK_NAME: "Polytechnic-Study-Hub-v1.0.5.apk"
      SOURCE: "android-app/app/src/main/java/org/diplomanotes/polytechnicstudyhub/MainActivity.java"
      STRINGS: "android-app/app/src/main/res/values/strings.xml"
      MANIFEST: "android-app/app/src/main/AndroidManifest.xml"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify secure Android APIs and manifest
        run: |
          set -euo pipefail
          ! grep -q "void onBackPressed" "$SOURCE"
          ! grep -q "startActivityForResult" "$SOURCE"
          ! grep -q "setDatabaseEnabled" "$SOURCE"
          ! grep -q "setAllowFileAccess(true)" "$SOURCE"
          ! grep -q "setAllowContentAccess(true)" "$SOURCE"
          ! grep -q "Intent.parseUri" "$SOURCE"
          grep -q "shouldOverrideUrlLoading(WebView view, String url)" "$SOURCE"
          grep -q "shouldOverrideUrlLoading(WebView view, WebResourceRequest request)" "$SOURCE"
          grep -q "MIXED_CONTENT_NEVER_ALLOW" "$SOURCE"
          grep -q "setAcceptThirdPartyCookies(webView, false)" "$SOURCE"
          grep -q 'request.addRequestHeader("Cookie"' "$SOURCE"
          grep -q "request.setMimeType" "$SOURCE"
          grep -q "onNewIntent" "$SOURCE"
          grep -q "onDestroy" "$SOURCE"
          grep -q "injectNativeAppChrome" "$SOURCE"
          grep -q 'android:autoVerify="true"' "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:launchMode="singleTop"' "$MANIFEST"
          ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"
          python -m json.tool .well-known/assetlinks.json > /dev/null

      - name: Build clean release APK
        working-directory: android-app
        run: |
          set -o pipefail
          mkdir -p release-output
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > release-output/dependencies.txt
          gradle --no-daemon --refresh-dependencies :app:clean :app:assembleRelease --stacktrace 2>&1 | tee release-output/gradle-build.log

      - name: Sign, verify and publish APK files
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="android-app/release-output"
          UNSIGNED_COPY="$OUTPUT/Polytechnic-Study-Hub-release-unsigned.apk"
          SIGNED_APK="downloads/$APK_NAME"
          mkdir -p "$OUTPUT" downloads
          test -f "$APK"
          cp "$APK" "$UNSIGNED_COPY"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"

          KEYSTORE="$OUTPUT/release.keystore"
          test -n "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" || { echo "Missing signing keystore"; exit 1; }
          test -n "${ANDROID_SIGNING_STORE_PASSWORD:-}" || { echo "Missing store password"; exit 1; }
          test -n "${ANDROID_SIGNING_KEY_ALIAS:-}" || { echo "Missing key alias"; exit 1; }
          test -n "${ANDROID_SIGNING_KEY_PASSWORD:-}" || { echo "Missing key password"; exit 1; }
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          STORE_PASS="${ANDROID_SIGNING_STORE_PASSWORD}"
          KEY_ALIAS="${ANDROID_SIGNING_KEY_ALIAS}"
          KEY_PASS="${ANDROID_SIGNING_KEY_PASSWORD}"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_COPY" "$OUTPUT/app-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$OUTPUT/app-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          sha256sum "$SIGNED_APK" > "$OUTPUT/$APK_NAME.sha256.txt"

      - name: Verify release metadata
        run: |
          set -euo pipefail
          APK="downloads/$APK_NAME"
          OUTPUT="android-app/release-output"
          REPORT="$OUTPUT/androidx-version-metadata.txt"
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          fi
          test -n "$APKANALYZER"
          test "$($APKANALYZER manifest debuggable "$APK" | tr -d '\r\n')" = "false"
          python - "$APK" "$REPORT" <<'PY'
          import re, sys, zipfile
          apk, report = sys.argv[1:3]
          entries, malformed = [], []
          with zipfile.ZipFile(apk) as archive:
              for name in archive.namelist():
                  if re.fullmatch(r"META-INF/androidx\..+\.version", name):
                      value = archive.read(name).decode("utf-8", "replace").strip()
                      entries.append(f"{name}: {value}")
                      if value and not re.fullmatch(r"\d+(?:\.\d+){1,3}(?:[-+][A-Za-z0-9._-]+)?", value):
                          malformed.append(f"{name}: {value}")
          with open(report, "w", encoding="utf-8") as handle:
              handle.write("\n".join(entries) + ("\n" if entries else ""))
          if malformed:
              raise SystemExit("Malformed AndroidX version metadata:\n" + "\n".join(malformed))
          PY

      - name: Update app-update.json
        run: |
          python - <<'PY'
          import hashlib, json, os
          apk = f"downloads/{os.environ['APK_NAME']}"
          digest = hashlib.sha256(open(apk, "rb").read()).hexdigest()
          data = {
            "schemaVersion": 1,
            "versionCode": int(os.environ["APP_VERSION_CODE"]),
            "versionName": os.environ["APP_VERSION_NAME"],
            "apkUrl": f"/downloads/{os.environ['APK_NAME']}",
            "sha256": digest,
            "publishedAt": "2026-06-20",
            "forceUpdate": False,
            "title": "Polytechnic Study Hub Android app 1.0.5",
            "message": "Updated Android app hides duplicate website headers inside the native shell, including the Mock Exams tab.",
            "releaseNotes": [
              "Removed duplicate website header/menu inside the Android WebView.",
              "Mock Exams now uses only the native app top bar and left-side drawer.",
              "Kept live website content and secure trusted downloads."
            ]
          }
          with open("downloads/app-update.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PY

      - name: Commit APK and manifest to website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/$APK_NAME" downloads/app-update.json
          if git diff --cached --quiet; then
            echo "No APK or manifest changes to commit."
          else
            git commit -m "Publish Android app v$APP_VERSION_NAME"
            git push
          fi

      - name: Upload validation bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polytechnic-study-hub-android-v1.0.5
          path: |
            android-app/release-output/
            downloads/Polytechnic-Study-Hub-v1.0.5.apk
          if-no-files-found: error
          retention-days: 14
