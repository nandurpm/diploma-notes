name: Build Android App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish signed release APK to downloads and update app-update.json"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

concurrency:
  group: poly-pmna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLY_PMNA_v3.0_debug_apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate release signing secrets
        run: |
          missing=""
          [ -z "${ANDROID_KEYSTORE_BASE64}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${ANDROID_KEY_ALIAS}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required GitHub Actions secrets:$missing"
            echo "Add them in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode release keystore
        run: |
          set -e
          printf "%s" "${ANDROID_KEYSTORE_BASE64}" \
            | sed '/-----BEGIN/d;/-----END/d' \
            | tr -d '\n\r ' \
            | base64 --decode > android-app/release.keystore
          test -s android-app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: |
          gradle -p android-app :app:assembleRelease --no-daemon \
            -PANDROID_KEYSTORE_FILE="$PWD/android-app/release.keystore" \
            -PANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" \
            -PANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
            -PANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK and metadata
        run: |
          set -e
          mkdir -p downloads
          APK_SOURCE=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "${APK_SOURCE}" ]; then
            echo "No release APK found."
            find android-app/app/build/outputs/apk/release -maxdepth 2 -type f -print || true
            exit 1
          fi
          cp "${APK_SOURCE}" downloads/POLY_PMNA_v3.0.apk
          SHA256=$(sha256sum downloads/POLY_PMNA_v3.0.apk | awk '{print $1}')
          cat > downloads/app-update.json <<JSON
          {
            "schemaVersion": 1,
            "versionCode": 9,
            "versionName": "3.0",
            "apkUrl": "/downloads/POLY_PMNA_v3.0.apk",
            "sha256": "${SHA256}",
            "publishedAt": "2026-07-16",
            "forceUpdate": false,
            "title": "POLY PMNA Android app 3.0",
            "message": "Major update adds Revision 2026 navigation and fully separates 2026 lessons and notes from Revision 2021.",
            "releaseNotes": [
              "Added Revision 2026 as a separate native drawer destination.",
              "Added dedicated Revision 2026 lesson and notes folder support.",
              "Prevented Revision 2026 subject codes from opening Revision 2021 content.",
              "Improved department and lesson deep-link highlighting.",
              "Updated WebView cache and trusted Revision 2026 PDF download handling."
            ]
          }
          JSON

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLY_PMNA_v3.0_signed_apk
          path: downloads/POLY_PMNA_v3.0.apk
          if-no-files-found: error

      - name: Publish APK and update metadata
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/POLY_PMNA_v3.0.apk downloads/app-update.json
          if git diff --cached --quiet; then
            echo "No APK or metadata changes to publish."
            exit 0
          fi
          git commit -m "Publish Android app v3.0"
          git pull --rebase origin main
          git push origin HEAD:main
