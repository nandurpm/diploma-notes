name: Build and publish Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

concurrency:
  group: poly-pmna-android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure Firebase Android app
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "FIREBASE_GOOGLE_SERVICES_JSON is required to build the notification-enabled APK." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          python -m json.tool android-app/app/google-services.json >/dev/null
          grep -q 'org.diplomanotes.polytechnicstudyhub' android-app/app/google-services.json

      - name: Read app version
        run: |
          VERSION_CODE=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]\+\([0-9][0-9]*\).*$/\1/p" android-app/app/build.gradle | head -n 1)
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]\+'\([^']*\)'.*$/\1/p" android-app/app/build.gradle | head -n 1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=POLY_PMNA_v$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLY_PMNA_v${{ env.VERSION_NAME }}_debug_apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Validate release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android-app/release.keystore
          test -s android-app/release.keystore
          keytool -list -keystore android-app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android-app :app:assembleRelease --no-daemon \
            -PANDROID_KEYSTORE_FILE="$PWD/android-app/release.keystore" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Prepare signed release
        run: |
          set -e
          mkdir -p release-output reports downloads
          RELEASE_APK=$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" "release-output/$APK_NAME"
          RELEASE_SHA=$(sha256sum "release-output/$APK_NAME" | awk '{print $1}')
          RELEASE_BYTES=$(stat -c '%s' "release-output/$APK_NAME")
          DEBUG_SHA=$(sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
          DEBUG_BYTES=$(stat -c '%s' android-app/app/build/outputs/apk/debug/app-debug.apk)
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_BYTES=$RELEASE_BYTES" >> "$GITHUB_ENV"
          echo "DEBUG_SHA=$DEBUG_SHA" >> "$GITHUB_ENV"
          echo "DEBUG_BYTES=$DEBUG_BYTES" >> "$GITHUB_ENV"

      - name: Publish signed APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "release-output/$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "release-output/$APK_NAME" \
              --title "POLY PMNA Android $VERSION_NAME" \
              --notes "Signed POLY PMNA Android release with automatic new-lesson push notifications, Revision 2026, Revision 2021, Ask POLY AI, mock exams and tools."
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLY_PMNA_v${{ env.VERSION_NAME }}_signed_apk
          path: release-output/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Update website manifest and build reports
        run: |
          set -e
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > downloads/app-update.json <<JSON
          {
            "schemaVersion": 1,
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "sha256": "${RELEASE_SHA}",
            "publishedAt": "${PUBLISHED_AT}",
            "forceUpdate": true,
            "title": "POLY PMNA Android app ${VERSION_NAME}",
            "message": "Install this update to receive automatic notifications when new lessons are published.",
            "releaseNotes": [
              "New lesson push notifications through Firebase Cloud Messaging.",
              "Notification taps open the exact Revision 2021 or Revision 2026 lesson.",
              "Android 13 and newer notification permission support.",
              "Revision 2026 and Revision 2021 remain separate content destinations."
            ]
          }
          JSON
          cat > reports/android-v3-build-status.json <<JSON
          {
            "applicationId": "org.diplomanotes.polytechnicstudyhub",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "firebaseMessaging": true,
            "status": "success",
            "debugApkBytes": ${DEBUG_BYTES},
            "debugSha256": "${DEBUG_SHA}",
            "releaseApkBytes": ${RELEASE_BYTES},
            "releaseSha256": "${RELEASE_SHA}",
            "builtAt": "${PUBLISHED_AT}"
          }
          JSON
          cat > reports/android-v3-publication.json <<JSON
          {
            "status": "success",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "firebaseMessaging": true,
            "apkUrl": "${APK_URL}",
            "apkBytes": ${RELEASE_BYTES},
            "sha256": "${RELEASE_SHA}",
            "publishedAt": "${PUBLISHED_AT}"
          }
          JSON

      - name: Commit website update metadata
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/app-update.json reports/android-v3-build-status.json reports/android-v3-publication.json
          if git diff --cached --quiet; then
            echo "Android release metadata is already current."
            exit 0
          fi
          git commit -m "Publish Android app v${VERSION_NAME} metadata [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
