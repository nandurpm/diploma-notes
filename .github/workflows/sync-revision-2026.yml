name: Sync and build Revision 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * 1,4'
  push:
    paths:
      - 'tools/sync_revision_2026.py'
      - 'tools/build_revision_2026_pages.py'
      - '.github/workflows/sync-revision-2026.yml'

permissions:
  contents: write

concurrency:
  group: sync-revision-2026
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate scripts
        run: python -m py_compile tools/sync_revision_2026.py tools/build_revision_2026_pages.py
      - name: Download official programme tables
        run: python tools/sync_revision_2026.py
      - name: Build static Semester 1-6 pages
        run: python tools/build_revision_2026_pages.py
      - name: Commit verified data and static pages
        run: |
          git add assets/data/revision-2026-programmes.json assets/data/revision-2026-subjects.json
          git add revision-2026.html revision-2026/*.html reports/revision-2026-build-summary.json
          if git diff --cached --quiet; then
            echo 'No verified data or page change.'
            exit 0
          fi
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Sync and build official SITTTR Revision 2026 pages'
          git push
