name: Sync and build Revision 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * 1,4'
  push:
    paths:
      - 'tools/sync_revision_2026.py'
      - 'tools/build_revision_2026_pages.py'
      - 'tools/enhance_revision_2026_model_qp.py'
      - 'tools/apply_revision_2026_department_themes.py'
      - 'assets/css/revision-2026-department-themes.css'
      - '.github/workflows/sync-revision-2026.yml'

permissions:
  contents: write

concurrency:
  group: sync-revision-2026
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate scripts
        run: python -m py_compile tools/sync_revision_2026.py tools/build_revision_2026_pages.py tools/enhance_revision_2026_model_qp.py tools/apply_revision_2026_department_themes.py
      - name: Download official programme tables
        run: python tools/sync_revision_2026.py
      - name: Build static Semester 1-6 pages and comparison report
        run: python tools/build_revision_2026_pages.py
      - name: Apply department-specific directory themes
        run: python tools/apply_revision_2026_department_themes.py
      - name: Verify all official programme cards have semantic themes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('assets/data/revision-2026-programmes.json').read_text(encoding='utf-8'))
          css = Path('assets/css/revision-2026-department-themes.css').read_text(encoding='utf-8')
          page = Path('revision-2026.html').read_text(encoding='utf-8')
          codes = [str(item['officialCode']) for item in registry['programmes']]
          missing = [code for code in codes if f'data-official-code="{code}"' not in css]
          assert len(codes) == 38, f'Expected 38 programmes, found {len(codes)}'
          assert not missing, f'Missing card themes: {missing}'
          assert 'revision-2026-department-themes.css' in page
          assert page.count('data-programme-card') == 38
          print('All 38 Revision 2026 department cards have semantic themes.')
          PY
      - name: Add permanent model-question-paper links
        run: python tools/enhance_revision_2026_model_qp.py
      - name: Commit verified data, pages and reports
        run: |
          git add assets/data/revision-2026-programmes.json assets/data/revision-2026-subjects.json
          git add revision-2026.html revision-2026/*.html
          git add reports/revision-2026-build-summary.json
          git add reports/revision-2026-new-codes-vs-2021.json reports/revision-2026-new-codes-vs-2021.md
          if git diff --cached --quiet; then
            echo 'No verified data or page change.'
            exit 0
          fi
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Sync REV2026 subjects, themes and sample question papers'
          git push
