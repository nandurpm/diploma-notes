name: Sync Revision 2026 subjects

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * 1,4'
  push:
    paths:
      - 'tools/sync_revision_2026.py'
      - '.github/workflows/sync-revision-2026.yml'

permissions:
  contents: write

concurrency:
  group: sync-revision-2026
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tools/sync_revision_2026.py
      - name: Commit verified subject data
        run: |
          if git diff --quiet -- assets/data/revision-2026-subjects.json; then
            echo 'No verified data change.'
            exit 0
          fi
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/data/revision-2026-subjects.json
          git commit -m 'Sync official SITTTR Revision 2026 subjects'
          git push
