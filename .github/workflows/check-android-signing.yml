name: Check Android release signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-android-signing.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record signing-secret availability
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p reports
          has_store=false; [ -n "$ANDROID_KEYSTORE_BASE64" ] && has_store=true
          has_store_password=false; [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && has_store_password=true
          has_alias=false; [ -n "$ANDROID_KEY_ALIAS" ] && has_alias=true
          has_key_password=false; [ -n "$ANDROID_KEY_PASSWORD" ] && has_key_password=true
          ready=false
          if $has_store && $has_store_password && $has_alias && $has_key_password; then ready=true; fi
          cat > reports/android-signing-secrets-status.json <<JSON
          {
            "ANDROID_KEYSTORE_BASE64": ${has_store},
            "ANDROID_KEYSTORE_PASSWORD": ${has_store_password},
            "ANDROID_KEY_ALIAS": ${has_alias},
            "ANDROID_KEY_PASSWORD": ${has_key_password},
            "readyForSignedRelease": ${ready},
            "checkedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON

      - name: Commit signing status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/android-signing-secrets-status.json
          git commit -m "Record Android signing configuration status [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
