name: Fix REV2026 Course 1002 and 1041 mobile content

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_rev2026_1002_1041_mobile_content.py'
      - '.github/workflows/fix-rev2026-1002-1041-mobile-content.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-rev2026-1002-1041-mobile-content
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repair script
        run: python -m py_compile tools/fix_rev2026_1002_1041_mobile_content.py
      - name: Repair Courses 1002 and 1041
        run: python tools/fix_rev2026_1002_1041_mobile_content.py
      - name: Validate final handbook markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p1002 = Path('revision-2026-content/lessons/lessons-1002.html').read_text(encoding='utf-8')
          p1041 = Path('revision-2026-content/lessons/lessons-1041.html').read_text(encoding='utf-8')
          checks = {
              '1002': [
                  '<meta name="course-code" content="1002">',
                  '1002-mobile-content-only-v2',
                  ':root{--top:0px;--sidebar:0px}',
                  '.topbar,.sidebar,.nav-arrows',
                  '.shell{display:block!important',
              ],
              '1041': [
                  '<meta name="course-code" content="1041">',
                  '1041-bilingual-visual-upgrade-v2',
                  '.lesson-header,.chapter-nav,.module-tabs,.control-deck,.nav-arrows',
                  'Malayalam explanation:',
                  'class="concept-viz"',
                  'IntersectionObserver',
              ],
          }
          for code, required in checks.items():
              text = p1002 if code == '1002' else p1041
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f'{code} validation failed: {missing}')
          if 'id="nativeHandbookMenu"' in p1041:
              raise SystemExit('Old Course 1041 floating chapter control returned')
          print('REV2026 Course 1002 and 1041 validation passed.')
          PY
      - name: Commit repairs and remove one-time runner
        run: |
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add revision-2026-content/lessons/lessons-1002.html revision-2026-content/lessons/lessons-1041.html
          git rm tools/fix_rev2026_1002_1041_mobile_content.py .github/workflows/fix-rev2026-1002-1041-mobile-content.yml
          git commit -m 'Fix REV2026 Course 1002 spacing and upgrade Course 1041'
          git push
