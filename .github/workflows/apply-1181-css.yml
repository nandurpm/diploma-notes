name: Apply Course 1181 CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-css:
    if: github.event.head_commit.message != 'Apply Course 1181 CSS to lesson'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dedicated stylesheet link
        shell: python
        run: |
          from pathlib import Path

          path = Path('revision-2026-content/lessons/lessons-1181.html')
          text = path.read_text(encoding='utf-8')
          marker = '<link id="poly-lesson-page-fix" rel="stylesheet" href="/assets/css/lesson-page-fix.css?v=20260718-fullscreen4">'
          addition = '<link rel="stylesheet" href="/assets/css/lesson-1181.css?v=20260729">'

          if addition not in text:
              if marker not in text:
                  raise SystemExit('Expected stylesheet marker not found; refusing to modify the lesson.')
              text = text.replace(marker, marker + '\n    ' + addition, 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Dedicated stylesheet link already present; no lesson content changed.')

      - name: Commit only stylesheet link
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision-2026-content/lessons/lessons-1181.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Apply Course 1181 CSS to lesson"
          git push