name: Post-deploy verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build-info.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production build info
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import urlopen

          expected = json.loads(Path("build-info.json").read_text(encoding="utf-8"))
          url = "https://polypmna.dpdns.org/build-info.json"
          last_error = None

          for _ in range(12):
              try:
                  with urlopen(url, timeout=15) as response:
                      production = json.loads(response.read().decode("utf-8"))

                  if production == expected:
                      print("Production build-info.json matches the tracked file.")
                      raise SystemExit(0)

                  last_error = (
                      f"production build info {production!r} did not match "
                      f"tracked build info {expected!r}"
                  )
              except Exception as exc:
                  last_error = str(exc)

              time.sleep(20)

          raise SystemExit(f"Deployment verification failed: {last_error}")
          PY
