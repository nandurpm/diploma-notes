name: Post-deploy verification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production files
        run: |
          python - <<'PY'
          import hashlib
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://polypmna.dpdns.org"
          files = ["index.html", "daily-quiz.html", "assets/js/main.js",
                   "assets/js/quiz-init.js", "sitemap.xml", "build-info.json"]
          last_error = None

          for attempt in range(18):
              try:
                  mismatches = []
                  for name in files:
                      expected = Path(name).read_bytes()
                      request = Request(f"{base}/{name}?deploy_verify={attempt}", headers={
                          "Cache-Control": "no-cache", "User-Agent": "POLY-PMNA-deploy-verifier"})
                      with urlopen(request, timeout=20) as response:
                          actual = response.read()
                      if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
                          mismatches.append(name)
                  if not mismatches:
                      print("Production core files match this commit.")
                      raise SystemExit(0)
                  last_error = f"stale production files: {', '.join(mismatches)}"
              except Exception as exc:
                  last_error = str(exc)

              time.sleep(20)

          raise SystemExit(f"Deployment verification failed: {last_error}")
          PY
