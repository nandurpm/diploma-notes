name: Production deployment diagnostic push

on:
  push:
    branches: [main]
    paths:
      - ".github/deploy-production-trigger.txt"
      - "tools/deploy_production_diagnostic.py"
      - ".github/workflows/deploy-production-diagnostic-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deployment-diagnostic-push
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DOMAIN: polypmna.dpdns.org
      DEPLOY_DIAGNOSTIC_REPORT: /tmp/deploy-diagnostic.md
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run safe production deployment diagnostic
        id: diagnostic
        continue-on-error: true
        run: python tools/deploy_production_diagnostic.py

      - name: Publish result as GitHub issue
        if: always()
        shell: bash
        run: |
          status="failed"
          [ "${{ steps.diagnostic.outcome }}" = "success" ] && status="passed"
          title="[production deployment] ${status} ${GITHUB_SHA:0:7}"
          if [ ! -f "$DEPLOY_DIAGNOSTIC_REPORT" ]; then
            printf '# Production deployment diagnostic: failed\n\nNo diagnostic report was produced.\n' > "$DEPLOY_DIAGNOSTIC_REPORT"
          fi
          {
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$DEPLOY_DIAGNOSTIC_REPORT"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$DEPLOY_DIAGNOSTIC_REPORT"

      - name: Fail job when deployment diagnostic failed
        if: always()
        run: test "${{ steps.diagnostic.outcome }}" = "success"
