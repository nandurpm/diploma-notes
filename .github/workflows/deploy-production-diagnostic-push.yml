name: Cloudflare Pages mirror diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deployment-diagnostic-push
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DOMAIN: diploma-notes.pages.dev
      CLOUDFLARE_PAGES_PROJECT: diploma-notes
      DEPLOY_DIAGNOSTIC_REPORT: /tmp/deploy-diagnostic.md
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run safe production deployment diagnostic
        id: diagnostic
        continue-on-error: true
        run: python tools/deploy_production_diagnostic.py

      - name: Publish result as GitHub issue
        if: ${{ !cancelled() && steps.diagnostic.outcome != 'cancelled' }}
        shell: bash
        run: |
          status="failed"
          [ "${{ steps.diagnostic.outcome }}" = "success" ] && status="passed"
          title="[Cloudflare Pages mirror] failed"
          if [ ! -f "$DEPLOY_DIAGNOSTIC_REPORT" ]; then
            printf '# Production deployment diagnostic: failed\n\nNo diagnostic report was produced.\n' > "$DEPLOY_DIAGNOSTIC_REPORT"
          fi
          {
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$DEPLOY_DIAGNOSTIC_REPORT"
          cat "$DEPLOY_DIAGNOSTIC_REPORT" >> "$GITHUB_STEP_SUMMARY"
          python tools/report_diagnostic_issue.py --status "$status" --title "$title" --report "$DEPLOY_DIAGNOSTIC_REPORT"

      - name: Fail job when deployment diagnostic failed
        if: ${{ !cancelled() && steps.diagnostic.outcome != 'cancelled' }}
        run: test "${{ steps.diagnostic.outcome }}" = "success"
