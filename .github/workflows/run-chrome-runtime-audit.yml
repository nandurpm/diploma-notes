name: Run Chrome runtime audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-chrome-runtime-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Audit sitemap pages in headless Chrome
        run: python tools/chrome_runtime_audit.py || true
      - name: Save runtime report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-integrity-audit.json reports/site-integrity-audit.md
          git commit -m "Record Chrome runtime audit results"
          git push
