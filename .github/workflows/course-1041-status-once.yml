name: Monitor Course 1041 recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-status-once.yml"

permissions:
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest publication run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh run list --repo nandurpm/diploma-notes --workflow run-course-1041-on-issue.yml --limit 3 --json databaseId,status,conclusion,headSha,displayTitle,event,createdAt,url)"
          gh issue comment 38 --repo nandurpm/diploma-notes --body "Course 1041 latest recovery status:

\`\`\`json
${status}
\`\`\`"
