name: Monitor Course 1041 recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-status-once.yml"

permissions:
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Wait and report latest publication run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          status="$(gh run list --repo nandurpm/diploma-notes --workflow run-course-1041-on-issue.yml --limit 2 --json databaseId,status,conclusion,headSha,displayTitle,event,createdAt,url)"
          body="$(printf 'Course 1041 recovery run status:\n\n```json\n%s\n```' "$status")"
          gh api --method PATCH repos/nandurpm/diploma-notes/issues/comments/4992023119 -f body="$body"
