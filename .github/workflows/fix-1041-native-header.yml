name: Fix Course 1041 native header

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_1041_native_header.py'
      - '.github/workflows/fix-1041-native-header.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-course-1041-native-header
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repair script
        run: python -m py_compile tools/fix_1041_native_header.py
      - name: Repair Course 1041 app layout
        run: python tools/fix_1041_native_header.py
      - name: Validate native and browser behavior markers
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('revision-2026-content/lessons/lessons-1041.html').read_text(encoding='utf-8')
          required = [
              '<meta name="revision" content="REV2026">',
              '<meta name="course-code" content="1041">',
              '1041-native-app-header-fix-v1',
              'html.polytechnic-native-app .lesson-header{display:none!important',
              'id="nativeHandbookMenu"',
              'aria-controls="chapterNav"',
              'originalButton.click()',
              '.lesson-header{position:fixed',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing expected Course 1041 repairs: {missing}')
          print('Course 1041 native-app and browser guards passed.')
          PY
      - name: Commit repair and remove one-time runner
        run: |
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add revision-2026-content/lessons/lessons-1041.html
          git rm tools/fix_1041_native_header.py .github/workflows/fix-1041-native-header.yml
          git commit -m 'Fix Course 1041 duplicate header in Android app'
          git push
