name: Daily GitHub Actions status monitor

on:
  schedule:
    # Daily at 04:15 UTC (09:45 IST).
    - cron: "15 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-actions-status-monitor.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-actions-status-monitor-main
  cancel-in-progress: true

jobs:
  collect-status:
    name: Collect workflow status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_WORKFLOW: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          current_workflow = os.environ["CURRENT_WORKFLOW"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "POLY-PMNA-Actions-Monitor/2.0",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          latest_by_workflow = {}
          for run in data.get("workflow_runs", []):
              if run.get("id") == current_run_id or run.get("name") == current_workflow:
                  continue
              raw = run.get("created_at")
              if not raw:
                  continue
              created = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if created < cutoff:
                  continue
              name = run.get("name") or "Unnamed workflow"
              # GitHub returns newest runs first. Keep only the newest run for each workflow
              # so a recovered workflow does not keep the daily monitor red for 24 hours.
              if name in latest_by_workflow:
                  continue
              latest_by_workflow[name] = {
                  "workflow": name,
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "branch": run.get("head_branch"),
                  "sha": run.get("head_sha", "")[:12],
                  "created_at": raw,
                  "html_url": run.get("html_url"),
              }

          recent = sorted(latest_by_workflow.values(), key=lambda item: item["workflow"].casefold())
          report = {
              "repository": repo,
              "collected_at": datetime.now(timezone.utc).isoformat(),
              "lookback_hours": 24,
              "policy": "latest run per workflow on main; monitor excludes itself",
              "runs": recent,
          }
          with open("reports/daily-actions-status.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)

          lines = [
              "# Daily GitHub Actions status",
              "",
              f"Repository: `{repo}`",
              f"Collected at: `{report['collected_at']}`",
              "",
              "Only the newest run per workflow on `main` is evaluated; this monitor excludes itself.",
              "",
              "| Workflow | Status | Conclusion | Branch | Created | Run |",
              "|---|---|---|---|---|---|",
          ]
          for run in recent:
              link = f"[open]({run['html_url']})" if run.get("html_url") else "-"
              lines.append(f"| {run['workflow']} | {run['status']} | {run['conclusion'] or '-'} | {run['branch']} | {run['created_at']} | {link} |")
          if not recent:
              lines.append("| No runs in the last 24 hours | - | - | - | - | - |")
          with open("reports/daily-actions-status.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cat reports/daily-actions-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a current workflow is unhealthy
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))' reports/daily-actions-status.json >/dev/null; then
            echo "One or more workflows currently have a failing latest run on main."
            exit 1
          fi
          echo "No workflow has a failing latest run on main."

      - name: Upload daily status report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-actions-status-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
