name: Daily GitHub Actions status monitor

on:
  schedule:
    # Daily at 04:15 UTC (09:45 IST).
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-actions-status-monitor-main
  cancel-in-progress: true

jobs:
  collect-status:
    name: Collect workflow status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          recent = []
          for run in data.get("workflow_runs", []):
              raw = run.get("created_at")
              if not raw:
                  continue
              created = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if created >= cutoff:
                  recent.append({
                      "workflow": run.get("name"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "branch": run.get("head_branch"),
                      "sha": run.get("head_sha", "")[:12],
                      "created_at": raw,
                      "html_url": run.get("html_url"),
                  })

          report = {
              "repository": repo,
              "collected_at": datetime.now(timezone.utc).isoformat(),
              "lookback_hours": 24,
              "runs": recent,
          }
          with open("reports/daily-actions-status.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)

          lines = [
              "# Daily GitHub Actions status",
              "",
              f"Repository: `{repo}`",
              f"Collected at: `{report['collected_at']}`",
              "",
              "| Workflow | Status | Conclusion | Branch | Created | Run |",
              "|---|---|---|---|---|---|",
          ]
          for run in recent:
              link = f"[open]({run['html_url']})" if run.get("html_url") else "-"
              lines.append(f"| {run['workflow']} | {run['status']} | {run['conclusion'] or '-'} | {run['branch']} | {run['created_at']} | {link} |")
          if not recent:
              lines.append("| No runs in the last 24 hours | - | - | - | - | - |")
          with open("reports/daily-actions-status.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cat reports/daily-actions-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a recent workflow failed
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))' reports/daily-actions-status.json >/dev/null; then
            echo "One or more GitHub Actions runs failed, timed out, or were cancelled during the last 24 hours."
            exit 1
          fi
          echo "No failed, timed-out, or cancelled workflow runs found in the last 24 hours."

      - name: Upload daily status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-actions-status-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
