name: Daily Good Morning Notification

on:
  workflow_dispatch:
  schedule:
    # 07:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Install FCM dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Send Good Morning notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from datetime import date
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              raise SystemExit("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is empty or unavailable.")

          account = json.loads(raw)
          required = ["project_id", "client_email", "private_key"]
          missing = [key for key in required if not account.get(key)]
          if missing:
              raise SystemExit(f"ERROR: Firebase service account JSON is missing: {', '.join(missing)}")

          credentials = service_account.Credentials.from_service_account_info(
              account,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"],
          )
          credentials.refresh(Request())

          quotes = [
              "Success is the sum of small efforts, repeated day in and day out.",
              "The secret of getting ahead is getting started.",
              "Great things are done by a series of small things brought together.",
              "Learn something new today. Small progress is still progress.",
              "Discipline turns plans into results.",
              "Your future is created by what you do today, not tomorrow.",
              "Stay curious, keep learning, and keep moving forward.",
              "A little progress each day adds up to big results.",
              "Focus on the work in front of you and let progress follow.",
              "Every expert was once a beginner who kept going.",
              "Do the work today that your future self will thank you for.",
              "Consistency is more powerful than occasional intensity.",
              "Start where you are. Use what you have. Do what you can.",
              "Keep learning. Keep building. Keep improving.",
          ]

          # Deterministic daily rotation: the same quote is sent only once per day.
          quote = quotes[date.today().toordinal() % len(quotes)]

          payload = {
              "message": {
                  "topic": "all-users",
                  "notification": {
                      "title": "🌅 Good Morning – POLY PMNA",
                      "body": f"{quote} Have a great day!"
                  },
                  "data": {
                      "contentType": "daily-good-morning",
                      "date": date.today().isoformat()
                  },
                  "android": {
                      "priority": "HIGH",
                      "ttl": "86400s"
                  }
              }
          }

          endpoint = f"https://fcm.googleapis.com/v1/projects/{account['project_id']}/messages:send"
          response = requests.post(
              endpoint,
              headers={
                  "Authorization": f"Bearer {credentials.token}",
                  "Content-Type": "application/json; charset=UTF-8",
              },
              json=payload,
              timeout=30,
          )

          print(f"FCM HTTP status: {response.status_code}")
          if not response.ok:
              print(response.text)
              raise SystemExit(1)

          print("SUCCESS: Daily Good Morning notification accepted by FCM.")
          print(response.text)
          PY
