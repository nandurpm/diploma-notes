name: Refresh department artwork assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-department-art.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update department artwork cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('revision-2021.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'department-card-art.css?v=20260614-department-art1',
              'department-card-art.css?v=20260614-department-art2'
          )
          text = text.replace(
              'department-card-art.js?v=20260614-department-art1',
              'department-card-art.js?v=20260614-department-art2'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/refresh-department-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh animated department artwork assets"
          git push origin main
