name: Materialize Revision 2021 subject pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/js/subjects.js"
      - "assets/js/subject-browser.js"
      - "assets/js/document-resolution.js"
      - "assets/data/sitttr-pdf-links.json"
      - "assets/data/revision-2021-subjects.json"
      - "lessons/**"
      - "notes/**"
      - "tools/materialize_rev2021_subjects.py"
      - "tools/normalize_rev2021_noscript.py"
      - ".github/workflows/materialize-rev2021-subjects.yml"

permissions:
  contents: write

concurrency:
  group: materialize-rev2021-subjects-main
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render and validate static department subject cards
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          {
            echo "Revision 2021 materialization diagnostic"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            python -m py_compile tools/normalize_rev2021_noscript.py tools/materialize_rev2021_subjects.py
            python tools/normalize_rev2021_noscript.py
            python tools/materialize_rev2021_subjects.py
            python - <<'PY'
import json
import re
from pathlib import Path

dataset = json.loads(Path("assets/data/revision-2021-subjects.json").read_text(encoding="utf-8"))
assert dataset.get("scheme") == "REV2021", dataset
assert len(dataset.get("subjects", [])) >= 2500, dataset.get("subjectCount")
assert len({row.get("department") for row in dataset.get("subjects", [])}) >= 44, "43 programmes plus common subjects"
pages = [path for path in Path("revision-2021").glob("*.html") if path.name != "department-view.html"]
assert len(pages) == 43, len(pages)
for path in pages:
    text = path.read_text(encoding="utf-8")
    assert len(re.findall(r"data-semester-section=", text)) == 6, path
    assert re.search(r"<article\b[^>]*data-revision=[\"']2021[\"']", text), path
print(f"Validated REV2021 dataset={len(dataset['subjects'])} pages={len(pages)}")
PY
            python tools/generate_sitemap.py
            python tools/site_quality_gate.py
          } 2>&1 | tee reports/rev2021-materialization-diagnostic.txt
      - name: Commit deterministic page updates
        if: steps.render.outcome == 'success'
        run: |
          rm -f reports/rev2021-materialization-diagnostic.txt
          if git diff --quiet -- revision-2021 assets/data/revision-2021-subjects.json sitemap.xml; then
            echo "Revision 2021 department pages are already current."
            exit 0
          fi
          git config user.name "POLY PMNA Page Generator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision-2021 assets/data/revision-2021-subjects.json sitemap.xml
          git commit -m "Pre-render Revision 2021 subject cards"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish failure diagnostic
        if: steps.render.outcome != 'success'
        run: |
          git config user.name "POLY PMNA Page Generator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/rev2021-materialization-diagnostic.txt
          git commit -m "Record Revision 2021 materialization failure"
          git pull --rebase origin main
          git push origin HEAD:main
          exit 1
