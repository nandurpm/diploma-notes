name: Replace site brand symbol

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-site-brand-symbol.yml

permissions:
  contents: write

jobs:
  replace-symbol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Use the books symbol on every standard public page
        run: |
          python - <<'PY'
          from pathlib import Path

          old_variants = (
              '<span aria-hidden="true">⚙</span><strong>Polytechnic Study Hub</strong>',
              '<span class="brand-symbol" aria-hidden="true">⚙</span><strong>Polytechnic Study Hub</strong>',
              '<span>DN</span><strong>Diploma Notes</strong>',
          )
          new = '<span class="brand-symbol" aria-hidden="true">📚</span><strong>Polytechnic Study Hub</strong>'

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '<a class="brand"' not in text:
                  continue
              original = text
              for old in old_variants:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No standard brand symbols were found to replace.')

          print(f'Replaced the brand symbol on {len(changed)} pages.')
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/replace-site-brand-symbol.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use books icon for Polytechnic Study Hub branding"
          git push origin main
