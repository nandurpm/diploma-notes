name: Enable department card artwork

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-department-card-art.yml

permissions:
  contents: write

jobs:
  enable-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Load adaptive department card artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('revision-2021.html')
          html = path.read_text(encoding='utf-8')

          css = '  <link rel="stylesheet" href="/assets/css/department-card-art.css?v=20260614-department-art1">\n'
          if 'department-card-art.css' not in html:
              marker = '  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260614-marquee3">\n'
              if marker not in html:
                  raise SystemExit('Responsive stylesheet marker not found')
              html = html.replace(marker, marker + css, 1)

          script = '  <script src="/assets/js/department-card-art.js?v=20260614-department-art1" defer></script>\n'
          if 'department-card-art.js' not in html:
              marker = '  <script src="/assets/js/site-hardening.js?v=20260612-1" defer></script>\n'
              if marker not in html:
                  raise SystemExit('Site hardening script marker not found')
              html = html.replace(marker, marker + script, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/enable-department-card-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show adaptive artwork on every department card"
          git push origin main
