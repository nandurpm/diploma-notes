name: Fix flush sticky topbar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-flush-sticky-topbar.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply site-wide topbar correction
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          style_path = root / 'assets/css/style.css'
          style = style_path.read_text(encoding='utf-8')
          pattern = re.compile(r'''\.topbar\s*\{\s*
            position:\s*sticky;\s*
            top:\s*12px;\s*
            z-index:\s*40;\s*
            width:\s*min\(var\(--page-width\),\s*calc\(100%\s*-\s*var\(--page-gutter\)\)\);\s*
            margin:\s*12px\s+auto\s+18px;''', re.X)
          replacement = '''.topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            max-width: none;
            margin: 0 0 18px;'''
          style, count = pattern.subn(replacement, style, count=1)
          if count != 1:
              raise SystemExit('Could not locate the desktop topbar block in style.css')
          style = style.replace('  border-radius: 28px;\n', '  border-radius: 0 0 28px 28px;\n', 1)
          style_path.write_text(style, encoding='utf-8')

          responsive_path = root / 'assets/css/responsive.css'
          responsive = responsive_path.read_text(encoding='utf-8')
          old_mobile = '.topbar { top: 6px; margin: 6px auto 10px; padding: 8px; border-radius: 18px; gap: 9px; }'
          new_mobile = '.topbar { top: 0; width: 100%; max-width: none; margin: 0 0 10px; padding: 8px; border-radius: 0 0 18px 18px; gap: 9px; }'
          if old_mobile not in responsive:
              raise SystemExit('Could not locate the mobile topbar override in responsive.css')
          responsive = responsive.replace(old_mobile, new_mobile, 1)
          responsive_path.write_text(responsive, encoding='utf-8')

          a11y_path = root / 'assets/css/site-navigation-a11y.css'
          a11y = a11y_path.read_text(encoding='utf-8').rstrip() + '\n'
          marker = '/* Flush sticky topbar: no empty area above the navigation. */'
          if marker not in a11y:
              a11y += '''
          /* Flush sticky topbar: no empty area above the navigation. */
          .topbar{
            position:sticky!important;
            top:0!important;
            z-index:1000!important;
            width:100%!important;
            max-width:none!important;
            margin:0 0 18px!important;
            border-top:0!important;
            border-radius:0 0 28px 28px!important;
          }
          @media(max-width:620px){
            .topbar{
              top:0!important;
              width:100%!important;
              max-width:none!important;
              margin:0 0 10px!important;
              border-radius:0 0 18px 18px!important;
            }
          }
          '''
          a11y_path.write_text(a11y, encoding='utf-8')

          changed_pages = 0
          for page in root.rglob('*.html'):
              if '.git' in page.parts or 'lessons' in page.parts:
                  continue
              text = page.read_text(encoding='utf-8')
              updated = re.sub(
                  r'/assets/css/style\.css(?:\?v=[^"\']*)?',
                  '/assets/css/style.css?v=20260614-flush-topbar1',
                  text,
              )
              updated = re.sub(
                  r'/assets/css/responsive\.css(?:\?v=[^"\']*)?',
                  '/assets/css/responsive.css?v=20260614-flush-topbar1',
                  updated,
              )
              updated = re.sub(
                  r'/assets/css/site-navigation-a11y\.css(?:\?v=[^"\']*)?',
                  '/assets/css/site-navigation-a11y.css?v=20260614-flush-topbar1',
                  updated,
              )
              if updated != text:
                  page.write_text(updated, encoding='utf-8')
                  changed_pages += 1

          revision = (root / 'revision-2021.html').read_text(encoding='utf-8')
          if 'site-navigation-a11y.css?v=20260614-flush-topbar1' not in revision:
              raise SystemExit('revision-2021.html did not receive the cache-busted topbar stylesheet')
          if 'top: 12px;' in style or 'margin: 12px auto 18px;' in style:
              raise SystemExit('Desktop topbar gap still exists')
          if old_mobile in responsive:
              raise SystemExit('Mobile topbar gap still exists')

          print(f'Updated common portal pages: {changed_pages}')

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-flush-sticky-topbar.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix navigation flush to top across portal pages"
          git push
