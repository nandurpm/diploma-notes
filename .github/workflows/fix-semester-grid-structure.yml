name: Fix semester grid structure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-semester-grid-structure.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair semester grouping renderer and layout
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          js_path = root / 'assets/js/subject-browser.js'
          js = js_path.read_text(encoding='utf-8')

          old_group = '''  function groupCards(subjects, renderer) {
            const counts = subjects.reduce((map, subject) => map.set(subject.semester, (map.get(subject.semester) || 0) + 1), new Map());
            let previous = "";
            return subjects.map((subject) => {
              const heading = subject.semester !== previous
                ? `<div class="semester-group-heading"><span>${escapeHtml(subject.semester)}</span><small>${counts.get(subject.semester)} subjects</small></div>`
                : "";
              previous = subject.semester;
              return heading + renderer(subject);
            }).join("");
          }
          '''

          new_group = '''  function groupCards(subjects, renderer) {
            const groups = new Map();
            subjects.forEach((subject) => {
              const semester = String(subject.semester || "Other subjects");
              if (!groups.has(semester)) groups.set(semester, []);
              groups.get(semester).push(subject);
            });

            return Array.from(groups.entries()).map(([semester, semesterSubjects], index) => {
              const headingId = `semester-group-heading-${index + 1}`;
              const count = semesterSubjects.length;
              return `
                <section class="semester-subject-section" aria-labelledby="${headingId}">
                  <div class="semester-group-heading">
                    <h3 id="${headingId}">${escapeHtml(semester)}</h3>
                    <span>${count} ${count === 1 ? "subject" : "subjects"}</span>
                  </div>
                  <div class="semester-card-grid">
                    ${semesterSubjects.map(renderer).join("")}
                  </div>
                </section>
              `;
            }).join("");
          }
          '''

          if old_group not in js:
              raise SystemExit('The expected broken groupCards implementation was not found.')
          js = js.replace(old_group, new_group, 1)

          old_controller = '''    const mode = grid.dataset.mode || "lessons";
            const fixedRevision = grid.dataset.revision || "";
          '''
          new_controller = '''    const mode = grid.dataset.mode || "lessons";
            const fixedRevision = grid.dataset.revision || "";
            grid.classList.add("semester-grouped");
          '''
          if old_controller not in js:
              raise SystemExit('Could not locate the subject browser controller setup.')
          js = js.replace(old_controller, new_controller, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = root / 'assets/css/site-navigation-a11y.css'
          css = css_path.read_text(encoding='utf-8').rstrip() + '\n'
          marker = '/* Correct full-width semester grouping for every subject browser. */'
          if marker not in css:
              css += '''

          /* Correct full-width semester grouping for every subject browser. */
          .subject-grid.semester-grouped{
            display:block!important;
            width:100%;
          }
          .semester-subject-section{
            display:block;
            width:100%;
            margin:0 0 24px;
          }
          .semester-group-heading{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            width:100%;
            min-height:58px;
            margin:0 0 14px;
            padding:13px 18px;
            border:1px solid rgba(29,78,216,.16);
            border-radius:18px;
            background:linear-gradient(135deg,rgba(219,234,254,.98),rgba(236,253,245,.98));
            box-shadow:0 10px 24px rgba(20,45,90,.07);
          }
          .semester-group-heading h3{
            margin:0;
            color:#0f3f8a;
            font-family:"Space Grotesk",Inter,sans-serif;
            font-size:clamp(1.12rem,1.7vw,1.5rem);
            font-weight:950;
            line-height:1.12;
            letter-spacing:-.025em;
          }
          .semester-group-heading span{
            flex:0 0 auto;
            padding:7px 11px;
            border-radius:999px;
            color:#047857;
            background:rgba(255,255,255,.94);
            font-size:.78rem;
            font-weight:900;
            white-space:nowrap;
          }
          .semester-card-grid{
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:18px;
            width:100%;
            align-items:stretch;
          }
          .semester-card-grid>.subject-card{
            min-width:0;
            height:100%;
          }
          @media(max-width:1300px){
            .semester-card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
          }
          @media(max-width:980px){
            .semester-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
          }
          @media(max-width:620px){
            .semester-subject-section{margin-bottom:18px}
            .semester-group-heading{min-height:50px;margin-bottom:10px;padding:10px 12px;border-radius:14px}
            .semester-group-heading h3{font-size:1.02rem}
            .semester-group-heading span{padding:6px 9px;font-size:.7rem}
            .semester-card-grid{grid-template-columns:1fr;gap:12px}
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          headers_path = root / '_headers'
          headers = headers_path.read_text(encoding='utf-8')
          cache_rule = '''
          /assets/js/subject-browser.js
            Cache-Control: public, max-age=0, must-revalidate
          '''
          if '/assets/js/subject-browser.js\n' not in headers:
              insertion = '''
          /assets/css/site-navigation-a11y.css
            Cache-Control: public, max-age=0, must-revalidate
          '''
              if insertion not in headers:
                  raise SystemExit('Could not locate the shared CSS cache rule in _headers.')
              headers = headers.replace(insertion, insertion + cache_rule, 1)
          headers_path.write_text(headers, encoding='utf-8')

          if '<div class="semester-group-heading">' in js and 'heading + renderer(subject)' in js:
              raise SystemExit('The broken direct-grid heading renderer still exists.')
          if '<section class="semester-subject-section"' not in js:
              raise SystemExit('The corrected semester section renderer was not added.')
          if '.semester-card-grid' not in css:
              raise SystemExit('The corrected nested card grid CSS was not added.')

      - name: Validate JavaScript syntax
        run: node --check assets/js/subject-browser.js

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-semester-grid-structure.yml

      - name: Commit the structural fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix semester grouping and remove subject grid gaps"
          git push
