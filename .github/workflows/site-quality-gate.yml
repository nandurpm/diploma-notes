name: Site quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install catalogue verifier dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Validate generated source state
        run: |
          python tools/generate_sitemap.py --check
          python tools/materialize_rev2021_subjects.py --check
          python tools/annotate_rev2026_title_provenance.py --check
          python tools/normalize_public_brand_assets.py --check
          python tools/inject_structured_data.py --check
          python tools/verify_revision_2026_catalogue.py
      - name: Run current site quality gate
        run: python tools/site_quality_gate.py
      - name: Validate critical JavaScript
        run: |
          for file in \
            assets/js/ask-poly-config.js \
            assets/js/ask-poly-v2.js \
            assets/js/mock-exam-service.js \
            assets/js/mock-exam-1004.js \
            workers/ask-poly-ai/src/index.js \
            workers/ask-poly-ai/src/secure-index.js \
            workers/ask-poly-ai/src/mock-evaluator.js \
            workers/ask-poly-ai/src/result-store.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
      - name: Prevent committed secrets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          allowed_public = {'assets/js/ask-poly-config.js', 'daily-quiz.html'}
          patterns = {
              'OpenAI key': re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}'),
              'Supabase service role': re.compile(r'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["\'][^$\n][^"\']+'),
              'Cloudflare token': re.compile(r'CLOUDFLARE_API_TOKEN\s*[:=]\s*["\'][^$\n][^"\']+'),
          }
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.stat().st_size > 2_000_000:
                  continue
              rel = path.as_posix()
              if rel in allowed_public:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      failures.append(f'{rel}: possible {label}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('No committed server secrets detected.')
          PY
