name: Apply final audit fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-final-audit-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the remaining corrections
        run: python automation/repair-audit-findings.py
      - name: Reapply shared public-page maintenance
        run: python tools/maintain_public_pages.py
      - name: Run the static integrity audit
        run: python tools/audit_site.py
      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Save corrected files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve final site integrity findings"
          git push
