name: Final site integrity pass

on:
  push:
    branches: [main]
    paths:
      - "automation/final-integrity.trigger"

permissions:
  contents: write

jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Repair audit findings
        run: python automation/repair-audit-findings.py
      - name: Reapply public page maintenance
        run: python tools/maintain_public_pages.py
      - name: Run static integrity audit
        run: python tools/audit_site.py
      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install browser audit dependency
        run: |
          mkdir -p /tmp/poly-browser-audit
          cd /tmp/poly-browser-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/tools/runtime_console_audit.cjs" .
      - name: Run browser console audit
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/poly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          cd /tmp/poly-browser-audit
          BASE_DIR="$GITHUB_WORKSPACE" BASE_URL="http://127.0.0.1:8000" node runtime_console_audit.cjs || true
      - name: Commit final verified state
        run: |
          rm -f automation/final-integrity.trigger
          rm -f automation/repair-audit-findings.py
          rm -f .github/workflows/final-integrity-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve final site integrity findings"
          git push
