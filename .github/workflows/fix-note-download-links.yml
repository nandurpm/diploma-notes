name: Fix note download links

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-note-download-links.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update note links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/js/subject-browser.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'const NOTES_CODES = new Set(["1003", "1004"]);',
              'const NOTES_CODES = new Set(LESSON_CODES);'
          )
          text = text.replace(
              'const notesLinkFor = (subject) => NOTES_CODES.has(String(subject.code))\n    ? `${rootPrefix()}notes/downloadable-notes-${encodeURIComponent(subject.code)}.pdf`\n    : lessonLinkFor(subject);',
              'const notesLinkFor = (subject) => `${rootPrefix()}notes/downloadable-notes-${encodeURIComponent(subject.code)}.pdf`;'
          )
          text = text.replace(
              'const notesDownload = NOTES_CODES.has(String(subject.code)) && notesAvailable ? \' target="_blank" rel="noopener noreferrer" download\' : "";',
              'const notesDownload = notesAvailable ? \' download\' : "";'
          )
          path.write_text(text, encoding='utf-8')

          path = Path('assets/js/site-assistant.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'const SEPARATE_PDFS = new Set(["1003", "1004"]);',
              'const NOTES_PDFS = new Set(AVAILABLE_LESSONS);'
          )
          text = text.replace(
              'const notes = SEPARATE_PDFS.has(code)\n      ? localPath(`notes/downloadable-notes-${code}.pdf`)\n      : lesson;',
              'const notes = NOTES_PDFS.has(code)\n      ? localPath(`notes/downloadable-notes-${code}.pdf`)\n      : "";'
          )
          path.write_text(text, encoding='utf-8')

          for html in Path('.').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              text = re.sub(
                  r'subject-browser\.js\?v=[^"\']+',
                  'subject-browser.js?v=20260615-notespdf1',
                  text,
              )
              html.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          rm -f .github/workflows/fix-note-download-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route Download Notes buttons to PDF files"
          git push origin main
