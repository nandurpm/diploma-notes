name: Verify lessons-2038 from uploaded syllabus

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-lessons-2038.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply syllabus verification note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lessons/lessons-2038.html')
          s = p.read_text(encoding='utf-8')
          old = 'The official syllabus specifies basic CAD tools, at least six CAD figures, at least four isometric figures, at least two complete two-dimensional figures, two three-hour lab examinations and a 15-mark open-ended group activity. Every one of those requirements is built into this handbook.'
          new = old + ' Verified again against the uploaded three-page official syllabus: programme, no-credit status, 45 practical periods, CO-PO mapping, lab-exam split, references, online resources and the open-ended experiment requirement are reflected here.'
          if new not in s:
              if old not in s:
                  raise SystemExit('Target syllabus alignment sentence not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          assert 'Verified again against the uploaded three-page official syllabus' in s
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/verify-lessons-2038.yml

      - name: Commit verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify Engineering Graphics CAD handbook from syllabus'
          git push origin HEAD:main
