name: GitHub Pages production diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Generate validated public site
        run: |
          GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="main" python tools/write_build_info.py
          python tools/generate_sitemap.py
          python tools/site_quality_gate.py
          python tools/build_public_site.py --target _site
          grep -q 'Bilingual Kerala Polytechnic Study Portal' _site/about.html
          test -f _site/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  report:
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    needs: [build, deploy]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish Pages deployment result
        shell: bash
        run: |
          status="failed"
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            status="passed"
          fi
          {
            echo "# GitHub Pages production diagnostic: ${status}"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build result: \`${{ needs.build.result }}\`"
            echo "- Deploy result: \`${{ needs.deploy.result }}\`"
            echo "- Pages URL: \`${{ needs.deploy.outputs.page_url || 'not available' }}\`"
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/pages-result.md
          cat /tmp/pages-result.md >> "$GITHUB_STEP_SUMMARY"
          python tools/report_diagnostic_issue.py --status "$status" --title "[GitHub Pages deployment] failed" --report /tmp/pages-result.md
          test "$status" = "passed"
