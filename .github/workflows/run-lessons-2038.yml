name: Run lessons-2038 handbook build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build handbook
        run: python scripts/build-lessons-2038.py

      - name: Commit handbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf tmp/lessons-2038 tmp/lessons-2038-hex2 tmp/lessons-2038-hex3 tmp/lessons-2038-enc
          rm -f scripts/build-lessons-2038.py
          rm -f .github/workflows/build-lessons-2038.yml .github/workflows/run-lessons-2038.yml
          git add -A
          git commit -m 'Add complete lessons-2038 CAD handbook'
          git push origin HEAD:main
