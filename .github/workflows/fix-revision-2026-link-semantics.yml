name: Finalize Revision 2026 semantics and metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-revision-2026-link-semantics.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve native links and detailed metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          generator = Path("tools/build_revision_2026_pages.py")
          text = generator.read_text(encoding="utf-8")
          text = text.replace('role="listitem" ', "", 1)
          text = text.replace('id="departmentCards" role="list"', 'id="departmentCards"', 1)
          generator.write_text(text, encoding="utf-8")

          main = Path("assets/js/main.js")
          main_text = main.read_text(encoding="utf-8")
          if "const existingDescription" not in main_text:
              pattern = re.compile(
                  r"\s{4}const description = isHomePage\(\)\n"
                  r"\s+\? `\$\{SITE_NAME\} provides Kerala Polytechnic Revision 2021 syllabus, notes, Ask POLY AI, mock exams, student tools, 2015 materials and question papers\.`\n"
                  r"\s+: `\$\{prefix\} on \$\{SITE_NAME\} for Kerala Polytechnic students\.`;"
              )
              replacement = '''    const existingDescription = document.querySelector('meta[name="description"]')?.content?.trim();
              const description = isHomePage()
                ? `${SITE_NAME} provides Kerala Polytechnic Revision 2026 and Revision 2021 syllabus, notes, Ask POLY AI, mock exams, student tools, 2015 materials and question papers.`
                : (existingDescription || `${prefix} on ${SITE_NAME} for Kerala Polytechnic students.`);'''
              main_text, changed = pattern.subn(replacement, main_text, count=1)
              if changed != 1:
                  raise SystemExit(f"Expected one metadata block, changed {changed}")
          main.write_text(main_text, encoding="utf-8")
          PY

      - name: Rebuild and validate Revision 2026 pages
        run: |
          python -m py_compile tools/build_revision_2026_pages.py
          python tools/build_revision_2026_pages.py
          node --check assets/js/main.js
          python - <<'PY'
          from pathlib import Path
          generated = Path("revision-2026.html").read_text(encoding="utf-8")
          generator = Path("tools/build_revision_2026_pages.py").read_text(encoding="utf-8")
          main = Path("assets/js/main.js").read_text(encoding="utf-8")
          assert generated.count('data-programme-card') == 38
          assert 'role="listitem"' not in generated
          assert 'id="departmentCards" role="list"' not in generated
          assert 'role="listitem"' not in generator
          assert 'const existingDescription' in main
          PY

      - name: Commit final durable corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_revision_2026_pages.py assets/js/main.js revision-2026.html revision-2026/*.html reports/revision-2026-build-summary.json
          if git diff --cached --quiet; then
            echo "Revision 2026 semantics and metadata are already final."
            exit 0
          fi
          git commit -m "Finalize Revision 2026 directory semantics and metadata"
          git pull --rebase origin main
          git push origin HEAD:main
