name: Apply responsive site brand

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-responsive-site-brand.yml

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update standard public-page headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          stylesheet = '  <link rel="stylesheet" href="/assets/css/site-brand.css?v=20260614-brand2">\n'

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '<a class="brand"' not in text:
                  continue

              original = text
              text = text.replace(
                  'aria-label="Diploma Notes home"',
                  'aria-label="Polytechnic Study Hub home"'
              )

              text = re.sub(
                  r'(<a class="brand"\b[^>]*>\s*)<span(?:\s+[^>]*)?>[^<]*</span>\s*<strong>[^<]*</strong>',
                  r'\1<span class="brand-symbol" aria-hidden="true">📚</span><strong>Polytechnic Study Hub</strong>',
                  text,
                  count=1,
              )

              if '/assets/css/site-brand.css' not in text:
                  marker = re.search(
                      r'\s*<link rel="stylesheet" href="/assets/css/site-navigation-a11y\.css(?:\?[^"\s]*)?">',
                      text,
                  )
                  if marker:
                      text = text[:marker.end()] + '\n' + stylesheet.rstrip() + text[marker.end():]
                  else:
                      text = text.replace('</head>', stylesheet + '</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No public headers required updating.')

          print(f'Updated {len(changed)} public pages.')
          for item in changed:
              print(f'  - {item}')
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/apply-responsive-site-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply compact responsive Polytechnic Study Hub header"
          git push origin main
