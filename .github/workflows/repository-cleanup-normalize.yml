name: Repository cleanup normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'chore/repository-structure-cleanup' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/repository-structure-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize deterministic structured data
        run: |
          python tools/inject_structured_data.py
          python tools/inject_structured_data.py --check
          git diff --check
      - name: Commit normalized source
        env:
          BRANCH: chore/repository-structure-cleanup
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'POLY PMNA Repository Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: normalize generated structured data'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
