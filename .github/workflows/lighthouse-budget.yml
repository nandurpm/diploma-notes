name: Lighthouse quality budget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/media/**"
      - "tools/build_public_site.py"
      - "tools/optimize_public_build.py"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse-budget.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Prepare deterministic source state
        run: |
          python tools/normalize_rev2021_noscript.py
          python tools/materialize_rev2021_subjects.py
          python tools/annotate_rev2026_title_provenance.py
          python tools/normalize_public_brand_assets.py
          python tools/inject_structured_data.py
          python tools/generate_sitemap.py
          GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="main" POLY_INJECT_BUILD_ID=1 python tools/write_build_info.py
          python tools/site_quality_gate.py
          python tools/build_public_site.py --target _site

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Run Lighthouse budgets on deployed artifact
        run: lhci autorun --config=.lighthouserc.json

      - name: Publish Lighthouse summary
        if: always()
        run: |
          {
            echo "## Lighthouse quality budget"
            echo ""
            echo "- Pages: Home, About, Revision 2026, Revision 2021, Mock Exams, Ask POLY AI, 2015 Materials, Tools, Help/Contact"
            echo "- Performance minimum: 0.55"
            echo "- Accessibility minimum: 0.90"
            echo "- Best Practices minimum: 0.90"
            echo "- SEO minimum: 0.90"
            echo "- CLS warning threshold: 0.15"
            echo "- LCP warning threshold: 4000 ms"
            echo "- Total Blocking Time warning threshold: 600 ms"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: reports/lighthouse
          if-no-files-found: warn
          retention-days: 30
