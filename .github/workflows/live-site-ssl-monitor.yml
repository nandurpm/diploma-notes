name: Live site and SSL monitor

on:
  schedule:
    # Run hourly at :17 UTC (22:47 IST), avoiding the top-of-hour queue.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-site-ssl-monitor.yml"

permissions:
  contents: read

concurrency:
  group: live-site-ssl-monitor-main
  cancel-in-progress: true

env:
  SITE_URL: https://polypmna.dpdns.org/
  BUILD_INFO_URL: https://polypmna.dpdns.org/build-info.json
  SSL_HOST: polypmna.dpdns.org
  MIN_SSL_DAYS: "30"

jobs:
  monitor:
    name: Check live website and certificate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTP response, security headers, and build metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          run_id = os.environ.get("GITHUB_RUN_ID", "monitor")
          site_url = os.environ["SITE_URL"] + f"?monitor={run_id}"
          build_url = os.environ["BUILD_INFO_URL"] + f"?monitor={run_id}"
          headers = {
              "User-Agent": "POLY-PMNA-Production-Audit/2.0",
              "Cache-Control": "no-cache",
              "Range": "bytes=0-262143",
              "Accept": "text/html,application/json;q=0.9,*/*;q=0.8",
          }

          def get(url):
              last = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(url, headers=headers, method="GET")
                      with urllib.request.urlopen(request, timeout=25) as response:
                          return response.status, dict(response.headers.items()), response.read(262144)
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(attempt)
              raise last

          status, response_headers, _ = get(site_url)
          if status not in (200, 206):
              raise SystemExit(f"Unexpected live-site HTTP status: {status}")
          hsts = next((value for key, value in response_headers.items() if key.lower() == "strict-transport-security"), "")
          if not hsts:
              raise SystemExit("Live response is missing Strict-Transport-Security")

          build_status, _, body = get(build_url)
          if build_status not in (200, 206):
              raise SystemExit(f"Unexpected build-info HTTP status: {build_status}")
          payload = json.loads(body.decode("utf-8"))
          commit = str(payload.get("commit") or "")
          built_at = payload.get("builtAt")
          branch = payload.get("branch")
          if len(commit) != 40 or any(ch not in "0123456789abcdef" for ch in commit):
              raise SystemExit("build-info.json contains an invalid commit SHA")
          if branch != "main" or not built_at:
              raise SystemExit("build-info.json is missing valid main-branch metadata")

          print(f"HTTP status: {status}")
          print("Security headers: HSTS present")
          print(f"Published commit: {commit}")
          print(f"Built at: {built_at}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Live site\n")
              summary.write(f"- URL: {os.environ['SITE_URL']}\n")
              summary.write(f"- HTTP status: {status}\n")
              summary.write("- HSTS: present\n\n")
              summary.write("## Published build\n")
              summary.write(f"- Commit: `{commit}`\n")
              summary.write(f"- Built at: {built_at}\n")
              summary.write(f"- Branch: {branch}\n")
          PY

      - name: Verify SSL certificate validity
        shell: bash
        run: |
          set -euo pipefail
          cert="$(mktemp)"
          echo | openssl s_client -connect "${SSL_HOST}:443" -servername "$SSL_HOST" -verify_return_error 2>/dev/null \
            | openssl x509 -outform PEM > "$cert"
          openssl x509 -checkend "$((MIN_SSL_DAYS * 86400))" -noout -in "$cert"
          subject="$(openssl x509 -subject -noout -in "$cert" | sed 's/^subject=//')"
          issuer="$(openssl x509 -issuer -noout -in "$cert" | sed 's/^issuer=//')"
          expires="$(openssl x509 -enddate -noout -in "$cert" | cut -d= -f2-)"
          echo "Certificate subject: $subject"
          echo "Certificate issuer: $issuer"
          echo "Certificate expiry: $expires"
          {
            echo "## SSL certificate"
            echo "- Subject: $subject"
            echo "- Issuer: $issuer"
            echo "- Expiry: $expires"
            echo "- Minimum remaining validity: ${MIN_SSL_DAYS} days"
          } >> "$GITHUB_STEP_SUMMARY"
