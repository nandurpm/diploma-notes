name: Deploy Ask POLY Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/ask-poly-ai-worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-ask-poly-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
