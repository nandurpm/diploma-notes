name: Update site header brand

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-site-brand.yml

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace the public header brand on every standard page
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  'aria-label="Diploma Notes home"',
                  'aria-label="Polytechnic Study Hub home"'
              )
              text = text.replace(
                  '<span>DN</span><strong>Diploma Notes</strong>',
                  '<span aria-hidden="true">⚙</span><strong>Polytechnic Study Hub</strong>'
              )
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No standard site brand markup was found.')

          print(f'Updated {len(changed)} pages:')
          for item in changed:
              print(f'  - {item}')
          PY

      - name: Improve symbol and long brand-name sizing
        run: |
          python - <<'PY'
          from pathlib import Path

          style_path = Path('assets/css/style.css')
          style = style_path.read_text(encoding='utf-8')
          style = style.replace(
              '  font-weight: 950;\n  box-shadow: 0 14px 30px rgba(29,78,216,.28);\n}\n.brand strong { font-size: 1.04rem; }',
              '  font-weight: 950;\n  font-size: 1.5rem;\n  line-height: 1;\n  box-shadow: 0 14px 30px rgba(29,78,216,.28);\n}\n.brand strong { font-size: 1rem; line-height: 1.08; }'
          )
          style_path.write_text(style, encoding='utf-8')

          responsive_path = Path('assets/css/responsive.css')
          responsive = responsive_path.read_text(encoding='utf-8')
          responsive = responsive.replace(
              '  .brand strong { font-size: .98rem; }',
              '  .brand strong { font-size: .9rem; line-height: 1.06; }'
          )
          responsive = responsive.replace(
              '  .brand strong { font-size: .88rem; }',
              '  .brand strong { font-size: .82rem; line-height: 1.05; }'
          )
          responsive_path.write_text(responsive, encoding='utf-8')
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/update-site-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename header brand to Polytechnic Study Hub"
          git push origin main
