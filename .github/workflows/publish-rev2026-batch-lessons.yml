name: Publish REV2026 batch lesson handbooks

on:
  push:
    branches: [main]
    paths:
      - "tools/rev2026-handbook-generator.zb64"
      - ".github/workflows/publish-rev2026-batch-lessons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rev2026-batch-lessons-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode and validate handbook generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          source = Path("tools/rev2026-handbook-generator.zb64")
          payload = source.read_text(encoding="utf-8").strip()
          decoded = zlib.decompress(base64.b64decode(payload))
          target = Path("/tmp/publish_rev2026_handbooks.py")
          target.write_bytes(decoded)
          print(f"Decoded {len(decoded):,} bytes to {target}")
          PY
          python -m py_compile /tmp/publish_rev2026_handbooks.py

      - name: Generate five separate REV2026 handbooks
        run: python /tmp/publish_rev2026_handbooks.py

      - name: Validate generated handbook files
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          codes = ("1003", "1008", "1031", "2031", "2032")
          for code in codes:
              path = Path(f"revision-2026-content/lessons/lessons-{code}.html")
              if not path.is_file():
                  raise SystemExit(f"Missing generated handbook: {path}")
              text = path.read_text(encoding="utf-8")
              required = (
                  f'content="{code}"',
                  'content="REV2026"',
                  "Print / Save PDF",
                  "Expected questions",
                  "Official syllabus coverage checklist",
                  "autoPrintNotes",
              )
              missing = [marker for marker in required if marker not in text]
              if missing:
                  raise SystemExit(f"{path}: missing markers {missing}")
              if len(text.encode("utf-8")) < 20000:
                  raise SystemExit(f"{path}: generated file is unexpectedly small")
              if not any("\u0d00" <= char <= "\u0d7f" for char in text):
                  raise SystemExit(f"{path}: Malayalam support is missing")
              Parser().feed(text)
              print(f"Validated {path} ({len(text.encode('utf-8')):,} bytes)")
          PY

      - name: Synchronize lesson availability and programme pages
        run: |
          python tools/update_asset_manifest.py
          python tools/build_revision_2026_pages.py
          node --check assets/js/subject-browser.js
          node --check assets/js/asset-manifest.js

      - name: Verify availability registration
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("assets/js/asset-manifest.js").read_text(encoding="utf-8")
          browser = Path("assets/js/subject-browser.js").read_text(encoding="utf-8")
          for code in ("1003", "1008", "1031", "2031", "2032"):
              if f'"{code}"' not in manifest:
                  raise SystemExit(f"Course {code} missing from asset manifest")
              if f'"{code}"' not in browser:
                  raise SystemExit(f"Course {code} missing from subject browser availability")
          print("All five lesson files are registered as available.")
          PY

      - name: Commit generated handbooks to main
        run: |
          git config user.name "poly-pmna-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            revision-2026-content/lessons/lessons-1003.html \
            revision-2026-content/lessons/lessons-1008.html \
            revision-2026-content/lessons/lessons-1031.html \
            revision-2026-content/lessons/lessons-2031.html \
            revision-2026-content/lessons/lessons-2032.html \
            reports/rev2026-five-handbooks.json \
            assets/js/subject-browser.js \
            assets/js/asset-manifest.js \
            revision-2026/*.html

          git rm -r --ignore-unmatch tools/rev2026-course-payload tools/rev2026-generator-parts
          git rm --ignore-unmatch reports/rev2026-batch-generator-error.txt .rev2026-batch-trigger

          if git diff --cached --quiet; then
            echo "Generated handbooks and availability data are already current."
            exit 0
          fi

          git commit -m "Add five complete REV2026 lesson handbooks"
          git pull --rebase origin main
          git push origin HEAD:main
