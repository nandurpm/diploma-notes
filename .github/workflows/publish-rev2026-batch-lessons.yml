name: Publish REV2026 batch lesson handbooks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".rev2026-batch-trigger"
      - "revision-2026-content/lessons/lessons-1003.html"
      - "revision-2026-content/lessons/lessons-1008.html"
      - "revision-2026-content/lessons/lessons-1031.html"
      - "revision-2026-content/lessons/lessons-2031.html"
      - "revision-2026-content/lessons/lessons-2032.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rev2026-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct generator
        run: |
          cat \
            tools/rev2026-generator-parts/part0 \
            tools/rev2026-generator-parts/part1 \
            tools/rev2026-generator-parts/part2 \
            tools/rev2026-generator-parts/part3 \
            > /tmp/publish_rev2026_batch.py
          python -m py_compile /tmp/publish_rev2026_batch.py

      - name: Generate and validate separate lesson handbooks
        run: python /tmp/publish_rev2026_batch.py

      - name: Synchronize lesson availability and generated department pages
        run: |
          python tools/update_asset_manifest.py
          python tools/build_revision_2026_pages.py
          node --check assets/js/subject-browser.js
          node --check assets/js/asset-manifest.js

      - name: Commit generated handbooks to pull-request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "poly-pmna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            revision-2026-content/lessons/lessons-1003.html \
            revision-2026-content/lessons/lessons-1008.html \
            revision-2026-content/lessons/lessons-1031.html \
            revision-2026-content/lessons/lessons-2031.html \
            revision-2026-content/lessons/lessons-2032.html \
            assets/js/subject-browser.js \
            assets/js/asset-manifest.js \
            revision-2026/*.html
          if git diff --cached --quiet; then
            echo "Generated handbooks are already current."
            exit 0
          fi
          git commit -m "Add five complete REV2026 lesson handbooks"
          git push origin HEAD:"${HEAD_REF}"
