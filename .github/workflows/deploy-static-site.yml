name: Deploy static site to Cloudflare Pages

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == '[automation] Deploy static site to production' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DOMAIN: polypmna.dpdns.org
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report deployment start
        if: github.event_name == 'issues'
        run: 'gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Production deployment started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Generate and validate deployable source
        run: |
          GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="main" python tools/write_build_info.py
          python tools/generate_sitemap.py
          python tools/site_quality_gate.py
          python tools/build_public_site.py --target _site
          python tools/verify_public_build_consistency.py _site --expected-commit "$GITHUB_SHA"
          test -f _site/build-optimization.json
          grep -q 'assets/build/home.' _site/index.html
          grep -q 'Bilingual Kerala Polytechnic Study Portal' _site/about.html
          test -f _site/assets/js/about-experience.js
          test -f _site/assets/css/about-experience.css

      - name: Set Cloudflare Pages project
        id: project
        run: |
          # The deployment token can deploy but no longer has permission to list
          # every Pages project in the account. Keep the known project name here
          # so deployment does not depend on an account-wide read permission.
          echo 'name=diploma-notes' >> "$GITHUB_OUTPUT"
          echo 'Using Cloudflare Pages project: diploma-notes'

      # NOTE: This Cloudflare Pages mirror is optional. Production remains
      # served by GitHub Pages (deploy-github-pages.yml) until the custom-domain
      # DNS CNAME is authorized and propagated. Prefer a dedicated Pages-scoped
      # CLOUDFLARE_PAGES_TOKEN; the existing account token is retained only as
      # a compatibility fallback for the already-working mirror deployment.
      - name: Deploy repository main to Cloudflare Pages mirror
        if: ${{ env.CLOUDFLARE_PAGES_TOKEN != '' || env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3.109.2 pages deploy _site \
            --project-name=${{ steps.project.outputs.name }} \
            --branch=main \
            --commit-hash=${{ github.sha }} \
            --commit-message="Deploy ${{ github.sha }}" || echo "::warning::Cloudflare Pages mirror deploy failed; production on GitHub Pages is unaffected."
      - name: Wait for production GitHub Pages deployment
        run: |
          python - <<'PY'
          # Production is served by GitHub Pages. Wait until its deployment for
          # this exact commit completes before verifying the live content.
          import json
          import os
          import time
          import urllib.request
          token = os.environ['GH_TOKEN']
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/deploy-github-pages.yml/runs?head_sha={sha}&per_page=5'
          deadline = time.time() + 900
          while time.time() < deadline:
              req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode('utf-8'))
              runs = [r for r in data.get('workflow_runs', []) if r['head_sha'] == sha]
              if runs:
                  latest = runs[0]
                  if latest['status'] == 'completed':
                      print(f'GitHub Pages run {latest["id"]} completed with conclusion {latest["conclusion"]}')
                      if latest['conclusion'] != 'success':
                          raise SystemExit(f'GitHub Pages deployment did not succeed: {latest["conclusion"]}')
                      raise SystemExit(0)
                  print(f'GitHub Pages run {latest["id"]} is {latest["status"]}; waiting...')
              else:
                  print('No GitHub Pages run found yet for this commit; waiting...')
              time.sleep(20)
          raise SystemExit('Timed out waiting for the GitHub Pages deployment to finish.')
          PY
      - name: Verify deployed commit and redesigned About page
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = 'https://' + os.environ['PRODUCTION_DOMAIN']
          expected = os.environ['GITHUB_SHA']
          last = ''
          for attempt in range(1, 7):
              try:
                  headers = {'Cache-Control': 'no-cache', 'User-Agent': 'POLY-PMNA-Deploy-QA/7.1'}
                  with urllib.request.urlopen(
                      urllib.request.Request(base + f'/build-info.json?deploy={attempt}', headers=headers), timeout=20
                  ) as response:
                      info = json.loads(response.read().decode('utf-8'))
                  with urllib.request.urlopen(
                      urllib.request.Request(base + f'/?deploy={attempt}', headers=headers), timeout=20
                  ) as response:
                      home = response.read().decode('utf-8', errors='replace')
                  with urllib.request.urlopen(
                      urllib.request.Request(base + f'/about.html?deploy={attempt}', headers=headers), timeout=20
                  ) as response:
                      about = response.read().decode('utf-8', errors='replace')
                  if info.get('commit') != expected:
                      raise RuntimeError(f"live commit {info.get('commit')} != {expected}")
                  for marker in ('Revision 2026', 'POLY PMNA', '/revision-2026.html', '/assets/build/home.'):
                      if marker not in home:
                          raise RuntimeError(f'homepage missing {marker}')
                  for marker in ('Bilingual Kerala Polytechnic Study Portal', 'data-about-guide', 'data-about-lang="ml"', '/assets/js/about-experience.js'):
                      if marker not in about:
                          raise RuntimeError(f'About page missing {marker}')
                  print(json.dumps({'commit': info.get('commit'), 'branch': info.get('branch'), 'aboutRedesign': True}, indent=2))
                  raise SystemExit(0)
              except Exception as error:
                  last = f'Attempt {attempt}: {type(error).__name__}: {error}'
                  print(last)
                  if attempt < 6:
                      time.sleep(8)
          raise SystemExit(last)
          PY

      - name: Report successful owner-triggered deployment
        if: success() && github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Production deployment and live About-page verification passed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Report failed owner-triggered deployment
        if: failure() && github.event_name == 'issues'
        run: 'gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Production deployment failed. Exact workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
