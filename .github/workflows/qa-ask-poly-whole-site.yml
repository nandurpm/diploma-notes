name: QA Ask POLY whole-site grounding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ask-poly.html"
      - "assets/js/ask-poly-v2.js"
      - "assets/js/ask-poly-knowledge-loader.js"
      - "assets/data/ask-poly-knowledge.json"
      - "tools/qa_ask_poly_whole_site.mjs"
      - ".github/workflows/qa-ask-poly-whole-site.yml"

permissions:
  contents: write

concurrency:
  group: qa-ask-poly-whole-site
  cancel-in-progress: true

jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local website
        run: |
          python -m http.server 8000 > /tmp/ask-poly-server.log 2>&1 &
          echo $! > /tmp/ask-poly-server.pid
          sleep 3

      - name: Run whole-site grounding QA
        id: qa
        continue-on-error: true
        run: |
          set +e
          QA_BASE_URL="http://127.0.0.1:8000" \
          QA_SCREENSHOT_DIR="/tmp/ask-poly-whole-site-qa" \
          node tools/qa_ask_poly_whole_site.mjs
          echo $? > /tmp/ask-poly-qa-status
          exit 0

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-poly-whole-site-rendered-qa
          path: |
            reports/ask-poly-whole-site-qa.json
            /tmp/ask-poly-whole-site-qa/*.png
            /tmp/ask-poly-server.log
          if-no-files-found: warn

      - name: Commit QA report
        if: always()
        run: |
          if [ ! -f reports/ask-poly-whole-site-qa.json ]; then
            echo "Ask POLY QA report was not generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ask-poly-whole-site-qa.json
          if git diff --cached --quiet; then
            echo "Ask POLY QA report is already current."
          else
            git commit -m "Record Ask POLY whole-site rendered QA [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Finish with QA result
        if: always()
        run: |
          if [ ! -f /tmp/ask-poly-qa-status ]; then
            echo "Ask POLY QA status file is missing."
            exit 1
          fi
          STATUS=$(cat /tmp/ask-poly-qa-status)
          if [ "$STATUS" != "0" ]; then
            echo "Ask POLY whole-site QA failed."
            cat reports/ask-poly-whole-site-qa.json || true
            exit "$STATUS"
          fi
          echo "Ask POLY whole-site QA passed."

      - name: Stop local website
        if: always()
        run: |
          if [ -f /tmp/ask-poly-server.pid ]; then
            kill "$(cat /tmp/ask-poly-server.pid)" || true
          fi
