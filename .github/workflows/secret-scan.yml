name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked files for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files
        run: python3 tools/secret_scan.py
      - name: Scan commit history for high-confidence credential markers
        shell: bash
        run: |
          set -euo pipefail
          # Exclude only the scanner definitions themselves; otherwise this
          # workflow would match its own marker literals in repository history.
          history_paths=(. ':!.github/workflows/secret-scan.yml' ':!tools/secret_scan.py')
          for marker in 'BEGIN PRIVATE KEY' 'AKIA' 'AIza' 'ghp_' 'github_pat_' 'sk-proj-'; do
            if git log --all --format='%H' --pickaxe-all -S"${marker}" -- "${history_paths[@]}" | grep -q .; then
              echo "::error::Credential marker found in repository history: ${marker}"
              exit 1
            fi
          done
