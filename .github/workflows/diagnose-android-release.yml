name: Publish verified Android signed release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-android-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | tr -d '\n\r ' | base64 --decode > android-app/release.keystore
          test -s android-app/release.keystore

      - name: Validate keystore and alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore android-app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android-app :app:assembleRelease --no-daemon \
            -PANDROID_KEYSTORE_FILE="$PWD/android-app/release.keystore" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Prepare signed APK
        run: |
          set -e
          mkdir -p release-output reports downloads
          APK_PATH=$(find android-app/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" release-output/POLY_PMNA_v3.0.apk
          SHA256=$(sha256sum release-output/POLY_PMNA_v3.0.apk | awk '{print $1}')
          BYTES=$(stat -c '%s' release-output/POLY_PMNA_v3.0.apk)
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_BYTES=$BYTES" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view android-v3.0 >/dev/null 2>&1; then
            gh release upload android-v3.0 release-output/POLY_PMNA_v3.0.apk --clobber
          else
            gh release create android-v3.0 release-output/POLY_PMNA_v3.0.apk \
              --title "POLY PMNA Android 3.0" \
              --notes "Major native Android update with Revision 2026, separate 2026 lessons and notes, and whole-site Ask POLY AI knowledge."
          fi

      - name: Update website manifest and publication report
        run: |
          set -e
          APK_URL="https://github.com/nandurpm/diploma-notes/releases/download/android-v3.0/POLY_PMNA_v3.0.apk"
          cat > downloads/app-update.json <<JSON
          {
            "schemaVersion": 1,
            "versionCode": 9,
            "versionName": "3.0",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}",
            "publishedAt": "2026-07-16",
            "forceUpdate": true,
            "title": "POLY PMNA Android app 3.0",
            "message": "Major update: Revision 2026 is now available in the native sidebar and the app matches the current POLY PMNA website.",
            "releaseNotes": [
              "Added Revision 2026 before Revision 2021 in the native drawer.",
              "Updated the native title and drawer branding to POLY PMNA.",
              "Updated the drawer footer from Version 2.01 to Version 3.0.",
              "Added dedicated Revision 2026 lesson and notes paths.",
              "Connected Ask POLY AI to the whole-site revision-aware knowledge system."
            ]
          }
          JSON
          cat > reports/android-v3-publication.json <<JSON
          {
            "status": "success",
            "versionCode": 9,
            "versionName": "3.0",
            "apkUrl": "${APK_URL}",
            "apkBytes": ${APK_BYTES},
            "sha256": "${SHA256}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON

      - name: Publish manifest to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/app-update.json reports/android-v3-publication.json
          git commit -m "Publish Android app v3.0 manifest [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
