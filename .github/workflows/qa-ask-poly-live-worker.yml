name: QA live Ask POLY Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/ask-poly-ai/src/index.js"
      - "workers/ask-poly-ai/src/site-instructions.js"
      - "workers/ask-poly-ai/src/ask-handler.js"
      - "workers/ask-poly-ai/wrangler.toml"
      - ".github/workflows/deploy-ask-poly-ai.yml"
      - ".github/workflows/qa-ask-poly-live-worker.yml"

permissions:
  contents: write

concurrency:
  group: qa-live-ask-poly-worker
  cancel-in-progress: true

jobs:
  health-and-answer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify health, real answer and relevance
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          health_url = "https://ask-poly-ai.nandakumarkdpm.workers.dev/health"
          ask_url = "https://ask-poly-ai.nandakumarkdpm.workers.dev/api/ask-poly"
          last_error = ""
          health = None
          ask_test = None
          relevance_test = None

          def ask_worker(message, page_title="Production QA", page_context=""):
              body = json.dumps({
                  "message": message,
                  "history": [],
                  "pageTitle": page_title,
                  "pageContext": page_context,
              }).encode("utf-8")
              request = urllib.request.Request(
                  ask_url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Origin": "https://polypmna.dpdns.org",
                      "User-Agent": "POLY-PMNA-Live-QA/3.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  payload = json.loads(response.read().decode("utf-8", "replace"))
              answer = str(payload.get("answer") or "").strip()
              if response.status != 200 or not answer:
                  raise RuntimeError(f"Worker returned no usable AI answer: {payload}")
              return payload, answer

          for attempt in range(1, 31):
              try:
                  health_request = urllib.request.Request(
                      f"{health_url}?attempt={attempt}",
                      headers={"User-Agent": "POLY-PMNA-Live-QA/3.0", "Cache-Control": "no-cache"},
                  )
                  with urllib.request.urlopen(health_request, timeout=20) as response:
                      candidate = json.loads(response.read().decode("utf-8", "replace"))
                  if not (
                      response.status == 200
                      and candidate.get("ok") is True
                      and candidate.get("configured") is True
                      and candidate.get("knowledgeMode") == "whole-site-revision-aware-v1"
                      and candidate.get("wholeSiteContext") is True
                      and set(candidate.get("revisionAware") or []) >= {"2026", "2021", "2015"}
                  ):
                      raise RuntimeError(f"Worker returned incomplete health payload: {candidate}")

                  ready_result, ready_answer = ask_worker("Reply with exactly: Ask POLY is ready")

                  general_result, general_answer = ask_worker(
                      "How many districts does Kerala have? Answer only this question in one short sentence.",
                      page_title="General knowledge question",
                  )
                  normalized = general_answer.lower()
                  forbidden = (
                      "poly pmna",
                      "syllabus",
                      "sample paper",
                      "sample question",
                      "subject records",
                      "website context",
                      "relevant links",
                  )
                  if "14" not in normalized:
                      raise RuntimeError(f"General answer did not contain the correct district count: {general_answer}")
                  contamination = [term for term in forbidden if term in normalized]
                  if contamination:
                      raise RuntimeError(
                          f"General answer contained irrelevant website material {contamination}: {general_answer}"
                      )

                  health = candidate
                  ask_test = {
                      "ok": True,
                      "provider": ready_result.get("provider") or "",
                      "model": ready_result.get("model") or "",
                      "answerPreview": ready_answer[:240],
                  }
                  relevance_test = {
                      "ok": True,
                      "provider": general_result.get("provider") or "",
                      "answerPreview": general_answer[:240],
                      "forbiddenTermsFound": [],
                  }
                  break
              except Exception as error:
                  last_error = f"Attempt {attempt}: {type(error).__name__}: {error}"
                  print(last_error)
                  time.sleep(10)

          report = {
              "status": "success" if health and ask_test and relevance_test else "failed",
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "endpoint": health_url,
              "askEndpoint": ask_url,
              "expectedKnowledgeMode": "whole-site-revision-aware-v1",
              "health": health,
              "askTest": ask_test,
              "relevanceTest": relevance_test,
              "lastError": "" if health and ask_test and relevance_test else last_error,
          }
          path = Path("reports/ask-poly-live-worker-qa.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          if not health or not ask_test or not relevance_test:
              raise SystemExit(last_error or "Live Ask POLY Worker failed answer relevance QA")
          PY

      - name: Commit live Worker QA report
        if: always()
        run: |
          if [ ! -f reports/ask-poly-live-worker-qa.json ]; then
            echo "Live Worker QA report was not generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ask-poly-live-worker-qa.json
          if git diff --cached --quiet; then
            echo "Live Worker QA report is already current."
          else
            git commit -m "Record live Ask POLY answer QA [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
