name: Publish REV2026 text contrast fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-rev2026-contrast-fix.yml"

permissions:
  contents: write

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add explicit high-contrast lesson text rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('revision-2026-content/lessons')
          pages = sorted(root.glob('lessons-*.html'))
          if len(pages) < 10:
              raise SystemExit(f'Expected at least 10 REV2026 lesson pages, found {len(pages)}')

          marker = 'rev2026-text-contrast-v1'
          style = '''<style id="rev2026-text-contrast-v1">
          /* Explicit contrast for labels placed on dark/gradient REV2026 covers. */
          html.revision-2026-lesson :is(.cover,.hero,.hero-mini,.hero-card,.hb-hero) :is(.chip,.badge,.pill,.tag,.meta-chip,.hero-badge,.course-badge),
          html.poly-lesson-page :is(.cover,.hero,.hero-mini,.hero-card,.hb-hero) :is(.chip,.badge,.pill,.tag,.meta-chip,.hero-badge,.course-badge){
            color:#0f172a!important;
            background:rgba(255,255,255,.96)!important;
            border-color:rgba(255,255,255,.82)!important;
            text-shadow:none!important;
            opacity:1!important;
            -webkit-text-fill-color:#0f172a!important;
          }
          html.revision-2026-lesson :is(.cover,.hero,.hero-mini,.hero-card,.hb-hero) :is(.facts,.course-facts,.hero-facts) :is(dt,dd,strong,span),
          html.poly-lesson-page :is(.cover,.hero,.hero-mini,.hero-card,.hb-hero) :is(.facts,.course-facts,.hero-facts) :is(dt,dd,strong,span){
            color:#fff!important;
            opacity:1!important;
            -webkit-text-fill-color:#fff!important;
          }
          @media print{
            html.poly-lesson-page :is(.cover,.hero,.hero-mini,.hero-card,.hb-hero) :is(.chip,.badge,.pill,.tag,.meta-chip,.hero-badge,.course-badge){
              color:#111827!important;
              background:#fff!important;
              border-color:#6b7280!important;
              -webkit-text-fill-color:#111827!important;
            }
          }
          </style>'''

          changed = 0
          for path in pages:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<style id="rev2026-text-contrast-v1">.*?</style>', '', text, flags=re.S)
              if '</head>' not in text:
                  raise SystemExit(f'Missing </head> in {path}')
              updated = text.replace('</head>', style + '</head>', 1)
              if updated != path.read_text(encoding='utf-8'):
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          sample = (root / 'lessons-1008.html').read_text(encoding='utf-8')
          required = [marker, '-webkit-text-fill-color:#0f172a', 'background:rgba(255,255,255,.96)']
          missing = [token for token in required if token not in sample]
          if missing:
              raise SystemExit(f'Course 1008 contrast patch incomplete: {missing}')
          print(f'Applied explicit contrast rules to {changed} REV2026 lesson pages.')
          PY

      - name: Commit repaired lesson pages
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add revision-2026-content/lessons/lessons-*.html
          if git diff --cached --quiet; then
            echo "Contrast rules are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix invisible text across REV2026 lesson covers"
          git push origin "HEAD:${HEAD_BRANCH}"
