name: Apply consolidated lesson fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-consolidated-lessons.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply batch corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          path = Path("lessons/lessons-1001.html")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, '<nav class="nav">', '<nav class="nav" aria-label="Lesson sections">', "1001 nav")
          text = replace_once(text, '<button class="btn" onclick="window.print()">Download as PDF</button>', '<button type="button" class="btn" onclick="window.print()">Print / Save as PDF</button>', "1001 button")
          path.write_text(text, encoding="utf-8")

          path = Path("lessons/lessons-1002.html")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, '<title>Mathematics I 1002 | Kerala Polytechnic Textbook</title>', '<title>Mathematics I 1002 | Kerala Polytechnic Study Hub</title>', "1002 title")
          text = replace_once(text, '<meta property="og:title" content="Mathematics I 1002 | Kerala Polytechnic Textbook">', '<meta property="og:title" content="Mathematics I 1002 | Kerala Polytechnic Study Hub">', "1002 og title")
          start_old = "<header class='top'><div class='wrap nav'>"
          start_new = "<header class='top'><nav class='wrap nav' aria-label='Lesson sections'>"
          text = replace_once(text, start_old, start_new, "1002 nav")
          close_at = text.index("</div></header>", text.index(start_new))
          text = text[:close_at] + "</nav></header>" + text[close_at + len("</div></header>"):]
          text = replace_once(text, "<button onclick='window.print()'>Download PDF</button>", "<button type='button' onclick='window.print()'>Print / Save as PDF</button>", "1002 top button")
          text = replace_once(text, "<button class='white' onclick='window.print()'>Download PDF</button>", "<button type='button' class='white' onclick='window.print()'>Print / Save as PDF</button>", "1002 hero button")
          path.write_text(text, encoding="utf-8")

          path = Path("lessons/lessons-1005.html")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "<nav class='nav'>", "<nav class='nav' aria-label='Lesson sections'>", "1005 nav")
          text = replace_once(text, "<button class='btn' onclick='window.print()'>Download as PDF</button>", "<button type='button' class='btn' onclick='window.print()'>Print / Save as PDF</button>", "1005 button")
          path.write_text(text, encoding="utf-8")

          path = Path("lessons/lessons-3023.html")
          text = path.read_text(encoding="utf-8")
          old = '<button class="btn primary back no-print" onclick="scrollTo({top:0,behavior:\'smooth\'})">↑ Top</button>'
          new = '<button type="button" class="btn primary back no-print" aria-label="Back to top" onclick="scrollTo({top:0,behavior:\'smooth\'})">↑ Top</button>'
          text = replace_once(text, old, new, "3023 back button")
          path.write_text(text, encoding="utf-8")

          path = Path("lessons/lessons-3031.html")
          text = path.read_text(encoding="utf-8")
          old = '<button id="backtop" onclick="window.scrollTo({top:0,behavior:\'smooth\'})" title="Back to top">↑</button>'
          new = '<button id="backtop" type="button" aria-label="Back to top" title="Back to top" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">↑</button>'
          text = replace_once(text, old, new, "3031 back button")
          path.write_text(text, encoding="utf-8")

          image_url = "https://polypmna.dpdns.org/assets/media/sfi-poly-pmna-poster.jpg"

          def find_meta(text, key, attr):
              pattern = rf'<meta\s+{attr}=["\']{re.escape(key)}["\'][^>]*content=["\']([^"\']*)["\']'
              match = re.search(pattern, text, flags=re.I)
              return match.group(1).strip() if match else ""

          for path in sorted(Path("lessons").glob("lessons-*.html")):
              text = path.read_text(encoding="utf-8")
              if not re.search(r'<meta\s+property=["\']og:url["\']', text, flags=re.I):
                  continue
              title = find_meta(text, "og:title", "property")
              description = find_meta(text, "og:description", "property") or find_meta(text, "description", "name")
              if not title:
                  match = re.search(r"<title>(.*?)</title>", text, flags=re.I | re.S)
                  title = match.group(1).strip() if match else "Kerala Polytechnic Study Hub"
              if not description:
                  description = "Kerala Polytechnic Revision 2021 lesson and exam preparation resource."
              additions = []
              if not re.search(r'<meta\s+property=["\']og:image["\']', text, flags=re.I):
                  additions += [
                      f'<meta property="og:image" content="{image_url}">',
                      '<meta property="og:image:width" content="1200">',
                      '<meta property="og:image:height" content="630">',
                      '<meta property="og:image:alt" content="Kerala Polytechnic Study Hub">',
                  ]
              if not re.search(r'<meta\s+name=["\']twitter:card["\']', text, flags=re.I):
                  additions += [
                      '<meta name="twitter:card" content="summary_large_image">',
                      f'<meta name="twitter:title" content="{title}">',
                      f'<meta name="twitter:description" content="{description}">',
                      f'<meta name="twitter:image" content="{image_url}">',
                  ]
              if additions:
                  block = "\n  " + "\n  ".join(additions) + "\n"
                  text = text.replace("</head>", block + "</head>", 1)
                  path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow and accidental placeholders
        run: |
          rm .github/workflows/fix-consolidated-lessons.yml
          rm -f x dummy placeholder-cleanup-note
      - name: Commit batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply consolidated lesson fixes"
          git push
