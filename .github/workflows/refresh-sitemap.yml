name: Refresh sitemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "tools/generate_sitemap.py"

permissions:
  contents: read
concurrency:
  group: generated-content-main-writer
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Generate sitemap from canonical files
        run: python tools/generate_sitemap.py
      - name: Commit deterministic sitemap update
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already current."
            exit 0
          fi
          git config user.name "POLY PMNA Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh complete sitemap"
          git pull --rebase origin main
          git push origin HEAD:main
