name: Fix REV2026 exact subject titles now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rev2026-titles-now.yml'

permissions:
  contents: write

concurrency:
  group: sync-revision-2026
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Restore exact official subject titles
        run: |
          python - <<'PY'
          import json
          import subprocess
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          data_path = Path('assets/data/revision-2026-subjects.json')
          report_path = Path('reports/revision-2026-title-resolution.json')
          historical_ref = 'b82decdf58f1e518f2802e3ce019f4d1a4633162'
          generic = {
              'programme core course',
              'program core course',
              'programme elective course',
              'program elective course',
              'open elective course',
          }

          def norm(value):
              return ' '.join(str(value or '').split())

          current = json.loads(data_path.read_text(encoding='utf-8'))
          historical = json.loads(subprocess.check_output(
              ['git', 'show', f'{historical_ref}:assets/data/revision-2026-subjects.json'],
              text=True,
          ))

          exact = {}
          by_code = defaultdict(set)
          for row in historical.get('subjects', []):
              code = norm(row.get('code')).upper()
              slug = norm(row.get('programmeSlug'))
              title = norm(row.get('name'))
              if code and title and title.casefold() not in generic:
                  exact[(slug, code)] = title
                  by_code[code].add(title)

          before = []
          replacements = []
          unresolved = []
          for row in current.get('subjects', []):
              old = norm(row.get('name'))
              if old.casefold() not in generic:
                  continue
              before.append(row)
              code = norm(row.get('code')).upper()
              slug = norm(row.get('programmeSlug'))
              title = exact.get((slug, code), '')
              if not title:
                  candidates = sorted(by_code.get(code, set()))
                  if len(candidates) == 1:
                      title = candidates[0]
              if not title or title.casefold() in generic:
                  unresolved.append({
                      'programmeSlug': slug,
                      'semester': row.get('semester'),
                      'code': code,
                      'oldTitle': old,
                      'historicalCandidates': sorted(by_code.get(code, set())),
                  })
                  continue
              row['name'] = title
              row['titleSource'] = 'historical-official-sitttr-snapshot'
              replacements.append({
                  'programmeSlug': slug,
                  'semester': row.get('semester'),
                  'code': code,
                  'oldTitle': old,
                  'newTitle': title,
                  'titleSource': row['titleSource'],
                  'syllabusUrl': row.get('syllabusUrl'),
              })

          remaining = [
              row for row in current.get('subjects', [])
              if norm(row.get('name')).casefold() in generic
          ]
          counts = Counter(item['oldTitle'] for item in replacements)
          report = {
              'scheme': 'REV2026',
              'resolvedAt': datetime.now(timezone.utc).isoformat(),
              'historicalReference': historical_ref,
              'genericRowsBefore': len(before),
              'resolvedRows': len(replacements),
              'genericRowsAfter': len(remaining),
              'resolvedByOriginalLabel': dict(sorted(counts.items())),
              'unresolved': unresolved,
              'replacements': replacements,
              'status': 'passed' if not remaining and not unresolved else 'failed',
          }
          report_path.parent.mkdir(exist_ok=True)
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if remaining or unresolved:
              raise SystemExit(
                  f'Could not resolve every generic title: remaining={len(remaining)} unresolved={len(unresolved)}'
              )

          current['subjects'] = current.get('subjects', [])
          current['subjectCount'] = len(current['subjects'])
          current['titleResolution'] = {
              'resolvedAt': report['resolvedAt'],
              'genericRowsReplaced': len(replacements),
              'genericRowsRemaining': 0,
              'titleSourceCounts': {'historical-official-sitttr-snapshot': len(replacements)},
          }
          current['sourceMethod'] = (
              norm(current.get('sourceMethod'))
              + ' Generic programme-table labels are replaced using an earlier exact-title '
              + 'snapshot generated from the official SITTTR REV2026 catalogue.'
          )
          data_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Replaced {len(replacements)} generic titles; remaining=0')
          PY
      - name: Bump REV2026 cache version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          version = '20260720-rev2026-exact-titles'
          browser_path = Path('assets/js/revision-2026-browser.js')
          browser = browser_path.read_text(encoding='utf-8')
          browser, count = re.subn(r'const VERSION = "[^"]+";', f'const VERSION = "{version}";', browser, count=1)
          assert count == 1
          browser_path.write_text(browser, encoding='utf-8')

          builder_path = Path('tools/build_revision_2026_pages.py')
          builder = builder_path.read_text(encoding='utf-8')
          builder, count = re.subn(r'^VERSION = "[^"]+"$', f'VERSION = "{version}"', builder, count=1, flags=re.MULTILINE)
          assert count == 1
          builder_path.write_text(builder, encoding='utf-8')
          PY
      - name: Rebuild all department pages
        run: |
          python tools/build_revision_2026_pages.py
          python tools/apply_revision_2026_department_themes.py
          python tools/enhance_revision_2026_model_qp.py
      - name: Verify every department, semester and exact title
        run: |
          python tools/verify_revision_2026_catalogue.py
          python tools/verify_rev2026_titles.py
      - name: Commit exact titles and rebuilt cards
        run: |
          git add assets/data/revision-2026-subjects.json
          git add assets/js/revision-2026-browser.js tools/build_revision_2026_pages.py
          git add revision-2026.html revision-2026/*.html
          git add reports/revision-2026-build-summary.json
          git add reports/revision-2026-catalogue-verification.json
          git add reports/revision-2026-title-resolution.json reports/revision-2026-title-verification.json
          git add reports/revision-2026-new-codes-vs-2021.json reports/revision-2026-new-codes-vs-2021.md
          if git diff --cached --quiet; then
            echo 'No title changes were required.'
            exit 0
          fi
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Replace generic REV2026 subject-card titles'
          git pull --rebase --autostash origin main
          git push
