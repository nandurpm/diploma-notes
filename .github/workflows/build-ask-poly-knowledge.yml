name: Build Ask POLY whole-site knowledge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "lessons/**"
      - "notes/**"
      - "revision-2026-content/**"
      - "assets/js/subjects.js"
      - "assets/data/revision-2026-programmes.json"
      - "assets/data/revision-2026-subjects.json"
      - "tools/build_ask_poly_knowledge.py"
      - "assets/js/ask-poly-knowledge-loader.js"
      - "assets/js/ask-poly-v2.js"
      - "assets/data/syllabus-details.json"
      - "assets/data/ask-poly-extra-facts.json"
      - ".github/workflows/build-ask-poly-knowledge.yml"

permissions:
  contents: write

concurrency:
  group: build-ask-poly-whole-site-knowledge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate whole-site knowledge index
        run: python tools/build_ask_poly_knowledge.py

      - name: Validate generated index and browser retrieval
        run: |
          python -m py_compile tools/build_ask_poly_knowledge.py
          node --check assets/js/ask-poly-knowledge-loader.js
          node --check assets/js/ask-poly-v2.js
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("assets/data/ask-poly-knowledge.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("assets/data/revision-2026-programmes.json").read_text(encoding="utf-8"))
          counts = data.get("counts", {})
          assert counts.get("programmes2026") == 42, counts
          expected_programmes = len(registry.get("programmes", []))
          declared_programmes = registry.get("programmeCount")
          assert expected_programmes > 0, registry
          assert declared_programmes == expected_programmes, registry
          assert counts.get("programmes2026") == expected_programmes, (counts, expected_programmes)
          assert counts.get("pages", 0) >= 40, counts
          assert counts.get("subjectRecords", 0) >= 300, counts
          revisions = {str(row.get("revision")) for row in data.get("subjects", [])}
          assert {"2021", "2026"}.issubset(revisions), revisions
          assert any(page.get("url") == "/revision-2026.html" for page in data.get("pages", []))
          assert any(page.get("url") == "/tools.html" for page in data.get("pages", []))
          lesson_pages = [page for page in data.get("pages", []) if page.get("category") == "revision-2026-lesson"]
          assert len(lesson_pages) >= 1200, len(lesson_pages)
          assert sum(bool(page.get("summary")) for page in lesson_pages) >= 1200
          assert all(page.get("heading") and len(page.get("summary", "")) >= 40 for page in lesson_pages[:20])
          dynamic_1004 = [page for page in data.get("pages", []) if page.get("url") == "/revision-2026-content/lessons/lessons-1004.html"]
          assert len(dynamic_1004) == 1, dynamic_1004
          assert len(dynamic_1004[0].get("summary", "")) >= 100, len(dynamic_1004[0].get("summary", ""))
          assert "orthographic" in f"{dynamic_1004[0].get('heading', '')} {dynamic_1004[0].get('summary', '')}".lower(), dynamic_1004[0]
          syllabus_details = json.loads(Path("assets/data/syllabus-details.json").read_text(encoding="utf-8"))
          detailed = [row for row in syllabus_details.get("courses", []) if row.get("revision") == "2021" and row.get("code") == "4272" and row.get("department") == "Cloud Computing and Big Data" and row.get("semester") == "Semester 4"]
          assert len(detailed) == 1, detailed
          assert len(detailed[0].get("outcomes", [])) == 4, detailed[0]
          assert sum(len(outcome.get("modules", [])) for outcome in detailed[0]["outcomes"]) == 26, detailed[0]
          print(json.dumps(counts, indent=2))
          PY

      - name: Commit refreshed knowledge index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ask-poly-knowledge.json
          if git diff --cached --quiet; then
            echo "Ask POLY knowledge is already current."
            exit 0
          fi
          git commit -m "Refresh Ask POLY whole-site knowledge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
