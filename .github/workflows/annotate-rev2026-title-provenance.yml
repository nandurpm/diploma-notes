name: Annotate Revision 2026 title provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reports/revision-2026-title-resolution.json"
      - "tools/annotate_rev2026_title_provenance.py"
      - ".github/workflows/annotate-rev2026-title-provenance.yml"

permissions:
  contents: read
concurrency:
  group: annotate-rev2026-title-provenance-main
  cancel-in-progress: true

jobs:
  annotate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Add visible provenance notices
        run: |
          python -m py_compile tools/annotate_rev2026_title_provenance.py
          python tools/annotate_rev2026_title_provenance.py
          python tools/generate_sitemap.py
          python tools/site_quality_gate.py
      - name: Commit deterministic notices
        run: |
          if git diff --quiet -- revision-2026 sitemap.xml; then
            echo "Revision 2026 provenance notices are current."
            exit 0
          fi
          git config user.name "POLY PMNA Page Generator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision-2026 sitemap.xml
          git commit -m "Label historical Revision 2026 title sources"
          git pull --rebase origin main
          git push origin HEAD:main
