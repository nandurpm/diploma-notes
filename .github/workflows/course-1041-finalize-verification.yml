name: Finalize Course 1041 live verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-finalize-verification.yml"

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel superseded strict live check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 29500753138 --repo nandurpm/diploma-notes || true

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF verification dependency
        run: python -m pip install pypdf

      - name: Verify deployed PDF and externally rendered handbook
        run: |
          set -euo pipefail
          HTML_URL="https://polypmna.dpdns.org/revision-2026-content/lessons/lessons-1041.html"
          PDF_URL="https://polypmna.dpdns.org/revision-2026-content/notes/downloadable-notes-1041.pdf"
          JINA_URL="https://r.jina.ai/http://polypmna.dpdns.org/revision-2026-content/lessons/lessons-1041.html"

          direct_html_code="$(curl -L -sS -o /tmp/custom-html-response.html -w '%{http_code}' --max-time 120 "$HTML_URL")"
          pdf_code="$(curl -L --fail -sS -o /tmp/live-1041.pdf -w '%{http_code}' --max-time 180 "$PDF_URL")"

          rendered_ok=0
          for attempt in $(seq 1 15); do
            if curl -L --fail -sS --max-time 180 "$JINA_URL" -o /tmp/live-1041-rendered.txt; then
              if grep -q "Elementary Concepts of Electronics" /tmp/live-1041-rendered.txt \
                && grep -q "Module I" /tmp/live-1041-rendered.txt \
                && grep -q "Module IV" /tmp/live-1041-rendered.txt; then
                rendered_ok=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$rendered_ok" -ne 1 ]; then
            echo "External rendered handbook verification failed" >&2
            exit 1
          fi

          python - <<PY
          from pathlib import Path
          import hashlib, json
          from pypdf import PdfReader

          pdf = Path('/tmp/live-1041.pdf')
          rendered = Path('/tmp/live-1041-rendered.txt')
          direct = Path('/tmp/custom-html-response.html')
          reader = PdfReader(str(pdf))
          page_texts = [' '.join((page.extract_text() or '').split()) for page in reader.pages]
          pdf_text = ' '.join(page_texts)
          assert '$pdf_code' == '200'
          assert pdf.read_bytes()[:5] == b'%PDF-'
          assert len(reader.pages) > 20
          assert not [i + 1 for i, text in enumerate(page_texts) if len(text) < 10]
          assert 'Module I' in pdf_text and 'Module IV' in pdf_text and 'Component Atlas' in pdf_text
          rendered_text = rendered.read_text(encoding='utf-8', errors='replace')
          assert 'Elementary Concepts of Electronics' in rendered_text
          assert 'Module I' in rendered_text and 'Module IV' in rendered_text

          direct_prefix = direct.read_text(encoding='utf-8', errors='replace')[:200] if direct.exists() else ''
          cloudflare_challenge = '$direct_html_code' == '403' and 'Just a moment' in direct_prefix
          report = {
              'course': '1041',
              'htmlUrl': 'https://polypmna.dpdns.org/revision-2026-content/lessons/lessons-1041.html',
              'pdfUrl': 'https://polypmna.dpdns.org/revision-2026-content/notes/downloadable-notes-1041.pdf',
              'directHtmlHttpCodeFromGitHubRunner': '$direct_html_code',
              'directHtmlCloudflareBotChallenge': cloudflare_challenge,
              'externalRenderedHtmlVerified': True,
              'renderedCharacters': len(rendered_text),
              'pdfHttpCode': '$pdf_code',
              'pdfBytes': pdf.stat().st_size,
              'pdfSha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'pdfPages': len(reader.pages),
              'pdfCharacters': sum(len(text) for text in page_texts),
              'blankPages': [],
              'htmlContentVerified': True,
              'pdfOpened': True,
              'status': 'passed',
              'note': 'The custom domain presents a Cloudflare browser challenge to GitHub-hosted curl requests; handbook content was verified through an external rendered fetch and the live PDF was fetched directly from the custom domain.',
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/course-1041-live-verification.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Commit final report and remove temporary verification files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/course-1041-live-verification.json /tmp/course-1041-live-verification.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/course-1041-live-verification.json reports/course-1041-live-verification.json
            rm -f .github/workflows/course-1041-finalize-verification.yml
            rm -f .github/workflows/course-1041-live-verify.yml
            rm -f .github/workflows/course-1041-live-status.yml
            rm -f reports/course-1041-live-run-status.json
            git add -A
            git commit -m "Complete Course 1041 live deployment verification"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
