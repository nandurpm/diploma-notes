name: Assemble REV2026 1008 handbook

on:
  push:
    branches: [main]
    paths:
      - ".upload/rev2026-1008/**"
      - ".github/workflows/assemble-rev2026-1008.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-rev2026-1008
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[assembled-1008]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify handbook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import shutil

          root = Path('.upload/rev2026-1008')
          chunks = sorted(root.glob('chunk-*.txt'))
          if len(chunks) != 6:
              raise SystemExit(f'Expected 6 chunks, found {len(chunks)}')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          data = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(data).hexdigest()
          expected = '397af91c7f6ed6e57fb98a11fc335bb55cc8c50b712943313f4264ebbc33baa2'
          if digest != expected:
              raise SystemExit(f'SHA mismatch: {digest}')

          target = Path('revision-2026-content/lessons/lessons-1008.html')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)

          stale_pdf = Path('revision-2026-content/notes/downloadable-notes-1008.pdf')
          if stale_pdf.exists():
              stale_pdf.unlink()

          shutil.rmtree(root)
          Path('.github/workflows/assemble-rev2026-1008.yml').unlink()
          print(f'Wrote {target} ({len(data)} bytes, {digest}) and removed stale notes PDF')
          PY

      - name: Commit assembled handbook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "Complete REV2026 1008 Foundational IT Skills handbook [assembled-1008]"
          git pull --rebase origin main
          git push origin HEAD:main
