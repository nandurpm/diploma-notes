name: Course 1041 workflow diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh publication status comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh run list --repo nandurpm/diploma-notes --workflow run-course-1041-on-issue.yml --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,event,createdAt,url)"
          body="$(printf 'Current Course 1041 publication workflow status:\n\n```json\n%s\n```' "$status")"
          gh api --method PATCH repos/nandurpm/diploma-notes/issues/comments/4992023119 -f body="$body"
