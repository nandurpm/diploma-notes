name: Course 1041 workflow diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh failed publication log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 29499640611 --repo nandurpm/diploma-notes --log-failed > /tmp/course-1041-full.log || true
          tail -n 120 /tmp/course-1041-full.log > /tmp/course-1041-tail.log
          body="$(printf 'Latest Course 1041 failed workflow log:\n\n```text\n%s\n```' "$(cat /tmp/course-1041-tail.log)")"
          gh api --method PATCH repos/nandurpm/diploma-notes/issues/comments/4992036997 -f body="$body"
