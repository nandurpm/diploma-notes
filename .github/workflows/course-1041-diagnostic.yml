name: Course 1041 workflow diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report publication workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh run list --repo nandurpm/diploma-notes --workflow run-course-1041-on-issue.yml --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,event,createdAt,url)"
          {
            echo "Course 1041 publication workflow status:"
            echo
            echo '```json'
            echo "$status"
            echo '```'
          } > /tmp/course-1041-status.md
          gh issue comment 38 --repo nandurpm/diploma-notes --body-file /tmp/course-1041-status.md
