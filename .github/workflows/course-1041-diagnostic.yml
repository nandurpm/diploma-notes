name: Course 1041 workflow diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report failed publication log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 29499156785 --repo nandurpm/diploma-notes --log-failed > /tmp/course-1041-full.log || true
          tail -n 120 /tmp/course-1041-full.log > /tmp/course-1041-tail.log
          {
            echo "Course 1041 failed workflow log tail:"
            echo
            echo '```text'
            cat /tmp/course-1041-tail.log
            echo '```'
          } > /tmp/course-1041-log.md
          gh issue comment 38 --repo nandurpm/diploma-notes --body-file /tmp/course-1041-log.md
