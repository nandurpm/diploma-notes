name: Course 1041 payload diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course-1041-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Concatenate staged payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path.cwd()
          payload_dir = root / "tools" / ".course-1041-payload"
          parts = sorted(
              payload_dir.glob("part-*.txt"),
              key=lambda path: tuple(int(value) for value in re.findall(r"\d+", path.stem)),
          )
          if not parts:
              raise SystemExit("No Course 1041 payload parts found")
          payload = "".join(path.read_text(encoding="utf-8").strip() for path in parts)
          output = root / "reports" / "course-1041-staged-payload.txt"
          output.parent.mkdir(exist_ok=True)
          output.write_text(payload, encoding="ascii")
          print({"parts": len(parts), "characters": len(payload), "sha256": hashlib.sha256(payload.encode()).hexdigest()})
          PY

      - name: Commit exported payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/course-1041-staged-payload.txt
          git commit -m "Export Course 1041 staged payload [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
