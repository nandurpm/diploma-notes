name: Fix Mathematics II handbook answers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-lessons-2002-math.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct verified mathematics answers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lessons/lessons-2002.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<p>Δ=4, Δx=4, Δy=8, Δz=12.</p>'
          new1 = '<p>Δ=6, Δx=6, Δy=12, Δz=18.</p>'
          old2 = '<li>-3</li><li>[10 -1;12 -3]</li>'
          new2 = '<li>-1</li><li>[10 -1;12 -3]</li>'
          assert old1 in s, 'Solved-bank determinant text not found'
          assert old2 in s, 'Practice answer text not found'
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          assert 'Δ=6, Δx=6, Δy=12, Δz=18.' in s
          assert '<li>-1</li><li>[10 -1;12 -3]</li>' in s
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-lessons-2002-math.yml

      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct Mathematics II worked answers'
          git push origin HEAD:main
