name: Package Android application

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-android.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build application package
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Store application package
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Polytechnic-Study-Hub-v1.0.0.apk
          sha256sum downloads/Polytechnic-Study-Hub-v1.0.0.apk > downloads/Polytechnic-Study-Hub-v1.0.0.sha256.txt
          rm -f .github/workflows/package-android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Polytechnic Study Hub Android package"
          git push origin main
