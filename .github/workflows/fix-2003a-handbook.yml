name: Fix Course 2003A handbook UI

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_2003a_handbook_ui.py'
      - '.github/workflows/fix-2003a-handbook.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-course-2003a-handbook
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repair script
        run: python -m py_compile tools/fix_2003a_handbook_ui.py
      - name: Repair and validate handbook
        run: |
          python tools/fix_2003a_handbook_ui.py
          python - <<'PY'
          from pathlib import Path
          text = Path('revision-2026-content/lessons/lessons-2003A.html').read_text(encoding='utf-8')
          required = [
              '.top-select option,.top-select optgroup{color:#172033;background:#fff}',
              'Sample',
              "summary span:first-child",
              "const units={atomic:'',molarity:' mol L⁻¹'",
              "document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSide()})",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing expected repairs: {missing}')
          if '<meta name="course-code" content="2003A">' not in text or '<meta name="curriculum" content="REV2026">' not in text:
              raise SystemExit('Course identity guard failed')
          print('Course 2003A repair validation passed.')
          PY
      - name: Commit repair and remove one-time runner
        run: |
          git config user.name 'poly-pmna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add revision-2026-content/lessons/lessons-2003A.html
          git rm tools/fix_2003a_handbook_ui.py .github/workflows/fix-2003a-handbook.yml
          git commit -m 'Fix Course 2003A handbook navigation and calculators'
          git push
