    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Principles of Electronic Communication 3042 | Engineering Handbook</h1><a class='revision-back-button' href='../revision-2021.html'>← Back to Revision 2021</a><div id='root'></div><script>
window.HB_DATA={code:'3042',title:'Principles of Electronic Communication',program:'Diploma in Electronics / Electronics and Communication Engineering',semester:'3',credits:'3',periods:'45',category:'Program Core',watermark:'AM FM PCM RX TX',visualTitle:'Communication system view',mainDiagram:'comm',visualCaption:'Information signal is shifted, transmitted, received and recovered.',intro:'This corrected edition treats 3042 as an engineering communication textbook. It explains AM, FM, sampling, pulse modulation, antennas, transmitters, receivers, noise and demodulation with block diagrams, spectra, formulas, numerical problems and answer patterns.',malayalam:'ഇത് communication subject ന്റെ formula list മാത്രം അല്ല. Signal, carrier, spectrum, bandwidth, power, noise, antenna, transmitter, receiver flow എന്നിവ diagram സഹിതം പഠിക്കണം.',objectives:['Introduce electronic communication and need of modulation.','Explain AM, FM and pulse modulation schemes.','Understand antenna role and radiation concepts.','Explain working of AM and FM transmitters and receivers.'],prerequisites:['Active and passive component basics.','Power, RMS, peak values and signal representation.','Integration, differentiation, trigonometry and mathematical signal forms.','Amplifiers, oscillators and switching circuits.'],outcomes:[{co:'CO1',text:'Solve AM and FM parameters from signal data.',hours:'11',meaning:'Calculate modulation index, sideband frequency, bandwidth and transmitted power.'},{co:'CO2',text:'Explain pulse modulation and antennas.',hours:'11',meaning:'Understand sampling, PAM, PWM, PPM, PCM and antenna parameters.'},{co:'CO3',text:'Explain AM and FM transmitters.',hours:'11',meaning:'Draw blocks of transmitters, modulators, pre-emphasis and noise sources.'},{co:'CO4',text:'Illustrate AM and FM receivers.',hours:'10',meaning:'Explain superheterodyne receiver, IF, detector, AGC and receiver characteristics.'}],quick:[['AM','Carrier amplitude varies with message.'],['FM','Carrier frequency varies with message.'],['Sampling','Minimum rate is twice highest signal frequency.'],['Antenna','Converts electrical signal and EM wave.'],['Superheterodyne','RF is converted to fixed IF.']],chapters:[{co:'CO1',hours:'11',short:'M1 AM and FM',title:'Amplitude modulation and frequency modulation parameters',core:'Modulation concept, AM wave, AM power, sidebands, DSBSC, SSB, VSB, FM spectrum and comparison.',mustDraw:'AM waveform, AM spectrum, FM spectrum, modulation classification tree.',mustSolve:'AM index, sideband frequencies, AM power, bandwidth, FM deviation and Carson bandwidth.',diagram:'comm',visual:'Carrier plus information signal and modulated signal idea.',opening:'Modulation is used because baseband signals cannot be transmitted efficiently over long distance. The message is shifted to a high frequency carrier.',explanation:['In amplitude modulation, carrier amplitude changes according to the message while frequency and phase remain constant.','AM spectrum contains carrier, upper sideband and lower sideband. The sidebands carry information. Carrier consumes power but does not carry information.','In frequency modulation, carrier frequency changes according to the message amplitude. FM has better noise immunity than AM.','Bandwidth, modulation index and power calculations are the scoring area of this module.'],ml:'AM/FM പഠിക്കുമ്പോൾ waveform, spectrum, formula, unit എന്നിവ വേർതിരിച്ചു പഠിക്കണം. Sideband frequency തെറ്റിച്ചാൽ numerical മുഴുവനും തെറ്റും.',subtopics:[{title:'Need of modulation',text:'Makes antenna size practical and avoids mixing of signals.',points:['Frequency translation.','Multiplexing possible.','Radiation efficiency improves.']},{title:'AM wave',text:'Amplitude of carrier varies with message.',points:['Modulation index m.','Carrier plus two sidebands.','BW = 2f<sub>m</sub>.']},{title:'AM power',text:'Power is distributed in carrier and sidebands.',points:['Carrier power is constant.','Sideband power increases with m.','Over modulation causes distortion.']},{title:'FM wave',text:'Frequency deviation represents message.',points:['Modulation index β = Δf/f<sub>m</sub>.','Better noise performance.','Uses limiter in receiver.']},{title:'DSBSC, SSB, VSB',text:'Bandwidth and power saving forms.',points:['DSBSC suppresses carrier.','SSB transmits one sideband.','VSB partly transmits one sideband.']},{title:'AM vs FM',text:'Compare bandwidth, noise and circuit complexity.',points:['AM narrow bandwidth.','FM wider bandwidth.','FM high fidelity.']}],formulas:['AM modulation index: m = V<sub>m</sub>/V<sub>c</sub>','AM bandwidth: BW = 2f<sub>m</sub>','AM total power: P<sub>t</sub> = P<sub>c</sub>(1 + m<sup>2</sup>/2)','FM modulation index: β = Δf/f<sub>m</sub>','Carson rule: BW = 2(Δf + f<sub>m</sub>)'],mistakes:['Confusing carrier frequency and modulating frequency.','Forgetting that AM has two sidebands.','Using percentage modulation without converting to decimal.','Writing FM bandwidth as 2fm for every case.'],examples:[{q:'Carrier is 1 MHz and audio is 5 kHz. Find AM sidebands.',solution:'USB = 1000 kHz + 5 kHz = 1005 kHz. LSB = 1000 kHz - 5 kHz = 995 kHz.'},{q:'FM deviation is 75 kHz and modulating frequency is 15 kHz. Find bandwidth using Carson rule.',solution:'BW = 2(75 + 15) kHz = 180 kHz.'}],questions:['Classify modulation techniques.','Derive AM wave expression and draw AM spectrum.','Solve AM modulation index, bandwidth and power problems.','Explain DSBSC, SSB and VSB.','Explain FM spectrum and Carson bandwidth.','Compare AM and FM.']},{co:'CO2',hours:'11',short:'M2 Pulse and Antenna',title:'Sampling, pulse modulation and antenna fundamentals',core:'Sampling theorem, PAM, PWM, PPM, PCM, radiation concept, antenna parameters, microwave and microstrip antennas.',mustDraw:'Sampling waveform, PAM/PWM/PPM comparison, antenna radiation pattern.',mustSolve:'Minimum sampling rate and Nyquist rate problems.',diagram:'comm',visual:'Sampling and pulse modulation as time-domain representation.',opening:'Pulse modulation prepares analog information for digital and time-sampled communication. Antenna is the conversion point between circuit signal and electromagnetic wave.',explanation:['Sampling theorem states that sampling frequency must be at least twice the highest frequency present in the message.','PAM changes pulse amplitude, PWM changes pulse width, PPM changes pulse position and PCM represents samples using digital code.','Antenna radiation pattern shows how energy is radiated in space. Antenna parameters include gain, directivity, bandwidth, polarization and radiation resistance.','Microstrip antennas are compact and widely used in modern communication devices.'],ml:'Sampling theorem simple ആണെങ്കിലും practical importance വലുതാണ്. fs < 2fm ആണെങ്കിൽ aliasing വരും.',subtopics:[{title:'Sampling theorem',text:'Minimum sampling rate prevents aliasing.',points:['f<sub>s</sub> ≥ 2f<sub>m</sub>.','Nyquist rate is 2fm.','Anti-aliasing filter is used before sampling.']},{title:'PAM',text:'Pulse amplitude varies with signal.',points:['Simple but noise sensitive.','Used as intermediate step in PCM.']},{title:'PWM',text:'Pulse width varies with signal.',points:['Amplitude remains constant.','Useful in power and control systems.']},{title:'PPM',text:'Pulse position varies with signal.',points:['Good noise immunity.','Needs synchronization.']},{title:'PCM',text:'Sample, quantize and encode.',points:['Digital transmission.','Needs higher bandwidth.','Good noise immunity.']},{title:'Antenna parameters',text:'Gain, radiation pattern, directivity and polarization.',points:['Antenna length depends on wavelength.','Radiation pattern shows direction.','Microstrip antenna is low-profile.']}],formulas:['Sampling condition: f<sub>s</sub> ≥ 2f<sub>m</sub>','Wavelength: λ = c/f','Approximate half-wave antenna length: L = λ/2'],mistakes:['Writing sampling frequency equal to signal frequency.','Not explaining aliasing.','Confusing PAM and PWM.','Drawing antenna as only a wire without radiation pattern.'],examples:[{q:'An audio signal has highest frequency 4 kHz. Find minimum sampling frequency.',solution:'f<sub>s</sub> = 2f<sub>m</sub> = 8 kHz.'},{q:'Find wavelength for 100 MHz signal.',solution:'λ = c/f = 3×10<sup>8</sup> / 100×10<sup>6</sup> = 3 m.'}],questions:['State sampling theorem and explain its significance.','Compare PAM, PWM, PPM and PCM.','Explain aliasing and Nyquist rate.','Explain radiation pattern and antenna parameters.','Explain microwave and microstrip antennas.']},{co:'CO3',hours:'11',short:'M3 Transmitters',title:'AM and FM transmitters, modulators and noise',core:'AM low level and high level transmitters, collector modulator, balanced modulator, Armstrong FM transmitter, pre-emphasis, de-emphasis and noise.',mustDraw:'AM transmitter block, FM transmitter block, collector modulator, balanced modulator, pre-emphasis circuit.',mustSolve:'SNR and noise comparison concept questions.',diagram:'receiver',visual:'Transmitter and receiver block thinking.',opening:'A transmitter is not one amplifier. It is an arranged chain of oscillator, modulator, frequency multiplier, power amplifier and antenna matching blocks.',explanation:['Low-level AM modulation is done before power amplification. High-level AM modulation is done at high power stage.','Balanced modulator suppresses carrier and generates DSBSC signal. Collector modulator varies collector voltage of RF power amplifier.','Armstrong method generates FM indirectly using phase modulation and frequency multiplication.','Noise may be external or internal. FM uses pre-emphasis and de-emphasis to improve high-frequency SNR.'],ml:'Transmitter block diagram answer-ൽ signal flow arrow, block purpose, modulation point, antenna output എന്നിവ എഴുതണം.',subtopics:[{title:'AM transmitter',text:'Generates and amplifies AM signal.',points:['Low-level modulation.','High-level modulation.','RF power amplifier feeds antenna.']},{title:'Collector modulator',text:'Modulates collector supply of RF amplifier.',points:['High level AM.','Good power handling.']},{title:'Balanced modulator',text:'Suppresses carrier.',points:['Used for DSBSC.','Saves carrier power.']},{title:'FM transmitter',text:'Armstrong method and frequency multiplication.',points:['Stable crystal oscillator.','Phase modulation to FM conversion.','Frequency multipliers increase deviation.']},{title:'Pre-emphasis',text:'Boosts high audio frequencies before transmission.',points:['Improves SNR.','Receiver uses de-emphasis.']},{title:'Noise',text:'Unwanted signal in communication system.',points:['External noise.','Internal noise.','Signal-to-noise ratio.']}],formulas:['SNR = signal power / noise power','SNR in dB = 10 log<sub>10</sub>(S/N)','Noise figure indicates degradation of SNR by a receiver or stage.'],mistakes:['Mixing modulator and demodulator.','Not differentiating low-level and high-level AM transmitter.','Forgetting de-emphasis in receiver.','Writing only noise definition without types.'],examples:[{q:'Why balanced modulator is used?',solution:'It suppresses carrier and produces DSBSC signal, saving transmitted power compared with ordinary AM.'},{q:'Why pre-emphasis is used in FM?',solution:'Noise effect is higher at high audio frequencies, so high-frequency audio components are boosted before transmission and corrected by de-emphasis at receiver.'}],questions:['Explain AM transmitter low-level and high-level types.','Explain collector modulator.','Explain balanced modulator.','Explain Armstrong FM transmitter.','Explain pre-emphasis and de-emphasis.','Classify noise in communication systems.']},{co:'CO4',hours:'10',short:'M4 Receivers',title:'AM and FM receivers, demodulation and AGC',core:'Receiver characteristics, superheterodyne receiver, AM and FM receiver blocks, choice of IF, diode detector, simple and delayed AGC.',mustDraw:'Superheterodyne receiver, AM receiver block, FM receiver block, diode detector and AGC block.',mustSolve:'Receiver characteristics and IF reasoning questions.',diagram:'receiver',visual:'Superheterodyne receiver chain.',opening:'Receiver quality is measured using selectivity, sensitivity, fidelity and noise figure. The superheterodyne receiver converts any selected RF station to a fixed IF.',explanation:['Selectivity is ability to reject unwanted nearby signals. Sensitivity is ability to receive weak signals. Fidelity is faithful reproduction of original signal.','Superheterodyne receiver uses mixer and local oscillator to produce fixed IF. Fixed IF gives stable gain and filtering.','AM demodulation can be done using diode detector. AGC keeps output nearly constant when received signal strength changes.','FM receiver includes limiter, discriminator or detector and de-emphasis network.'],ml:'Receiver answer-ൽ RF amplifier, mixer, local oscillator, IF amplifier, detector, AF amplifier എന്ന flow വരണം.',subtopics:[{title:'Selectivity',text:'Ability to select desired signal.',points:['Depends on tuned circuits and IF filters.']},{title:'Sensitivity',text:'Ability to receive weak signal.',points:['Improved by RF and IF gain.']},{title:'Fidelity',text:'Faithful reproduction of original signal.',points:['Depends on bandwidth and distortion.']},{title:'Superheterodyne',text:'RF converted to fixed IF.',points:['Mixer plus local oscillator.','IF amplification gives stable performance.']},{title:'AM detector',text:'Diode detector recovers envelope.',points:['Needs RC time constant selection.','Used for AM demodulation.']},{title:'AGC',text:'Automatic gain control.',points:['Simple AGC.','Delayed AGC for stronger signals.']}],formulas:['For high-side injection: f<sub>LO</sub> = f<sub>RF</sub> + f<sub>IF</sub>','For low-side injection: f<sub>LO</sub> = f<sub>RF</sub> - f<sub>IF</sub>','Receiver quality terms: selectivity, sensitivity, fidelity and noise figure.'],mistakes:['Spelling and concept error: superheterodyne, not superhetrodyne.','Not explaining why IF is used.','Drawing transmitter block when asked receiver.','Confusing AGC with audio volume control.'],examples:[{q:'Why fixed IF is used in superheterodyne receiver?',solution:'Fixed IF allows high gain and sharp filtering at one constant frequency for all received stations.'},{q:'What is the function of AGC?',solution:'AGC changes receiver gain automatically so output remains nearly constant even when input signal strength varies.'}],questions:['Define selectivity, sensitivity, fidelity and noise figure.','Explain superheterodyne receiver with block diagram.','Explain AM receiver and FM receiver blocks.','Explain choice of IF in receivers.','Explain diode detector and AGC.','Compare AM and FM receivers.']}],visuals:[{title:'Modulation concept',type:'comm',caption:'Carrier is modified by information signal.',note:'This diagram supports AM, FM and PM explanation.'},{title:'Superheterodyne receiver',type:'receiver',caption:'RF is converted into fixed IF before detection.',note:'Use this block in receiver answers.'},{title:'Spectrum thinking',type:'comm',caption:'Sidebands carry information around carrier.',note:'Most AM numerical questions come from this view.'},{title:'General signal chain',type:'default',caption:'Source, transmitter, channel, receiver and destination.',note:'Never write transmitter or receiver answers without signal flow.'}],problems:[{title:'AM sidebands',q:'Carrier frequency is 800 kHz and modulating frequency is 5 kHz. Find sideband frequencies.',steps:['Upper sideband = fc + fm.','Lower sideband = fc - fm.','Substitute fc = 800 kHz and fm = 5 kHz.'],ans:'USB = 805 kHz, LSB = 795 kHz'},{title:'AM total power',q:'Carrier power is 100 W and modulation index is 0.6. Find total AM power.',steps:['Use Pt = Pc(1 + m²/2).','m²/2 = 0.36/2 = 0.18.','Pt = 100 × 1.18.'],ans:'118 W'},{title:'FM bandwidth',q:'Frequency deviation is 60 kHz and maximum audio frequency is 10 kHz. Find bandwidth.',steps:['Use Carson rule BW = 2(Δf + fm).','Substitute 60 kHz and 10 kHz.'],ans:'140 kHz'},{title:'Sampling rate',q:'Highest frequency in message is 3.4 kHz. Find minimum sampling frequency.',steps:['Use Nyquist sampling condition.','fs must be at least 2fm.'],ans:'6.8 kHz minimum'}],modelPaper:'COURSE 3042 PRINCIPLES OF ELECTRONIC COMMUNICATION\nTime: 3 Hours    Maximum Marks: 100\n\nPART A\n1. Define modulation.\n2. What is modulation index in AM?\n3. Define frequency deviation.\n4. State sampling theorem.\n5. Name four pulse modulation schemes.\n6. Define antenna gain.\n7. What is pre-emphasis?\n8. Define signal-to-noise ratio.\n9. What is selectivity?\n10. What is AGC?\n\nPART B\n11. Explain need of modulation.\n12. Derive AM bandwidth and draw spectrum.\n13. Solve AM power problem from given carrier power and m.\n14. Compare PAM, PWM, PPM and PCM.\n15. Explain antenna parameters.\n16. Explain AM transmitter block diagram.\n17. Explain balanced modulator.\n18. Explain receiver characteristics.\n\nPART C\n19. Explain AM and FM techniques with formulas and comparison.\n20. Explain sampling theorem, aliasing and PCM.\n21. Explain microwave and microstrip antennas.\n22. Explain Armstrong FM transmitter and noise reduction.\n23. Explain superheterodyne receiver and choice of IF.\n24. Explain diode detector and AGC.\n25. Compare AM and FM receivers.\n26. Solve one AM numerical and one FM bandwidth numerical.',answerGuide:['For modulation questions draw time waveform and frequency spectrum.','For numerical answers write formula, substitution, unit and final answer.','For antenna questions include radiation pattern and parameters.','For receiver questions draw block diagram and explain each block in order.'],references:[['T1','Electronic Communication Systems - George Kennedy - TMH'],['T2','Electronic Communications - Roddy and Coolen - PHI'],['R1','Electronic Communication Systems - Frank R Dungan'],['R2','Electronic Communication Systems - Wayne Tomasi'],['R3','Communication Systems Analog and Digital - Sanjay Sharma'],['Online','NPTEL 117105143 and selected communication system resources']]};document.write('<script id=\'courseData\' type=\'application/json\'>'+JSON.stringify(window.HB_DATA).replace(/</g,'\\u003c')+'<\/script>');
