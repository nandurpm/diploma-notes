<script>
window.HB_DATA={
code:'5042',title:'Industrial Automation',program:'Diploma in Electronics Engineering / Electronics and Communication Engineering',semester:'5',credits:'4',periods:'60',category:'Program Core / Elective',watermark:'PLC SCR IGBT DRIVE UPS',visualTitle:'Factory automation view',mainDiagram:'plc',visualCaption:'Sensor input, PLC logic, power converter and motor or process load working as one system.',
intro:'This is the corrected engineering textbook edition for Industrial Automation 5042. It is not a school notebook. It links power semiconductor devices, converter circuits, industrial drives, heating, UPS systems and PLC ladder programs using diagrams, waveform thinking, field examples, solved numerical problems and answer-writing patterns.',
malayalam:'ഈ lesson ഒരു short note അല്ല. Device symbol മാത്രം പഠിച്ചാൽ മതി എന്ന സമീപനം തെറ്റാണ്. Gate drive, current path, waveform, protection, industrial load, PLC sequence എന്നിവ ഒരുമിച്ച് മനസ്സിലാക്കണം.',
objectives:['Understand the structure, concepts and applications of power semiconductor devices.','Explain how controlled rectifiers, inverters, cycloconverters and choppers control industrial power.','Connect power electronics to drives, heating, welding and UPS systems.','Develop PLC ladder programs for real-time automation applications.'],
prerequisites:['Semiconductor Physics from Basic Electronics 2041.','Amplifiers and Oscillators from Electronic Circuits 3043.','Electrical fundamentals from Electric Circuits and Networks 3041.','Logic circuits from Digital Electronics 3044.'],
outcomes:[{co:'CO1',text:'Illustrate structure and operation of power semiconductor devices.',hours:'16',meaning:'Choose and explain MOSFET, IGBT, SCR, DIAC, TRIAC, triggering and commutation.'},{co:'CO2',text:'Explain controlled rectifiers, inverters, cycloconverters and choppers.',hours:'16',meaning:'Read converter circuits, current path, firing angle and waveform effect.'},{co:'CO3',text:'Illustrate industrial applications of power semiconductor devices.',hours:'13',meaning:'Use converters in drives, heating, welding and UPS.'},{co:'CO4',text:'Develop PLC ladder program for an application.',hours:'13',meaning:'Convert process sequence into safe ladder logic with inputs, outputs and interlocks.'}],
quick:[['SCR','Gate turns ON; current below holding current turns OFF.'],['TRIAC','Bidirectional AC power control device.'],['Chopper','Fixed DC to variable DC using duty cycle.'],['VFD','Controls AC motor speed by changing voltage and frequency.'],['PLC','Input scan, logic solve, output update.']],
chapters:[{co:'CO1',hours:'16',short:'M1 Power Devices',title:'Power semiconductor devices, SCR triggering and commutation',core:'Power MOSFET, IGBT, SCR, DIAC, TRIAC, triggering and commutation.',mustDraw:'MOSFET symbol, IGBT symbol, SCR PNPN structure, two-transistor analogy, DIAC and TRIAC symbol, commutation block sketches.',mustSolve:'Device selection, SCR current terms, gate triggering comparison.',diagram:'device',visual:'Power switching device as gate control plus load current path.',opening:'Industrial automation depends on reliable high-power switches. A power device is not only a symbol in the textbook; it is a gate-drive problem, a heat problem and a protection problem.',explanation:['Power MOSFET is a voltage-controlled majority carrier device. It is fast and suitable for low-to-medium voltage choppers, SMPS and DC control. Its conduction loss is mainly decided by RDS(on).','IGBT combines MOS gate control and bipolar conduction. It is widely used in VFDs, UPS inverters and medium-power drives because it handles higher voltage and current effectively.','SCR is a controlled rectifier with PNPN structure. Once triggered, it latches ON and cannot be turned OFF by removing gate signal. Current must fall below holding current or forced commutation must be applied.','DIAC is a bidirectional trigger device. TRIAC is a bidirectional AC power control device used in heater control, fan regulators and lamp dimmers.'],ml:'SCR gate pulse ON ചെയ്യാൻ മാത്രം ഉപയോഗിക്കുന്നു. OFF ചെയ്യാൻ holding current ക്ക് താഴെ current കുറയ്ക്കണം അല്ലെങ്കിൽ commutation circuit വേണം.',subtopics:[{title:'Power MOSFET',text:'High-speed voltage-controlled switch.',points:['Gate, drain and source terminals.','Excellent for choppers and SMPS.','Low gate current but gate capacitance must be driven.']},{title:'IGBT',text:'High-power switch used in inverters and VFDs.',points:['Gate, collector and emitter terminals.','Better for high voltage power control.','Needs proper gate resistor and heat sink.']},{title:'SCR',text:'Controlled rectifier that latches after triggering.',points:['Anode, cathode and gate.','Holding current and latching current are key terms.','Used in controlled rectifiers and AC controllers.']},{title:'Triggering',text:'Methods that start conduction.',points:['Gate triggering is normal method.','R, RC and UJT triggering shape firing angle.','dv/dt and thermal triggering may be unwanted.']},{title:'Commutation',text:'Turning OFF a conducting SCR.',points:['Natural commutation in AC circuits.','Forced commutation in DC circuits.','Class A to F methods are asked in exams.']},{title:'DIAC and TRIAC',text:'Bidirectional AC control devices.',points:['DIAC often triggers TRIAC.','TRIAC controls both half cycles.','Snubber is important with inductive load.']}],formulas:['MOSFET conduction loss: P<sub>cond</sub> = I<sup>2</sup>R<sub>DS(on)</sub>','SCR turns OFF when I<sub>A</sub> falls below I<sub>H</sub> for required turn-off time.','dv/dt false triggering happens due to junction capacitance current.'],mistakes:['Thinking gate can turn SCR OFF.','Not mentioning holding current and latching current.','Drawing TRIAC as a simple diode instead of bidirectional thyristor.','Ignoring snubber requirement for inductive loads.'],examples:[{q:'Why is IGBT preferred in VFD inverter power stage?',solution:'A VFD needs switching of high DC bus voltage and motor current. IGBT provides easy voltage gate control and better high-voltage current handling than ordinary MOSFET, so it is widely used in inverter bridges.'},{q:'Explain SCR latching with two transistor analogy.',solution:'The PNP and NPN equivalent transistors feed each other. A small gate current increases one transistor current, which drives the other transistor. This regenerative action keeps both transistors ON after triggering.'}],questions:['Explain construction and working of SCR with V-I characteristics.','Compare power MOSFET and IGBT.','Explain two transistor analogy of SCR.','Explain R, RC and UJT triggering methods.','Describe Class A to Class F commutation techniques.','Explain DIAC and TRIAC with applications.']},{co:'CO2',hours:'16',short:'M2 Converters',title:'Controlled rectifiers, inverters, cycloconverters and choppers',core:'Single phase controlled rectifiers, AC power control, inverter circuits, dual converter, cycloconverter and chopper.',mustDraw:'Half wave controlled rectifier, full bridge, freewheeling diode, inverter block, chopper waveform.',mustSolve:'Firing angle effect, duty cycle output voltage, step-down and step-up chopper problems.',diagram:'rectifier',visual:'Firing angle and output waveform of controlled rectifier.',opening:'Converter circuits are the centre of industrial power control. The key is to follow current path and waveform change, not to memorize circuit names only.',explanation:['Controlled rectifier converts AC to controlled DC by delaying SCR firing angle. Increasing firing angle reduces the average output voltage.','With R load, current follows voltage. With RL load, current continues due to inductance. A freewheeling diode gives current a safe path and improves load current continuity.','Inverter converts DC to AC. Series and parallel inverters illustrate commutation and waveform formation.','Chopper converts fixed DC into variable DC using switching. Cycloconverter directly changes AC frequency using controlled devices.'],ml:'Converter answer എഴുതുമ്പോൾ circuit മാത്രം മതിയല്ല. Current path, firing angle, waveform, load effect, application എന്നിവ ചേർക്കണം.',subtopics:[{title:'Half-wave controlled rectifier',text:'One SCR controls positive half cycle.',points:['Simple circuit.','Used for low power control.','Average output depends on firing angle.']},{title:'Full-wave controlled rectifier',text:'Provides better DC output using both half cycles.',points:['Bridge or midpoint connection.','R and RL load waveforms differ.','Used in DC drives and chargers.']},{title:'Freewheeling diode',text:'Inductive load current path during OFF period.',points:['Reduces voltage spikes.','Improves current continuity.','Protects power device.']},{title:'Inverter',text:'DC to AC converter.',points:['Used in UPS and drives.','Series and parallel types are syllabus topics.','Output waveforms must be drawn.']},{title:'Cycloconverter',text:'Direct AC to AC frequency converter.',points:['Useful in low-speed high-power drives.','Can be step-up or step-down frequency concept.','Output is made from supply segments.']},{title:'Chopper',text:'Fixed DC to variable DC.',points:['Duty cycle controls output.','Step-up and step-down types.','Used in DC motor speed control.']}],formulas:['Half-wave controlled rectifier: V<sub>avg</sub> = (V<sub>m</sub>/2π)(1 + cos α)','Full controlled bridge continuous mode: V<sub>avg</sub> = (2V<sub>m</sub>/π)cos α','Step-down chopper: V<sub>o</sub> = D V<sub>s</sub>','Step-up chopper: V<sub>o</sub> = V<sub>s</sub>/(1-D)'],mistakes:['Forgetting freewheeling diode in RL load answer.','Writing chopper as AC converter. It is DC to DC.','Not showing waveform after firing angle delay.','Confusing inverter and rectifier direction of conversion.'],examples:[{q:'A 220 V DC supply feeds a step-down chopper with duty cycle 0.4. Find output voltage.',solution:'V<sub>o</sub> = D V<sub>s</sub> = 0.4 × 220 = 88 V.'},{q:'What happens when firing angle increases in a controlled rectifier?',solution:'The SCR conducts later in the cycle. The conduction period reduces and average DC output voltage decreases.'}],questions:['Explain single phase half wave controlled rectifier with R and RL load.','Explain full wave controlled bridge rectifier with waveform.','Explain AC power control using SCR and TRIAC.','Describe series and parallel inverter circuits.','Explain dual converter and cycloconverter.','Explain step-up, step-down and Jones chopper.']},{co:'CO3',hours:'13',short:'M3 Drives and UPS',title:'Industrial applications of power semiconductor devices',core:'AC and DC drives, speed control, industrial heating, resistance welding, online and offline UPS.',mustDraw:'AC drive block, DC drive block, induction heating setup, online UPS block, offline UPS block.',mustSolve:'Drive comparison table, V/f control explanation, UPS selection question.',diagram:'device',visual:'Power electronics applications from converter to load.',opening:'This module links the devices and converters to real machines. The important question is what is controlled: voltage, current, frequency, torque, speed or heat.',explanation:['DC drives control speed by armature voltage, field control or resistance method. They offer good torque but need brush maintenance.','AC drives are now common because induction motors are rugged and VFDs provide smooth speed control using VVVF principle.','Induction heating uses induced eddy currents. Dielectric heating uses high-frequency electric field in insulating materials. Resistance welding uses heat generated at joint resistance.','Online UPS supplies load through inverter continuously. Offline UPS supplies load from mains normally and changes to inverter during failure.'],ml:'Industrial application answer-ൽ principle, block diagram, merits, applications എന്നിവ ചേർക്കണം. Example കൊടുക്കാത്ത answer weak ആയിരിക്കും.',subtopics:[{title:'AC vs DC drives',text:'Comparison based on motor, control, maintenance and application.',points:['AC drive uses induction or synchronous motor.','DC drive gives simple torque control.','Modern industry prefers VFD for many loads.']},{title:'VVVF control',text:'Voltage and frequency are changed together.',points:['Maintains air-gap flux.','Smooth speed control.','Used in conveyors, pumps, fans and escalator drives.']},{title:'Induction heating',text:'Eddy current heat generation.',points:['Fast localized heating.','Used for hardening and melting.','No direct flame needed.']},{title:'Dielectric heating',text:'Heating of insulating material by electric field.',points:['Used for wood, plastic and rubber.','Uniform internal heating.','High-frequency source required.']},{title:'Resistance welding',text:'Heat at joint due to high current and contact resistance.',points:['Spot, seam and projection welding.','Needs pressure and current control.','No filler material required.']},{title:'UPS systems',text:'Backup power with rectifier, battery and inverter.',points:['Online has no transfer interruption.','Offline is simpler and cheaper.','Line conditioning differs.']}],formulas:['Drive control idea: speed is controlled by voltage, frequency or field depending on motor type.','Induction heating heat source: eddy current I<sup>2</sup>R loss in workpiece.','UPS backup time depends on battery capacity, load power and inverter efficiency.'],mistakes:['Writing only definitions without industrial examples.','Confusing online and offline UPS energy path.','Not mentioning V/f in induction motor speed control.','Ignoring protection and feedback in drives.'],examples:[{q:'Why is VFD preferred for conveyor speed control?',solution:'VFD changes frequency and voltage supplied to an induction motor, giving smooth acceleration, speed setting, overload protection and better efficiency than mechanical speed control.'},{q:'Which UPS is better for critical automation controller?',solution:'Online UPS is better because the load is continuously supplied by inverter, giving better power conditioning and no transfer delay.'}],questions:['Compare AC and DC drives.','Explain speed control techniques of induction motor.','Explain induction heating and dielectric heating.','Explain resistance welding schemes.','Compare online and offline UPS.','Write industrial applications of power semiconductor devices.']},{co:'CO4',hours:'13',short:'M4 PLC Ladder Logic',title:'PLC architecture, instruction set and ladder programs',core:'PLC architecture, advantages, applications, bit, timer, counter, compare, move, math, program control and ladder applications.',mustDraw:'PLC scan cycle, input-output table, ladder rungs for start stop, conveyor, level control and traffic signal.',mustSolve:'Develop ladder program from process sequence and add interlocks.',diagram:'plc',visual:'PLC scan cycle and logic flow.',opening:'PLC programming is not drawing contacts randomly. A correct ladder starts from process requirement, input-output list, safety interlock and sequence table.',explanation:['PLC reads field inputs, executes stored logic and updates outputs repeatedly. This is called scan cycle.','Bit instructions implement basic relay logic. Timers, counters, compare, move and math instructions make real process control possible.','A ladder program must include stop, overload, emergency and feedback conditions where required. Unsafe ladder logic may pass a classroom test but fail in industry.','For every PLC answer, write input table, output table, rung logic and explanation.'],ml:'PLC ladder program എഴുതുന്നതിന് മുമ്പ് input, output, sequence, interlock എന്നിവ table ആക്കണം. Safety contact ഇല്ലാത്ത ladder real machine-ൽ അപകടകരമാണ്.',subtopics:[{title:'PLC architecture',text:'CPU, memory, power supply, input module, output module and communication.',points:['Input scan reads sensors.','Program scan solves logic.','Output scan updates actuators.']},{title:'Bit instructions',text:'NO, NC, coil, set and reset.',points:['Basic ON-OFF control.','Start stop latch.','Fault interlocks.']},{title:'Timers and counters',text:'Delay and event counting.',points:['TON for ON delay.','Counter for object counting.','Reset is necessary.']},{title:'Compare and move',text:'Data-based decisions.',points:['Level threshold.','Batch count comparison.','Preset transfer.']},{title:'Math instructions',text:'Simple arithmetic operations.',points:['Totalizer.','Speed or quantity calculation.','Recipe calculation.']},{title:'Real-time applications',text:'Machine sequence examples.',points:['Staircase lamp.','Conveyor control.','Fluid level control.','Traffic signal.']}],formulas:['PLC scan = input scan + program scan + output scan + communication housekeeping.','Start-stop latch: STOP and fault contacts in series, START and holding contact in parallel.','Counter logic: sensor pulse increments count; compare count to preset; reset after batch complete.'],mistakes:['No stop or overload contact in holding rung.','Forward and reverse output allowed together.','Counter not reset after batch completion.','Using timer without checking feedback.'],examples:[{q:'Develop a start-stop latch concept.',solution:'Place STOP and OVERLOAD normally closed contacts in series. Place START contact in parallel with MOTOR auxiliary contact. Coil is MOTOR. This keeps motor ON after releasing START and stops it during fault.'},{q:'Conveyor counting logic method.',solution:'Photo sensor pulse drives CTU counter. When accumulated value reaches preset, batch complete output turns ON. Reset push button resets the counter for next batch.'}],questions:['Draw PLC architecture and explain scan cycle.','List advantages and applications of PLC.','Explain bit, timer, counter, compare, move and math instructions.','Develop ladder program for staircase lamp.','Develop ladder program for conveyor control and object counting.','Develop ladder program for fluid level control and traffic signal.']}],
visuals:[{title:'Power device control chain',type:'device',caption:'Gate drive controls a high-power load through semiconductor switch.',note:'Use this thinking for MOSFET, IGBT and SCR questions.'},{title:'Controlled rectifier waveform',type:'rectifier',caption:'Firing angle controls average DC output.',note:'Always mark α and explain why output decreases as α increases.'},{title:'PLC scan cycle',type:'plc',caption:'PLC reads, solves and updates repeatedly.',note:'This is the base of every ladder program explanation.'},{title:'Industrial system block idea',type:'default',caption:'Every industrial system has input, processing and output.',note:'Same concept applies to sensors, PLC and actuator control.'}],
problems:[{title:'Chopper output voltage',q:'A 250 V DC source feeds a step-down chopper with duty cycle 0.35. Find average output voltage.',steps:['Identify converter as step-down chopper.','Use V<sub>o</sub> = D V<sub>s</sub>.','Substitute D = 0.35 and V<sub>s</sub> = 250 V.'],ans:'V<sub>o</sub> = 87.5 V'},{title:'SCR turn-off reasoning',q:'An SCR is conducting. Gate signal is removed but load current is still greater than holding current. Will SCR turn OFF?',steps:['SCR is a latching device.','Gate removal alone cannot turn it OFF.','Turn-off happens only when anode current falls below holding current for turn-off time.'],ans:'No. It remains ON.'},{title:'VFD application',q:'Why is VVVF control used for induction motor speed control?',steps:['Induction motor speed depends on supply frequency.','Changing only frequency can disturb flux.','Changing voltage and frequency together maintains proper flux and gives smooth speed control.'],ans:'VVVF gives efficient smooth speed control.'},{title:'PLC object counting',q:'A conveyor must stop after 12 objects are detected. State the logic method.',steps:['Use photo sensor as counter input.','Use CTU counter with preset 12.','When counter done bit is ON, stop conveyor and turn ON batch complete lamp.','Use reset push button to clear count.'],ans:'Photo sensor → CTU preset 12 → done bit stops conveyor.'}],
modelPaper:'COURSE 5042 INDUSTRIAL AUTOMATION\nTime: 3 Hours    Maximum Marks: 100\n\nPART A\n1. Define holding current and latching current.\n2. State two applications of IGBT.\n3. What is freewheeling diode?\n4. Define duty cycle.\n5. List two applications of TRIAC.\n6. What is VVVF control?\n7. State two merits of induction heating.\n8. What is PLC scan cycle?\n9. Name two PLC timer or counter instructions.\n10. List two PLC applications.\n\nPART B\n11. Explain power MOSFET structure and working.\n12. Explain two transistor analogy of SCR.\n13. Explain RC and UJT triggering.\n14. Explain half wave controlled rectifier with R load.\n15. Explain step-down chopper with equation.\n16. Compare AC drive and DC drive.\n17. Explain online UPS with block diagram.\n18. Develop ladder logic for staircase lamp.\n\nPART C\n19. Explain SCR V-I characteristics and turn-on methods.\n20. Describe Class A to Class F commutation.\n21. Explain full wave controlled rectifier with RL load and freewheeling diode.\n22. Explain inverter and cycloconverter applications.\n23. Explain industrial heating and resistance welding.\n24. Draw PLC architecture and explain instruction sets.\n25. Develop ladder program for conveyor counting system.\n26. Develop ladder program for fluid level control.',
answerGuide:['Use diagram plus principle for every power electronics answer.','For converter answers include circuit, current path, waveform and application.','For PLC answers include input-output table, ladder rung and rung explanation.','For application questions include principle, merits, limitations and real industrial use.'],
references:[['T1','Industrial Electronics and Control - S K Bhattacharya, S Chatterjee'],['T2','Programmable Logic Controllers - Frank D Petruzella'],['R1','Industrial Electronics and Control - Biswanath Paul - PHI'],['R2','Thyristors Principles and Applications - Ramamoorthy'],['R3','Modern Power Electronics and AC Drives - Bimal K Bose'],['R4','Power Electronics - P S Bimbhra'],['Online','NPTEL 108102145, electronics-tutorials.ws, technologystudent.com, NDL IIT Kharagpur, Electrical4U']]
