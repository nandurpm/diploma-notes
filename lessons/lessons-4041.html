<body><a class='revision-back-button' href='../revision-2021.html'>← Back to Revision 2021</a><div id='root'></div><script>
window.HB_DATA={code:'4041',title:'Microcontroller and Applications',program:'Diploma in Electronics / Electronics and Communication / Biomedical Engineering',semester:'4',credits:'4',periods:'60',category:'Program Core',watermark:'8051 ALP TIMER UART',visualTitle:'8051 system view',mainDiagram:'mc',visualCaption:'8051 integrates CPU, memory, ports, timers, interrupts and serial port in one controller.',intro:'This corrected edition makes 4041 a proper 8051 engineering handbook. It explains architecture, memory map, PSW, assembly programming, addressing modes, timers, interrupts, serial communication and interfacing with motors, keyboard, LCD, ADC, DAC and LM35 using diagrams, code patterns, solved problems and field notes.',malayalam:'8051 പഠിക്കുമ്പോൾ pin names മാത്രം മതിയല്ല. Memory, SFR, PSW flags, instruction effect, timer calculation, interrupt priority, port interfacing എന്നിവ ഒരുമിച്ച് മനസ്സിലാക്കണം.',objectives:['Equip students with 8051 architecture, interfacing and ALP knowledge.','Develop simple interfacing applications for daily use.','Prepare students for troubleshooting microcontroller-based equipment.','Connect programs with real input and output devices.'],prerequisites:['Basic engineering mathematics and number systems.','Digital electronics, codes, combinational and sequential circuits.','Memory concepts and logic gates.','Basic electronics and interfacing ideas.'],outcomes:[{co:'CO1',text:'Explain features and block diagram of 8051.',hours:'12',meaning:'Understand CPU, memory, ports, SFRs and PSW.'},{co:'CO2',text:'Develop simple ALP for 8051.',hours:'17',meaning:'Write programs for arithmetic, BCD/ASCII conversion, delay and port operation.'},{co:'CO3',text:'Explain interrupts, timers and serial communication.',hours:'14',meaning:'Configure IE, IP, TMOD, TCON, SCON, SBUF and PCON.'},{co:'CO4',text:'Illustrate interfacing of I/O devices with 8051.',hours:'15',meaning:'Connect motors, keyboard, LCD, ADC, DAC and LM35 with correct signals.'}],quick:[['8051','8-bit microcontroller with ROM, RAM, ports, timers and serial port.'],['PSW','Stores carry, auxiliary carry, overflow, parity and register bank bits.'],['Timer','Counts machine cycles or external pulses.'],['Interrupt','Temporarily shifts CPU to ISR.'],['Interfacing','Needs correct port direction, driver and timing.']],chapters:[{co:'CO1',hours:'12',short:'M1 Architecture',title:'Features, block diagram and memory organization of 8051',core:'Microprocessor vs microcontroller, features, 8051 block diagram, data memory, program memory and PSW.',mustDraw:'8051 block diagram, program memory map, data memory map, PSW bit layout.',mustSolve:'Memory location interpretation and PSW flag reasoning.',diagram:'mc',visual:'8051 internal architecture.',opening:'8051 is not only a chip name. It is a complete small computer: CPU, memory, I/O ports, timers, interrupt system and serial port in one package.',explanation:['A microprocessor normally needs external memory and I/O devices. A microcontroller includes CPU, memory, ports and peripherals on the same chip.','8051 has 4 KB program ROM in classic version, 128 bytes internal RAM, four 8-bit ports, two timers, serial port and interrupt system.','Internal RAM includes register banks, bit-addressable area and general purpose RAM. SFRs control ports, timers, serial communication and interrupts.','PSW contains flags such as CY, AC, OV and P and register bank selection bits.'],ml:'8051 architecture answer-ൽ CPU, ROM, RAM, ports, timer, serial port, interrupt, bus എന്നിവ diagram ആയി കാണിക്കണം.',subtopics:[{title:'Microprocessor vs microcontroller',text:'System-level difference.',points:['Microcontroller has built-in memory and I/O.','Microprocessor is more general and often needs external chips.']},{title:'8051 features',text:'Main internal resources.',points:['8-bit CPU.','Four 8-bit ports.','Timers and serial port.']},{title:'Program memory',text:'Stores instructions.',points:['Addressed by program counter.','Can be internal or external.']},{title:'Data memory',text:'Stores variables and stack.',points:['Register banks.','Bit-addressable area.','General RAM.']},{title:'SFRs',text:'Control registers.',points:['P0 to P3.','TMOD and TCON.','SCON and SBUF.']},{title:'PSW',text:'Program status word.',points:['Carry flag.','Overflow flag.','Parity flag.','Register bank selection.']}],formulas:['8051 has four ports × 8 bits = 32 I/O lines.','Internal RAM lower area includes register banks, bit addressable area and general RAM.','PSW flag changes depend on arithmetic or logical instruction result.'],mistakes:['Drawing only CPU and forgetting ports.','Not separating internal RAM and SFR area.','Confusing ROM and RAM.','Ignoring PSW flags in ALP questions.'],examples:[{q:'Why is 8051 called microcontroller?',solution:'It includes CPU, memory, I/O ports, timers, serial port and interrupt hardware inside one chip, so it can control devices with fewer external components.'},{q:'What is PSW used for?',solution:'PSW stores status flags and register bank selection bits used by the CPU during program execution.'}],questions:['Compare microprocessor and microcontroller.','List features of 8051.','Draw and explain 8051 block diagram.','Explain data memory organization.','Explain program memory organization.','Explain PSW register.']},{co:'CO2',hours:'17',short:'M2 ALP',title:'Assembly language programming, addressing modes and instructions',core:'ALP structure, addressing modes, data transfer, arithmetic, logical, compare, rotate, swap, jump, loop, call, delay, bit instructions and simple programs.',mustDraw:'Program structure, addressing mode examples, flowchart for delay and conversion programs.',mustSolve:'8-bit addition, subtraction, multiplication, division, ASCII/BCD/HEX conversion and port I/O.',diagram:'mc',visual:'Instruction flow inside microcontroller.',opening:'Assembly programming is exact. Every instruction changes registers, flags, memory or port pins. The correct way to study ALP is to trace each instruction step by step.',explanation:['ALP contains labels, mnemonics, operands, comments and directives. A good program also includes clear initialization and end statement.','Addressing modes decide where the operand comes from: immediate, register, direct, indirect and indexed.','Instruction groups include data transfer, arithmetic, logical, compare, rotate, swap, jump, call and bit-level instructions.','Delay programs use loops and machine cycle calculation. Port reading and writing connects software to external hardware.'],ml:'ALP answer-ൽ program മാത്രം പോര. Algorithm, register use, comments, result location എന്നിവ ചേർക്കണം.',subtopics:[{title:'ALP structure',text:'Labels, opcode, operands and comments.',points:['ORG directive.','END directive.','Readable comments.']},{title:'Addressing modes',text:'Operand source method.',points:['Immediate.','Register.','Direct.','Indirect.','Indexed.']},{title:'Arithmetic',text:'ADD, SUBB, MUL and DIV.',points:['Carry and overflow may change.','Result registers must be mentioned.']},{title:'Logical and rotate',text:'ANL, ORL, XRL, CPL, RL, RR.',points:['Used for bit masking.','Used for serializing data.']},{title:'Branching',text:'Jump, loop and call.',points:['SJMP, LJMP, DJNZ.','Subroutine with CALL and RET.']},{title:'Port I/O',text:'Reading and writing external pins.',points:['Port latch behaviour.','Use driver for heavy loads.']}],formulas:['Delay time = machine cycle time × number of executed machine cycles.','For 12 MHz classic 8051, one machine cycle is about 1 microsecond.','BCD correction may require decimal adjust after addition.'],mistakes:['Writing program without comments.','Not clearing carry before subtraction where required.','Forgetting result register after MUL or DIV.','Using port pin directly for motor current without driver.'],examples:[{q:'Write logic for 8-bit addition.',solution:'Load first number to accumulator, add second number, store result, check carry if required. Example pattern: MOV A,number1; ADD A,number2; MOV result,A.'},{q:'How is delay generated?',solution:'A register is loaded with a count and decremented in a loop using DJNZ. Total delay is calculated from machine cycles used by loop instructions.'}],questions:['Explain structure of ALP.','Explain addressing modes of 8051.','Explain data transfer and arithmetic instructions.','Explain jump, loop and call instructions.','Develop ALP for addition and subtraction.','Develop ALP for BCD and ASCII conversion.']},{co:'CO3',hours:'14',short:'M3 Timer Interrupt Serial',title:'Interrupts, timers and serial communication in 8051',core:'Interrupt concept, ISR, IE, IP, TMOD, TCON, timer modes, delay calculation, SCON, SBUF, serial modes and PCON.',mustDraw:'Interrupt priority flow, timer mode table, serial communication block, RS232 connection concept.',mustSolve:'Timer initial value, baud rate concept and interrupt priority questions.',diagram:'mc',visual:'8051 timers, interrupts and serial port as internal peripherals.',opening:'Timers, interrupts and serial port make 8051 useful in real machines. Without them, the CPU would waste time waiting for every event manually.',explanation:['Interrupt allows external or internal event to temporarily stop main program and run an ISR. IE enables interrupts and IP controls priority.','Timers can work in different modes using TMOD. TCON contains timer run and overflow flags.','Timer delay depends on oscillator frequency, machine cycle time, timer mode and initial count.','Serial communication uses SBUF for data and SCON for mode and flags. PCON can affect baud rate.'],ml:'Timer calculation-ൽ oscillator frequency, machine cycle, count, overflow value എന്നിവ clear ആയിരിക്കണം.',subtopics:[{title:'Interrupt concept',text:'Event-driven program execution.',points:['Main program is interrupted.','ISR executes.','RETI returns.']},{title:'IE and IP',text:'Enable and priority registers.',points:['EA global enable.','Priority selection.']},{title:'TMOD',text:'Timer mode register.',points:['Timer 0 and Timer 1 modes.','Timer or counter selection.']},{title:'TCON',text:'Run and overflow flags.',points:['TR0, TR1.','TF0, TF1.']},{title:'Serial port',text:'UART style communication.',points:['SBUF data register.','SCON control register.','Modes 0 to 3.']},{title:'Baud rate',text:'Bits per second.',points:['Timer often generates baud rate.','PCON can double baud in some modes.']}],formulas:['Machine cycle frequency = oscillator frequency / 12 for classic 8051.','Timer count required = delay / machine cycle time.','Initial value = maximum count - required count.'],mistakes:['Using oscillator period instead of machine cycle time.','Forgetting to clear overflow flag.','Ending ISR with RET instead of RETI.','Confusing SBUF and SCON.'],examples:[{q:'For 12 MHz 8051, what is one machine cycle?',solution:'Classic 8051 divides oscillator by 12. 12 MHz gives 1 MHz machine cycle frequency, so one machine cycle is 1 microsecond.'},{q:'Why interrupts are useful?',solution:'They let CPU respond quickly to important events without continuously polling every input.'}],questions:['Explain interrupt concept, types and ISR.','Explain IE and IP registers.','Explain TMOD and timer modes.','Explain TCON register and delay calculation.','Explain SCON, SBUF and serial modes.','Explain baud rate concept.']},{co:'CO4',hours:'15',short:'M4 Interfacing',title:'Interfacing I/O devices with 8051',core:'Stepper motor, DC motor speed control, 4x4 keyboard, 16x2 LCD, ADC, DAC and LM35 temperature sensor interfacing.',mustDraw:'Stepper motor driver, DC motor driver, matrix keyboard, LCD pin block, ADC/DAC/LM35 interface block.',mustSolve:'I/O table, scan algorithm and interfacing sequence questions.',diagram:'mc',visual:'8051 connected to field devices through drivers and converters.',opening:'Interfacing is where textbook programming becomes real electronics. The microcontroller pin cannot directly drive every load; drivers, pull-ups, ADC and protection matter.',explanation:['Stepper motor requires a sequence of coil energization. 8051 usually drives it through transistor or driver IC, not directly.','DC motor speed control can use PWM and driver transistor or H-bridge depending on direction requirement.','Matrix keyboard is scanned by driving rows and reading columns. LCD requires command and data sequence with enable signal timing.','Analog sensors such as LM35 require ADC because 8051 is digital. DAC converts digital data to analog output.'],ml:'Interfacing diagram-ൽ driver IC, power supply, common ground, protection diode എന്നിവ mention ചെയ്യണം.',subtopics:[{title:'Stepper motor',text:'Moves in steps using coil sequence.',points:['Full step and half step.','Needs driver stage.']},{title:'DC motor',text:'Speed control using PWM.',points:['Transistor or H-bridge driver.','Back EMF protection needed.']},{title:'Matrix keyboard',text:'Rows and columns scanned by software.',points:['Drive one row at a time.','Read columns.','Debounce needed.']},{title:'16x2 LCD',text:'Displays characters using command and data pins.',points:['RS, RW, EN.','4-bit or 8-bit mode.']},{title:'ADC and DAC',text:'Connect analog world and digital controller.',points:['ADC reads sensors.','DAC generates analog voltage.']},{title:'LM35',text:'Temperature sensor.',points:['10 mV per degree Celsius.','Needs ADC input.']}],formulas:['LM35 output ≈ 10 mV/°C.','PWM duty cycle controls average motor voltage.','Keyboard scanning = row selection plus column reading.'],mistakes:['Connecting motor directly to port pin.','Forgetting common ground between 8051 and driver.','No debounce for keyboard.','Trying to read LM35 without ADC.'],examples:[{q:'Why driver is required for motor interfacing?',solution:'8051 port pin can supply only small current. Motor needs higher current and produces back EMF, so driver transistor or driver IC is required.'},{q:'How is 4x4 keyboard scanned?',solution:'Make one row active at a time and read column lines. The row-column combination identifies the pressed key.'}],questions:['Explain stepper motor interfacing with 8051.','Explain DC motor speed control interfacing.','Explain 4x4 matrix keyboard scanning.','Explain 16x2 LCD interfacing.','Explain ADC and DAC interfacing.','Explain LM35 temperature sensor interfacing.']}],visuals:[{title:'8051 block diagram',type:'mc',caption:'CPU, memory, ports, timers, interrupts and serial port.',note:'Use this for architecture answers.'},{title:'PLC style scan comparison',type:'plc',caption:'Microcontroller also repeatedly reads inputs and writes outputs.',note:'Useful for embedded control thinking.'},{title:'Interfacing chain',type:'default',caption:'Sensor or keyboard to 8051 to driver to actuator.',note:'Every interface answer needs signal direction.'},{title:'Serial communication chain',type:'receiver',caption:'Data is transmitted, received and interpreted through registers.',note:'Useful for SBUF and SCON answers.'}],problems:[{title:'Machine cycle',q:'Find machine cycle time for classic 8051 with 12 MHz crystal.',steps:['Classic 8051 uses 12 oscillator periods per machine cycle.','Machine cycle frequency = 12 MHz / 12 = 1 MHz.','Time = 1 / 1 MHz.'],ans:'1 microsecond'},{title:'Timer initial value idea',q:'Timer mode 1 needs 1000 counts. Find initial value in hex.',steps:['Mode 1 maximum count is 65536.','Initial value = 65536 - 1000 = 64536.','Convert 64536 to hex.'],ans:'FC18H'},{title:'LM35 temperature',q:'LM35 output is 300 mV. Find temperature.',steps:['LM35 gives 10 mV per degree Celsius.','Temperature = 300/10.'],ans:'30 °C'},{title:'Motor driver reason',q:'Why is a transistor driver needed for DC motor?',steps:['8051 port current is small.','Motor requires higher current.','Motor back EMF can damage controller.'],ans:'Driver provides current gain and protection.'}],modelPaper:'COURSE 4041 MICROCONTROLLER AND APPLICATIONS\nTime: 3 Hours    Maximum Marks: 100\n\nPART A\n1. Define microcontroller.\n2. List two features of 8051.\n3. What is PSW?\n4. Name two addressing modes.\n5. What is DJNZ used for?\n6. Define ISR.\n7. What is TMOD?\n8. What is SBUF?\n9. Why driver is used for motor?\n10. What is LM35 output scale?\n\nPART B\n11. Compare microprocessor and microcontroller.\n12. Draw 8051 block diagram.\n13. Explain 8051 memory organization.\n14. Explain addressing modes.\n15. Write ALP algorithm for 8-bit addition.\n16. Explain interrupts and IE register.\n17. Explain timer delay calculation.\n18. Explain stepper motor interfacing.\n\nPART C\n19. Explain 8051 architecture and PSW.\n20. Develop ALP for arithmetic and conversion programs.\n21. Explain jump, loop, call and bit instructions.\n22. Explain timer registers and serial communication registers.\n23. Explain 4x4 keyboard and LCD interfacing.\n24. Explain ADC, DAC and LM35 interfacing.\n25. Solve timer and LM35 numerical problems.\n26. Design an 8051 based temperature display block.',answerGuide:['For architecture answers draw block diagram and explain every block.','For ALP questions include algorithm, program and result location.','For timer problems show machine cycle calculation.','For interfacing questions include driver, signal direction and protection.'],references:[['T1','Muhammad Ali Mazidi and Janice Gillispie Mazidi, The 8051 Microcontroller and Embedded Systems'],['T2','Subratha Ghoshal, 8051 Microcontroller Internals, Instructions, Programming and Interfacing'],['T3','Kenneth J Ayala, The 8051 Microcontroller'],['Online','Electronicshub, Elprocus, TutorialsPoint and 8051 reference resources']]};document.write('<script id=\'courseData\' type=\'application/json\'>'+JSON.stringify(window.HB_DATA).replace(/</g,'\\u003c')+'<\/script>');
</script><script src='/assets/js/engineering-handbook.js?v=20260629-2'></script><noscript>This engineering handbook needs JavaScript enabled.</noscript>
