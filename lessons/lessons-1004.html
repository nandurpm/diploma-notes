/* Concept animations: used only inside chemistry diagrams, never as decoration */
.diagram .flow-dash { stroke-dasharray: 10 12; animation: flowDash 1.4s linear infinite; }
.diagram .flow-dash-slow { stroke-dasharray: 12 16; animation: flowDash 2.2s linear infinite; }
.diagram .pulse-soft { animation: pulseSoft 1.8s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
.diagram .pulse-delay { animation-delay:.55s; }
.diagram .float-up { animation: floatUp 2.8s ease-in-out infinite; }
.diagram .float-delay { animation-delay:.7s; }
.diagram .shake-drop { animation: dropShake 1.2s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
.diagram .grow-layer { transform-origin:center bottom; transform-box:fill-box; animation: growLayer 2.4s ease-in-out infinite; }
.diagram .rust-spot { animation: rustPulse 2.4s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
@keyframes flowDash { to { stroke-dashoffset: -44; } }
@keyframes pulseSoft { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
@keyframes floatUp { 0% { transform:translateY(18px); opacity:.15; } 35% { opacity:1; } 100% { transform:translateY(-22px); opacity:.05; } }
@keyframes dropShake { 0%,100% { transform:translateY(0); } 50% { transform:translateY(5px); } }
@keyframes growLayer { 0%,100% { transform:scaleY(.35); opacity:.65; } 50% { transform:scaleY(1); opacity:1; } }
@keyframes rustPulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1.08); } }

eps": ["Nâ‚Vâ‚ = Nâ‚‚Vâ‚‚", "N(HCl) Ã— 25 = 0.1 Ã— 20", "N(HCl) = 2/25 = 0.08 N"], "answer": "Normality of HCl = 0.08 N.", "tip": "Use same volume unit on both sides."}, {"title": "Hardness reason", "given": "Water sample gives poor lather with soap.", "steps": ["Presence of CaÂ²âº/MgÂ²âº ions is suspected.", "These ions react with soap to form insoluble scum.", "Softening removes these ions."], "answer": "Poor lather is due to hardness caused by calcium and magnesium salts.", "tip": "Mention scum formation in answer."}], "m3": [{"title": "Choose material for laboratory beaker", "given": "Beaker must resist sudden heating and cooling.", "steps": ["Thermal shock resistance is required.", "Borosilicate glass has low expansion and good thermal resistance.", "Therefore it is suitable."], "answer": "Borosilicate glass is suitable.", "tip": "Always connect property to application."}, {"title": "Classify polymers", "given": "Polythene, PVC, Nylon-66, Bakelite.", "steps": ["Polythene and PVC are addition polymers.", "Nylon-66 and Bakelite are condensation polymers.", "Polythene/PVC are thermoplastics; Bakelite is thermosetting."], "answer": "Addition: polythene, PVC. Condensation: Nylon-66, Bakelite.", "tip": "Learn examples as pairs."}, {"title": "Nanomaterial classification", "given": "Nanoparticle, nanotube, graphene.", "steps": ["Nanoparticle has all dimensions nanoscale â†’ 0D.", "Nanotube has one extended dimension â†’ 1D.", "Graphene is a sheet â†’ 2D."], "answer": "Nanoparticle: 0D; nanotube: 1D; graphene: 2D.", "tip": "Dimension classification is enough for this syllabus."}], "m4": [{"title": "Faraday law mass deposition", "given": "Current = 2 A, time = 30 min, Z = 0.000329 g/C.", "steps": ["t = 30 Ã— 60 = 1800 s.", "m = ZIt", "m = 0.000329 Ã— 2 Ã— 1800 = 1.1844 g"], "answer": "Mass deposited â‰ˆ 1.18 g.", "tip": "Time must be in seconds."}, {"title": "Daniell cell reactions", "given": "Zn/ZnÂ²âº and CuÂ²âº/Cu half cells.", "steps": ["At zinc anode: Zn â†’ ZnÂ²âº + 2eâ».", "At copper cathode: CuÂ²âº + 2eâ» â†’ Cu.", "Overall: Zn + CuÂ²âº â†’ ZnÂ²âº + Cu."], "answer": "Zinc is anode, copper is cathode; electrons flow from Zn to Cu.", "tip": "Oxidation at anode, reduction at cathode."}, {"title": "Corrosion prevention selection", "given": "Underground iron pipeline must be protected.", "steps": ["Soil moisture causes electrochemical corrosion.", "Connect a more active metal such as magnesium or zinc.", "The active metal acts as sacrificial anode and corrodes instead."], "answer": "Use cathodic protection by sacrificial anode method.", "tip": "Protected metal behaves as cathode."}]}, "questions": {"m1": [{"q": "Explain Bohrâ€™s atom model. Write its important postulates, merits and demerits.", "a": "Bohr proposed that electrons revolve around the nucleus only in certain permitted circular orbits called stationary states. In these orbits electrons do not radiate energy. Energy is absorbed or emitted only when an electron jumps between two energy levels. The model explains stability of atoms and hydrogen line spectrum. Its limitations are that it cannot explain spectra of multi-electron atoms, fine structure and Zeeman effect."}, {"q": "Define de Broglie wavelength and solve a simple problem using Î» = h/mv.", "a": "de Broglie wavelength is the wavelength associated with a moving particle. It is given by Î» = h/mv, where h is Planck constant, m is mass and v is velocity. In a problem, convert mass to kg and velocity to m/s, substitute in the formula and write final answer in metre. It shows wave nature of matter, especially microscopic particles."}, {"q": "State Heisenbergâ€™s uncertainty principle and explain its meaning.", "a": "Heisenbergâ€™s uncertainty principle states that it is impossible to determine simultaneously the exact position and exact momentum of a microscopic particle. Mathematically, Î”x Î”p â‰¥ h/4Ï€. It means the electron cannot be treated like a particle moving in a fixed path; instead probability and orbitals are used."}, {"q": "Explain quantum numbers and their significance.", "a": "Quantum numbers describe the state of an electron in an atom. Principal quantum number n indicates shell and energy. Azimuthal quantum number l indicates subshell and shape. Magnetic quantum number m indicates orientation of orbital. Spin quantum number s indicates spin direction. Together they help describe electron arrangement in orbitals."}, {"q": "Write Aufbau principle, Pauli exclusion principle and Hundâ€™s rule.", "a": "Aufbau principle: electrons fill lower energy orbitals before higher energy orbitals. Pauli exclusion principle: no two electrons in an atom can have the same set of four quantum numbers; an orbital can hold maximum two electrons with opposite spins. Hundâ€™s rule: degenerate orbitals are singly occupied before pairing occurs."}, {"q": "Write electronic configuration of first 20 elements using examples.", "a": "Electronic configuration is written by filling orbitals in order of increasing energy: 1s, 2s, 2p, 3s, 3p, 4s. Example: Na = 1sÂ²2sÂ²2pâ¶3sÂ¹, Cl = 1sÂ²2sÂ²2pâ¶3sÂ²3pâµ, Ca = 1sÂ²2sÂ²2pâ¶3sÂ²3pâ¶4sÂ². Shell configuration may also be written as 2,8,1 for Na and 2,8,8,2 for Ca."}, {"q": "Compare ionic, covalent and coordinate bonds with examples.", "a": "Ionic bond is formed by transfer of electrons, example NaCl. Covalent bond is formed by sharing of electrons, example Hâ‚‚ and HF. Coordinate bond is formed when one atom donates both electrons of the shared pair, example NHâ‚„âº. Ionic compounds usually have high melting point; covalent compounds often have lower melting points; coordinate bond behaves like covalent bond after formation."}, {"q": "Explain anomalous behaviour of water due to hydrogen bonding.", "a": "Water molecules form extensive hydrogen bonding because hydrogen is bonded to highly electronegative oxygen. This causes high boiling point, high surface tension, high specific heat and lower density of ice compared to liquid water. These properties are anomalous because Hâ‚‚O behaves differently from similar hydrides."}], "m2": [{"q": "Define solute, solvent and solution. Explain molarity, normality and ppm.", "a": "A solution is a homogeneous mixture of solute and solvent. Solute is the dissolved substance and solvent is the dissolving medium. Molarity is moles of solute per litre of solution. Normality is gram equivalents of solute per litre of solution. ppm means parts per million and for dilute water solutions it is approximately mg/L. These concentration units are used in titration and water analysis."}, {"q": "Solve a molarity problem from mass and volume.", "a": "Use the method: moles = given mass / molar mass, volume in litre = mL/1000, molarity = moles / volume in litre. Example: 4 g NaOH in 500 mL, molar mass 40 g/mol. Moles = 4/40 = 0.1 mol. Volume = 0.5 L. M = 0.1/0.5 = 0.2 M."}, {"q": "Explain pH, pOH and their relation. Add applications of pH.", "a": "pH = âˆ’log[Hâº] and pOH = âˆ’log[OHâ»]. At 25Â°C, pH + pOH = 14. pH below 7 is acidic, pH 7 is neutral and pH above 7 is basic. pH control is important in water treatment, agriculture, medicine, electroplating, boiler water and corrosion prevention."}, {"q": "What is buffer solution? Give one acidic and one basic buffer example.", "a": "A buffer solution resists change in pH when small amounts of acid or base are added. Acidic buffer is made from a weak acid and its salt, for example acetic acid and sodium acetate. Basic buffer is made from a weak base and its salt, for example ammonium hydroxide and ammonium chloride."}, {"q": "Explain volumetric analysis, titration, end point and indicator.", "a": "Volumetric analysis is a quantitative method to find concentration using measured volumes of reacting solutions. Titration is the experimental process. End point is the stage where indicator changes colour showing completion of reaction. Indicator is a substance that shows colour change near the equivalence point. The choice of indicator depends on titration type."}, {"q": "Use normality equation to find unknown concentration.", "a": "At equivalence point, Nâ‚Vâ‚ = Nâ‚‚Vâ‚‚. Substitute known normality and volumes using the same volume unit. Example: 25 mL HCl is neutralized by 20 mL 0.1 N NaOH. N(HCl) Ã— 25 = 0.1 Ã— 20, so N(HCl) = 0.08 N."}, {"q": "Explain hardness of water and problems caused in boilers.", "a": "Hardness is due to calcium and magnesium salts in water. Temporary hardness is due to bicarbonates and permanent hardness is due to chlorides and sulphates. Hard water forms scum with soap and does not lather easily. In boilers it produces scale, reduces heat transfer, wastes fuel and causes corrosion."}, {"q": "Explain lime-soda process, ion exchange method and municipal water treatment steps.", "a": "Lime-soda process removes hardness by precipitating calcium and magnesium salts. Ion exchange method uses resins to replace CaÂ²âº and MgÂ²âº ions with Naâº or Hâº ions. Municipal water treatment includes sedimentation, coagulation, filtration and sterilization by chlorination, bleaching powder or UV radiation to produce potable water."}], "m3": [{"q": "What is alloying? Explain purposes of alloying with examples brass, bronze and solder.", "a": "Alloying is the process of mixing two or more elements, at least one metal, to improve properties. It improves strength, hardness, corrosion resistance, melting point and castability. Brass is copper-zinc alloy used in fittings. Bronze is copper-tin alloy used in bearings and statues. Solder is used for joining metals."}, {"q": "Explain types and applications of glasses in engineering.", "a": "Glass is an amorphous inorganic material. Sodium silicate glass is common glass used in windows and containers. Borosilicate glass resists thermal shock and is used in laboratory apparatus. Safety glass reduces injury during breakage and is used in vehicles. Insulating glass reduces heat transfer in buildings."}, {"q": "What are refractory materials? Write characteristics and applications.", "a": "Refractory materials withstand high temperatures without softening or reacting. Important characteristics are high melting point, thermal stability, chemical resistance,t is impossible to determine simultaneously the exact position and exact momentum of a microscopic particle. Mathematically, Î”x Î”p â‰¥ h/4Ï€. It means the electron cannot be treated like a particle moving in a fixed path; instead probability and orbitals are used."}, {"q": "Explain quantum numbers and their significance.", "a": "Quantum numbers describe the state of an electron in an atom. Principal quantum number n indicates shell and energy. Azimuthal quantum number l indicates subshell and shape. Magnetic quantum number m indicates orientation of orbital. Spin quantum number s indicates spin direction. Together they help describe electron arrangement in orbitals."}, {"q": "Write Aufbau principle, Pauli exclusion principle and Hundâ€™s rule.", "a": "Aufbau principle: electrons fill lower energy orbitals before higher energy orbitals. Pauli exclusion principle: no two electrons in an atom can have the same set of four quantum numbers; an orbital can hold maximum two electrons with opposite spins. Hundâ€™s rule: degenerate orbitals are singly occupied before pairing occurs."}, {"q": "Write electronic configuration of first 20 elements using examples.", "a": "Electronic configuration is written by filling orbitals in order of increasing energy: 1s, 2s, 2p, 3s, 3p, 4s. Example: Na = 1sÂ²2sÂ²2pâ¶3sÂ¹, Cl = 1sÂ²2sÂ²2pâ¶3sÂ²3pâµ, Ca = 1sÂ²2sÂ²2pâ¶3sÂ²3pâ¶4sÂ². Shell configuration may also be written as 2,8,1 for Na and 2,8,8,2 for Ca."}, {"q": "Compare ionic, covalent and coordinate bonds with examples.", "a": "Ionic bond is formed by transfer of electrons, example NaCl. Covalent bond is formed by sharing of electrons, example Hâ‚‚ and HF. Coordinate bond is formed when one atom donates both electrons of the shared pair, example NHâ‚„âº. Ionic compounds usually have high melting point; covalent compounds often have lower melting points; coordinate bond behaves like covalent bond after formation."}, {"q": "Explain anomalous behaviour of water due to hydrogen bonding.", "a": "Water molecules form extensive hydrogen bonding because hydrogen is bonded to highly electronegative oxygen. This causes high boiling point, high surface tension, high specific heat and lower density of ice compared to liquid water. These properties are anomalous because Hâ‚‚O behaves differently from similar hydrides."}], "m2": [{"q": "Define solute, solvent and solution. Explain molarity, normality and ppm.", "a": "A solution is a homogeneous mixture of solute and solvent. Solute is the dissolved substance and solvent is the dissolving medium. Molarity is moles of solute per litre of solution. Normality is gram equivalents of solute per litre of solution. ppm means parts per million and for dilute water solutions it is approximately mg/L. These concentration units are used in titration and water analysis."}, {"q": "Solve a molarity problem from mass and volume.", "a": "Use the method: moles = given mass / molar mass, volume in litre = mL/1000, molarity = moles / volume in litre. Example: 4 g NaOH in 500 mL, molar mass 40 g/mol. Moles = 4/40 = 0.1 mol. Volume = 0.5 L. M = 0.1/0.5 = 0.2 M."}, {"q": "Explain pH, pOH and their relation. Add applications of pH.", "a": "pH = âˆ’log[Hâº] and pOH = âˆ’log[OHâ»]. At 25Â°C, pH + pOH = 14. pH below 7 is acidic, pH 7 is neutral and pH above 7 is basic. pH control is important in water treatment, agriculture, medicine, electroplating, boiler water and corrosion prevention."}, {"q": "What is buffer solution? Give one acidic and one basic buffer example.", "a": "A buffer solution resists change in pH when small amounts of acid or base are added. Acidic buffer is made from a weak acid and its salt, for example acetic acid and sodium acetate. Basic buffer is made from a weak base and its salt, for example ammonium hydroxide and ammonium chloride."}, {"q": "Explain volumetric analysis, titration, end point and indicator.", "a": "Volumetric analysis is a quantitative method to find concentration using measured volumes of reacting solutions. Titration is the experimental process. End point is the stage where indicator changes colour showing completion of reaction. Indicator is a substance that shows colour change near the equivalence point. The choice of indicator depends on titration type."}, {"q": "Use normality equation to find unknown concentration.", "a": "At equivalence point, Nâ‚Vâ‚ = Nâ‚‚Vâ‚‚. Substitute known normality and volumes using the same volume unit. Example: 25 mL HCl is neutralized by 20 mL 0.1 N NaOH. N(HCl) Ã— 25 = 0.1 Ã— 20, so N(HCl) = 0.08 N."}, {"q": "Explain hardness of water and problems caused in boilers.", "a": "Hardness is due to calcium and magnesium salts in water. Temporary hardness is due to bicarbonates and permanent hardness is due to chlorides and sulphates. Hard water forms scum with soap and does not lather easily. In boilers it produces scale, reduces heat transfer, wastes fuel and causes corrosion."}, {"q": "Explain lime-soda process, ion exchange method and municipal water treatment steps.", "a": "Lime-soda process removes hardness by precipitating calcium and magnesium salts. Ion exchange method uses resins to replace CaÂ²âº and MgÂ²âº ions with Naâº or Hâº ions. Municipal water treatment includes sedimentation, coagulation, filtration and sterilization by chlorination, bleaching powder or UV radiation to produce potable water."}], "m3": [{"q": "What is alloying? Explain purposes of alloying with examples brass, bronze and solder.", "a": "Alloying is the process of mixing two or more elements, at least one metal, to improve properties. It improves strength, hardness, corrosion resistance, melting point and castability. Brass is copper-zinc alloy used in fittings. Bronze is copper-tin alloy used in bearings and statues. Solder is used for joining metals."}, {"q": "Explain types and applications of glasses in engineering.", "a": "Glass is an amorphous inorganic material. Sodium silicate glass is common glass used in windows and containers. Borosilicate glass resists thermal shock and is used in laboratory apparatus. Safety glass reduces injury during breakage and is used in vehicles. Insulating glass reduces heat transfer in buildings."}, {"q": "What are refractory materials? Write characteristics and applications.", "a": "Refractory materials withstand high temperatures without softening or reacting. Important characteristics are high melting point, thermal stability, chemical resistance, mechanical strength and low thermal expansion. Examples include fire clay bricks and silica bricks. They are used in furnaces, kilns, boilers and reactors."}, {"q": "Define monomer, polymer and polymerization. Classify polymers.", "a": "Monomer is a small molecule capable of joining with similar or different molecules. Polymer is a large molecule made of repeating monomer units. Polymerization is the process of forming polymer. Homopolymer is made from one monomer; copolymer from two or more monomers. Addition polymers form without by-product; condensation polymers form with elimination of small molecules."}, {"q": "Explain polythene, PVC, Nylon-66 and Bakelite with monomers and uses.", "a": "Polythene is formed from ethene and is used for films, containers and insulation. PVC is formed from vinyl chloride and used for pipes and cable insulation. Nylon-66 is formed from hexamethylenediamine and adipic acid and used for fibres and machine parts. Bakelite is formed from phenol and formaldehyde and used for switches and electrical fittings."}, {"q": "Compare thermoplastics and thermosetting plastics.", "a": "Thermoplastics soften on heating and harden on cooling, so they can be remoulded; examples are polythene and PVC. Thermosetting plastics harden permanently on heating and cannot be remoulded; examples are Bakelite and melamine. Thermosetting plastics are generally harder and more heat resistant."}, {"q": "Explain natural rubber, vulcanization, Buna-S and Buna-N.", "a": "Natural rubber is a polymer of isoprene and is elastic but weak and temperature sensitive. Vulcanization is heating rubber with sulphur to improve strength, elasticity, durability and resistance. Buna-S is made from butadiene and s
