<script>
(async()=>{
"use strict";
const slots=[...document.querySelectorAll("[data-fragment]")];
await Promise.all(slots.map(async slot=>{try{const response=await fetch(slot.dataset.fragment,{cache:"no-cache"});if(!response.ok)throw new Error(`HTTP ${response.status}`);slot.outerHTML=await response.text()}catch(error){slot.innerHTML=`<section class="section"><div class="callout warning"><b>Section could not be loaded:</b> ${error.message}</div></section>`}}));
const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];
const panels=$$(".panel");const tabs=$$(".tab");
function show(id,scroll=true){panels.forEach(panel=>panel.classList.toggle("active",panel.id===id));tabs.forEach(tab=>{const active=tab.dataset.target===id;tab.classList.toggle("active",active);tab.setAttribute("aria-current",active?"page":"false")});if(scroll)window.scrollTo({top:0,behavior:"smooth"})}
tabs.forEach(tab=>tab.addEventListener("click",()=>show(tab.dataset.target)));
$$("pre").forEach(pre=>{const button=document.createElement("button");button.className="copy";button.type="button";button.textContent="Copy";button.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(pre.innerText);button.textContent="Copied";setTimeout(()=>button.textContent="Copy",1200)}catch{button.textContent="Select & copy"}});pre.parentElement.insertBefore(button,pre)});
function search(inputId,selector){const input=document.getElementById(inputId);if(!input)return;const apply=()=>{const query=input.value.trim().toLowerCase();$$(selector).forEach(item=>item.hidden=!!query&&!item.innerText.toLowerCase().includes(query))};input.addEventListener("input",apply);document.querySelector(`[data-clear="${inputId}"]`)?.addEventListener("click",()=>{input.value="";apply();input.focus()})}
search("keySearch","#keybank .searchable");search("programSearch","#programGrid .program-card");
const progress=document.getElementById("progress");const topButton=document.getElementById("toTop");addEventListener("scroll",()=>{const root=document.documentElement;progress.style.width=(root.scrollTop/Math.max(1,root.scrollHeight-root.clientHeight)*100)+"%";topButton.classList.toggle("show",root.scrollTop>700)},{passive:true});topButton.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
let previous=[];addEventListener("beforeprint",()=>{previous=panels.map(panel=>panel.classList.contains("active"));panels.forEach(panel=>panel.classList.add("active"));$$("details").forEach(detail=>detail.open=true)});addEventListener("afterprint",()=>panels.forEach((panel,index)=>panel.classList.toggle("active",previous[index])));document.getElementById("downloadPdf").addEventListener("click",()=>window.print());show("overview",false);
})();
</script>
