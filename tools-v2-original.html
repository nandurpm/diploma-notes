function openTool(id){active=id;let t=tools.find(x=>x.id===id),r=st.get('recent',[]).filter(x=>x!==id);r.unshift(id);st.set('recent',r.slice(0,8));$('#ttl').textContent=t.name;$('#desc').textContent=t.desc;$('#body').innerHTML=tpl(id);$('#modal').classList.add('show');if(id==='counter')bindCounter();if(id==='cgpa')addRow();if(id==='resistance')addRes()}function tpl(id){let F={attendance:[['total','Total classes conducted'],['attended','Classes attended'],['req','Required percentage','number','',75]],ohm:[['v','Voltage V (optional)'],['i','Current I in ampere (optional)'],['r','Resistance R in ohm (optional)'],['p','Power P in watt (optional)']],divider:[['vin','Input voltage Vin (V)'],['r1','R1 top resistor (Ω)'],['r2','R2 bottom resistor (Ω)']],capacitor:[['code','Capacitor code','text','Example: 104']],led:[['vs','Supply voltage Vs (V)'],['vf','LED forward voltage Vf (V)'],['ma','LED current (mA)','number','',20]],pf:[['kw','Real power kW (optional)'],['kva','Apparent power kVA (optional)'],['pfv','Power factor (optional)','number','0 to 1']],transformer:[['vp','Primary voltage Vp'],['vs2','Secondary voltage Vs'],['np','Primary turns Np'],['ns','Secondary turns Ns']],concrete:[['cl','Length (m)'],['cw','Width (m)'],['cd','Depth / thickness (m)'],['mix','Mix ratio','select',[["1:1.5:3","M20 / 1:1.5:3"],["1:2:4","M15 / 1:2:4"],["1:3:6","M10 / 1:3:6"]]]],brick:[['wl','Wall length (m)'],['wh','Wall height (m)'],['wt','Wall thickness (m)','number','',.2],['bw','Wastage %','number','',5]],steel:[['dia','Bar diameter (mm)','select',[[6,'6 mm'],[8,'8 mm'],[10,'10 mm'],[12,'12 mm'],[16,'16 mm'],[20,'20 mm'],[25,'25 mm'],[32,'32 mm']]],['len','Length of each bar (m)'],['qty','Number of bars','number','',1]],tile:[['fl','Floor/wall length (m)'],['fw','Floor/wall width (m)'],['tl','Tile length (cm)'],['tw','Tile width (cm)'],['waste','Wastage %','number','',5]],paint:[['area','Wall area (m²)'],['coats','Number of coats','number','',2],['cover','Coverage per litre (m²/L)','num function scientific(){let keys=['MC','MR','M+','M-','DEG','sin','cos','tan','log','ln','√','x²','xʸ','π','e','7','8','9','÷','DEL','4','5','6','×','C','1','2','3','-','%','0','.','±','+','='];return `<div class="calc"><div class="display"><div class="expr" id="expr"></div><div class="ans" id="ans">0</div><div style="font-size:13px;color:#cbd5e1">Mode: <span id="ang">DEG</span> • Memory: <span id="mem">0</span></div></div><div class="keys">${keys.map(k=>`<button class="${['+','-','×','÷','sin','cos','tan','log','ln','√','x²','xʸ','='].includes(k)?'op':''} ${k==='='?'eq':''}" onclick="APP.sci('${k}')">${k}</button>`).join('')}</div></div>${hist()}`}
function updateCalc(){if($('#ans')){$('#ans').textContent=calc.cur;$('#expr').textContent=calc.op?`${f(calc.acc)} ${calc.op}`:'';$('#ang').textContent=calc.angle;$('#mem').textContent=f(calc.mem)}}function angle(x){return calc.angle==='DEG'?x*Math.PI/180:x}function cop(a,o,b){return o==='+'?a+b:o==='-'?a-b:o==='×'?a*b:o==='÷'?a/b:o==='xʸ'?a**b:b}window.APP={open:openTool,calc:doCalc,sci(k){try{let x=parseFloat(calc.cur)||0;if(/^\d$/.test(k))calc.cur=calc.cur==='0'?k:calc.cur+k;else if(k==='.')calc.cur=calc.cur.includes('.')?calc.cur:calc.cur+'.';else if(['+','-','×','÷','xʸ'].includes(k)){calc.acc=calc.acc===null?x:cop(calc.acc,calc.op,x);calc.op=k;calc.cur='0'}else if(k==='='){let ans=cop(calc.acc,calc.op,x);save(`${f(calc.acc)} ${calc.op} ${f(x)} = ${f(ans)}`);calc.cur=f(ans,10);calc.acc=null;calc.op=null}else if(k==='C'){calc.cur='0';calc.acc=null;calc.op=null}else if(k==='DEL')calc.cur=calc.cur.length>1?calc.cur.slice(0,-1):'0';else if(k==='±')calc.cur=f(-x);else if(k==='%')calc.cur=f(x/100);else if(k==='π')calc.cur=f(Math.PI,10);else if(k==='e')calc.cur=f(Math.E,10);else if(k==='DEG')calc.angle=calc.angle==='DEG'?'RAD':'DEG';else if(k==='sin')calc.cur=f(Math.sin(angle(x)));else if(k==='cos')calc.cur=f(Math.cos(angle(x)));else if(k==='tan')calc.cur=f(Math.tan(angle(x)));else if(k==='log')calc.cur=f(Math.log10(x));else if(k==='ln')calc.cur=f(Math.log(x));else if(k==='√')calc.cur=f(Math.sqrt(x));else if(k==='x²')calc.cur=f(x*x);else if(k==='MC')calc.mem=0;else if(k==='MR')calc.cur=f(calc.mem);else if(k==='M+')calc.mem+=x;else if(k==='M-')calc.mem-=x;updateCalc()}catch(e){calc.cur=e.message;updateCalc()}}};function unitForm(){return form([['cat','Unit category','select',[['Length','Length'],['Mass','Mass'],['Temperature','Temperature'],['Area','Area'],['Volume','Volume'],['Speed','Speed'],['Pressure','Pressure'],['Power','Power']]],['uv','Value','number','',1],['from','From unit','select',[["m","m"],["cm","cm"],["mm","mm"],["km","km"]]],['to','To unit','select',[["m","m"],["cm","cm"],["mm","mm"],["km","km"]]]],'Standard conversion factors. Change category to update unit lists.')}let units={Length:{m:1,cm:.01,mm:.001,km:1000,inch:.0254,feet:.3048},Mass:{kg:1,g:.001,mg:1e-6,tonne:1000},Area:{'m²':1,'cm²':1e-4,'mm²':1e-6,hectare:10000},Volume:{litre:1,ml:.001,'m³':1000},Speed:{'m/s':1,'km/h':.2777778},Pressure:{Pa:1,kPa:1000,bar:1e5,psi:6894.76},Power:{W:1,kW:1000,HP:745.7},Temperature:{Celsius:1,Fahrenheit:1,Kelvin:1}};document.addEventListener('change',e=>{if(e.target.id==='cat'){let u=Object.keys(units[e.target.value]);['from','to'].forEach(id=>$('#'+id).innerHTML=u.map(x=>`<option>${x}</option>`).join(''))}});function cgpa(){return `<div id="rows"></div><div class="actions"><button class="btn secondary" onclick="addRow()">Add subject</button><button class="btn" onclick="APP.calc('cgpa')">Calculate</button></div><div id="out" class="result">Add subjects.</div><div class="hint"><b>Formula:</b> SGPA = Σ(Credit × Grade Point) ÷ ΣCredits</div>${hist()}`}window.addRow=()=>{let d=document.createElement('div');d.className='form';d.style.marginBottom='10px';d.innerHTML=field(['sn','Subject name','text','Mathematics'])+field(['sc','Credit'])+field(['sg','Grade point'])+'<button class="btn secondary" onclick="this.parentElement.remove()">Remove</button>';$('#rows').appendChild(d)};function resistorForm(){let cs=['black','brown','red','orange','yellow','green','blue','violet','grey','white'].map((c,i)=>[i,c]);return form([['rb','Band type','select',[[4,'4 band'],[5,'5 band']]],['b1','1st digit','select',cs],['b2','2nd digit','select',cs],['b3','3rd digit / multiplier','select',cs],['b4','Multiplier','select',cs],['tol','Tolerance','select',[[5,'Gold ±5%'],[10,'Silver ±10%'],[1,'Brown ±1%'],[2,'Red ±2%']]]],'4-band: first two digits + multiplier. 5-band: first three digits + multiplier.')}function resistance(){return `<div id="rr"></div><div class="actions"><button class="btn secondary" onclick="addRes()">Add resistor</button><button class="btn" onclick="APP.calc('resistance')">Calculate</button></div><div id="out" class="result">Add resistor values.</div><div class="hint"><b>Formula:</b> Series = sum; Parallel = 1 / sum(1/R)</div>${hist()}`}window.addRes=()=>{let d=document.createElement('div');d.className='form';d.style.marginBottom='10px';d.innerHTML=field(['rv','Resistance value (Ω)'])+'<button class="btn secondary" onclick="this.parentElement.remove()">Remove</button>';$('#rr').appendChild(d)};
function bindCounter(){let box=$('#words');box.oninput=()=>{let t=box.value,w=(t.trim().match(/\S+/g)||[]).length,c=t.length,se=(t.match(/[.!?]+/g)||[]).length;out(`Words: <b>${w}</b><br>Characters: <b>${c}</b><br>Sentences: <b>${se}</b><br>Reading time: <b>${Math.max(1,Math.ceil(w/200))} min</b>`)};box.oninput()}function ipInt(ip){let p=ip.split('.').map(Number);if(p.length!==4||p.some(x=>!Number.isInteger(x)||x<0||x>255))throw Error('Invalid IP');return p.reduce((s,x)=>s*256+x,0)>>>0}function toIp(n){return[24,16,8,0].map(x=>(n>>>x)&255).join('.')}function doCalc(id){let r='';try{if(id==='attendance'){let pct=n('attended')/n('total')*100,need=Math.max(0,Math.ceil((n('req')*n('total')-100*n('attended'))/(100-n('req'))));r=`Current attendance: <b>${f(pct,2)}%</b><br>Classes needed: <b>${need}</b>`}else if(id==='ohm'){let V=n('v'),I=n('i'),R=n('r'),P=n('p');if(!isFinite(V)&&isFinite(I)&&isFinite(R))V=I*R;if(!isFinite(I)&&isFinite(V)&&isFinite(R))I=V/R;if(!isFinite(R)&&isFinite(V)&&isFinite(I))R=V/I;if(!isFinite(P)){if(isFinite(V)&&isFinite(I))P=V*I;else if(isFinite(V)&&isFinite(R))P=V*V/R;else if(isFinite(I)&&isFinite(R))P=I*I*R}r=`Voltage: <b>${f(V)} V</b><br>Current: <b>${f(I)} A</b><br>Resistance: <b>${f(R)} Ω</b><br>Power: <b>${f(P)} W</b>`}else if(id==='divider'){let vo=n('vin')*n('r2')/(n('r1')+n('r2')),i=n('vin')/(n('r1')+n('r2'));r=`Output voltage: <b>${f(vo)} V</b><br>Divider current: <b>${f(i*1000)} mA</b>`}else if(id==='capacitor'){let code=s('code');if(!/^\d{3}$/.test(code))throw Error('Enter valid 3-digit code');let pf=parseInt(code.slice(0,2))*10**parseInt(code[2]);r=`${code} = <b>${f(pf)} pF</b> = <b>${f(pf/1000)} nF</b> = <b>${f(pf/1e6)} µF</b>`}else if(id==='led'){let R=(n('vs')-n('vf'))/(n('ma')/1000),P=(n('ma')/1000)**2*R;r=`Required resistor: <b>${f(R)} Ω</b><br>Power rating: <b>${P<=.125?'1/4 W':P<=.5?'1/2 W':'1 W or higher'}</b>`}else if(id==='pf'){let kw=n('kw'),kva=n('kva'),pf=n('pfv');if(!isFinite(pf)&&isFinite(kw)&&isFinite(kva))pf=kw/kva;if(!isFinite(kw)&&isFinite(kva)&&isFinite(pf))kw=kva*pf;if(!isFinite(kva)&&isFinite(kw)&&isFinite(pf))kva=kw/pf;r=`kW: <b>${f(kw)}</b><br>kVA: <b>${f(kva)}</b><br>Power factor: <b>${f(pf,3)}</b>`}else if(id==='transformer'){r=`Ratio Vp/Vs: <b>${f(n('vp')/n('vs2'))}</b><br>Turns ratio Np/Ns: <b>${f(n('np')/n('ns'))}</b>`}else if(id==='resistor'){let oh=+s('rb')===4?((10*+s('b1')+ +s('b2'))*10**+s('b3')):((100*+s('b1')+10*+s('b2')+ +s('b3'))*10**+s('b4'));r=`Resistance: <b>${oh>=1e6?f(oh/1e6)+' MΩ':oh>=1000?f(oh/1000)+' kΩ':f(oh)+' Ω'}</b><br>Tolerance: <b>±${s('tol')}%</b>`}else if(id==='resistance'){let a=$$('#rr input').map(x=>parseFloat(x.value)).filter(x=>isFinite(x)&&x>0),ser=a.reduce((s,x)=>s+x,0),par=1/a.reduce((s,x)=>s+1/x,0);r=`Series total: <b>${f(ser)} Ω</b><br>Parallel total: <b>${f(par)} Ω</b>`}else if(id==='base'){let x=parseInt(s('num'),+s('base'));r=`Decimal: <b>${x}</b><br>Binary: <b>${x.toString(2)}</b><br>Octal: <b>${x.toString(8)}</b><br>Hex: <b>${x.toString(16).toUpperCase()}</b>`}else if(id==='logic'){let g=s('gate'),rows=g==='NOT'?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]],fn=a=>g==='NOT'?+!a[0]:g==='AND'?a[0]&a[1]:g==='OR'?a[0]|a[1]:g==='NAND'?+!(a[0]&a[1]):g==='NOR'?+!(a[0]|a[1]):g==='XOR'?a[0]^a[1]:+!(a[0]^a[1]);r=`<table><tr>${g==='NOT'?'<th>A</th>':'<th>A</th><th>B</th>'}<th>Output</th></tr>${rows.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}<td><b>${fn(a)}</b></td></tr>`).join('')}</table>`}else if(id==='unit'){let cat=s('cat'),x=n('uv'),fr=s('from'),to=s('to'),res;if(cat==='Temperature'){let c=fr==='Celsius'?x:fr==='Fahrenheit'?(x-32)*5/9:x-273.15;res=to==='Celsius'?c:to==='Fahrenheit'?c*9/5+32:c+273.15}else res=x*units[cat][fr]/units[cat][to];r=`${x} ${fr} = <b>${f(res,6)} ${to}</b>`}else if(id==='cgpa'){let rows=$$('#rows .form'),C=0,P=0;rows.forEach(row=>{let c=parseFloat(row.children[1].querySelector('input').value),g=parseFloat(row.children[2].querySelector('input').value);if(isFinite(c)&&isFinite(g)){C+=c;P+=c*g}});r=`Total credits: <b>${f(C)}</b><br>SGPA / CGPA: <b>${f(P/C,3)}</b>`}else if(id==='exam'){let d=Math.ceil((new Date(s('date'))-new Date())/86400000);r=`${esc(s('name')||'Exam')} is <b>${d>=0?d+' days left':'already passed'}</b>`}else if(id==='concrete'){let vol=n('cl')*n('cw')*n('cd'),dry=vol*1.54,ra=s('mix').split(':').map(Number),sum=ra.reduce((a,b)=>a+b,0);r=`Wet volume: <b>${f(vol)} m³</b><br>Dry volume: <b>${f(dry)} m³</b><br>Cement: <b>${Math.ceil((dry*ra[0]/sum)*1440/50)} bags</b><br>Sand: <b>${f(dry*ra[1]/sum)} m³</b><br>Aggregate: <b>${f(dry*ra[2]/sum)} m³</b>`}else if(id==='brick'){let wall=n('wl')*n('wh')*n('wt'),qty=Math.ceil(wall/(.19*.09*.09)*(1+n('bw')/100));r=`Wall volume: <b>${f(wall)} m³</b><br>Bricks required: <b>${qty}</b>`}else if(id==='steel'){let per=n('dia')*n('dia')/162;r=`Weight per metre: <b>${f(per)} kg/m</b><br>Total weight: <b>${f(per*n('len')*n('qty'))} kg</b>`}else if(id==='tile'){let area=n('fl')*n('fw'),tile=(n('tl')/100)*(n('tw')/100);r=`Area: <b>${f(area)} m²</b><br>Tiles required: <b>${Math.ceil(area/tile*(1+n('waste')/100))}</b>`}else if(id==='paint'){r=`Paint required: <b>${f(n('area')*n('coats')/n('cover'),2)} litres</b>`}else if(id==='gear'){let ratio=n('driven')/n('driver');r=`Gear ratio: <b>${f(ratio,3)}</b><br>Output RPM: <b>${f(n('rpm')/ratio)}</b>`}else if(id==='torque'){r=`Torque: <b>${f(n('force')*n('radius'))} N·m</b>`}else if(id==='pulley'){r=`Driven RPM: <b>${f(n('n1')*n('d1')/n('d2'))}</b>`}else if(id==='engine'){r=`Engine capacity: <b>${f(Math.PI/4*n('bore')**2*n('stroke')*n('cyl')/1000,2)} cc</b>`}else if(id==='mileage'){let m=n('dist')/n('fuel'),price=n('price');r=`Mileage: <b>${f(m,2)} km/litre</b>${isFinite(price)?`<br>Fuel cost/km: <b>${f(price/m,2)}</b>`:''}`}else if(id==='subnet'){let ip=ipInt(s('ip')),cidr=n('cidr'),mask=cidr===0?0:(0xffffffff<<(32-cidr))>>>0,net=ip&mask,bc=net|(~mask>>>0);r=`Subnet mask: <b>${toIp(mask)}</b><br>Network address: <b>${toIp(net)}</b><br>Broadcast address: <b>${toIp(bc)}</b><br>Usable hosts: <b>${Math.max(0,2**(32-cidr)-2)}</b>`}else if(id==='json'){r=`<pre>${esc(JSON.stringify(JSON.parse(s('json')),null,2))}</pre>`}else if(id==='textcase'){let t=s('text');r=`<b>UPPERCASE</b><pre>${esc(t.toUpperCase())}</pre><b>lowercase</b><pre>${esc(t.toLowerCase())}</pre><b>Title Case</b><pre>${esc(t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()))}</pre>`}else if(id==='grammar'){let t=s('text'),issues=[],map={'I has':'I have','He have':'He has','She have':'She has','Your welcome':'You’re welcome','Its a':'It’s a','Dont':'Don’t','Cant':'Can’t','Recieve':'Receive','Definately':'Definitely','Seperate':'Separate','Occured':'Occurred'};for(let k in map){let re=new RegExp('\\b'+k+'\\b','gi');if(re.test(t)){issues.push(`${k} → ${map[k]}`);t=t.replace(re,map[k])}}r=`<b>Suggestions:</b><br>${issues.length?issues.join('<br>'):'No common mistakes found.'}<hr><pre>${esc(t)}</pre>`}else if(id==='resume'){r=`<div class="preview"><h2>${esc(s('name'))}</h2><p>${esc(s('email'))} | ${esc(s('phone'))}</p><h3>Objective</h3><p>${esc(s('objective'))}</p><h3>Education</h3><p>${esc(s('edu'))}</p><h3>Skills</h3><p>${esc(s('skills'))}</p><h3>Projects</h3><p>${esc(s('projects'))}</p></div>`}else if(id==='application'){r=`<div class="preview">From,<br>${esc(s('name'))}<br>${esc(s('dept'))}, ${esc(s('sem'))}<br><br>To,<br>The Principal<br>${esc(s('college'))}<br><br>Date: ${esc(s('date'))}<br><br><b>Subject: ${esc(s('purpose'))}</b><br><br>Respected Sir/Madam,<br><br>I kindly request approval for ${esc(s('purpose'))}. Kindly consider my application.<br><br>Yours faithfully,<br>${esc(s('name'))}</div>`}else if(id==='leave'){r=`<div class="preview">From,<br>${esc(s('name'))}<br>${esc(s('cls'))}<br><br>To,<br>${esc(s('rec'))}<br><br><b>Subject: Leave application</b><br><br>Respected Sir/Madam,<br><br>I request leave from ${esc(s('from'))} to ${esc(s('to'))} due to ${esc(s('reason'))}. Kindly grant me leave.<br><br>Yours faithfully,<br>${esc(s('name'))}</div>`}out(r)}catch(e){out(`<b style="color:var(--bad)">${esc(e.message)}</b>`)}}
