(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};let cat='All',q='',favOnly=false,active='',sci={expr:'',ans:'0',angle:'DEG',mem:0,last:0};const cats=['All','Common','Electrical','Electronics','Civil','Mechanical','Computer','Writing','Career'];const tools=[['scientific','Common','🧮','Scientific Calculator','Natural-display scientific calculator with functions, memory, history and DEG/RAD.'],['unit','Common','📏','Unit Converter','Length, mass, temperature, area, volume, speed, pressure and power.'],['cgpa','Common','🎓','CGPA / SGPA Calculator','Weighted SGPA/CGPA from subject credits and grade points.'],['attendance','Common','✅','Attendance Calculator','Current attendance and classes needed for required percentage.'],['exam','Common','⏱️','Exam Countdown','Exam date countdown.'],['ohm','Electrical','⚡','Ohm’s Law Calculator','Voltage, current, resistance and power.'],['divider','Electrical','🔋','Voltage Divider Calculator','Vout and divider current from Vin, R1 and R2.'],['pf','Electrical','🔌','Power Factor Calculator','Calculate kW, kVA or PF.'],['transformer','Electrical','🧲','Transformer Ratio Calculator','Transformer voltage and turns ratio.'],['resistor','Electronics','🎨','Resistor Colour Code','4-band and 5-band resistor colour calculator.'],['capacitor','Electronics','🔷','Capacitor Code Calculator','Convert 104 style capacitor codes.'],['led','Electronics','💡','LED Resistor Calculator','LED series resistor and power rating.'],['resistance','Electronics','〽️','Series / Parallel Resistance','Total resistance calculator.'],['base','Computer','🔢','Number System Converter','Binary, decimal, octal and hexadecimal.'],['logic','Computer','🔀','Logic Gate Truth Table','AND, OR, NOT, NAND, NOR, XOR and XNOR.'],['subnet','Computer','🌐','IP Subnet Calculator','Network istory(){let a=store.get('hist_'+active,[]);return `<div class="history"><b>History</b>${a.length?a.map(x=>`<p><b>${x.t}</b><br>${esc(x.v).slice(0,180)}</p>`).join(''):'<p>No saved result yet.</p>'}</div>`}function screen(main='Ready',sub='Enter values and press Calculate'){return `<div class="screen"><div class="label">Calculator Display</div><div class="main" id="displayMain">${main}</div><div class="sub" id="displaySub">${sub}</div></div>`}function setScreen(main,sub=''){const m=$('#displayMain'),s=$('#displaySub');if(m)m.innerHTML=main;if(s)s.innerHTML=sub;save((m?.innerText||'')+' '+(s?.innerText||''))}function field(f){let [id,label,type='number',ph='',val='',opts=[]]=f;return `<div class="field"><label>${label}</label>${type==='select'?`<select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="${id}" placeholder="${ph}">${val}</textarea>`:`<input id="${id}" type="${type}" placeholder="${ph}" value="${val}">`}</div>`}function machine(fields,formula,notes='',extra='',pads=''){return `<div class="machine">${screen()}<div class="modes"><button class="mode">NORMAL</button><button class="mode">FORMULA</button><button class="mode">COPY</button></div><div class="toolGrid"><div><div class="form">${fields.map(field).join('')}</div>${extra}<div class="actions"><button class="btn" onclick="APP.calc('${active}')">Calculate</button><button class="btn secondary" onclick="APP.open('${active}')">Reset</button><button class="btn secondary" onclick="navigator.clipboard?.writeText(($('#displayMain')?.innerText||'')+' '+($('#displaySub')?.innerText||''))">Copy</button><button class="btn secondary" onclick="window.print()">Print</button></div></div><div><div class="pad">${pads||defaultPad()}</div><div class="hint"><b>Formula</b><br>${formula}</div>${notes?`<div class="hint">${notes}</div>`:''}${history()}</div></div></div>`}function defaultPad(){return ['7','8','9','4','5','6','1','2','3','0','.','AC'].map(x=>
