name = "ask-poly-ai"
main = "src/index.js"
compatibility_date = "2026-06-18"
workers_dev = true
# Deployment trigger: Ask POLY AI backend
# Redeploy marker: 2026-06-21T00:15:00Z provider-timeout-fallback-fix

[vars]
AI_PROVIDER_ORDER = "openai,nvidia,gemini"
PROVIDER_TIMEOUT_MS = "16000"
OPENAI_MODEL = "gpt-4o-mini"
NVIDIA_MODEL = "nvidia/nemotron-3-ultra-550b-a55b"
MAX_OUTPUT_TOKENS = "1800"
MOCK_EXAM_MODEL = "gpt-4o-mini"
MOCK_EXAM_MAX_OUTPUT_TOKENS = "7500"
ALLOWED_ORIGINS = "https://polypmna.dpdns.org,https://www.polypmna.dpdns.org,https://polypmna.dpdns.com,https://www.polypmna.dpdns.com,https://polypmna.blogspot.com,https://polypmna.blogspot.in,http://localhost:8000,http://127.0.0.1:8000"
