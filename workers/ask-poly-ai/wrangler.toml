name = "ask-poly-ai"
main = "src/index.js"
compatibility_date = "2026-06-18"
workers_dev = true

[ai]
binding = "AI"

[vars]
ASK_POLY_RELEASE = "2026-07-20-ai-relay2"
AI_PROVIDER_ORDER = "nvidia,openai,gemini"
PROVIDER_TIMEOUT_MS = "7000"
OPENAI_MODEL = "gpt-4o-mini"
NVIDIA_MODEL = "meta/llama-3.1-8b-instruct"
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
MAX_OUTPUT_TOKENS = "900"
MOCK_EXAM_MODEL = "gpt-4o-mini"
MOCK_EXAM_MAX_OUTPUT_TOKENS = "7500"
EXPOSE_ERRORS = "false"
ALLOWED_ORIGINS = "https://polypmna.dpdns.org,https://www.polypmna.dpdns.org,https://polypmna.dpdns.com,https://www.polypmna.dpdns.com,https://polypmna.blogspot.com,https://polypmna.blogspot.in,https://localhost:3000"
