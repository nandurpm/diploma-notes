// POLY PMNA Android app v3.5 — lesson push notifications, offline pages, bookmarks
plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json is missing; APK will build without active Firebase registration.')
}

def releaseStoreFilePath = project.findProperty('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = project.findProperty('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = project.findProperty('ANDROID_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'org.diplomanotes.polytechnicstudyhub'
    compileSdk 35

    defaultConfig {
        applicationId 'org.diplomanotes.polytechnicstudyhub'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '3.10'
    }

    buildFeatures {
        buildConfig true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    packaging {
        resources {
            pickFirsts += [
                'META-INF/androidx.arch.core_core-runtime.version',
                'META-INF/androidx.drawerlayout_drawerlayout.version',
                'META-INF/androidx.lifecycle_lifecycle-livedata-core.version',
                'META-INF/androidx.lifecycle_lifecycle-runtime.version',
                'META-INF/androidx.lifecycle_lifecycle-viewmodel-savedstate.version',
                'META-INF/androidx.lifecycle_lifecycle-viewmodel.version'
            ]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The GitHub connector can commit text files but not binary PNG/WebP files directly.
// Decode the committed base64 icon before Android resource processing so both CI and
// local Gradle builds use the same POLY PMNA launcher icon.
def appIconB64 = file("$projectDir/src/main/app-icon/poly_pmna_logo.webp.b64")
def appIconWebp = file("$projectDir/src/main/res/drawable/poly_pmna_logo.webp")

tasks.register('preparePolyPmnaAppIcon') {
    inputs.file(appIconB64)
    outputs.file(appIconWebp)
    doLast {
        if (!appIconB64.exists()) {
            throw new GradleException("Missing app icon source: ${appIconB64}")
        }
        appIconWebp.parentFile.mkdirs()
        appIconWebp.bytes = appIconB64.text.replaceAll(/\s+/, '').decodeBase64()
    }
}

tasks.named('preBuild').configure {
    dependsOn('preparePolyPmnaAppIcon')
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'
}
