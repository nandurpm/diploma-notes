// POLY PMNA Android app v3.1 — lesson push notifications
plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json is missing; APK will build without active Firebase registration.')
}

def releaseStoreFilePath = project.findProperty('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = project.findProperty('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = project.findProperty('ANDROID_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'org.diplomanotes.polytechnicstudyhub'
    compileSdk 35

    defaultConfig {
        applicationId 'org.diplomanotes.polytechnicstudyhub'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '3.2'
    }

    buildFeatures {
        buildConfig true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    packaging {
        resources {
            pickFirsts += [
                'META-INF/androidx.arch.core_core-runtime.version',
                'META-INF/androidx.drawerlayout_drawerlayout.version',
                'META-INF/androidx.lifecycle_lifecycle-livedata-core.version',
                'META-INF/androidx.lifecycle_lifecycle-runtime.version',
                'META-INF/androidx.lifecycle_lifecycle-viewmodel-savedstate.version',
                'META-INF/androidx.lifecycle_lifecycle-viewmodel.version'
            ]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'
}
