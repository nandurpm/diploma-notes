<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page unavailable</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,Arial,sans-serif;color:#0f172a;background:linear-gradient(145deg,#eaf2ff,#f8fbff 55%,#e6fffb)}
    main{width:min(100%,540px);padding:30px;border:1px solid #dbeafe;border-radius:26px;background:#fff;box-shadow:0 24px 64px rgba(15,23,42,.14);text-align:center}
    .mark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#0891b2);font-size:2rem;box-shadow:0 14px 30px rgba(29,78,216,.24)}
    h1{margin:0 0 10px;font-size:clamp(1.55rem,6vw,2rem)}
    p{margin:0 auto 22px;max-width:430px;color:#526681;line-height:1.6}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 18px;border-radius:999px;font-weight:850;text-decoration:none}
    .primary{color:#fff;background:linear-gradient(135deg,#1d4ed8,#0891b2)}
    .secondary{color:#123a86;border:1px solid #bfdbfe;background:#eff6ff}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">📚</div>
    <h1 id="title">Connection unavailable</h1>
    <p id="message">Check your internet connection, then retry the page you were opening.</p>
    <div class="actions">
      <a class="primary" href="polytechnic-study-hub://retry">Retry this page</a>
      <a class="secondary" href="polytechnic-study-hub://home">Open Home</a>
    </div>
  </main>
  <script>
    const reason = new URLSearchParams(location.search).get('reason');
    if (reason === 'error') {
      document.title = 'Page could not load';
      document.getElementById('title').textContent = 'Page could not load';
      document.getElementById('message').textContent = 'The requested page returned an error. Retry it, or return to the Polytechnic Study Hub home page.';
    }
  </script>
</body>
</html>
